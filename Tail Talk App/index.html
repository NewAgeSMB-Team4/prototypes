  <!-- The brand sheet names both faces: Fredoka draws the tailtalk wordmark,
       Montserrat carries "THE PET SOCIAL PLATFORM" and the tagline. Fredoka is
       held back for the wordmark and pet names; Montserrat does the work. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    /* ============================================================
       TAILTALK DESIGN SYSTEM
       Three values come from the brand sheet and nothing else is
       invented at full strength: the gray-orange #DFAA5A, the warm
       gray #5D5A5A, and white. Everything below is a tint, a shade
       or a semantic of those.
       ============================================================ */
    :root {
      --tan: #DFAA5A;
      /* brand gray-orange */
      --tan-deep: #B07C2C;
      /* same hue, darkened for text on white */
      --tan-soft: #F7EBD8;
      --tan-line: #EBD5B0;
      --gray: #5D5A5A;
      /* brand gray */
      --gray-2: #7A7676;
      --gray-3: #A9A4A4;
      --ink: #3A3838;
      /* headings: the brand gray, deepened */

      --paper: #FAF8F5;
      --paper-2: #F2EDE7;
      --card: #FFFFFF;
      --line: #EAE4DC;
      --line-2: #F2ECE4;

      --tx: #3A3838;
      --tx-2: #6E6A6A;
      --tx-3: #A19C9C;

      --ok: #2F7D5B;
      --ok-bg: #E6F2EC;
      --warn: #B07C2C;
      --warn-bg: #FBF0DD;
      --err: #C0453A;
      --err-bg: #FBEAE8;
      --info: #4A6E8A;
      --info-bg: #EAF0F5;

      --sh-1: 0 1px 2px rgba(58, 56, 56, .06);
      --sh-2: 0 1px 2px rgba(58, 56, 56, .05), 0 6px 16px -6px rgba(58, 56, 56, .14);
      --sh-3: 0 2px 4px rgba(58, 56, 56, .05), 0 14px 30px -12px rgba(58, 56, 56, .20);
      --sh-4: 0 24px 60px -18px rgba(58, 56, 56, .34);

      --s1: 4px;
      --s2: 8px;
      --s3: 12px;
      --s4: 16px;
      --s5: 20px;
      --s6: 24px;
      --s8: 32px;
      --s10: 40px;

      --r-sm: 8px;
      --r: 12px;
      --r-lg: 16px;
      --r-xl: 22px;

      --display: 'Fredoka', 'Montserrat', system-ui, sans-serif;
      --body: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    [data-theme="dark"] {
      --tan: #E3B36B;
      --tan-deep: #E9C88A;
      --paper: #171614;
      --paper-2: #201E1B;
      --card: #232120;
      --line: #34302D;
      --line-2: #2A2725;
      --tx: #F2EEE9;
      --tx-2: #B5AFA9;
      --tx-3: #857F7A;
      --tan-soft: #33291A;
      --tan-line: #4A3B22;
      --ok-bg: #162B22;
      --warn-bg: #2E2413;
      --err-bg: #301A18;
      --info-bg: #1A242C;
      --sh-1: 0 1px 2px rgba(0, 0, 0, .5);
      --sh-2: 0 6px 16px -6px rgba(0, 0, 0, .6);
      --sh-3: 0 14px 30px -12px rgba(0, 0, 0, .7);
      --sh-4: 0 24px 60px -18px rgba(0, 0, 0, .8);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: var(--body);
      color: var(--tx);
      background: #2A2622;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    :focus-visible {
      outline: 2px solid var(--tan-deep);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none;
    }

    .icon.fill {
      fill: currentColor;
      stroke: none;
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    .no-scrollbar {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* ================= PROTOTYPE VIEWER ================= */
    #viewer {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: 100vh;
      height: 100dvh;
    }

    #panel {
      background: #211E1B;
      color: #D8D2CA;
      border-right: 1px solid #332F2A;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .pn-top {
      padding: var(--s5);
      border-bottom: 1px solid #332F2A;
    }

    .pn-logo {
      width: 150px;
      display: block;
    }

    .pn-tag {
      font-size: 11px;
      color: #9A928A;
      margin-top: 10px;
      letter-spacing: .04em;
    }

    .pn-ver {
      display: inline-block;
      margin-top: 12px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--tan);
      border: 1px solid #4A423A;
      border-radius: 5px;
      padding: 3px 8px;
    }

    .pn-sec {
      padding: var(--s4) var(--s5) var(--s2);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
      color: #8A827A;
    }

    .pn-scroll {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      padding-bottom: var(--s6);
    }

    .pn-search {
      margin: 0 var(--s5) var(--s3);
      display: flex;
      align-items: center;
      gap: 8px;
      background: #2B2724;
      border: 1px solid #3D3833;
      border-radius: 8px;
      padding: 8px 10px;
      color: #8A827A;
    }

    .pn-search input {
      flex: 1;
      min-width: 0;
      background: none;
      border: 0;
      outline: none;
      color: #F2EEE9;
      font-size: 13px;
    }

    .pn-search input::placeholder {
      color: #7A736C;
    }

    .devgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 0 var(--s5) var(--s2);
    }

    .devbtn {
      border: 1px solid #3D3833;
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 11.5px;
      font-weight: 600;
      color: #BDB5AD;
      background: #2B2724;
      text-align: left;
      line-height: 1.25;
      transition: .15s;
    }

    .devbtn small {
      display: block;
      font-weight: 500;
      font-size: 10px;
      color: #7A736C;
      margin-top: 2px;
    }

    .devbtn:hover {
      border-color: #5A5149;
      color: #fff;
    }

    .devbtn.on {
      background: #4A3B22;
      border-color: var(--tan);
      color: #fff;
    }

    .devbtn.on small {
      color: var(--tan);
    }

    .modrow {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 9px var(--s5);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #A9A199;
    }

    .modrow:hover {
      background: #2A2623;
    }

    .modrow .cnt {
      margin-left: auto;
      font-size: 10px;
      font-weight: 600;
      color: #7A736C;
      letter-spacing: 0;
    }

    .modrow .caret {
      transition: transform .2s;
      width: 13px;
      height: 13px;
    }

    .modrow.closed .caret {
      transform: rotate(-90deg);
    }

    .scrbtn {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      text-align: left;
      padding: 7px var(--s5) 7px 38px;
      font-size: 13px;
      color: #C6BFB7;
      border-left: 2px solid transparent;
    }

    .scrbtn:hover {
      background: #2A2623;
      color: #fff;
    }

    .scrbtn.on {
      background: #3A2F1E;
      color: #fff;
      font-weight: 600;
      border-left-color: var(--tan);
    }

    .scrbtn .dot {
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: #5A5149;
      flex: none;
    }

    .scrbtn.on .dot {
      background: var(--tan);
    }

    .pn-foot {
      border-top: 1px solid #332F2A;
      padding: var(--s3) var(--s5);
      display: flex;
      gap: 6px;
      background: #1A1815;
    }

    .tool {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid #3D3833;
      background: #2B2724;
      color: #BDB5AD;
      border-radius: 8px;
      padding: 8px 6px;
      font-size: 11.5px;
      font-weight: 600;
    }

    .tool:hover {
      border-color: #5A5149;
      color: #fff;
    }

    #stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      background: #2A2622;
      background-image: radial-gradient(circle at 50% 0%, rgba(80, 70, 58, .55) 0%, transparent 55%);
    }

    .stage-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      color: #B0A89F;
      font-size: 12px;
      z-index: 5;
    }

    .stage-bar .crumb {
      font-weight: 600;
      color: #fff;
    }

    .stage-bar .sep {
      color: #5A5149;
    }

    .sbtn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #423B34;
      background: #332E29;
      color: #BDB5AD;
      border-radius: 7px;
      padding: 6px 9px;
      font-size: 11.5px;
      font-weight: 600;
    }

    .sbtn:hover {
      border-color: var(--tan);
      color: var(--tan);
    }

    .sbtn[disabled] {
      opacity: .35;
      pointer-events: none;
    }

    #stage-caption {
      position: absolute;
      bottom: 14px;
      color: #7A736C;
      font-size: 11.5px;
    }

    #devwrap {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      padding: 54px 20px 46px;
      min-height: 0;
    }

    .frame {
      background: #0F0E0D;
      border: 1px solid #453E37;
      box-shadow: 0 40px 90px rgba(0, 0, 0, .55);
      position: relative;
      transform-origin: center center;
    }

    .frame .btn-side {
      position: absolute;
      background: #3A342E;
      border-radius: 2px;
    }

    .screen-out {
      position: relative;
      overflow: hidden;
      background: var(--paper);
      display: flex;
      flex-direction: column;
    }

    .statusbar {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--tx);
      position: relative;
      z-index: 4;
    }

    .statusbar.on-dark {
      color: #fff;
    }

    .sb-r {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 122px;
      height: 34px;
      background: #000;
      border-radius: 999px;
      z-index: 6;
    }

    .punch {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 11px;
      height: 11px;
      background: #000;
      border-radius: 999px;
      z-index: 6;
    }

    .homebar {
      position: absolute;
      bottom: 7px;
      left: 50%;
      transform: translateX(-50%);
      width: 36%;
      height: 5px;
      border-radius: 999px;
      background: var(--tx);
      opacity: .22;
      z-index: 20;
      pointer-events: none;
    }

    #app {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* ================= APP ================= */
    #screen {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    #screen.flexcol {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .fill {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    .fade-in {
      animation: fade .22s ease both;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .pad {
      padding: 0 var(--s5);
    }

    .stack>*+* {
      margin-top: var(--s3);
    }

    .row {
      display: flex;
      align-items: center;
      gap: var(--s3);
    }

    .grow {
      flex: 1;
      min-width: 0;
    }

    .trunc {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .clamp2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .clamp3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Fredoka is the wordmark face; it appears on pet names and nowhere else. */
    .brand {
      font-family: var(--display);
      font-weight: 600;
      letter-spacing: -.01em;
    }

    .d1 {
      font-family: var(--body);
      font-weight: 800;
      font-size: 26px;
      line-height: 1.16;
      letter-spacing: -.03em;
    }

    .d2 {
      font-family: var(--body);
      font-weight: 800;
      font-size: 21px;
      line-height: 1.2;
      letter-spacing: -.02em;
    }

    .h1 {
      font-family: var(--body);
      font-weight: 700;
      font-size: 16.5px;
      line-height: 1.3;
      letter-spacing: -.015em;
    }

    .h2 {
      font-family: var(--body);
      font-weight: 700;
      font-size: 14.5px;
      line-height: 1.32;
      letter-spacing: -.01em;
    }

    .bd {
      font-size: 14.5px;
      line-height: 1.58;
    }

    .sm {
      font-size: 13px;
      line-height: 1.5;
    }

    .xs {
      font-size: 11.5px;
      line-height: 1.45;
    }

    .cap {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .mut {
      color: var(--tx-2);
    }

    .faint {
      color: var(--tx-3);
    }

    .b {
      font-weight: 600;
    }

    .eb {
      font-weight: 700;
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    .tan {
      color: var(--tan-deep);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 50px;
      padding: 0 var(--s5);
      border-radius: var(--r);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -.01em;
      border: 1px solid transparent;
      background: var(--tan);
      color: var(--ink);
      box-shadow: var(--sh-1);
      transition: filter .15s, transform .08s;
    }

    .btn:active {
      transform: scale(.988);
      filter: brightness(.96);
    }

    .btn.gray {
      background: var(--gray);
      color: #fff;
    }

    .btn.ghost {
      background: var(--card);
      color: var(--tx);
      border-color: var(--line);
    }

    .btn.danger {
      background: var(--err);
      color: #fff;
    }

    .btn.flat {
      background: transparent;
      color: var(--tan-deep);
      box-shadow: none;
      min-height: 44px;
    }

    .btn.sm {
      min-height: 40px;
      font-size: 13.5px;
      border-radius: 10px;
      padding: 0 var(--s4);
    }

    .btn[disabled] {
      opacity: .45;
      pointer-events: none;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--s3);
    }

    .card,
    .tile {
      background: var(--card);
      border-radius: var(--r-lg);
      border: 1px solid var(--line);
      box-shadow: var(--sh-1);
    }

    .tile {
      padding: var(--s4);
    }

    .tile.pop,
    .card.pop {
      box-shadow: var(--sh-2);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 12.5px;
      font-weight: 600;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--tx-2);
      white-space: nowrap;
      transition: .15s;
    }

    .chip.on {
      background: var(--tan);
      border-color: var(--tan);
      color: var(--ink);
    }

    .chip.soft {
      background: var(--tan-soft);
      border-color: var(--tan-line);
      color: var(--tan-deep);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 10.5px;
      font-weight: 700;
    }

    .badge.ok {
      background: var(--ok-bg);
      color: var(--ok);
    }

    .badge.warn {
      background: var(--warn-bg);
      color: var(--warn);
    }

    .badge.err {
      background: var(--err-bg);
      color: var(--err);
    }

    .badge.info {
      background: var(--info-bg);
      color: var(--info);
    }

    .badge.tan {
      background: var(--tan-soft);
      color: var(--tan-deep);
    }

    .dotn {
      min-width: 17px;
      height: 17px;
      border-radius: 999px;
      background: var(--err);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: inline-grid;
      place-items: center;
      padding: 0 5px;
      border: 2px solid var(--card);
    }

    .av {
      border-radius: 999px;
      background: var(--paper-2);
      color: var(--gray);
      display: grid;
      place-items: center;
      font-family: var(--display);
      font-weight: 600;
      overflow: hidden;
      flex: none;
      position: relative;
    }

    .av img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .av.sq {
      border-radius: var(--r);
    }

    .av-32 {
      width: 32px;
      height: 32px;
      font-size: 13px;
    }

    .av-40 {
      width: 40px;
      height: 40px;
      font-size: 15px;
    }

    .av-44 {
      width: 44px;
      height: 44px;
      font-size: 16px;
    }

    .av-48 {
      width: 48px;
      height: 48px;
      font-size: 17px;
    }

    .av-56 {
      width: 56px;
      height: 56px;
      font-size: 19px;
    }

    .av-64 {
      width: 64px;
      height: 64px;
      font-size: 22px;
    }

    .av-88 {
      width: 88px;
      height: 88px;
      font-size: 30px;
    }

    .av-104 {
      width: 104px;
      height: 104px;
      font-size: 36px;
    }

    .ring {
      padding: 2.5px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--tan), #E8CB9A);
      display: inline-block;
    }

    .ring.seen {
      background: var(--line);
    }

    .ring>.av {
      border: 2px solid var(--card);
    }

    /* minmax(0,1fr): an input carries an intrinsic width that otherwise wins
       and blows the track out. */
    /* The dialling code is two to four characters; the number beside it is the
       part being typed, so the code takes only what it needs. */
    .inp.dial {
      width: 96px;
      flex: none;
      padding-left: 10px;
      padding-right: 6px;
      cursor: pointer;
    }

    .otp-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      max-width: 288px;
      margin: 0 auto;
    }

    .otp {
      width: 100%;
      min-width: 0;
      height: 62px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      border-radius: var(--r);
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--tx);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .otp:focus {
      border-color: var(--tan);
      box-shadow: 0 0 0 3px rgba(223, 170, 90, .20);
    }

    .otp.filled {
      border-color: var(--tan);
      color: var(--tan-deep);
    }

    .lbl {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--tx);
      margin-bottom: 6px;
    }

    .inp {
      width: 100%;
      min-height: 48px;
      border-radius: var(--r);
      border: 1px solid var(--line);
      background: var(--card);
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .inp::placeholder {
      color: var(--tx-3);
    }

    .inp:focus {
      border-color: var(--tan);
      box-shadow: 0 0 0 3px rgba(223, 170, 90, .20);
    }

    .inp.err {
      border-color: var(--err);
    }

    textarea.inp {
      resize: none;
      line-height: 1.55;
    }

    .inp-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .inp-wrap .lead {
      position: absolute;
      left: 13px;
      color: var(--tx-3);
      pointer-events: none;
      display: flex;
    }

    .inp-wrap .lead~.inp {
      padding-left: 42px;
    }

    .inp-wrap .trail {
      position: absolute;
      right: 8px;
      color: var(--tx-2);
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
    }

    .hint {
      font-size: 11.5px;
      color: var(--tx-2);
      margin-top: 6px;
    }

    .hint.err {
      color: var(--err);
      font-weight: 600;
    }

    .hint.ok {
      color: var(--ok);
      font-weight: 600;
    }

    .sw {
      width: 46px;
      height: 28px;
      border-radius: 999px;
      background: #DDD6CD;
      position: relative;
      flex: none;
      transition: background .2s;
    }

    .sw::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #fff;
      box-shadow: var(--sh-1);
      transition: transform .2s;
    }

    .sw.on {
      background: var(--tan);
    }

    .sw.on::after {
      transform: translateX(18px);
    }

    .check {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1.5px solid #CFC7BE;
      background: var(--card);
      display: grid;
      place-items: center;
      flex: none;
      color: transparent;
      transition: .15s;
    }

    .check.on {
      background: var(--tan);
      border-color: var(--tan);
      color: var(--ink);
    }

    .radio {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1.5px solid #CFC7BE;
      background: var(--card);
      display: grid;
      place-items: center;
      flex: none;
    }

    .radio::after {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: transparent;
    }

    .radio.on {
      border-color: var(--tan);
      border-width: 2px;
    }

    .radio.on::after {
      background: var(--tan);
    }

    .lrow {
      display: flex;
      align-items: center;
      gap: var(--s3);
      width: 100%;
      text-align: left;
      padding: 13px var(--s4);
      background: var(--card);
      border-bottom: 1px solid var(--line-2);
      transition: background .12s;
    }

    .lrow:last-child {
      border-bottom: 0;
    }

    .lrow:active {
      background: var(--paper-2);
    }

    .lgroup {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      overflow: hidden;
      box-shadow: var(--sh-1);
    }

    .topbar {
      flex: none;
      display: flex;
      align-items: center;
      gap: var(--s2);
      padding: 6px var(--s3);
      min-height: 52px;
      background: var(--paper);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .topbar.plain {
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }

    .iconbtn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      flex: none;
      position: relative;
    }

    .iconbtn:active {
      background: rgba(0, 0, 0, .05);
    }

    .tabbar {
      flex: none;
      display: flex;
      align-items: stretch;
      background: var(--card);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 30;
    }

    .tabbtn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 9px 0 11px;
      color: var(--tx-3);
      font-size: 10px;
      font-weight: 600;
      position: relative;
    }

    .tabbtn.on {
      color: var(--tan-deep);
    }

    .seg {
      display: flex;
      background: var(--paper-2);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }

    .seg button {
      flex: 1;
      border-radius: 8px;
      padding: 8px 4px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--tx-2);
      transition: .15s;
    }

    .seg button.on {
      background: var(--card);
      color: var(--tx);
      box-shadow: var(--sh-1);
    }

    .chiprow {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 var(--s5) 2px;
      margin: 0 calc(var(--s5) * -1);
    }

    .chiprow>* {
      flex: none;
    }

    #sheet-root:empty {
      display: none;
    }

    .scrim {
      position: absolute;
      inset: 0;
      background: rgba(35, 32, 30, .48);
      z-index: 60;
      opacity: 0;
      transition: opacity .22s;
    }

    .scrim.in {
      opacity: 1;
    }

    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 61;
      background: var(--card);
      border-radius: var(--r-xl) var(--r-xl) 0 0;
      max-height: 88%;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.32, .72, 0, 1);
      box-shadow: var(--sh-4);
    }

    .sheet.in {
      transform: none;
    }

    .grab {
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: #DDD6CD;
      margin: 10px auto 2px;
      flex: none;
    }

    .sheet-body {
      overflow-y: auto;
      padding: var(--s4) var(--s5) calc(var(--s6) + env(safe-area-inset-bottom));
    }

    .modal {
      position: absolute;
      left: var(--s5);
      right: var(--s5);
      top: 50%;
      z-index: 61;
      transform: translateY(-50%) scale(.96);
      opacity: 0;
      background: var(--card);
      border-radius: var(--r-xl);
      box-shadow: var(--sh-4);
      padding: var(--s6) var(--s5) var(--s5);
      transition: .22s cubic-bezier(.32, .72, 0, 1);
    }

    .modal.in {
      transform: translateY(-50%) scale(1);
      opacity: 1;
    }

    #toast-root {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 92px;
      z-index: 70;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      padding: 0 var(--s5);
    }

    .toast {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #3A3838;
      color: #fff;
      border-radius: var(--r);
      padding: 12px 14px;
      font-size: 13.5px;
      font-weight: 500;
      max-width: 100%;
      box-shadow: var(--sh-3);
      animation: toastin .26s cubic-bezier(.32, .72, 0, 1) both;
    }

    .toast .icon {
      margin-top: 1px;
      width: 18px;
      height: 18px;
    }

    .toast.ok .icon {
      color: #6FCFA3;
    }

    .toast.err .icon {
      color: #F1948C;
    }

    .toast.warn .icon {
      color: var(--tan);
    }

    .toast.info .icon {
      color: #9EC1DA;
    }

    .toast.out {
      animation: toastout .2s ease both;
    }

    @keyframes toastin {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
    }

    @keyframes toastout {
      to {
        opacity: 0;
        transform: translateY(6px);
      }
    }

    .sk {
      background: linear-gradient(90deg, var(--paper-2) 25%, #E8E1D8 37%, var(--paper-2) 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }

    @keyframes shimmer {
      0% {
        background-position: 100% 0
      }

      100% {
        background-position: -100% 0
      }
    }

    .divider {
      height: 1px;
      background: var(--line);
    }

    .empty {
      text-align: center;
      padding: var(--s10) var(--s5);
    }

    .empty .art {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: var(--tan-soft);
      display: grid;
      place-items: center;
      margin: 0 auto var(--s4);
      color: var(--tan-deep);
    }

    .photo {
      background: var(--paper-2);
      position: relative;
      overflow: hidden;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Reactions: paw for like, heart for comfort — the two the brief names. */
    .react {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 4px;
      color: var(--tx-2);
      font-weight: 600;
      font-size: 13px;
    }

    .react.on-paw {
      color: var(--tan-deep);
    }

    .react.on-love {
      color: var(--err);
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }

    body.fs #panel {
      display: none;
    }

    body.fs #viewer {
      grid-template-columns: 1fr;
    }
  </style>
</head>

      <div class="field" style="margin-top:var(--s4)">

        ${byPhone ? `<div class="row" style="gap:8px">
          <select class="inp dial" id="li-dial">${dialOpts(S.reg.dial)}</select>

        </div>`
            : `<div class="inp-wrap"><span class="lead">${ic('mail', 18)}</span>
          <input class="inp" id="li-id" type="email" placeholder="you@example.com" value="${esc(S.reg.email)}"></div>`}

      <button class="btn" style="margin-top:var(--s5)" data-act="send-code">Login</button>

    /* --- create account: choose the kind, then fill it in --- */
    const stepDots = (i, n) => `<div class="row" style="gap:6px;margin:0 0 var(--s5)">

    function scrSignupKind() {
      const card = (icon2, title, body, go2) => `<button class="tile" data-nav="${go2}"

      <span class="av av-56 sq" style="background:var(--tan-soft);color:var(--tan-deep);flex:none">${ic(icon2, 24)}</span>
      <span class="grow" style="min-width:0">

        <span class="sm mut" style="display:block;margin-top:4px">${body}</span>

      return {
        chromeless: true, body: `
    <div style="position:relative;height:150px;background:#2A2622">
      <span style="position:absolute;inset:0">${img('handpaw')}</span>
      <span style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,24,18,.24) 0%,rgba(30,24,18,.40) 55%,var(--paper) 100%)"></span>
      <div class="row" style="position:relative;padding:6px 4px 0">

    </div>
    <div class="pad" style="padding-bottom:var(--s10);margin-top:-28px;position:relative">
      <h1 class="d1" style="margin:0">What kind of account?</h1>
      <p class="sm mut" style="margin:8px 0 var(--s6)">This decides what your profile is. It cannot be changed later, so pick the one that describes you.</p>
      <div class="stack">
        ${card('paw', 'Pet owner', 'For your pets. Each one gets its own profile, followers and posts.', 'signup-owner')}
        ${card('store', 'Rescue Org', 'For a shelter or rescue listing pets for adoption and fostering. No pet profiles needed.', 'business-edit')}
        <!-- A third account type is coming. It is shown rather than hidden so
             the shape of the product is honest, and it is not selectable

        <div class="tile" style="width:100%;padding:var(--s5);display:flex;gap:var(--s4);align-items:flex-start;

          <span class="grow" style="min-width:0">

          </span>
        </div>
      </div>
    </div>` };
    }

    /* ── Legal ───────────────────────────────────────────────────
       The two documents the sign-up asks people to agree to. They are reachable
       from the agreement line itself, because a link that agrees on your behalf
       without letting you read what you agreed to is not a link. Both state when
       they last changed: a policy with no date is one nobody can hold you to. */
    const legalPage = (title, updated, intro, sections) => ({
      top: topBar({ back: true, title }), body: `
    <div class="pad" style="padding-bottom:var(--s10)">
      <div class="tile" style="margin-top:var(--s3);background:var(--tan-soft);border-color:var(--tan-line)">
        <div class="row" style="gap:10px;align-items:flex-start"><span class="tan">${ic('clock', 18)}</span>
          <span class="sm"><b>Last updated ${updated}.</b> We tell you in the app before anything here
            changes in a way that affects you.</span></div>
      </div>
      <p class="bd mut" style="margin-top:var(--s5)">${intro}</p>
      ${sections.map((sec, i) => `<div style="margin-top:var(--s6)">
        <div class="row" style="gap:10px;align-items:flex-start">
          <span class="eb tan" style="font-size:13px;padding-top:3px">${String(i + 1).padStart(2, '0')}</span>
          <div class="grow">
            <div class="h1">${sec[0]}</div>
            ${sec[1].map(t => `<p class="bd mut" style="margin:10px 0 0">${t}</p>`).join('')}
          </div>
        </div></div>`).join('')}
      <div class="tile" style="margin-top:var(--s8)">
        <div class="h2">Questions about this?</div>
        <p class="sm mut" style="margin:6px 0 0">Write to <b>support@tailtalk.com</b> and a person will answer.</p>
      </div>
    </div>` });

    function scrTerms() {
      return legalPage('Terms of Use', '2 August 2026',
        'What you can expect from tailtalk and what we expect from you. Plain language, because terms nobody reads protect nobody.', [
        ['Your account', [
          'You need to be 16 or older to hold an account, and the details you give us should be accurate — a lost pet alert only works if the contact information on it is real.',
          'You are responsible for what happens under your account. A business account is held by the business, and whoever is named as the contact person speaks for it.']],
        ['Your pets and your content', [
          'Photographs, pet profiles and posts stay yours. You give us permission to show them to the people you have chosen to share them with, and nothing more.',
          'You can delete any post at any time. Deleting your account removes your content from other people\u2019s feeds within 30 days.']],
        ['Pet alerts', [
          'Report honestly. A false alert pulls hundreds of neighbours away from a real search, and we remove accounts that file them.',
          'A found-pet report is a good-faith notice, not a transfer of ownership. Where local law sets out what a finder must do, that law comes first.']],
        ['Behaviour', [
          'Treat other owners the way you would at the park gate. Harassment, threats and hate speech end an account without warning.',
          'Do not use tailtalk to sell animals. Rehoming through a shelter or rescue profile is welcome; private sale is not.']],
        ['Availability', [
          'We aim to keep tailtalk running continuously, but we do not guarantee it.',
          'Never rely on tailtalk alone in an emergency. For a sick or injured animal, call a vet.']],
        ['Changes', [
          'If we change these terms in a way that affects you, we will tell you in the app at least 30 days beforehand.']],
      ]);
    }

    function scrPrivacyPolicy() {
      return legalPage('Privacy Policy', '2 August 2026',
        'What we collect, why, and what we will never do with it. Location is the sensitive part of a product like this, so it comes first.', [
        ['Location', [
          'Your precise location never leaves your device. It is rounded to a neighbourhood before it is sent to us, and that rounded value is what other owners see.',
          'A pet alert shows an approximate area, never a home address. You choose the area yourself and you can move it.',
          'Turning location off keeps the app working: you lose distance sorting on alerts, and nothing else.']],
        ['What we collect', [
          'Account details you give us: name, email, phone, and the town you set on your profile.',
          'Pet details you enter, including photographs you upload.',
          'How you use the app — screens opened, features used — so we know what to build next. This is never sold.']],
        ['Who can see what', [
          'Pet profiles are public. That is what lets a lost pet be recognised and PawPals find each other.',
          'Your owner details stay private. Tailtalks are between the two accounts in them.']],
        ['Advertising', [
          'tailtalk does not sell your data to advertisers and does not run behavioural advertising.']],
        ['Keeping and deleting', [
          'We keep your data while your account is open. When you delete your account it is recoverable for 30 days, then permanently removed within 90 days.']],
        ['Your rights', [
          'You can see, correct, export or delete your data. Write to privacy@tailtalk.com and we will answer within 30 days.']],
      ]);
    }

    /* ══════════ DISCOVER HUB ══════════
       Adoption, communities and the map are all "find something beyond the pets
       you already follow", so they share one door rather than each taking a slot
       in a five-tab bar that is already full. */
    function scrDiscover() {
      const row = (icon2, title, blurb, go2, count) => `<button class="tile row" data-nav="${go2}" style="width:100%;text-align:left;gap:var(--s3)">
      <span class="av av-48 sq" style="background:var(--tan-soft);color:var(--tan-deep);flex:none">${ic(icon2, 21)}</span>
      <span class="grow" style="min-width:0"><span class="h2" style="display:block">${title}</span>
        <span class="xs mut">${blurb}</span></span>
      ${count ? `<span class="chip soft">${count}</span>` : ''}${ic('fwd', 17, 'faint')}</button>`;
      return {
        top: topBar({ back: true, title: 'Discover', actions: [navBtn('search', 'search', 'Search')] }), body: `
    <div class="pad" style="padding-bottom:var(--s8)">
      <p class="sm mut" style="margin:var(--s3) 0 var(--s4)">Pets looking for homes, places that welcome them, and people who keep the same kind of animal you do.</p>
      <div class="stack">
        ${row('heart', 'Adoption & fostering', 'Pets listed by shelters and rescues near you', 'adoption', ADOPTABLE.length)}
        ${row('users', 'Communities', 'Boards by species, breed and interest', 'communities', BOARDS.length)}
        ${row('map', 'Pet-friendly map', 'Parks, vets, groomers and daycare', 'placemap', PLACES.length)}
        ${row('gift', 'Wellness', 'Check-ins, milestones and birthdays', 'wellness', WELLNESS.streak + ' day streak')}
      </div>
    </div>` };
    }

    /* ══════════ ADOPTION & FOSTERING ══════════ */
    function scrAdoption() {
      const near = ADOPTABLE.filter(a => a.miles <= S.adoptRadius);
      // Listing a pet is a rescue's job. An owner sees the pets on offer and the
      // applications they have made, and nothing about running a shelter.
      const manages = ACCOUNT === 'business' && !!MY_BIZ && /shelter|rescue/i.test(MY_BIZ.cat);
      const mine = manages ? ADOPTABLE.filter(a => a.org === MY_BIZ.id) : [];
      return {
        top: topBar({ back: true, title: 'Adoption & fostering' }), body: `
    <div class="pad" style="padding-bottom:var(--s8)">
      <!-- Distance is the filter that matters most here: an animal three
           states away is not a match however well it suits. -->
      ${manages || ACCOUNT === 'owner' ? `<div class="seg" style="margin-top:var(--s3)">
        ${[['browse', 'Suggested'], ['apps', manages ? 'Applications' : 'My applications']].map(t =>
          `<button class="${S.adoptTab === t[0] ? 'on' : ''}" data-act="adopt-tab" data-val="${t[0]}">${t[1]}
          ${t[0] === 'apps' && (manages ? pendingApps() : myApps().length) ? `<span class="chip on xs" style="padding:1px 7px;margin-left:4px">${manages ? pendingApps() : myApps().length}</span>` : ''}</button>`).join('')}
      </div>` : ''}

      ${S.adoptTab === 'apps' ? (manages ? applicationsPanel() : myAppsPanel()) : ''}
      ${S.adoptTab === 'apps' ? '' : `
      ${manages ? `<div class="tile" style="margin-top:var(--s3);background:var(--tan-soft);border-color:var(--tan-line)">
        <div class="row"><div class="grow"><div class="cap tan">Your listings</div>
          <div class="h1" style="margin-top:3px">${mine.length} pet${mine.length === 1 ? '' : 's'} listed by ${esc(MY_BIZ.name)}</div></div>
          <button class="btn sm" style="width:auto;padding:0 14px" data-act="pick-adoptable">${ic('plus', 15)} List a pet</button></div>
        ${mine.length ? `<div class="stack" style="margin-top:var(--s4)">
          ${mine.map(a => `<div class="row" style="gap:var(--s3);background:var(--card);border-radius:12px;padding:var(--s3)">
            ${av(a.photo, 40, { fallback: a.name[0] })}
            <div class="grow" style="min-width:0"><div class="brand h2">${a.name}</div>
              <div class="xs mut trunc">${a.species} · ${a.breed} · ${a.foster ? 'Fostering' : 'Adoption'}</div></div>
            <button class="iconbtn" data-act="remove-adoptable" data-id="${a.id}" aria-label="Remove listing" style="color:var(--err)">${ic('trash', 17)}</button>
          </div>`).join('')}</div>` : `<p class="xs mut" style="margin:var(--s3) 0 0">Nothing listed yet. Anyone within 100 miles will see what you list here.</p>`}
      </div>` : ''}

      <div class="tile" style="margin-top:var(--s3)">
        <div class="row"><span class="cap mut grow">Within ${S.adoptRadius} miles</span>
          <span class="b sm tan">${near.length} pet${near.length === 1 ? '' : 's'}</span></div>
        <input type="range" min="10" max="100" step="10" value="${S.adoptRadius}" data-act="adopt-radius"
          style="width:100%;margin-top:10px;accent-color:var(--tan)">
        <div class="row xs mut" style="justify-content:space-between"><span>10 mi</span><span>100 mi</span></div>
      </div>

      ${sectionHead('Suggested for you')}
      ${near.length ? `<div class="stack">${near.map(a => `
        <button class="card" data-nav="adopt-detail" data-id="${a.id}" style="width:100%;text-align:left;padding:0;overflow:hidden">
          <span class="row" style="gap:0;align-items:stretch">
            <span class="photo" style="width:112px;flex:none">${img(a.cover)}</span>
            <span class="grow" style="padding:var(--s3) var(--s4);min-width:0">
              <span class="row" style="gap:6px">
                ${a.urgent ? '<span class="chip soft xs" style="padding:3px 9px">Longest waiting</span>' : ''}
                ${a.foster ? '<span class="chip xs" style="padding:3px 9px">Foster</span>' : ''}
                <span class="grow"></span><span class="xs mut">${a.miles} mi</span></span>
              <span class="brand h1" style="display:block;margin-top:4px">${a.name}</span>
              <span class="xs mut trunc" style="display:block">${a.species} · ${a.breed} · ${a.age}</span>
              <span class="xs faint" style="display:block;margin-top:4px">${bizOf(a.org).name}</span>
            </span></span></button>`).join('')}</div>`
              : emptyState('heart', `Nothing within ${S.adoptRadius} miles`, 'Widen the radius to see pets further away.', '', '')}
      `}

    </div>` };
    }

    const myApps = () => APPLICATIONS.filter(a => a.who === OWNER.name);
    const APP_STATE = {
      pending: { label: 'Applied', cls: '', note: 'Waiting on the rescue.' },
      accepted: { label: 'Accepted', cls: 'on', note: 'They chose you. Expect to hear from them.' },
      declined: { label: 'Declined', cls: '', note: 'This one went to another home.' },
    };
    /* What the applicant sees. A withdrawal is only offered while the rescue has
       not decided — pulling out of a decision already made is not a withdrawal,
       it is a message, and belongs in Tailtalks. */
    function myAppsPanel() {
      const list = myApps();
      if (!list.length) return emptyState('heart', 'No applications yet',
        'Apply to adopt or offer to foster and you can follow it here.', 'Browse pets', 'adopt-browse');
      return `<div class="stack" style="margin-top:var(--s4)">
      ${list.map(a => {
        const pet = adoptOf(a.adopt), st = APP_STATE[a.status]; return `<div class="card" style="padding:var(--s4)">
        <div class="row" style="gap:var(--s3)">
          <button data-nav="adopt-detail" data-id="${pet.id}">${av(pet.photo, 48, { fallback: pet.name[0] })}</button>
          <div class="grow" style="min-width:0">
            <div class="brand h1">${pet.name}</div>
            <div class="xs mut trunc">${a.kind === 'foster' ? 'Offered to foster' : 'Applied to adopt'} · ${bizOf(pet.org).name}</div>
            <div class="xs faint" style="margin-top:2px">${a.when}</div>
          </div>
          <span class="chip ${st.cls}">${st.label}</span>
        </div>
        <p class="xs mut" style="margin:var(--s3) 0 0">${st.note}</p>
        ${a.status === 'pending' ? `<button class="btn ghost sm" style="margin-top:var(--s3)" data-act="withdraw-app" data-id="${a.id}">Take it back</button>` : ''}
      </div>`;
      }).join('')}
    </div>`;
    }
    const pendingApps = () => APPLICATIONS.filter(a =>
      a.status === 'pending' && MY_BIZ && (adoptOf(a.adopt) || {}).org === MY_BIZ.id).length;

    /* Applications received, grouped by the pet they are for. Accepting one
       settles the rest: an animal goes to one home, so leaving the others
       "pending" would be a lie the rescue then has to undo by hand. */
    function applicationsPanel() {
      const listings = ADOPTABLE.filter(a => a.org === MY_BIZ.id);
      const withApps = listings.filter(a => appsFor(a.id).length);
      if (!withApps.length) return emptyState('mail', 'No applications yet',
        'When someone applies to adopt or foster one of your pets, it lands here.', '', '');
      return `<div class="stack" style="margin-top:var(--s4)">
      ${withApps.map(pet => {
        const apps = appsFor(pet.id), placed = apps.find(a => a.status === 'accepted');
        return `<div class="card" style="padding:var(--s4)">
        <div class="row" style="gap:var(--s3)">
          ${av(pet.photo, 44, { fallback: pet.name[0] })}
          <div class="grow"><div class="brand h1">${pet.name}</div>
            <div class="xs mut">${pet.species} · ${apps.length} application${apps.length === 1 ? '' : 's'}</div></div>
          ${placed ? `<span class="chip on">Placed</span>` : ''}
        </div>
        <div class="stack" style="margin-top:var(--s4)">
          ${apps.map(a => `<div class="tile" style="box-shadow:none;background:var(--paper)">
            <div class="row" style="gap:var(--s3);align-items:flex-start">
              ${av(a.photo, 40, { fallback: a.who[0] })}
              <div class="grow" style="min-width:0">
                <div class="row" style="gap:6px"><span class="h2">${esc(a.who)}</span>
                  <span class="chip xs" style="padding:2px 8px">${a.kind === 'foster' ? 'Foster' : 'Adopt'}</span></div>
                <div class="xs faint">${a.when}</div>
                <p class="sm" style="margin:6px 0 0">${esc(a.note)}</p>
              </div>
            </div>
            ${a.status === 'pending' && !placed ? `<div class="btn-row" style="margin-top:var(--s3)">
              <button class="btn ghost sm" data-act="decline-app" data-id="${a.id}">Not this time</button>
              <button class="btn sm" data-act="accept-app" data-id="${a.id}">${ic('check', 15)} Accept</button>
            </div>`
            : `<div class="xs b" style="margin-top:var(--s3);color:${a.status === 'accepted' ? 'var(--ok)' : 'var(--tx-3)'}">
              ${a.status === 'accepted' ? 'Accepted — this home was chosen' : 'Not this time'}</div>`}
          </div>`).join('')}
        </div>
      </div>`;
      }).join('')}
    </div>`;
    }

    function scrAdoptDetail() {
      const a = adoptOf(S.id), org = bizOf(a.org);
      const mineApp = APPLICATIONS.find(x => x.adopt === a.id && x.who === OWNER.name);
      return {
        top: topBar({ back: true, title: a.name, actions: [barBtn('share', 'share', 'Share')] }), body: `
    <div class="photo" style="height:230px">${img(a.cover)}</div>
    <div class="pad" style="padding-top:var(--s5);padding-bottom:var(--s10)">
      <div class="row"><h1 class="brand d2 grow">${a.name}</h1>
        <span class="chip soft">${a.days} days waiting</span></div>
      <div class="sm mut" style="margin-top:6px">${a.species} · ${a.breed} · ${a.age} · ${a.sex}</div>
      <p class="bd" style="margin-top:var(--s4)">${a.bio}</p>

      <button class="tile row" data-nav="business" data-id="${org.id}" style="width:100%;text-align:left;gap:var(--s3);margin-top:var(--s5)">
        ${av(org.photo, 44, { sq: true, fallback: org.name[0] })}
        <span class="grow"><span class="h2" style="display:block">${org.name}</span>
          <span class="xs mut">${org.cat} · ${a.miles} miles away</span></span>${ic('fwd', 17, 'faint')}</button>

      <div class="btn-row" style="margin-top:var(--s5)">
        ${mineApp
            ? `<button class="btn sm ghost" data-act="${mineApp.status === 'pending' ? 'withdraw-app' : 'view-apps'}" data-id="${mineApp.status === 'pending' ? mineApp.id : ''}">
            ${a.foster ? 'Offered to foster' : 'Applied to adopt'}${mineApp.status === 'pending' ? ' · Take back' : ''}</button>`
            : `<button class="btn sm" data-act="apply-adopt" data-id="${a.id}">${ic('heart', 16)} ${a.foster ? 'Offer to foster' : 'Apply to adopt'}</button>`}
        <button class="btn ghost sm" data-nav="thread" data-id="t1">${ic('chat', 16)} Ask a question</button>
      </div>
    </div>` };
    }

    /* ══════════ COMMUNITIES ══════════ */
    function scrCommunities() {
      return {
        top: topBar({ back: true, title: 'Communities' }), body: `
    <div class="pad" style="padding-bottom:var(--s8)">
      <p class="sm mut" style="margin:var(--s3) 0 var(--s4)">Boards for a species, a breed or an interest. Join the ones that match your household.</p>
      <div class="stack">
        ${BOARDS.map(b => `<div class="card" style="overflow:hidden">
          <button data-nav="board" data-id="${b.id}" style="display:block;width:100%">

          <div class="row" style="padding:var(--s3) var(--s4);gap:var(--s3);align-items:flex-start">
            <div class="grow" style="min-width:0">
              <div class="h2">${b.name}</div>
              <div class="xs mut">${b.topic} · ${b.members.toLocaleString()} members</div>

    /* ══════════ WELLNESS ══════════ */
    function scrWellness() {

      // cruel, and the streak should not wait on an answer that cannot come.
      const living = PETS.filter(pt => !pt.memorial);
      const answered = living.filter(pt => S.checkIn[pt.id]).length;
      const done = answered === living.length && living.length > 0;
      return {
        top: topBar({ back: true, title: 'Wellness' }), body: `
    <div class="pad" style="padding-bottom:var(--s8)">
      <!-- A check-in is answered per pet, not once for the household: with
           three animals "did you check in today" has no single true answer, and
           the point of asking daily is noticing which one is off. The streak
           only counts a day where every pet was answered. -->

        <div class="row">
          <div class="grow"><div class="cap tan">Daily check-in</div>
            <div class="d2" style="margin-top:4px">${WELLNESS.streak + (done ? 1 : 0)} day streak</div>
            <div class="xs mut" style="margin-top:2px">${done

            : answered + ' of ' + living.length + ' answered — how is everyone doing?'}</div></div>
          <span class="av av-56" style="background:${done ? 'var(--tan)' : 'var(--card)'};color:${done ? 'var(--ink)' : 'var(--tan-deep)'}">${ic('check', 24)}</span>

        </div>
        <div class="stack" style="margin-top:var(--s4)">
          ${living.map(pt => {
              const v = S.checkIn[pt.id]; return `<div class="row" style="gap:var(--s3)">
            ${petAv(pt, 40)}
            <div class="grow" style="min-width:0"><div class="brand h2">${pt.name}</div>

              <button class="chip ${v === 'well' ? 'on' : ''}" data-act="check-pet" data-id="${pt.id}" data-val="well" title="Doing well">${ic('check', 14)}</button>
              <button class="chip ${v === 'off' ? 'on' : ''}" data-act="check-pet" data-id="${pt.id}" data-val="off" title="Not quite right">${ic('alert', 14)}</button>
            </div>

            }).join('')}

            }).join('')}
      </div>

      ${sectionHead('Birthdays')}
      <div class="lgroup">
        ${WELLNESS.birthdays.map(bd => {
              const p = anyPet(bd.pet); return `<div class="lrow">
          ${petAv(p, 40)}

      ${sectionHead('In memory')}

        <div class="row" style="gap:var(--s3);align-items:flex-start">

      const v = VERIFY[key];

        chromeless: true, body: `

    <div class="row" style="padding:6px 4px 0">

      ${v.step ? `<span class="cap mut">${v.step}</span>` : ''}
    </div>
    <div class="pad" style="padding-bottom:var(--s6)">
      <div style="text-align:center;padding:var(--s6) 0 var(--s5)">
        <span class="av av-64" style="background:var(--tan-soft);color:var(--tan-deep);margin:0 auto">${ic(/phone/.test(key) ? 'phone' : 'mail', 26)}</span>
        <h1 class="d1" style="margin:var(--s4) 0 0">${v.title}</h1>

      </div>
      <div class="otp-row" data-otp-next="${v.next}">
        ${S.otp.map((dg, i) => `<input class="otp ${dg ? 'filled' : ''}" inputmode="numeric" maxlength="1"
          value="${esc(dg)}" data-otp="${i}" aria-label="Digit ${i + 1}" autocomplete="one-time-code">`).join('')}

      <div class="hint" id="otp-hint" style="text-align:center;margin-top:var(--s4);min-height:18px">

      <div class="row" style="justify-content:center;gap:6px;margin-top:var(--s5)">
        <span class="sm mut">Nothing arrived?</span>
        <button class="b sm" id="resend-btn" data-act="resend" ${waiting ? 'disabled' : ''}
          style="color:${waiting ? 'var(--tx-3)' : 'var(--tan-deep)'};${waiting ? 'pointer-events:none' : ''}">${waiting ? `Resend in 00:${String(S.resendIn).padStart(2, '0')}` : 'Resend code'}</button>
      </div>
    </div>
    ${footerArt(230)}
    </div>` };

    function scrPawPals() {
      /* One feed. The requirement describes PawPals as "a personalized social
         feed containing posts from pets followed by any pets associated with the
         owner's account" — that is a single stream, not one per pet. The
         combined/by-pet toggle was invented, so it is gone; whose circle a post
         came through is answered by the post itself, which names the pet. */
      // Reads the live follow state, so unfollowing a pet removes its posts from
      // here immediately rather than at the next reload.
      const feed = POSTS.filter(p => p.kind === 'pet' && S.follow[p.pet]);
      return {
        tab: 'pawpals',
        top: topBar({ title: 'PawPals', big: true, actions: [navBtn('search', 'search', 'Search'), navBtn('suggested', 'users', 'Suggested PawPals')] }),

    function scrPost() {

      const r = S.react[po.id] || {};

        top: topBar({ back: true, title: 'Post', actions: [barBtn('report', 'flag', 'Report this post')] }),
        body: `
    <div class="row" style="padding:var(--s3) var(--s5);gap:var(--s3)">
      <button data-nav="${isPet ? 'pet-public' : 'business'}" data-id="${who.id}">${av(who.photo, 48, { fallback: who.name[0] })}</button>
      <div class="grow"><div class="brand h1">${who.name}</div>
        <div class="xs mut">${isPet ? `${who.species} · with ${who.owner || OWNER.name}` : who.cat}</div></div>
      <button class="chip ${S.follow[who.id] ? '' : 'on'}" data-act="follow" data-id="${who.id}">${S.follow[who.id] ? 'Unfollow' : 'Follow'}</button>

    ${po.img ? `<div class="photo" style="height:300px">${img(po.img)}</div>` : ''}

        <button class="react ${r.paw ? 'on-paw' : ''}" data-act="paw" data-id="${po.id}">${ic('paw', 22, r.paw ? 'fill' : '')}<span>${po.paws + (r.paw ? 1 : 0)}</span></button>
        <button class="react ${r.love ? 'on-love' : ''}" data-act="love" data-id="${po.id}">${ic('heart', 22, r.love ? 'fill' : '')}<span>${po.loves + (r.love ? 1 : 0)}</span></button>
        <span class="react">${ic('chat', 22)}<span>${po.comments}</span></span>
        <span class="grow"></span>
        <button class="react" data-act="share">${ic('share', 21)}</button>
      </div>
      <div class="divider" style="margin:var(--s5) 0"></div>
      <div class="cap mut">Comments</div>
      <div class="stack" style="margin-top:var(--s3)">
        ${COMMENTS.map(c => {
          const p = anyPet(c.pet); return `<div class="row" style="gap:var(--s3);align-items:flex-start">
          ${petAv(p, 40)}
          <div class="grow"><div class="row" style="gap:7px"><span class="brand h2">${p.name}</span><span class="xs faint">${c.when}</span></div>
            <p class="sm" style="margin:3px 0 0">${c.text}</p>
</div></div>`;
        }).join('')}
      </div>
      <div class="row" style="margin-top:var(--s6);gap:var(--s2)">
        ${petAv(petOf(S.asPet), 40)}
        <div class="inp-wrap grow"><input class="inp" placeholder="Comment as ${petOf(S.asPet).name}" value="Freeze-dried liver. It is the only thing that outranks wildlife."></div>
        <button class="iconbtn tan" data-act="comment" aria-label="Send">${ic('send', 21)}</button>
      </div>
    </div>` };
    }

    function scrCompose() {
      const p = petOf(S.asPet);
      return {
        top: topBar({
          back: true, title: 'New post',
          actions: [`<button class="btn sm" data-act="publish" style="width:auto;padding:0 16px;margin-right:4px">Publish</button>`]
        }), body: `
    <div class="pad" style="padding-top:var(--s4);padding-bottom:var(--s10)">
      <!-- A post belongs to a pet, not to the owner, so the first choice on the
           screen is which pet is speaking. -->
      <button class="tile row" data-act="pick-pet" style="width:100%;text-align:left;gap:var(--s3)">
        ${petAv(p, 48)}
        <span class="grow"><span class="xs mut" style="display:block">Posting as</span>
          <span class="brand h1">${p.name}</span></span>
        ${ic('down', 18, 'faint')}</button>

      <textarea class="inp" rows="4" style="margin-top:var(--s4);border:0;padding:0;font-size:16.5px;background:transparent"
        placeholder="What is going on today?">${esc(S.postText)}</textarea>

      <div class="tile" style="padding:0;overflow:hidden;margin-top:var(--s3)">
        <div class="photo" style="height:190px">${img(S.postImg)}</div>
        <div class="row" style="padding:var(--s3)">
          <span class="xs mut grow">Photo attached</span>
          <button class="chip" data-act="swap-img">${ic('refresh', 13)} Change</button>
        </div>
      </div>

      <div class="lgroup" style="margin-top:var(--s4)">
        <button class="lrow" data-act="tag-pets"><span class="faint">${ic('paw', 19)}</span>
          <span class="grow b sm">Tag pets</span><span class="xs mut">${S.tagPets.length ? S.tagPets.join(', ') : 'None'}</span>${ic('fwd', 17, 'faint')}</button>
        <button class="lrow" data-act="tag-biz"><span class="faint">${ic('store', 19)}</span>
          <span class="grow b sm">Tag a business</span><span class="xs mut">${S.tagBiz || 'None'}</span>${ic('fwd', 17, 'faint')}</button>
      </div>

      <div class="row" style="margin-top:var(--s4);gap:var(--s2)">
        <button class="chip" data-act="upload">${ic('image', 15)} Photo</button>
        <button class="chip" data-act="upload">${ic('video', 15)} Video</button>
        <button class="chip" data-act="upload">${ic('cam', 15)} Reel</button>
      </div>
    </div>` };
    }

    function scrStory() {
      const s = STORIES.find(x => x.id === S.id) || STORIES[0];
      const p = anyPet(s.pet);
      return {
        chromeless: true, noTab: true, dark: true, body: `
    <div class="fill" style="background:#1A1816;position:relative">
      <div class="photo" style="position:absolute;inset:0">${img(s.img)}</div>
      <span style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,16,.62) 0%,rgba(20,18,16,.10) 30%,rgba(20,18,16,.72) 100%)"></span>
      <div style="position:relative;padding:var(--s4) var(--s4) 0">
        <div class="row" style="gap:5px">
          ${STORIES.map((x, i) => `<span class="grow" style="height:3px;border-radius:999px;background:${x.id === s.id ? '#fff' : 'rgba(255,255,255,.34)'}"></span>`).join('')}
        </div>
        <div class="row" style="margin-top:var(--s4);gap:var(--s3)">
          ${petAv(p, 40, { style: 'border:2px solid rgba(255,255,255,.8)' })}
          <div class="grow"><div class="brand h2" style="color:#fff">${p.name}</div>
            <div class="xs" style="color:rgba(255,255,255,.75)">${s.when} ago</div></div>
          ${S.storyMusic ? `<span class="row" style="gap:5px;background:rgba(255,255,255,.16);border-radius:100px;
            padding:5px 11px;color:#fff;font-size:.7rem;font-weight:700;max-width:150px">
            ${ic('chat', 12)}<span class="trunc">${esc((STORY_MUSIC.find(m => m.id === S.storyMusic) || {}).title || '')}</span></span>` : ''}
          <button class="iconbtn" style="color:#fff" data-go-back aria-label="Close">${ic('x', 22)}</button>
        </div>
      </div>
      <div style="position:relative;margin-top:auto;padding:var(--s5) var(--s4) var(--s6)">
        <!-- What has come back on this story. Instagram shows the sender their
             own replies and reactions; without them the box is a message you
             post into nothing. -->
        ${(S.storyReplyLog || []).length ? `<div class="stack" style="margin-bottom:var(--s3)">
          ${(S.storyReplyLog || []).slice(-3).map(r => `<div class="row" style="gap:8px;background:rgba(20,18,16,.55);
            border-radius:14px;padding:8px 12px">
            ${petAv(petOf(S.asPet), 26)}
            <span class="grow xs" style="color:#fff">${esc(r)}</span></div>`).join('')}
        </div>` : ''}
        <div class="row" style="gap:var(--s2)">
          <div class="inp-wrap grow"><input class="inp" placeholder="Reply to ${p.name}" value="That face. Every time."
            style="background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff"></div>
          <button class="iconbtn" data-act="story-reply" style="color:#fff" aria-label="Send reply">${ic('send', 20)}</button>
          ${QUICK.slice(0, 2).map(e => `<button class="iconbtn" data-act="story-react" style="font-size:20px">${e}</button>`).join('')}
        </div>
      </div>
    </div>` };
    }

    /* Stories carry more than a photograph: a clip, a track, stickers laid over
       the frame, and the replies and reactions that come back. A business posts
       them on the same screen — it has no pet to post as, so it posts as itself. */
    const STORY_MUSIC = [
      { id: 'm1', title: 'Sunday Morning', artist: 'Kit Vaughn' },
      { id: 'm2', title: 'Good Dog', artist: 'The Porch Lights' },
      { id: 'm3', title: 'Slow Walk Home', artist: 'Auden Reyes' },
      { id: 'm4', title: 'Tail Lights', artist: 'Marlow & June' },
    ];
    const STORY_STICKERS = ['paw', 'heart', 'sun', 'gift', 'pin', 'check'];

    function scrStoryCreate() {
      const asBiz = ACCOUNT === 'business' && !!MY_BIZ;
      const track = STORY_MUSIC.find(m => m.id === S.storyMusic);
      return {
        top: topBar({ back: true, title: 'New story', actions: [`<button class="btn sm" data-act="publish-story" style="width:auto;padding:0 16px;margin-right:4px">Share</button>`] }),
        body: `
    <div class="pad" style="padding-top:var(--s4);padding-bottom:var(--s10)">
      ${asBiz
            ? `<div class="tile row" style="gap:var(--s3)">
        ${av(MY_BIZ.photo, 44, { sq: true, fallback: MY_BIZ.name[0] })}
        <span class="grow"><span class="xs mut" style="display:block">Story from</span>
          <span class="brand h1">${esc(MY_BIZ.name)}</span></span></div>`
            : `<button class="tile row" data-act="pick-pet" style="width:100%;text-align:left;gap:var(--s3)">
        ${petAv(petOf(S.asPet), 44)}
        <span class="grow"><span class="xs mut" style="display:block">Story from</span>
          <span class="brand h1">${petOf(S.asPet).name}</span></span>${ic('down', 18, 'faint')}</button>`}

      <div class="tile" style="padding:0;overflow:hidden;margin-top:var(--s4);position:relative">
        <div class="photo" style="height:300px">${img(S.postImg)}</div>
        ${S.storyKind === 'video' ? `<span style="position:absolute;left:10px;top:10px;background:rgba(9,15,26,.72);color:#fff;
          border-radius:100px;padding:4px 10px;font-size:.68rem;font-weight:800" class="row">${ic('video', 12)} 0:12</span>` : ''}
        <!-- Stickers sit on the frame, which is the only place they mean
             anything. Tapping one in the tray drops it here. -->
        ${(S.storyStickers || []).map((st, n) => `<span style="position:absolute;left:${16 + n * 46}px;bottom:${58 + (n % 2) * 34}px;
          width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--tan-deep);
          box-shadow:0 2px 10px rgba(0,0,0,.18)">${ic(st, 19)}</span>`).join('')}
        ${track ? `<span style="position:absolute;left:10px;bottom:10px;right:10px;background:rgba(9,15,26,.66);color:#fff;
          border-radius:100px;padding:6px 12px;font-size:.72rem;font-weight:700" class="row">
          ${ic('chat', 13)}<span class="grow trunc">${esc(track.title)} · ${esc(track.artist)}</span>
          <button data-act="story-music" data-val="" aria-label="Remove music">${ic('x', 13)}</button></span>` : ''}
      </div>

      <div class="seg" style="margin-top:var(--s4)">
        ${[['photo', 'Photo'], ['video', 'Video']].map(k =>
              `<button class="${(S.storyKind || 'photo') === k[0] ? 'on' : ''}" data-act="story-kind" data-val="${k[0]}">${k[1]}</button>`).join('')}
      </div>

      <div class="row" style="margin-top:var(--s3);gap:var(--s2);flex-wrap:wrap">
        <button class="chip" data-act="swap-img">${ic('refresh', 15)} Change ${S.storyKind === 'video' ? 'clip' : 'photo'}</button>
        <button class="chip" data-act="upload">${ic('cam', 15)} ${S.storyKind === 'video' ? 'Record' : 'Camera'}</button>
        <button class="chip ${track ? 'on' : ''}" data-act="pick-music">${ic('gift', 15)} Music</button>
      </div>

      <div class="cap mut" style="margin:var(--s5) 0 var(--s2)">Stickers</div>
      <div class="row" style="gap:var(--s2);flex-wrap:wrap">
        ${STORY_STICKERS.map(st => `<button class="chip ${(S.storyStickers || []).includes(st) ? 'on' : ''}"
          data-act="story-sticker" data-val="${st}">${ic(st, 15)}</button>`).join('')}
      </div>

      <div class="lgroup" style="margin-top:var(--s5)">
        <button class="lrow" data-act="story-replies"><span class="grow b sm">Allow replies</span>
          <span class="sw ${S.storyReplies !== false ? 'on' : ''}"></span></button>
        <button class="lrow" data-act="story-reactions"><span class="grow b sm">Allow reactions</span>
          <span class="sw ${S.storyReactions !== false ? 'on' : ''}"></span></button>
      </div>

      <p class="xs mut" style="margin-top:var(--s4)">Stories disappear after 24 hours and appear at the top of Home and PawPals.</p>
    </div>` };
    }

    const musicSheet = () => openSheet(`
    <div class="d2">Add music</div>
    <p class="sm mut" style="margin:6px 0 var(--s4)">One track plays behind the story.</p>
    <div class="stack">
      ${STORY_MUSIC.map(m => `<button class="tile row" data-act="story-music" data-val="${m.id}" style="width:100%;text-align:left;gap:var(--s3)">
        <span class="av av-48" style="background:var(--tan-soft);color:var(--tan-deep);flex:none">${ic('gift', 20)}</span>
        <span class="grow"><span class="h2" style="display:block">${esc(m.title)}</span>
          <span class="xs mut">${esc(m.artist)}</span></span>
        ${S.storyMusic === m.id ? `<span class="tan">${ic('check', 18)}</span>` : ic('fwd', 17, 'faint')}</button>`).join('')}
    </div>`);

    /* ==========================================================
       PET ALERTS  (+ notifications, per the brief's nav grouping)
       ========================================================== */
    function scrAlerts() {
      const list = ALERTS.filter(a => S.alertTab === 'near' ? !a.mine : a.mine);
      return {
        tab: 'alerts',
        top: topBar({ title: 'Pet Alerts', big: true, actions: [navBtn('search', 'search', 'Search'), navBtn('notifications', 'bell', 'Notifications', NOTIFS.filter(n => n.unread).length)] }),
        body: `
    <div class="pad">
      <div class="tile" style="background:var(--err-bg);border-color:#F0D2CE">
        <div class="row" style="gap:10px;align-items:flex-start">
          <span style="color:var(--err)">${ic('alert', 20)}</span>
          <div class="grow"><div class="h2" style="color:var(--err)">Lost a pet?</div>
            <p class="xs mut" style="margin:3px 0 0">Every tailtalk owner within 25 miles is alerted straight away.</p></div>
        </div>
        <button class="btn sm danger" style="margin-top:var(--s3)" data-nav="alert-create">Create a lost pet alert</button>
      </div>

      <div class="seg" style="margin-top:var(--s4)">
        <button class="${S.alertTab === 'near' ? 'on' : ''}" data-act="alert-tab" data-val="near">Near me</button>
        <button class="${S.alertTab === 'mine' ? 'on' : ''}" data-act="alert-tab" data-val="mine">My alerts</button>
      </div>

      <div class="inp-wrap" style="margin-top:var(--s4)"><span class="lead">${ic('search', 18)}</span>
        <input class="inp" placeholder="Search lost pets by name, breed or area"></div>

      <!-- A static map stands in for the interactive one: the radius and the

      <button class="tile" data-nav="alert-map" style="width:100%;padding:0;overflow:hidden;margin-top:var(--s4);position:relative;height:150px">

        <svg viewBox="0 0 320 150" style="position:absolute;inset:0;width:100%;height:100%">
          <path d="M0 40h320M0 100h320M90 0v150M220 0v150" stroke="#DFD6C9" stroke-width="9" fill="none"/>
          <path d="M0 40h320M0 100h320M90 0v150M220 0v150" stroke="#F6F1E9" stroke-width="4" fill="none"/>
          <circle cx="160" cy="76" r="52" fill="#DFAA5A" opacity=".16"/>
          <circle cx="160" cy="76" r="52" fill="none" stroke="#DFAA5A" stroke-width="1.5" stroke-dasharray="4 4"/>
        </svg>
        ${[[104, 58], [212, 44], [138, 116]].map((pos, i) => `<span style="position:absolute;left:${pos[0]}px;top:${pos[1]}px;transform:translate(-50%,-100%);
          background:${i === 0 ? 'var(--err)' : 'var(--card)'};color:${i === 0 ? '#fff' : 'var(--tx)'};border:1px solid ${i === 0 ? 'var(--err)' : 'var(--line)'};
          border-radius:999px;padding:4px 9px;font-size:10.5px;font-weight:700;box-shadow:var(--sh-2)">${['Rufus', 'Kitten', 'Bella'][i]}</span>`).join('')}
        <span class="badge tan" style="position:absolute;left:10px;bottom:10px">25 mile radius</span>
      </button>

      <div class="row" style="margin:var(--s5) 0 var(--s3)">
        <span class="cap mut grow">${list.length} alert${list.length === 1 ? '' : 's'}</span>

      </div>
      <div class="stack" style="padding-bottom:var(--s8)">
        ${list.length ? list.map(alertCard).join('')
            : emptyState('alert', 'No alerts of your own', 'When you report a lost pet it appears here so you can update or close it.', 'Create an alert', 'go-alert-create')}
      </div>
    </div>` };
    }

    function alertCard(a) {
      const st = ALERT_STATUS[a.status];
      return `<button class="tile" data-nav="alert-detail" data-id="${a.id}" style="width:100%;text-align:left;padding:0;overflow:hidden">
    <div class="row" style="gap:0;align-items:stretch">
      <span class="photo" style="width:110px;flex:none">${img(a.img)}</span>
      <span class="grow" style="padding:var(--s3) var(--s4);min-width:0">
        <span class="row" style="gap:6px">
          <span class="badge ${st.cls}">${st.label}</span>
          ${a.reward ? `<span class="badge tan">${a.reward}</span>` : ''}
          <span class="grow"></span><span class="xs mut">${a.dist}</span></span>
        <span class="brand h1" style="display:block;margin-top:5px">${a.name}</span>
        <span class="xs mut trunc" style="display:block">${a.species} · ${a.breed} · ${a.area}</span>
        <span class="xs b tan" style="display:block;margin-top:5px">${a.when}</span>
      </span>
    </div></button>`;
    }

    function scrAlertDetail() {
      const a = alertOf(S.id), st = ALERT_STATUS[a.status];
      return {
        top: topBar({ back: true, title: st.label + ' pet', actions: [barBtn('share', 'share', 'Share')] }), body: `
    <div class="photo" style="height:230px">${img(a.img)}</div>
    <div class="pad" style="padding-top:var(--s5);padding-bottom:var(--s10)">
      <div class="row"><h1 class="brand d2 grow">${a.name}</h1><span class="badge ${st.cls}">${st.label}</span></div>
      <div class="sm mut" style="margin-top:6px">${a.species} · ${a.breed}</div>

      <div class="tile" style="margin-top:var(--s5);background:var(--tan-soft);border-color:var(--tan-line)">
        <div class="cap tan">Last seen</div>
        <div class="h1" style="margin-top:5px">${a.area}</div>
        <div class="sm mut" style="margin-top:2px">${a.when} · ${a.dist} from you</div>
        <button class="btn sm ghost" style="margin-top:var(--s3)" data-nav="alert-map">${ic('map', 16)} Open map</button>
      </div>

      <p class="bd" style="margin-top:var(--s5)">${a.desc}</p>

      <div class="lgroup" style="margin-top:var(--s5)">
        ${[['user', 'Reported by', a.owner], ['clock', 'Status', st.label], ['eye', 'Sightings', `${a.sightings} logged`]].map(r =>
          `<div class="lrow"><span class="faint">${ic(r[0] === 'eye' ? 'search' : r[0], 19)}</span>
        <span class="sm mut grow">${r[1]}</span><span class="b sm">${r[2]}</span></div>`).join('')}
      </div>

      ${a.mine ? (a.status === 'lost' ? `<div class="btn-row" style="margin-top:var(--s5)">
        <button class="btn sm" data-act="mark-found">${ic('check', 16)} Mark as found</button>
      </div>`
            : `<div class="tile" style="margin-top:var(--s5);background:var(--ok-bg);border-color:#CFE6DA">
        <div class="row" style="gap:10px"><span style="color:var(--ok)">${ic('check', 19)}</span>
          <span class="sm grow"><b>${esc(a.name)} is home.</b> This alert is closed and no longer shown to owners nearby.</span></div>
      </div>`)
            : `${a.status === 'lost' ? `<div class="btn-row" style="margin-top:var(--s5)">
        <button class="btn ghost sm" data-act="call">${ic('phone', 16)} Call owner</button>

             nothing to report a sighting of. -->
        <button class="btn sm" data-act="sighting">${ic('pin', 16)} I saw this pet</button>
      </div>`
              : `<button class="btn sm" style="margin-top:var(--s5)" data-act="call">${ic('phone', 16)} Call ${esc(a.owner.split(' ')[0])}</button>`}
      <button class="btn flat" style="margin-top:var(--s2)" data-nav="thread" data-id="t1">Message the owner</button>`}
    </div>` };
    }

    function scrAlertMap() {
      return {
        chromeless: true, body: `
    <div class="fill" style="position:relative;background:#EDE7DE">
      <svg viewBox="0 0 400 700" style="position:absolute;inset:0;width:100%;height:100%">
        <path d="M0 120h400M0 300h400M0 480h400M110 0v700M280 0v700" stroke="#DFD6C9" stroke-width="14" fill="none"/>
        <path d="M0 120h400M0 300h400M0 480h400M110 0v700M280 0v700" stroke="#F6F1E9" stroke-width="6" fill="none"/>
        <circle cx="200" cy="330" r="150" fill="#DFAA5A" opacity=".14"/>
        <circle cx="200" cy="330" r="150" fill="none" stroke="#DFAA5A" stroke-width="2" stroke-dasharray="6 6"/>

        <div class="grow"></div>
        <span class="chip" style="box-shadow:var(--sh-2)">25 mile radius</span>
      </div>
      ${[[150, 250, 'Rufus', 'err'], [290, 190, 'Kitten', 'ok'], [190, 430, 'Bella', 'err']].map(m =>
          `<button data-nav="alert-detail" data-id="a1" style="position:absolute;left:${m[0]}px;top:${m[1]}px;transform:translate(-50%,-100%)">
        <span style="display:block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;
          font-size:11.5px;font-weight:700;box-shadow:var(--sh-2)">
          <span style="color:var(--${m[3]})">●</span> ${m[2]}</span></button>`).join('')}
