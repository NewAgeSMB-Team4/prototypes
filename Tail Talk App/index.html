       ========================================================== */
    /* ── Global search ───────────────────────────────────────────
       One box across everything the app holds: pets by name, breed or species,
       the owners behind them, hashtags, towns and states, businesses, rescues
       and communities. Each hit says which kind of thing it is, because "Alberta"
       could be a town, a vet clinic or somebody's dog, and the answer to "why is
       this in my results" should be on the row itself. */
    const SEARCH_KINDS = ['All', 'Pets', 'Owners', 'Businesses', 'Rescues', 'Communities', 'Places', 'Hashtags'];
    /* Pets carry no town of their own in the records, so a search for a city
       could only ever reach a business. This is where each one lives. */
    const PET_TOWN = {
      p1: 'Portland', p2: 'Portland', p3: 'Portland',
      f1: 'Beaverton', f2: 'Portland', f3: 'Hillsboro',
      f4: 'Portland', f5: 'Lake Oswego', f6: 'Gresham', f7: 'Beaverton',
    };
    const STATE = { name: 'Oregon', abbr: 'OR' };

    function searchAll(q) {
      const t = q.trim().toLowerCase();
      if (!t) return [];
      /* A two-letter query like "OR" matched inside Morrison, Gresham and half
         the breeds. Anything this short has to land on a whole word. */
      const short = t.length <= 3;
      const word = new RegExp(`(^|[^a-z0-9])${t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}([^a-z0-9]|$)`, 'i');
      const hit = (...vals) => vals.filter(Boolean).some(v =>
        short ? word.test(String(v)) : String(v).toLowerCase().includes(t));
      /* The records carry a town, never the state it sits in, so "Oregon" matched
         nothing at all. Every place in this prototype is in one, and searching the
         state a family lives in is the broadest thing they can type. */
      const inState = hit(STATE.name, STATE.abbr);
      const out = [];

      [...PETS, ...FRIENDS].forEach(p2 => {
        if (hit(p2.name, p2.breed, p2.species, PET_TOWN[p2.id]) || inState) out.push({
          kind: 'Pets', id: p2.id, nav: 'pet-public', title: p2.name,
          sub: `${p2.species} · ${p2.breed || ''}`.replace(/ · $/, ''), pet: p2,
          why: hit(p2.breed) ? 'Breed' : hit(p2.species) ? 'Species' : hit(PET_TOWN[p2.id]) || inState ? PET_TOWN[p2.id] + ', ' + STATE.abbr : 'Pet',
        });
        // The owner is searchable through the pet they belong to: an owner has no
        // profile of their own, so their pet is where the result has to land.
        if (p2.owner && hit(p2.owner)) out.push({
          kind: 'Owners', id: p2.id, nav: 'pet-public', title: p2.owner,
          sub: `Owner of ${p2.name}`, pet: p2, why: 'Owner',
        });
      });

      BIZ.forEach(b2 => {
        if (!hit(b2.name, b2.cat, b2.addr, b2.bio)) return;
        out.push({
          kind: /shelter|rescue/i.test(b2.cat) ? 'Rescues' : 'Businesses',
          id: b2.id, nav: 'business', title: b2.name, sub: b2.cat,
          photo: b2.photo, why: hit(b2.addr) ? 'Location' : b2.cat,
        });
      });

      BOARDS.forEach(c2 => {
        if (hit(c2.name, c2.topic, c2.blurb)) out.push({
          kind: 'Communities', id: c2.id, nav: 'board', title: c2.name,
          sub: `${c2.topic} · ${c2.members.toLocaleString()} members`, why: 'Community',
        });
      });

      PLACES.forEach(pl => {
        if (hit(pl.name, pl.kind)) out.push({
          kind: 'Places', id: pl.id, nav: 'placemap', title: pl.name,
          sub: `${pl.kind} · ${pl.miles} mi`, why: 'On the map',
        });
      });

      // Towns and states come off the records themselves, so the list can never
      // offer a place with nothing behind it.
      const areas = new Set();
      [...PETS, ...FRIENDS].forEach(p2 => PET_TOWN[p2.id] && areas.add(PET_TOWN[p2.id] + ', ' + STATE.abbr));
      if (inState) areas.add(STATE.name);
      BIZ.forEach(b2 => b2.addr && areas.add(b2.addr.split(',').slice(-2).join(',').trim()));
      [...areas].forEach(a => {
        if (hit(a)) out.push({ kind: 'Places', id: '', nav: 'placemap', title: a, sub: 'Town or state', why: 'Location' });
      });

      const tags = new Set();
      POSTS.forEach(po => (String(po.text || '').match(/#[\w]+/g) || []).forEach(x => tags.add(x)));
      [...tags].forEach(tag => {
        if (hit(tag)) out.push({ kind: 'Hashtags', id: tag, nav: 'home', title: tag, sub: 'Hashtag', why: 'Hashtag' });
      });

      return out;
    }

    function buildDevice() {
      const d = DEV;
      el('device').innerHTML = `

      const wrap = el('devwrap'), f = el('frame');
      if (!wrap || !f) return;
      const ow = DEV.w + DEV.bez * 2, oh = DEV.h + DEV.bez * 2;
      const s = Math.min(1, (wrap.clientWidth - 48) / ow, (wrap.clientHeight - 30) / oh) * S.zoom;

      el('stage-caption').textContent = `${DEV.name} · ${DEV.w} × ${DEV.h} · ${Math.round(s * 100)}%`;
    }
    window.addEventListener('resize', fit);

    /* ==========================================================
       RENDER
       ========================================================== */
    function render() {
      const s = scrOf(S.scr), out = s.fn();
      /* Nothing before sign-in gets a tab bar. The S.tab fallback that keeps a
         detail screen on the tab it came from was leaking onto the launch flow,
         where there is no account for those tabs to belong to. */
      const preAuth = s.mod.id === 'start' || (!S.authed && !MOD_TAB[s.mod.id]);
      let tab = (out.noTab || preAuth) ? null : (out.tab || S.tab || MOD_TAB[s.mod.id] || null);
      // Switching account type can leave a tab selected that no longer exists.
      if (tab && !tabsFor().some(t => t.id === tab)) tab = tabsFor()[0].id;
      el('app').innerHTML = `${out.top || ''}
    <div id="screen" class="no-scrollbar fade-in${out.fill ? ' flexcol' : ''}">${out.body}</div>
    ${tab ? tabBar(tab) : ''}`;
      const bar = el('statusbar');
      bar.classList.toggle('on-dark', !!out.dark);
      /* The status bar sits above the screen body, so on a dark screen making it
         transparent only reveals the light page behind. It takes a dark fill of
         its own instead, or white numerals sit on a pale strip and vanish. */
      bar.style.background = out.dark ? '#221D18' : '';
      syncExplorer();
      el('crumb-mod').textContent = s.mod.name;
      el('crumb-scr').textContent = s.name;
      const i = ALL.indexOf(s);

      el('btn-next').disabled = i >= ALL.length - 1;
    }
    /* Which tab a screen belongs to is a question of where you came from, not
       which module the file happens to keep it in. Opening a post from PawPals
       leaves PawPals lit; opening the same post from Home leaves Home lit. */
    const TAB_ROOTS = { home: 'home', pawpals: 'pawpals', alerts: 'alerts', tailtalks: 'tailtalks', owner: 'owner', business: 'business', discover: 'discover' };
    function go(key, id) {
      if (key === S.scr && id === S.id) return;
      /* Discover is a tab only on a business account. An owner reaches it from
         Home, so their Home stays lit rather than nothing at all. */
      if (TAB_ROOTS[key] && tabsFor().some(t => t.id === TAB_ROOTS[key])) S.tab = TAB_ROOTS[key];
      S.back.push({ scr: S.scr, id: S.id });
      S.scr = key; S.id = id || null;
      render();
      const sc = el('screen'); if (sc) sc.scrollTop = 0;
    }
    function back() {
      const p = S.back.pop();
      if (p) { S.scr = p.scr; S.id = p.id; render(); } else go('home');
    }

    /* ==========================================================
       EXPLORER
       ========================================================== */
    function buildExplorer() {
      el('explorer').innerHTML = MODULES.map(m => {
        const list = m.screens.filter(s => !S.query || s[1].toLowerCase().includes(S.query) || m.name.toLowerCase().includes(S.query));
        if (!list.length) return '';
        const closed = S.closed[m.id] && !S.query;
        return `<div>
      <button class="modrow ${closed ? 'closed' : ''}" data-mod="${m.id}">
        <svg class="icon caret"><use href="#i-down"/></svg><span>${m.name}</span><span class="cnt">${list.length}</span></button>
      <div ${closed ? 'hidden' : ''}>
        ${list.map(s => `<button class="scrbtn" data-scr="${s[0]}"><span class="dot"></span><span>${s[1]}</span></button>`).join('')}
      </div></div>`;
      }).join('') || `<p class="pn-tag" style="padding:0 20px">No screens match “${esc(S.query)}”.</p>`;
      syncExplorer();
    }
    const syncExplorer = () => document.querySelectorAll('.scrbtn').forEach(b => b.classList.toggle('on', b.dataset.scr === S.scr));
    const buildDevGrid = () => el('devgrid').innerHTML = DEVICES.map(d =>
      `<button class="devbtn ${d.id === DEV.id ? 'on' : ''}" data-dev="${d.id}">${d.name}<small>${d.w} × ${d.h}</small></button>`).join('');

    /* ==========================================================
       TOASTS · SHEETS · MODALS
       ========================================================== */
    /* The resend clock patches its own label each second rather than re-rendering
       the screen, because a re-render would take the caret out of whichever digit
       box is being typed in. */
    let resendTimer = null;
    function stopResend() { clearInterval(resendTimer); resendTimer = null; }
    function resetOtp() { S.otp = ['', '', '', '']; S.resendIn = 0; S.otpBusy = false; stopResend(); }
    function paintResend() {
      const b = el('resend-btn'); if (!b) return;
      const waiting = S.resendIn > 0;
      b.disabled = waiting;
      b.textContent = waiting ? `Resend in 00:${String(S.resendIn).padStart(2, '0')}` : 'Resend code';
      b.style.color = waiting ? 'var(--tx-3)' : 'var(--tan-deep)';
      b.style.pointerEvents = waiting ? 'none' : 'auto';
    }
    function startResend(sec) {
      stopResend();
      S.resendIn = sec;
      paintResend();
      resendTimer = setInterval(() => {
        S.resendIn = Math.max(0, S.resendIn - 1);
        paintResend();
        if (!S.resendIn) stopResend();
      }, 1000);
    }
    /* The last digit submits. A four-digit field has one obvious next action, so
       there is no button for it; the pause is the moment the person reads
       "Verifying" and understands why the screen moved. */
    function syncOtp() {
      const hint = el('otp-hint'); if (!hint) return;
      const left = S.otp.filter(v => !v).length;
      if (!left && !S.otpBusy) {
        S.otpBusy = true;
        hint.innerHTML = '<span class="b" style="color:var(--ok)">Verifying…</span>';
        document.querySelectorAll('[data-otp]').forEach(b => b.blur());
        const row = document.querySelector('[data-otp-next]');
        setTimeout(() => otpNext(row ? row.dataset.otpNext : 'home'), 620);
        return;
      }
      if (!S.otpBusy) hint.textContent = `${left} digit${left === 1 ? '' : 's'} to go`;
    }

    function otpNext(next) {
      // Cleared before moving on, so a code is never carried into the next step.
      S.otp = ['', '', '', '']; S.resendIn = 0; S.otpBusy = false; stopResend();
      if (next === 'home') {
        go('home');
        toast(ACCOUNT === 'business' ? 'Rescue Org account ready' : 'Welcome to tailtalk', 'ok');
      } else if (/phone/.test(next)) {
        go(next); toast(`Code sent to ${showPhone(MY_BIZ && ACCOUNT === 'business' ? MY_BIZ : S.reg)}`, 'info');
      } else go(next);
    }

    const TONE_IC = { ok: 'check', err: 'x', warn: 'alert', info: 'info' };
    function toast(msg, tone = 'ok') {
      const root = el('toast-root'); if (!root) return;
      const n = document.createElement('div');
      n.className = `toast ${tone}`;
      n.innerHTML = `${ic(TONE_IC[tone] || 'check', 18)}<span>${msg}</span>`;
      root.appendChild(n);
      setTimeout(() => { n.classList.add('out'); setTimeout(() => n.remove(), 240); }, 2400);
    }
    function openSheet(html) {
      el('sheet-root').innerHTML = `<div class="scrim" data-close-sheet></div>
    <div class="sheet"><div class="grab"></div><div class="sheet-body no-scrollbar">${html}</div></div>`;
      requestAnimationFrame(() => {
        el('sheet-root').querySelector('.scrim').classList.add('in');
        el('sheet-root').querySelector('.sheet').classList.add('in');
      });
    }
    function openModal(html) {
      el('sheet-root').innerHTML = `<div class="scrim" data-close-sheet></div><div class="modal">${html}</div>`;
      requestAnimationFrame(() => {
        el('sheet-root').querySelector('.scrim').classList.add('in');
        el('sheet-root').querySelector('.modal').classList.add('in');
      });
    }
    function closeSheet() {
      const r = el('sheet-root');
      ['.scrim', '.sheet', '.modal'].forEach(sel => { const n = r.querySelector(sel); if (n) n.classList.remove('in'); });
      setTimeout(() => { r.innerHTML = ''; }, 280);
    }

    const petSheet = () => openSheet(`
    <div class="d2">Which pet is posting?</div>
    <p class="sm mut" style="margin:6px 0 var(--s4)">A post belongs to a pet, not to you — it appears on their profile and goes to their followers.</p>
    <div class="lgroup">
      ${PETS.map(p => `<button class="lrow" data-act="set-pet" data-val="${p.id}">${petAv(p, 44)}
        <span class="grow"><span class="brand h2" style="display:block">${p.name}</span>
          <span class="xs mut">${p.species} · ${p.followers} followers</span></span>
        <span class="radio ${S.asPet === p.id ? 'on' : ''}"></span></button>`).join('')}
    </div>`);

    /* Blocking, for pets and for the people behind them. Reporting is about a
       piece of content and stays on the post; blocking is about who you want to
       hear from at all, so it belongs on the profile and in the thread. */
    const isBlocked = (id) => !!S.blocked[id];
    /* Refusing a send says why and offers the one thing that fixes it, rather
       than failing quietly. Returns true when the send should not happen. */
    function blockGuard() {
      const t = S.scr === 'thread' ? threadOf(S.id) : null;
      if (!t) return false;
      if (isBlocked(t.id)) {
        openModal(`
      <div style="text-align:center">
        <span class="av av-64" style="background:#FBEAE8;color:var(--err);margin:0 auto">${ic('lock', 26)}</span>
        <div class="d2" style="margin-top:var(--s4)">${esc(t.who)} is blocked</div>
        <p class="sm mut" style="margin:8px 0 var(--s5)">Unblock them to send this message. They are not told either way.</p>
        <button class="btn" data-act="do-block" data-id="${t.id}" data-val="off">Unblock and continue</button>
        <button class="btn flat" data-close-sheet style="margin-top:6px">Keep blocked</button>
      </div>`);
        return true;
      }
      if (t.blockedMe) { toast(`${t.who} is unable to receive messages at this time`, 'info'); return true; }
      return false;
    }
    function blockSheet(id, kind) {
      const who = kind === 'pet' ? anyPet(id) : threadOf(id);
      const name = kind === 'pet' ? who.name : who.who;
      const on = isBlocked(id);
      openModal(`
    <div style="text-align:center">
      <span class="av av-64" style="background:#FBEAE8;color:var(--err);margin:0 auto">${ic('lock', 26)}</span>
      <div class="d2" style="margin-top:var(--s4)">${on ? 'Unblock' : 'Block'} ${esc(name)}?</div>
      <p class="sm mut" style="margin:8px 0 var(--s5)">${on
          ? 'You will be able to message each other again, and their posts come back to your feeds.'
          : kind === 'pet'
            ? 'Their posts leave your feeds and they can no longer follow you. They are not told.'
            : 'Neither of you can send the other a message until you unblock them. They are not told they have been blocked.'}</p>
      <button class="btn ${on ? '' : 'danger'}" data-act="do-block" data-id="${id}" data-kind="${kind}" data-val="${on ? 'off' : 'on'}">
        ${on ? 'Unblock' : 'Block'} ${esc(name)}</button>
      <button class="btn flat" data-close-sheet style="margin-top:6px">Cancel</button>
    </div>`);
    }

    const moreSheet = () => openSheet(`
    <div class="lgroup" style="box-shadow:none;border:0">
      ${[['share', 'Share post', 'share'], ['link', 'Copy link', 'copy-link']].map(r =>
      `<button class="lrow" data-act="${r[2]}"><span class="faint">${ic(r[0], 20)}</span><span class="grow b sm">${r[1]}</span></button>`).join('')}
      <button class="lrow" data-act="report"><span style="color:var(--err)">${ic('flag', 20)}</span>
        <span class="grow b sm" style="color:var(--err)">Report content</span></button>
    </div>`);

    /* Deleting is not logging out, so it is confirmed on its own terms and says
       what is actually lost. */
    const confirmDelete = () => openModal(`
    <div style="text-align:center">
      <span class="av av-64" style="background:#FBEAE8;color:var(--err);margin:0 auto">${ic('trash', 26)}</span>
      <div class="d2" style="margin-top:var(--s4)">Delete your account?</div>
      <p class="sm mut" style="margin:8px 0 var(--s5)">${ACCOUNT === 'business'
        ? 'Your Rescue Org profile, posts and followers are removed. People who follow you will no longer see you.'
        : 'Every pet profile on this account is removed, along with their posts, followers and alerts. This cannot be undone.'}</p>
      <button class="btn danger" data-act="do-delete">Delete account</button>
      <button class="btn flat" data-close-sheet style="margin-top:6px">Keep my account</button>
    </div>`);

    /* Reporting without a reason is a complaint nobody can act on: moderation
       needs to know which rule is in question. A reason is preselected so the
       report can be sent in one press, and the note is optional. */
    const REPORT_REASONS = ['Spam or misleading', 'Harassment or hate', 'Animal welfare concern',
      'Graphic or upsetting content', 'Selling animals', 'Something else'];
    const reportModal = () => {
      openModal(`
    <div class="row" style="gap:var(--s3);align-items:flex-start">
      <span class="av av-48" style="background:#FBEAE8;color:var(--err);flex:none">${ic('flag', 20)}</span>
      <div class="grow"><div class="d2">Report this post</div>
        <p class="sm mut" style="margin:6px 0 0">Only our moderators see this. The poster is not told who reported them.</p></div>
    </div>
    <div class="lgroup" style="margin-top:var(--s5);box-shadow:none">
      ${REPORT_REASONS.map((r, i) => `<label class="lrow" style="cursor:pointer">
        <input type="radio" name="rp-why" value="${esc(r)}" ${i === 0 ? 'checked' : ''} style="accent-color:var(--tan);width:18px;height:18px">
        <span class="grow b sm">${r}</span></label>`).join('')}
    </div>
    <div style="margin-top:var(--s4)">
      <label class="lbl" for="rp-note">Anything else we should know?</label>
      <textarea class="inp" id="rp-note" rows="3">This account has posted the same listing four times today.</textarea>
    </div>
    <button class="btn danger" style="margin-top:var(--s5)" data-act="send-report">${ic('flag', 16)} Report</button>
    <button class="btn flat" style="margin-top:6px" data-close-sheet>Cancel</button>`);
    };

    /* Listing a pet means choosing one already in the shelter's care, not
       describing a new animal from scratch. A rescue knows its intake; asking it
       to retype what it already holds is how duplicate records get made. */
    const pickAdoptable = () => openSheet(`
    <div class="d2">List a pet</div>
    <p class="sm mut" style="margin:6px 0 var(--s4)">Pets currently in your care. Choose one and say whether you are looking for an adopter or a foster home.</p>
    ${IN_CARE.length ? `<div class="stack">
      ${IN_CARE.map(x => `<div class="tile row" style="gap:var(--s3);align-items:flex-start">
        ${av(x.photo, 48, { fallback: x.name[0] })}
        <div class="grow" style="min-width:0">
          <div class="brand h2">${x.name}</div>
          <div class="xs mut trunc">${x.species} · ${x.breed} · ${x.age} · ${x.sex}</div>
          <div class="xs faint" style="margin-top:2px">${x.note}</div>
          <div class="row" style="gap:8px;margin-top:var(--s3)">
            <button class="chip on" data-act="list-adoptable" data-id="${x.id}" data-kind="adopt">For adoption</button>
            <button class="chip" data-act="list-adoptable" data-id="${x.id}" data-kind="foster">For fostering</button>
          </div>
        </div></div>`).join('')}</div>`
        : `<div class="tile" style="border-style:dashed;box-shadow:none;text-align:center">
      <div class="sm mut">Every pet in your care is already listed.</div></div>`}`);

    /* The foot of the sign-in and code screens was blank space. This fills it
       with the same photograph the welcome screen uses, fading up out of the page
       so it reads as the page ending rather than a picture pasted on. It is
       decorative, so it is hidden from screen readers. */
    const footerArt = (h = 200) => `<div aria-hidden="true" style="margin-top:auto;position:relative;height:${h}px;
    background:#2A2622;flex:none">
    <span style="position:absolute;inset:0">${img('handpaw')}</span>
    <span style="position:absolute;inset:0;background:linear-gradient(180deg,var(--paper) 0%,rgba(246,244,241,.72) 26%,rgba(30,24,18,.10) 68%,rgba(30,24,18,.34) 100%)"></span>
  </div>`;

    /* A wish is a message, not a token. It is written by the person sending it
       and lands in the Tailtalk they already share with that owner, so it can be
       replied to — which a virtual biscuit could not be. */
    const wishSheet = (petId) => {
      const pet = anyPet(petId);
      const owner = pet.owner || OWNER.name;
      openSheet(`
    <div class="row" style="gap:var(--s3);align-items:flex-start">
      ${petAv(pet, 48)}
      <div class="grow"><div class="d2">Send ${esc(pet.name)} a wish</div>
        <p class="sm mut" style="margin:4px 0 0">It arrives in your Tailtalk with ${esc(owner)}.</p></div>
    </div>
    <div style="margin-top:var(--s5)">
      <label class="lbl" for="wish-note">Your message</label>
      <textarea class="inp" id="wish-note" rows="4">Happy birthday, ${esc(pet.name)}! Hope there is cake, or whatever the equivalent is.</textarea>
    </div>
    <button class="btn" style="margin-top:var(--s5)" data-act="deliver-wish" data-id="${pet.id}">${ic('send', 16)} Send wish</button>
    <button class="btn flat" style="margin-top:6px" data-close-sheet>Cancel</button>`);
    };

    const logoutModal = () => openModal(`
    <div style="text-align:center">
      <span class="av av-64" style="background:var(--err-bg);color:var(--err);margin:0 auto">${ic('logout', 26)}</span>
      <div class="d2" style="margin-top:var(--s4)">Log out of tailtalk?</div>
      <p class="sm mut" style="margin:8px 0 var(--s5)">Your pets stay exactly as they are. You will need your password to come back.</p>
      <button class="btn danger" data-act="do-logout">Log out</button>
      <button class="btn flat" data-close-sheet style="margin-top:6px">Stay logged in</button>
    </div>`);

    /* ==========================================================
       EVENTS
       ========================================================== */
    document.addEventListener('click', e => {
      const t = e.target;
      const dev = t.closest('[data-dev]');
      if (dev) { DEV = DEVICES.find(d => d.id === dev.dataset.dev); buildDevGrid(); buildDevice(); return; }
      const scr = t.closest('[data-scr]');
      if (scr) { S.back.push({ scr: S.scr, id: S.id }); S.scr = scr.dataset.scr; S.id = defaultId(S.scr); render(); return; }
      const mod = t.closest('[data-mod]');
      if (mod) { S.closed[mod.dataset.mod] = !S.closed[mod.dataset.mod]; buildExplorer(); return; }
      const tool = t.closest('[data-tool]');
      if (tool) { runTool(tool.dataset.tool); return; }

      if (t.closest('[data-close-sheet]')) { closeSheet(); return; }
      if (t.closest('[data-go-back]')) { back(); return; }
      const tab = t.closest('[data-tab]');
      if (tab) {
        const k = tab.dataset.tab;
        go(TAB_SCREEN[k], k === 'business' && MY_BIZ ? MY_BIZ.id : undefined);
        return;
      }
      const nav = t.closest('[data-nav]');
      if (nav) { go(nav.dataset.nav, nav.dataset.id); return; }
      const act = t.closest('[data-act]');
      if (act) { runAct(act.dataset.act, act); return; }
    });

    const defaultId = k => ({
      post: 'po1', story: 's1', 'pet-public': 'p1', 'pet-manage': 'p1', 'pet-edit': 'p1',
      'alert-detail': 'a1', thread: 't1', business: 'b1', followers: 'p1', following: 'p1',
    })[k] || null;

    function runTool(k) {
      if (k === 'collapse') { MODULES.forEach(m => S.closed[m.id] = true); buildExplorer(); }
      if (k === 'expand') { S.closed = {}; buildExplorer(); }
      if (k === 'theme') setThemeMode(S.theme === 'light' ? 'dark' : 'light');
      if (k === 'restart') { Object.assign(S, { scr: 'splash', id: null, back: [], react: {}, follow: {}, sent: [] }); render(); setTimeout(() => { if (S.scr === 'splash') go('welcome'); }, 1800); }
      if (k === 'splash') go('splash');
      if (k === 'home') go('home');
      if (k === 'prev' || k === 'next') {
        const i = ALL.indexOf(scrOf(S.scr)) + (k === 'next' ? 1 : -1);
        if (ALL[i]) { S.back.push({ scr: S.scr, id: S.id }); S.scr = ALL[i].key; S.id = defaultId(ALL[i].key); render(); }
      }
      if (k === 'zoomin') { S.zoom = Math.min(1.6, S.zoom + .1); fit(); }
      if (k === 'zoomout') { S.zoom = Math.max(.5, S.zoom - .1); fit(); }
      if (k === 'fs') { document.body.classList.toggle('fs'); setTimeout(fit, 60); }
    }

    const prefersDark = () => window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    function applyTheme(rerender = true) {
      S.theme = S.themeMode === 'system' ? (prefersDark() ? 'dark' : 'light') : S.themeMode;
      document.documentElement.setAttribute('data-theme', S.theme);
      el('theme-ic').innerHTML = `<use href="#i-${S.theme === 'dark' ? 'sun' : 'moon'}"/>`;
      el('theme-lbl').textContent = S.theme === 'dark' ? 'Light' : 'Dark';
      if (rerender) render();
    }
    function setThemeMode(m) { S.themeMode = m; applyTheme(); }
    if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)')
      .addEventListener('change', () => { if (S.themeMode === 'system') applyTheme(); });

    const IMG_KEYS = ['park', 'couch', 'husky', 'chis', 'catbed', 'kitten', 'birds', 'geese', 'tort', 'rat', 'people'];

    function runAct(a, node) {
      const d = node.dataset;
      switch (a) {
        case 'pw-toggle': S.pw[d.id] = !S.pw[d.id]; render(); break;
        case 'remember': S.remember = !S.remember; render(); break;
        case 'finish-signup': ACCOUNT = 'owner'; MY_BIZ = null; go('home'); toast('Welcome to tailtalk', 'ok'); break;

        case 'adopt-radius': S.adoptRadius = +d.val || 100; render(); break;
        case 'place-kind': S.placeKind = d.val; render(); break;
        /* Directions come from the phone's own map app — the requirement leaves
           the data source to technical discovery, and nothing here pretends to
           own it. The toast says plainly that the tap leaves tailtalk. */
        case 'place-pin': {
          const pl = PLACES.find(x => x.id === d.id);
          if (pl) toast(`Opening ${pl.name} in Maps — this takes you outside tailtalk`, 'info');
          break;
        }
        case 'join-board': {
          const b2 = boardOf(d.id);
          const now = !(S.joined[d.id] ?? b2.joined);
          S.joined[d.id] = now; render();
          toast(now ? `Joined ${b2.name}` : `Left ${b2.name}`, now ? 'ok' : 'info');
          break;
        }
        case 'pick-adoptable': pickAdoptable(); break;
        case 'list-adoptable': {
          const src = IN_CARE.find(x => x.id === d.id); if (!src) break;
          const foster = d.kind === 'foster';
          ADOPTABLE.unshift({
            ...src, id: 'adx' + Date.now(), org: MY_BIZ ? MY_BIZ.id : 'b2',
            miles: 2, urgent: false, foster, days: 0,
            bio: `${src.name} is in our care and ready for ${foster ? 'a foster home' : 'adoption'}. ${src.note}.`,
          });
          IN_CARE = IN_CARE.filter(x => x.id !== src.id);
          closeSheet(); render();
          toast(`${src.name} listed for ${foster ? 'fostering' : 'adoption'} — visible within 100 miles`, 'ok');
          break;
        }
        case 'remove-adoptable': {
          const i2 = ADOPTABLE.findIndex(a => a.id === d.id);
          if (i2 > -1) {
            const gone = ADOPTABLE.splice(i2, 1)[0];
            // Back into care rather than deleted — the animal has not gone anywhere.
            IN_CARE.unshift({
              id: 'ic' + Date.now(), name: gone.name, species: gone.species, breed: gone.breed,
              age: gone.age, sex: gone.sex, photo: gone.photo, cover: gone.cover, note: 'Listing withdrawn'
            });
            render(); toast(`${gone.name} withdrawn — back in your care list`, 'info');
          }
          break;
        }
        case 'apply-adopt': {
          const a2 = adoptOf(d.id);
          if (APPLICATIONS.some(x => x.adopt === a2.id && x.who === OWNER.name)) {
            toast(`You have already applied for ${a2.name}`, 'info'); break;
          }
          APPLICATIONS.unshift({
            id: 'ap' + Date.now(), adopt: a2.id, who: OWNER.name, photo: OWNER.photo,
            kind: a2.foster ? 'foster' : 'adopt', status: 'pending', when: 'Just now',
            note: 'Applied through tailtalk.',
          });
          render(); toast(`Application sent for ${a2.name} — you can follow it on the adoption page`, 'ok');
          break;
        }
        case 'accept-app': {
          const app = APPLICATIONS.find(x => x.id === d.id); if (!app) break;
          APPLICATIONS.forEach(x => { if (x.adopt === app.adopt && x.id !== app.id) x.status = 'declined'; });
          app.status = 'accepted';
          render(); toast(`${app.who} accepted for ${adoptOf(app.adopt).name}`, 'ok');
          break;
        }
        case 'decline-app': {
          const app = APPLICATIONS.find(x => x.id === d.id); if (!app) break;
          app.status = 'declined'; render(); toast('Application closed', 'info');
          break;
        }
        case 'adopt-tab': S.adoptTab = d.val; render(); break;
        case 'adopt-browse': S.adoptTab = 'browse'; render(); break;
        case 'view-apps': S.adoptTab = 'apps'; go('adoption'); break;
        case 'withdraw-app': {
          const i2 = APPLICATIONS.findIndex(x => x.id === d.id);
          if (i2 < 0) break;
          const gone = APPLICATIONS.splice(i2, 1)[0];
          render(); toast(`Withdrawn from ${adoptOf(gone.adopt).name}`, 'info');
          break;
        }
        case 'add-care': {
          const n = IN_CARE.length + 1;
          IN_CARE.unshift({
            id: 'ic' + Date.now(), name: ['Maple', 'Otis', 'Wren', 'Barley'][n % 4], species: 'Dog',
            breed: 'Collie cross', age: '2 yrs', sex: 'Female', photo: 'av_marlow', cover: 'couch',
            bio: 'Newly arrived and settling in. Notes to follow after the vet check.',
          });
          render(); toast('Pet added to your care', 'ok');
          break;
        }
        case 'check-pet': {
          S.checkIn[d.id] = S.checkIn[d.id] === d.val ? undefined : d.val;
          const all = PETS.every(pt => S.checkIn[pt.id]);
          render();
          if (all) toast(`All caught up — ${WELLNESS.streak + 1} day streak`, 'ok');
          else toast(`${petOf(d.id).name} logged`, 'ok');
          break;
        }
        case 'add-milestone': {
          const pt = petOf(d.id);
          openModal(`<div class="d2">Record a milestone</div>
          <p class="sm mut" style="margin:6px 0 var(--s4)">It appears on ${esc(pt.name)}\u2019s profile and in Wellness.</p>
          <label class="lbl" for="ms-text">What happened</label>
          <input class="inp" id="ms-text" value="Learned to ring the bell to go out">
          <button class="btn" style="margin-top:var(--s5)" data-act="save-milestone" data-id="${pt.id}">Save milestone</button>
          <button class="btn flat" style="margin-top:6px" data-close-sheet>Cancel</button>`);
          break;
        }
        case 'save-milestone': {
          const txt = el('ms-text').value.trim();
          if (!txt) { toast('Say what happened', 'err'); break; }
          WELLNESS.milestones.unshift({ pet: d.id, text: txt, when: 'Today', icon: 'gift' });
          closeSheet(); render(); toast('Milestone recorded', 'ok');
          break;
        }
        case 'memorial': {
          const pt = petOf(d.id);
          openModal(`<div style="text-align:center">
          <span class="av av-64" style="background:var(--tan-soft);color:var(--tan-deep);margin:0 auto">${ic('heart', 26)}</span>
          <div class="d2" style="margin-top:var(--s4)">Mark ${esc(pt.name)} as passed away</div>
          <p class="sm mut" style="margin:8px 0 var(--s5)">Their profile becomes a memorial. Posts and photographs stay, followers can leave a candle, and no reminders are sent again.</p>
          <label class="lbl" for="mm-note" style="text-align:left">A few words, if you would like</label>
          <textarea class="inp" id="mm-note" rows="3">Sixteen good years and every one of them loud.</textarea>
          <button class="btn" style="margin-top:var(--s5)" data-act="save-memorial" data-id="${pt.id}">Open memorial</button>
          <button class="btn flat" style="margin-top:6px" data-close-sheet>Cancel</button></div>`);
          break;
        }
        case 'save-memorial': {
          const pt = petOf(d.id);
          MEMORIALS.unshift({ pet: pt.id, owner: OWNER.name, text: `${pt.name}. ${el('mm-note').value.trim()}`, when: 'Today', candles: 0 });
          pt.memorial = true;
          closeSheet(); go('wellness'); toast(`${pt.name}\u2019s memorial is open`, 'ok');
          break;
        }
        case 'send-wish': wishSheet(d.id); break;
        case 'deliver-wish': {
          const pet = anyPet(d.id);
          const text = (el('wish-note').value || '').trim();
          if (!text) { toast('Write a few words first', 'err'); break; }
          // Delivered, not announced: it joins the conversation with that owner.
          S.sent.push(text);
          closeSheet();
          go('thread', 't1');
          toast(`Wish sent to ${pet.name}`, 'ok');
          break;
        }
        case 'candle': toast('Candle lit', 'ok'); break;
        case 'delete-account': confirmDelete(); break;
        case 'soon-post': toast('Discussions open in the next build', 'info'); break;
        case 'login-as': S.loginAs = d.val; render(); break;
        case 'login-by': S.loginBy = d.val; render(); break;

        /* Signing in: the address or number is checked, then a code is sent. */
        case 'send-code': {
          const v = (el('li-id') || {}).value ? el('li-id').value.trim() : '';
          if (S.loginBy === 'email') {
            if (!validEmail(v)) { toast('Enter a valid email address', 'err'); break; }
            S.reg.email = v;
          } else {
            if (v.replace(/\D/g, '').length < 7) { toast('Enter a phone number we can text', 'err'); break; }
            S.reg.dial = el('li-dial').value; S.reg.phone = v;
          }
          ACCOUNT = S.loginAs;
          /* Signing in as a business used to set the account type without ever
             creating the profile behind it, so the Business tab fell through to
             whichever business happened to be first in the directory. A signed-in
             business account now always has its own profile. */
          if (ACCOUNT === 'business' && !MY_BIZ) {
            /* Reuse the directory record of the same name rather than pushing a
               second one. Otherwise the account owns an empty duplicate while its
               actual listings sit under the original — the panel read "0 pets
               listed" above a list of four of its own. */
            const existing = BIZ.find(x => x.name === DEMO.biz.name);
            if (existing) MY_BIZ = Object.assign(existing, { ...DEMO.biz, id: existing.id });
            else { MY_BIZ = { id: 'mine', kind: 'business', photo: '', followers: 128, ...DEMO.biz }; BIZ.push(MY_BIZ); }
          }
          if (ACCOUNT === 'owner') MY_BIZ = null;
          resetOtp(); go('verify-login');
          toast(`Code sent to ${S.loginBy === 'email' ? v : showPhone(S.reg)}`, 'info');
          break;
        }

        /* Owner sign-up step 1. Everything on it is required, so it is all
           checked before a code goes anywhere. */
        case 'owner-continue': {
          const first = el('so-first').value.trim(), last = el('so-last').value.trim();
          const email = el('so-em').value.trim(), phone = el('so-ph').value.trim();
          if (!first) { toast('Enter your first name', 'err'); break; }
          if (!last) { toast('Enter your last name', 'err'); break; }
          if (!validEmail(email)) { toast('Enter a valid email address', 'err'); break; }
          if (phone.replace(/\D/g, '').length < 7) { toast('Enter a phone number we can text', 'err'); break; }
          Object.assign(S.reg, { first, last, email, phone, dial: el('so-dial').value });
          ACCOUNT = 'owner';
          resetOtp(); go('verify-email'); toast(`Code sent to ${email}`, 'info');
          break;
        }

        /* reactions: paw and love are separate, and both can be given */
        case 'paw': case 'love': {
          const r = S.react[d.id] = S.react[d.id] || {};
          r[a] = !r[a]; render();
          if (r[a]) toast(a === 'paw' ? 'Paw given 🐾' : 'Sent some love ❤️', 'ok');
          break;
        }
        case 'follow': {
          S.follow[d.id] = !S.follow[d.id];
          const p = anyPet(d.id);
          /* Unfollowing from a post opened inside PawPals leaves you reading a
             post that no longer belongs in that feed, so the screen goes back to
             the list it came from — where the post is already gone. */
          if (!S.follow[d.id] && S.scr === 'post' && S.tab === 'pawpals') go('pawpals');
          else render();
          toast(S.follow[d.id] ? `${petOf(S.asPet).name} now follows ${p.name}` : `Unfollowed ${p.name}`, S.follow[d.id] ? 'ok' : 'info');
          break;
        }
        case 'home-filter': S.homeFilter = d.val; render(); break;
        case 'go-suggested': go('suggested'); break;

        case 'pick-pet': petSheet(); break;
        case 'set-pet': S.asPet = d.val; closeSheet(); render(); break;
        case 'swap-img': S.postImg = IMG_KEYS[(IMG_KEYS.indexOf(S.postImg) + 1) % IMG_KEYS.length]; render(); break;
        case 'publish': go('home'); toast(`Posted as ${petOf(S.asPet).name}`, 'ok'); break;
        case 'publish-story': go('home'); toast('Story shared — live for 24 hours', 'ok'); break;
        case 'tag-pets': S.tagPets = S.tagPets.length ? [] : ['Marlow', 'Pip']; render(); break;
        case 'tag-biz': S.tagBiz = S.tagBiz ? '' : 'Alberta Vet Clinic'; render(); break;
        case 'comment': toast('Comment added', 'ok'); break;
        case 'story-react': toast('Reaction sent', 'ok'); break;
        case 'post-more': moreSheet(); break;
        case 'search-kind': S.searchKind = d.val; render(); break;
        case 'search-clear': S.query = ''; S.searchKind = 'All'; render(); break;
        case 'story-reply': {
          const box = document.querySelector('#screen input');
          const txt = box && box.value.trim();
          if (!txt) { toast('Write a reply first', 'err'); break; }
          (S.storyReplyLog || (S.storyReplyLog = [])).push(txt);
          box.value = '';
          render(); toast('Reply sent', 'ok');
          break;
        }
        case 'story-kind': S.storyKind = d.val; render(); break;
        case 'story-sticker': {
          const list = S.storyStickers || (S.storyStickers = []);
          const i = list.indexOf(d.val);
          if (i > -1) list.splice(i, 1); else list.push(d.val);
          render();
          break;
        }
        case 'pick-music': musicSheet(); break;
        case 'story-music': {
          S.storyMusic = d.val || '';
          closeSheet(); render();
          toast(d.val ? 'Music added' : 'Music removed', d.val ? 'ok' : 'info');
          break;
        }
        case 'story-replies': S.storyReplies = S.storyReplies === false; render(); break;
        case 'story-reactions': S.storyReactions = S.storyReactions === false; render(); break;
        case 'block-pet': blockSheet(d.id, 'pet'); break;
        case 'block-user': blockSheet(d.id, 'user'); break;
        case 'do-block': {
          const on = d.val === 'on';
          /* The kind is stored alongside, not just a true: a list of blocked
             accounts has to say whether an entry is a pet or the person behind a
             conversation, and the id alone cannot tell you. */
          if (on) S.blocked[d.id] = d.kind || (threadOf(d.id) && threadOf(d.id).id === d.id ? 'user' : 'pet');
          else delete S.blocked[d.id];
          // A blocked pet is not one you follow.
          if (on && S.follow[d.id]) S.follow[d.id] = false;
          closeSheet(); render();
          setTimeout(() => toast(on ? 'Blocked' : 'Unblocked', on ? 'lock' : 'ok'), 160);
          break;
        }
        case 'report': {
          /* closeSheet empties the root on a 280ms timer. Calling it when nothing
             is open leaves that timer running with no sheet to close, and it then
             wipes the modal this action just opened — so it is only called when
             there is genuinely a sheet in the way, and the modal waits for it. */
          if (el('sheet-root').innerHTML.trim()) { closeSheet(); setTimeout(reportModal, 320); }
          else reportModal();
          break;
        }
        case 'send-report': {
          const why = (document.querySelector('[name="rp-why"]:checked') || {}).value || 'Something else';
          closeSheet();
          setTimeout(() => toast(`Reported for ${why.toLowerCase()} — thank you, we will review it`, 'ok'), 160);
          break;
        }
        case 'share': toast('Share sheet opened', 'info'); break;
        case 'remove-pet': {
          /* An account with no pets has nothing to post as, so the last one
             cannot be removed. Anything pointing at the removed pet is moved on
             before it is dropped. */
          if (PETS.length < 2) { toast('An account needs at least one pet', 'err'); break; }
          const i = PETS.findIndex(x => x.id === d.id);
          if (i < 0) break;
          const gone = PETS.splice(i, 1)[0];
          if (S.asPet === gone.id) S.asPet = PETS[0].id;
          if (S.notifPet === gone.id) S.notifPet = '';
          if (S.alertPet === gone.id) S.alertPet = PETS[0].id;
          go('owner'); toast(`${gone.name} removed from your account`, 'info');
          break;
        }
        case 'otp-next': otpNext(d.next); break;
        case 'resend': {
          S.otp = S.otp.map(() => '');
          startResend(30);
          render();
          toast('New code sent', 'info');
          const first = document.querySelector('[data-otp="0"]'); if (first) first.focus();
          break;
        }
        case 'save-biz': {
          const name = el('bz-name').value.trim(), contact = el('bz-contact').value.trim();
          const email = el('bz-em').value.trim(), phone = el('bz-phone').value.trim();
          const addr = el('bz-addr').value.trim();
          if (!name) { toast('Enter the business name', 'err'); break; }
          if (!contact) { toast('Enter the contact person', 'err'); break; }
          if (!validEmail(email)) { toast('Enter a valid email address', 'err'); break; }
          if (phone.replace(/\D/g, '').length < 7) { toast('Enter a phone number we can text', 'err'); break; }
          if (!addr) { toast('Enter the location', 'err'); break; }
          const data = {
            name, contact, cat: el('bz-cat').value, email, dial: el('bz-dial').value, phone, addr,
            bio: el('bz-bio').value.trim(), hours: el('bz-hours').value.trim(), web: el('bz-web').value.trim(),
          };
          if (MY_BIZ) {
            Object.assign(MY_BIZ, data);
            go('business', MY_BIZ.id); toast('Rescue Org profile updated', 'ok');
          } else {
            MY_BIZ = { id: 'mine', kind: 'business', photo: '', followers: 0, ...data };
            BIZ.push(MY_BIZ);
            ACCOUNT = 'business';
            Object.assign(S.reg, { email: data.email, dial: data.dial, phone: data.phone });
            resetOtp(); go('verify-biz-email'); toast(`Code sent to ${data.email}`, 'info');
          }
          break;
        }

        case 'copy-link': toast('Profile link copied', 'ok'); break;

        case 'alert-tab': S.alertTab = d.val; render(); break;
        case 'alert-pet': S.alertPet = d.val; render(); break;
        case 'go-alert-create': go('alert-create'); break;
        case 'submit-alert': go('alerts'); toast('Alert published — 1,240 owners notified', 'ok'); break;
        case 'mark-found': {
          const a3 = alertOf(S.id);
          if (a3) a3.status = 'found';
          render(); toast('Marked as found — the alert is now closed', 'ok');
          break;
        }
        case 'sighting': toast('Sighting logged — the owner has been told', 'ok'); break;
        case 'call': toast('Calling the owner…', 'info'); break;
        case 'notif-tab': S.notifTab = d.val; render(); break;
        case 'notif-pet': S.notifPet = d.val; render(); break;
        case 'read-all': NOTIFS.forEach(n => n.unread = false); render(); toast('All marked as read', 'ok'); break;

        case 'send': {
          // Guarded here as well as in the markup: a block set from another
          // screen must stop a send from a thread already on screen.
          if (blockGuard()) break;
          const i = el('msg-inp'), v = i && i.value.trim();
          if (!v) { toast('Type a message first', 'warn'); break; }
          S.sent.push(v); i.value = ''; render(); break;
        }
        case 'quick': {
          if (blockGuard()) break;
          S.sent.push(d.val); render(); break;
        }

        case 'go-add-pet': go('add-pet'); break;
        case 'save-pet': go('owner'); toast('Pet added — they have a profile now', 'ok'); break;
        case 'save': toast('Saved', 'ok'); back(); break;
        case 'privacy': S.privacy[+d.i] = !S.privacy[+d.i]; render(); break;
        case 'notif-set': S.notifSet[+d.i] = !S.notifSet[+d.i]; render(); break;
        case 'theme-mode': setThemeMode(d.val); break;
        case 'logout': logoutModal(); break;
        case 'do-delete': closeSheet(); setTimeout(() => { ACCOUNT = 'owner'; MY_BIZ = null; go('welcome'); toast('Account deleted', 'info'); }, 240); break;
        case 'do-logout': closeSheet(); setTimeout(() => { ACCOUNT = 'owner'; go('welcome'); toast('Logged out', 'ok'); }, 240); break;

        case 'retry': toast('Reconnecting…', 'info'); setTimeout(() => { go('home'); toast('Back online', 'ok'); }, 700); break;
        case 'upload': toast('Choose a file', 'info'); break;
        case 'soon': toast('Not wired in this prototype', 'info'); break;
        default: break;
      }
    }

    document.addEventListener('input', e => {
      if (e.target.id === 'scr-search') { S.query = e.target.value.trim().toLowerCase(); buildExplorer(); }
      /* Typing a digit patches the box, the counter and the focus by hand rather
         than re-rendering: a repaint per keystroke made the fields flicker and
         threw away the caret every time. */
      const t = e.target;
      if (t.dataset && t.dataset.act === 'adopt-radius') { S.adoptRadius = +t.value; render(); return; }
      if (t.id === 'gsearch') {
        /* render() rebuilds the screen, which throws away the box being typed in.
           The caret is put back where it was so the cursor does not jump to the
           end on every keystroke. */
        const pos = t.selectionStart;
        S.query = t.value;
        S.searchKind = 'All';
        render();
        const n2 = el('gsearch');
        if (n2) {
          n2.focus({ preventScroll: true });
          requestAnimationFrame(() => { try { n2.setSelectionRange(pos, pos); } catch (_) { } });
        }
        return;
      }
      if (t.dataset && t.dataset.otp != null) {
        const i = +t.dataset.otp;
        t.value = t.value.replace(/\D/g, '').slice(0, 1);
        S.otp[i] = t.value;
        t.classList.toggle('filled', !!t.value);
        const boxes = [...document.querySelectorAll('[data-otp]')];
        if (t.value && boxes[i + 1]) boxes[i + 1].focus();
        syncOtp();
      }
    });
    document.addEventListener('keydown', e => {
      const t = e.target;
      // Backspace on an empty box steps back and clears the one before it.
      if (t.dataset && t.dataset.otp != null && e.key === 'Backspace' && !t.value) {
        const prev = document.querySelector(`[data-otp="${+t.dataset.otp - 1}"]`);
        if (prev) { prev.value = ''; S.otp[+t.dataset.otp - 1] = ''; prev.classList.remove('filled'); prev.focus(); syncOtp(); }
        return;
      }
      if (t.matches('input,textarea')) return;
      if (e.key === 'ArrowRight') runTool('next');
      if (e.key === 'ArrowLeft') runTool('prev');
      if (e.key === 'Escape') closeSheet();
    });

    /* ==========================================================
       BOOT
       ========================================================== */
    el('pn-logo').src = WORDMARK;
    buildDevGrid(); buildExplorer(); buildDevice();
    setTimeout(() => { if (S.scr === 'splash') go('welcome'); }, 1900);
  </script>
</body>

</html>
