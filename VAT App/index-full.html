    const SEG_OFF = ('font-semibold ' + T2).split(' ').filter(Boolean);
    const CHIP_OFF = (LINE + ' ' + SURF + ' ' + T2).split(' ').filter(Boolean);
    const CHIP_ACC = ['border-rescue-500', 'bg-rescue-500', 'text-white'];
    const CHIP_INK = ['border-ink', 'bg-ink', 'text-white', 'dark:border-road-50', 'dark:bg-road-50', 'dark:text-ink'];
    const RAD_OFF = ['border-road-200', 'dark:border-road-600'];

    function groupOf(node, sel) {
      const vpEl = document.getElementById('vp');
      let el = node.parentElement;
      while (el && el !== vpEl) {
        if (el.querySelectorAll(sel).length > 1) return el;
        el = el.parentElement;
      }
      return vpEl;
    }
    function actSwitch(n) {
      const on = n.dataset.on === '1', acc = n.dataset.acc === '1', knob = n.firstElementChild;
      n.classList.remove('bg-rescue-500', 'bg-ok-500', 'bg-road-200', 'dark:bg-road-600');
      if (on) { n.classList.add('bg-road-200', 'dark:bg-road-600'); knob.classList.replace('left-[21px]', 'left-[3px]'); }
      else { n.classList.add(acc ? 'bg-rescue-500' : 'bg-ok-500'); knob.classList.replace('left-[3px]', 'left-[21px]'); }
      n.dataset.on = on ? '0' : '1';
    }
    function actRadio(n) {
      groupOf(n, '[data-act="radio"]').querySelectorAll('[data-act="radio"]').forEach(r => {
        r.classList.remove('border-rescue-500'); r.classList.add(...RAD_OFF); r.innerHTML = '';
      });
      n.classList.remove(...RAD_OFF); n.classList.add('border-rescue-500');
      n.innerHTML = '<span class="h-[11px] w-[11px] rounded-full bg-rescue-500"></span>';
    }
    function actCheck(n) {
      const on = n.dataset.on === '1';
      if (on) { n.classList.remove('border-rescue-500', 'bg-rescue-500'); n.classList.add(...RAD_OFF); n.innerHTML = ''; }
      else { n.classList.add('border-rescue-500', 'bg-rescue-500'); n.classList.remove(...RAD_OFF); n.innerHTML = ic('check'); }
      n.dataset.on = on ? '0' : '1';
    }
    function actSeg(n) {
      [...n.parentElement.children].forEach(b => { b.classList.remove(...SEG_ON); b.classList.add(...SEG_OFF); });
      n.classList.remove(...SEG_OFF); n.classList.add(...SEG_ON);
    }
    function actChip(n) {
      const on = n.dataset.on === '1', acc = n.dataset.acc === '1';
      const ON = acc ? CHIP_ACC : CHIP_INK;
      const label = n.dataset.label || n.textContent.trim();
      if (on) { n.classList.remove(...ON); n.classList.add(...CHIP_OFF); n.innerHTML = label; }
      else { n.classList.remove(...CHIP_OFF); n.classList.add(...ON); n.innerHTML = ic('check') + label; }
      n.dataset.on = on ? '0' : '1';
    }
    function actStar(n) {
      const wrap = n.closest('[data-act="stars"]'), i = +n.dataset.i;
      [...wrap.children].forEach((sEl, k) => {
        sEl.classList.toggle('text-[#E8901A]', k < i);
        sEl.classList.toggle('text-road-200', k >= i);
        sEl.classList.toggle('dark:text-road-600', k >= i);
      });
    }
    function actPick(n) {
      const box = n.closest('[data-pick]');
      const ON = (box.dataset.on || '').split(' ').filter(Boolean);
      const OFF = (box.dataset.off || '').split(' ').filter(Boolean);
      box.querySelectorAll('[data-pi]').forEach(b => { b.classList.remove(...ON); b.classList.add(...OFF); });
      n.classList.remove(...OFF); n.classList.add(...ON);
    }
    function actInput(box) {
      const span = box.querySelector('.flex-1');
      if (!span) return;
      box.querySelectorAll('.animate-blink').forEach(c => c.remove());
      if (span.getAttribute('contenteditable') !== 'true') {
        span.setAttribute('contenteditable', 'true');
        span.classList.add('outline-none');
        if (span.classList.contains('text-road-400')) { span.textContent = ''; span.classList.remove('text-road-400'); }
      }
      box.classList.add('border-rescue-500', 'ring-[3px]', 'ring-rescue-50', 'dark:ring-rescue-900');
      span.focus();
      const r = document.createRange(); r.selectNodeContents(span); r.collapse(false);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);

    function wireInteractions(root) {
      root.addEventListener('click', ev => {
        const t = ev.target;
        if (!t.closest) return;
        const inpBox = t.closest('.js-inp');
        if (inpBox) { actInput(inpBox); return; }
        const star = t.closest('[data-i]');
        if (star && star.parentElement && star.parentElement.dataset.act === 'stars') { ev.stopPropagation(); actStar(star); return; }
        const pi = t.closest('[data-pi]');
        if (pi) { ev.stopPropagation(); actPick(pi); return; }
        const sg = t.closest('[data-act="seg"]');
        if (sg) { ev.stopPropagation(); actSeg(sg); return; }
        const chip = t.closest('[data-act="chip"]');
        if (chip) { ev.stopPropagation(); actChip(chip); return; }
        let ctl = t.closest('[data-act="switch"],[data-act="check"],[data-act="radio"]');
        if (!ctl) {
          /* tapping the row that owns a control drives that control */
          const row = t.closest('div,button,label');
          if (row && !row.hasAttribute('data-go')) ctl = row.querySelector('[data-act="switch"],[data-act="check"],[data-act="radio"]');
        }
        if (!ctl) return;
        ev.stopPropagation();
        if (ctl.dataset.act === 'switch') actSwitch(ctl);
        else if (ctl.dataset.act === 'check') actCheck(ctl);
        else actRadio(ctl);
      }, true);
      root.addEventListener('focusout', ev => {
        const box = ev.target.closest && ev.target.closest('.js-inp');
        if (box) box.classList.remove('ring-[3px]', 'ring-rescue-50', 'dark:ring-rescue-900');
      }, true);
    }

    /* ================= ENGINE ================= */
    const $ = s => document.querySelector(s);
    const el = {
      tree: $('#tree'), vp: $('#vp'), doc: $('#doc'), dev: $('#device'), screen: $('#screen'), label: $('#devlabel'),
      insp: $('#inspector'), pos: $('#stepPos'), cnt: $('#cnt'), q: $('#q'), qx: $('#qx'), stage: $('#stage'),
      devgrp: $('#devgrp'), zval: $('#zVal'), shell: $('#shell'), deck: $('#deck')
    };
    let cur = 'splash', devIdx = 0, userZoom = null, filter = '', fs = false;
    const closed = new Set();

    const TB = 'flex h-7 items-center gap-1.5 whitespace-nowrap rounded-[7px] px-2.5 text-[12px] font-semibold text-road-700 transition hover:bg-road-100 hover:text-ink dark:text-road-350 dark:hover:bg-road-700 dark:hover:text-road-50 [&>svg]:h-[15px] [&>svg]:w-[15px] [&>svg]:flex-none';
    const TB_ON = 'bg-white text-ink shadow-card dark:bg-road-900 dark:text-road-50';
    const TB_IO = 'w-7 justify-center !px-0';

    function buildDeviceBar() {
      el.devgrp.innerHTML = DEVICES.map((d, i) => `<button class="${TB} ${i === devIdx ? TB_ON : ''}" data-dev="${i}">${d.short}</button>`).join('');
      el.devgrp.querySelectorAll('[data-dev]').forEach(b => b.onclick = () => { devIdx = +b.dataset.dev; buildDeviceBar(); applyDevice(); });
    }
    const mq = window.matchMedia('(max-width: 767px)');
    const isMobile = () => mq.matches;
    function openDrawer(on) {
      $('#rail').classList.toggle('max-md:!translate-x-0', on);
      $('#mscrim').classList.toggle('hidden', !on);
    }
    function applyDevice() {
      const d = DEVICES[devIdx], b = d.bez;
      if (isMobile()) {
        /* phone viewing: the app screen IS the viewport — no bezel, no scaling */
        el.dev.querySelectorAll('[data-chrome]').forEach(n => n.remove());
        el.dev.style.cssText = 'width:' + el.stage.clientWidth + 'px;height:' + el.stage.clientHeight + 'px;border-radius:0;transform:none;margin:0;box-shadow:none';
        el.screen.style.cssText = 'position:absolute;inset:0;border-radius:0;overflow:hidden';
        el.vp.dataset.nt = 'none';
        applyNotchChrome('none');
        el.label.textContent = '';
        return;
      }
      el.dev.style.boxShadow = '';
      el.dev.style.width = (d.w + b * 2) + 'px'; el.dev.style.height = (d.h + b * 2) + 'px'; el.dev.style.borderRadius = (d.r + b) + 'px';
      el.screen.style.cssText = `position:absolute;left:${b}px;top:${b}px;right:${b}px;bottom:${b}px;border-radius:${d.r}px;overflow:hidden`;
      el.dev.querySelectorAll('[data-chrome]').forEach(n => n.remove());
      const add = (cls, style) => { const n = document.createElement('div'); n.dataset.chrome = '1'; n.className = cls; n.style.cssText = style; el.dev.appendChild(n); };
      if (d.notch === 'island') add('absolute left-1/2 z-[7] -translate-x-1/2 rounded-[20px] bg-black', `top:${b + 11}px;width:118px;height:34px`);
      if (d.notch === 'punchC') add('absolute left-1/2 z-[7] -translate-x-1/2 rounded-full bg-black', `top:${b + 11}px;width:11px;height:11px`);
      const side = 'absolute rounded-sm bg-bezel-rim';
      if (d.id !== 'ipadm' && d.id !== 'ipadp') {
        add(side, `right:-2.5px;top:${b + 118}px;width:3px;height:76px`);
        add(side, `left:-2.5px;top:${b + 92}px;width:3px;height:34px`);
        add(side, `left:-2.5px;top:${b + 140}px;width:3px;height:58px`);
      } else add(side, `right:-2.5px;top:${b + 70}px;width:3px;height:60px`);
      el.vp.dataset.nt = d.notch;
      applyNotchChrome(d.notch);
      el.label.textContent = `${d.name} · ${d.w}×${d.h} · ${d.os}`;
      fit();
    }
    /* status-bar + home-indicator geometry differs per device family */
    function applyNotchChrome(nt) {
      const bar = el.vp.querySelector('.sbar'), home = el.vp.querySelector('.homeind');
      if (bar) {
        bar.classList.remove('h-14', 'items-end', 'pb-[7px]', 'h-9', 'h-[22px]', 'h-[26px]', 'text-[12px]', 'text-[13px]', 'px-3.5', 'px-[22px]');
        if (nt === 'island') bar.classList.add('h-14', 'items-end', 'pb-[7px]');
        else if (nt === 'punchC') bar.classList.add('h-9', 'text-[13px]');
        else if (nt === 'se') bar.classList.add('h-[22px]', 'text-[12px]', 'px-3.5');
        else bar.classList.add('h-[26px]', 'text-[13px]', 'px-[22px]');
      }
      if (home) { home.classList.toggle('hidden', nt === 'se'); }
      el.vp.querySelectorAll('.scr,.homeind i').forEach(() => { });
    }
    function fit() {
      if (isMobile()) return 1;
      const d = DEVICES[devIdx], W = d.w + d.bez * 2, H = d.h + d.bez * 2;
      const aw = el.stage.clientWidth - (fs ? 24 : 70), ah = el.stage.clientHeight - (fs ? 24 : 84);
      const base = Math.min(1, aw / W, ah / H);
      const s = userZoom == null ? base : Math.min(userZoom, aw / W * 1.6);
      el.dev.style.transform = `scale(${s})`;
      el.dev.style.margin = `${(H * s - H) / 2}px ${(W * s - W) / 2}px`;
      el.zval.textContent = Math.round(s * 100) + '%';
      return s;
    }
    function zoomBy(delta) {
      const d = DEVICES[devIdx], W = d.w + d.bez * 2, H = d.h + d.bez * 2;
      const base = Math.min(1, (el.stage.clientWidth - 70) / W, (el.stage.clientHeight - 84) / H);
      const c = userZoom == null ? base : userZoom;
      userZoom = Math.max(.25, Math.min(2, Math.round((c + delta) * 20) / 20));
      fit();
    }

    function buildTree() {
      const f = filter.trim().toLowerCase();
      let shown = 0, html = '';
      MODULES.forEach(m => {
        const kids = m.s.filter(id => S[id] && (!f || `${S[id].t} ${m.n} ${S[id].tag || ''} ${id}`.toLowerCase().includes(f)));
        if (!kids.length) return;
        shown += kids.length;
        const open = f ? true : !closed.has(m.id);
        html += `<div data-mod="${m.id}" class="mb-0.5">
      <button data-head class="flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-left hover:bg-road-50 dark:hover:bg-road-800">
        <span data-chev class="h-[13px] w-[13px] flex-none text-road-400 transition-transform ${open ? '' : '-rotate-90'} [&>svg]:h-full [&>svg]:w-full">${ic('chevD')}</span>
        <span class="h-[7px] w-[7px] flex-none rounded-sm" style="background:${m.c}"></span>
        <span class="flex-1 font-display text-[11.5px] font-bold uppercase tracking-wide text-road-700 dark:text-road-350">${m.n}</span>
        <span class="rounded-full bg-road-50 px-1.5 py-px font-mono text-[10px] text-road-400 dark:bg-road-800">${kids.length}</span></button>
      <div data-kids class="ml-1.5 flex flex-col gap-px border-l border-road-100 py-0.5 pb-1.5 pl-[15px] dark:border-road-800 ${open ? '' : 'hidden'}">
      ${kids.map(id => {
          const n = ORDER.indexOf(id) + 1, on = id === cur;
          return `<button data-go-screen="${id}" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-[12.5px] transition ${on ? 'bg-rescue-50 font-semibold text-rescue-700 dark:bg-rescue-900 dark:text-rescue-300' : 'text-road-700 hover:bg-road-50 hover:text-ink dark:text-road-350 dark:hover:bg-road-800 dark:hover:text-road-50'}">
          <span class="w-4 flex-none font-mono text-[9.5px] ${on ? 'text-rescue-500' : 'text-road-400'}">${String(n).padStart(2, '0')}</span>
          <span class="min-w-0 flex-1 truncate">${S[id].t}</span>
          <span class="ml-auto flex-none rounded border px-1 py-px text-[8.5px] font-bold uppercase tracking-wider ${on ? 'border-current' : 'border-road-300 text-road-400 dark:border-road-600'}">${S[id].tag || ''}</span></button>`;
        }).join('')}</div></div>`;
      });
      el.tree.innerHTML = html || `<div class="px-3.5 py-6 text-center text-[12px] leading-relaxed text-road-400">
    <b>No screens match “${filter}”</b><br>Try a module name, a screen name or a tag.</div>`;
      el.cnt.textContent = `${shown} of ${ORDER.length} screens`;
      el.tree.querySelectorAll('[data-head]').forEach(h => h.onclick = () => {
        const mod = h.parentElement, id = mod.dataset.mod;
        const kids = mod.querySelector('[data-kids]'), chev = h.querySelector('[data-chev]');
        if (closed.has(id)) { closed.delete(id); kids.classList.remove('hidden'); chev.classList.remove('-rotate-90'); }
        else { closed.add(id); kids.classList.add('hidden'); chev.classList.add('-rotate-90'); }
      });
      el.tree.querySelectorAll('[data-go-screen]').forEach(b => b.onclick = () => go(b.dataset.goScreen));
    }

    function inspector(id) {
      const e = S[id], m = MOD[e.mod], i = ORDER.indexOf(id), d = DEVICES[devIdx];
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const links = [...new Set((e._html || '').match(/data-go="[a-z0-9-]+"/g) || [])].map(s => s.slice(9, -1)).filter(x => S[x] && x !== id).slice(0, 8);
      const SEC = 'mb-2 font-display text-[9.5px] font-bold uppercase tracking-[0.14em] text-road-400';
      const JBTN = 'flex items-center gap-1.5 rounded-lg border border-road-300 bg-road-50 px-2.5 py-1.5 text-[11px] font-semibold text-road-700 hover:border-rescue-500 hover:bg-rescue-50 hover:text-rescue-700 dark:border-road-550 dark:bg-road-800 dark:text-road-350 dark:hover:bg-rescue-900 dark:hover:text-rescue-300 [&>svg]:h-3 [&>svg]:w-3';
      el.insp.innerHTML = `
  <div class="sticky top-0 z-[3] border-b border-road-100 bg-white px-4 pb-3 pt-3.5 dark:border-road-800 dark:bg-road-900">
    <div class="font-display text-[9.5px] font-bold uppercase tracking-[0.14em] text-rescue-700 dark:text-rescue-300">${m.n}</div>
    <h2 class="my-1 font-display text-[17px] font-bold leading-tight tracking-tight text-ink dark:text-road-50">${e.t}</h2>
    <p class="text-[12px] leading-relaxed text-road-700 dark:text-road-350">${e.desc}</p></div>
  <div class="flex flex-col gap-4 px-4 pb-10 pt-3.5">
    ${e.notes ? `<div><h3 class="${SEC}">Design decisions</h3><ul class="flex flex-col gap-1.5">${e.notes.map(n => `
      <li class="relative pl-4 text-[12px] leading-relaxed text-road-700 dark:text-road-350"><span class="absolute left-0 top-[6.5px] h-[5px] w-[5px] rounded-sm bg-rescue-500 opacity-75"></span>${n}</li>`).join('')}</ul></div>` : ''}
    ${e.comps ? `<div><h3 class="${SEC}">Implementation</h3><div class="flex flex-wrap gap-1.5">${e.comps.map(c => `
      <span class="rounded-full border border-transparent bg-navy-50 px-2 py-0.5 text-[10.5px] font-semibold text-navy-500 dark:bg-navy-900 dark:text-navy-400">${esc(c)}</span>`).join('')}</div></div>` : ''}
    <div><h3 class="${SEC}">Screen facts</h3><dl class="grid grid-cols-[92px_1fr] gap-x-2.5 gap-y-1.5 text-[11.5px]">
      ${[['Screen', `${String(i + 1).padStart(2, '0')} of ${ORDER.length}`], ['Route id', id], ['Module', m.id],
        ['Type', e.doc ? 'specification' : 'device screen'], ['Canvas', e.doc ? 'document' : `${d.w}×${d.h}`]]
          .map(r => `<dt class="font-semibold text-road-400">${r[0]}</dt><dd class="m-0 font-mono text-[11px] text-road-700 dark:text-road-350">${r[1]}</dd>`).join('')}
    </dl></div>
    ${links.length ? `<div><h3 class="${SEC}">Goes to</h3><div class="flex flex-wrap gap-1.5">${links.map(l => `
      <button data-go-screen="${l}" class="${JBTN}">${ic('arrR')}${S[l].t}</button>`).join('')}</div></div>` : ''}
    <div><h3 class="${SEC}">Sequence</h3><div class="flex flex-wrap gap-1.5">
      ${i > 0 ? `<button data-go-screen="${ORDER[i - 1]}" class="${JBTN}">${ic('arrL')}${S[ORDER[i - 1]].t}</button>` : ''}
      ${i < ORDER.length - 1 ? `<button data-go-screen="${ORDER[i + 1]}" class="${JBTN}">${S[ORDER[i + 1]].t}${ic('arrR')}</button>` : ''}
    </div></div></div>`;
      el.insp.querySelectorAll('[data-go-screen]').forEach(b => b.onclick = () => go(b.dataset.goScreen));
      el.insp.scrollTop = 0;
    }

    let autoTimer = null;
    function go(id) {
      if (!S[id]) return;
      if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
      cur = id;
      const e = S[id], html = e.render();
      e._html = html;
      if (e.doc) {
        el.doc.classList.remove('hidden'); el.deck.classList.add('hidden');
        el.doc.innerHTML = html; el.doc.scrollTop = 0;
      } else {
        el.doc.classList.add('hidden'); el.deck.classList.remove('hidden');
        const isNav = html.slice(0, 300).includes('border-b ' + LINE2);
        el.vp.style.background = e.vpbg || '';
        if (el.vp.dataset.vpc) el.vp.classList.remove(...el.vp.dataset.vpc.split(' ').filter(Boolean));
        el.vp.dataset.vpc = e.vpclass || '';
        if (e.vpclass) el.vp.classList.add(...e.vpclass.split(' ').filter(Boolean));
        el.vp.innerHTML = statusBar(e.sb || (isNav ? 'navbg' : '')) + html;
        el.vp.classList.remove('animate-screenIn'); void el.vp.offsetWidth; el.vp.classList.add('animate-screenIn');
        applyNotchChrome(DEVICES[devIdx].notch);
        el.vp.querySelectorAll('[data-go]').forEach(n => {
          n.onclick = ev => { ev.stopPropagation(); go(n.dataset.go); };
          n.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(n.dataset.go); } };
        });
      }
      el.pos.textContent = `${String(ORDER.indexOf(id) + 1).padStart(2, '0')} / ${ORDER.length}`;
      $('#mPos').textContent = el.pos.textContent;
      if (isMobile()) openDrawer(false);
      if (e.next && e.nextIn) autoTimer = setTimeout(() => { if (cur === id) go(e.next); }, e.nextIn);
      inspector(id);
      el.tree.querySelectorAll('[data-go-screen]').forEach(b => {
        const on = b.dataset.goScreen === id;
        b.className = `flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-[12.5px] transition ${on ? 'bg-rescue-50 font-semibold text-rescue-700 dark:bg-rescue-900 dark:text-rescue-300' : 'text-road-700 hover:bg-road-50 hover:text-ink dark:text-road-350 dark:hover:bg-road-800 dark:hover:text-road-50'}`;
        b.querySelector('span').className = `w-4 flex-none font-mono text-[9.5px] ${on ? 'text-rescue-500' : 'text-road-400'}`;
      });
      const active = el.tree.querySelector(`[data-go-screen="${id}"]`);
      if (active) {
        const mod = active.closest('[data-mod]');
        if (mod && closed.has(mod.dataset.mod)) {
          closed.delete(mod.dataset.mod);
          mod.querySelector('[data-kids]').classList.remove('hidden');
          mod.querySelector('[data-chev]').classList.remove('-rotate-90');
        }
        const r = active.getBoundingClientRect(), t = el.tree.getBoundingClientRect();
        if (r.top < t.top + 8 || r.bottom > t.bottom - 8)
          el.tree.scrollTo({ top: active.offsetTop - el.tree.clientHeight / 2 + active.offsetHeight / 2, behavior: 'smooth' });
      }
    }
    const step = n => { const i = ORDER.indexOf(cur); go(ORDER[(i + n + ORDER.length) % ORDER.length]); };

    function setTheme(t) {
      document.documentElement.classList.toggle('dark', t === 'dark');
      $('#tLight').className = `${TB} ${t === 'light' ? TB_ON : ''}`;
      $('#tDark').className = `${TB} ${t === 'dark' ? TB_ON : ''}`;
      try { localStorage.setItem('vat-theme', t); } catch (e) { }
    }
    function setFs(on) {
      fs = on;
      ['#rail', '#inspector', '#brand', '#topbar'].forEach(s => $(s).classList.toggle('hidden', on));
      el.shell.style.gridTemplateColumns = on ? '0 minmax(0,1fr) 0' : '';
      el.shell.style.gridTemplateRows = on ? '0 minmax(0,1fr)' : '';
      $('#fsx').classList.toggle('hidden', !on);
      $('#fsx').classList.toggle('grid', on);
      setTimeout(fit, 260);
    }

    /* ---- wire up ---- */
    [['#zIn', 'zoomIn', 1], ['#zOut', 'zoomOut', 1], ['#goSplash', 'power', 1], ['#goHome', 'home', 1], ['#goRestart', 'refresh', 1],
    ['#goFs', 'max', 1], ['#pv', 'chevL', 1], ['#nx', 'chevR', 1]].forEach(([sel, icon, io]) => {
      const b = $(sel); b.innerHTML = ic(icon); b.className = `${TB} ${io ? TB_IO : ''}`;
    });
    $('#zFit').className = TB;
    $('#fsx').innerHTML = ic('min');
    el.q.insertAdjacentHTML('beforebegin', `<span class="pointer-events-none absolute left-[22px] top-1/2 h-[15px] w-[15px] -translate-y-1/2 text-road-400 [&>svg]:h-full [&>svg]:w-full">${ic('search')}</span>`);

    $('#zIn').onclick = () => zoomBy(.1);
    $('#zOut').onclick = () => zoomBy(-.1);
    $('#zFit').onclick = () => { userZoom = null; fit(); };
    $('#tLight').onclick = () => setTheme('light');
    $('#tDark').onclick = () => setTheme('dark');
    $('#goSplash').onclick = () => go('splash');
    $('#goHome').onclick = () => go('home');
    $('#goRestart').onclick = () => { closed.clear(); filter = ''; el.q.value = ''; el.qx.classList.add('hidden'); userZoom = null; buildTree(); go('splash'); };
    $('#goFs').onclick = () => setFs(true);
    $('#fsx').onclick = () => setFs(false);
    $('#pv').onclick = () => step(-1);
    $('#nx').onclick = () => step(1);
    $('#expAll').onclick = () => { closed.clear(); buildTree(); };
    $('#colAll').onclick = () => { MODULES.forEach(m => closed.add(m.id)); buildTree(); };
    el.q.oninput = () => { filter = el.q.value; el.qx.classList.toggle('hidden', !filter); el.qx.classList.toggle('grid', !!filter); buildTree(); };
    el.qx.onclick = () => { filter = ''; el.q.value = ''; el.qx.classList.add('hidden'); buildTree(); el.q.focus(); };

    document.addEventListener('keydown', ev => {
      const typing = ev.target.tagName === 'INPUT';
      if (ev.key === '/' && !typing) { ev.preventDefault(); el.q.focus(); return; }
      if (ev.key === 'Escape') { if (fs) setFs(false); else if (typing) el.q.blur(); return; }
      if (typing) return;
      if (ev.key === 'ArrowRight') { ev.preventDefault(); step(1); }
      if (ev.key === 'ArrowLeft') { ev.preventDefault(); step(-1); }
      if (ev.key === 'f') setFs(!fs);
      if (ev.key === 't') setTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
    });
    let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(applyDevice, 90); });
    mq.addEventListener('change', () => { openDrawer(false); applyDevice(); });
    window.addEventListener('load', () => applyDevice());
    let lastW = 0, lastH = 0;
    new ResizeObserver(() => {
      const w = el.stage.clientWidth, h = el.stage.clientHeight;
      if (w === lastW && h === lastH) return;
      lastW = w; lastH = h; applyDevice();
    }).observe(el.stage);

    /* mobile control bar */
    $('#mMenu').innerHTML = ic('list') + '<span>Screens</span>';
    $('#mPv').innerHTML = ic('chevL');
    $('#mNx').innerHTML = ic('chevR');
    $('#mTheme').innerHTML = ic('moon');
    $('#mMenu').onclick = () => openDrawer(true);
    $('#mscrim').onclick = () => openDrawer(false);
    $('#mPv').onclick = () => step(-1);
    $('#mNx').onclick = () => step(1);
    $('#mTheme').onclick = () => { const dark = document.documentElement.classList.contains('dark'); setTheme(dark ? 'light' : 'dark'); $('#mTheme').innerHTML = ic(dark ? 'moon' : 'sun'); };

    /* ---- boot ---- */
    let saved = 'light'; try { saved = localStorage.getItem('vat-theme') || 'light'; } catch (e) { }
    setTheme(saved === 'dark' ? 'dark' : 'light');
    buildDeviceBar();
    applyDevice();
    buildTree();
    wireInteractions(el.vp);
    go('splash');
  </script>
</body>

</html>
