      if (drag.mode.indexOf('s') > -1) b.h = Math.max(MIN, Math.min(s.h + dy, f.y + f.h - s.y));
      if (drag.mode.indexOf('w') > -1) { const nx = Math.min(Math.max(s.x + dx, f.x), s.x + s.w - MIN); b.w = s.w + (s.x - nx); b.x = nx; }
      if (drag.mode.indexOf('n') > -1) { const ny = Math.min(Math.max(s.y + dy, f.y), s.y + s.h - MIN); b.h = s.h + (s.y - ny); b.y = ny; }
      if (cropAspect) {
        const side2 = Math.min(b.w, b.h);
        if (drag.mode.indexOf('w') > -1) b.x = b.x + (b.w - side2);
        if (drag.mode.indexOf('n') > -1) b.y = b.y + (b.h - side2);
        b.w = side2; b.h = side2;
      }
    }
    cropRef.box = b;
    paintCrop();
  };

  stage.onpointerup = stage.onpointercancel = () => { drag = null; };
}

function paintCrop() {
  if (!cropRef) return;
  const b = cropRef.box, box = document.getElementById('cropBox');
  if (!box) return;
  box.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px`;
  const set = (id, css) => { const el = document.getElementById(id); if (el) el.style.cssText = css; };
  set('dimT', `left:0;top:0;width:100%;height:${Math.max(0, b.y)}px`);
  set('dimB', `left:0;top:${b.y + b.h}px;width:100%;bottom:0`);
  set('dimL', `left:0;top:${b.y}px;width:${Math.max(0, b.x)}px;height:${b.h}px`);
  set('dimR', `left:${b.x + b.w}px;top:${b.y}px;right:0;height:${b.h}px`);
  const r = document.getElementById('cropRatio');
  if (r) r.textContent = Math.round(b.w) + ' × ' + Math.round(b.h);
}

function setCropAspect(sq) {
  cropAspect = sq ? 1 : 0;
  if (cropAspect && cropRef) {
    const b = cropRef.box, s = Math.min(b.w, b.h);
    cropRef.box = { x: b.x, y: b.y, w: s, h: s };
    paintCrop();
  }
  go('crop');
}

/* Done: rasterise the selected region so the avatar is genuinely cropped */
function applyCrop() {
  const img = document.getElementById('cropImg');
  if (!img || !cropRef) { go('edit-profile'); return; }
  const f = cropRef.frame, b = cropRef.box;
  const sx = (b.x - f.x) / f.w * img.naturalWidth;
  const sy = (b.y - f.y) / f.h * img.naturalHeight;
  const sw = b.w / f.w * img.naturalWidth;
  const sh = b.h / f.h * img.naturalHeight;
  const scale = Math.min(1, 512 / Math.max(sw, sh));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(sw * scale));
  c.height = Math.max(1, Math.round(sh * scale));
  try {
    c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
    const out = c.toDataURL('image/jpeg', 0.9);
    if (userPhoto && userPhoto.startsWith('blob:')) URL.revokeObjectURL(userPhoto);
    userPhoto = out;
  } catch (e) { /* keep the uncropped original if the canvas is unavailable */ }
  cropRef = null;
  go('edit-profile');
}

function meAvatar(size, extra) {
  return userPhoto
    ? '<img src="' + userPhoto + '" alt="" class="flex-none rounded-full object-cover ' + size + ' ' + (extra || '') + '">'
    : av('SM', size, '#B3541E');
}

/* ================= MODULES ================= */
    const MODULES = [
      { id: 'start', n: 'Get Started', c: '#D9480F', s: ['splash', 'welcome', 'signup', 'otp', 'login'] },
      { id: 'request', n: 'Request Help', c: '#0B7A55', s: ['home', 'request', 'matching', 'tracking', 'in-progress', 'complete'] },
      { id: 'payment', n: 'Payment', c: '#1B5FCC', s: ['payment', 'receipt'] },
      { id: 'partner', n: 'Partner', c: '#133A63', s: ['pv-offer'] },
      { id: 'account', n: 'Account', c: '#C4342A', s: ['activity', 'profile', 'edit-profile', 'crop', 'appearance', 'terms', 'privacy', 'logout', 'delete-account'] },
    ];
    const ORDER = MODULES.flatMap(m => m.s.filter(id => S[id]));
    const MOD = {}; MODULES.forEach(m => MOD[m.id] = m);

    /* ================= INTERACTION LAYER =================
       Delegated on #vp so every control the kit emits is live in the demo. */
    const SEG_ON = (SURF + ' ' + T1 + ' font-bold shadow-card').split(' ').filter(Boolean);
    const SEG_OFF = ('font-semibold ' + T2).split(' ').filter(Boolean);
    const CHIP_OFF = (LINE + ' ' + SURF + ' ' + T2).split(' ').filter(Boolean);
    const CHIP_ACC = ['border-rescue-500', 'bg-rescue-500', 'text-white'];
    const CHIP_INK = ['border-ink', 'bg-ink', 'text-white', 'dark:border-road-50', 'dark:bg-road-50', 'dark:text-ink'];
    const RAD_OFF = ['border-road-200', 'dark:border-road-600'];

    function groupOf(node, sel) {
      const vpEl = document.getElementById('vp');
      let el = node.parentElement;
      while (el && el !== vpEl) {
        if (el.querySelectorAll(sel).length > 1) return el;
        el = el.parentElement;
      }
      return vpEl;
    }
    function actSwitch(n) {
      const on = n.dataset.on === '1', acc = n.dataset.acc === '1', knob = n.firstElementChild;
      n.classList.remove('bg-rescue-500', 'bg-ok-500', 'bg-road-200', 'dark:bg-road-600');
      if (on) { n.classList.add('bg-road-200', 'dark:bg-road-600'); knob.classList.replace('left-[21px]', 'left-[3px]'); }
      else { n.classList.add(acc ? 'bg-rescue-500' : 'bg-ok-500'); knob.classList.replace('left-[3px]', 'left-[21px]'); }
      n.dataset.on = on ? '0' : '1';
    }
    function actRadio(n) {
      groupOf(n, '[data-act="radio"]').querySelectorAll('[data-act="radio"]').forEach(r => {
        r.classList.remove('border-rescue-500'); r.classList.add(...RAD_OFF); r.innerHTML = '';
      });
      n.classList.remove(...RAD_OFF); n.classList.add('border-rescue-500');
      n.innerHTML = '<span class="h-[11px] w-[11px] rounded-full bg-rescue-500"></span>';
    }
    function actCheck(n) {
      const on = n.dataset.on === '1';
      if (on) { n.classList.remove('border-rescue-500', 'bg-rescue-500'); n.classList.add(...RAD_OFF); n.innerHTML = ''; }
      else { n.classList.add('border-rescue-500', 'bg-rescue-500'); n.classList.remove(...RAD_OFF); n.innerHTML = ic('check'); }
      n.dataset.on = on ? '0' : '1';
    }
    function actSeg(n) {
      [...n.parentElement.children].forEach(b => { b.classList.remove(...SEG_ON); b.classList.add(...SEG_OFF); });
      n.classList.remove(...SEG_OFF); n.classList.add(...SEG_ON);
    }
    function actChip(n) {
      const on = n.dataset.on === '1', acc = n.dataset.acc === '1';
      const ON = acc ? CHIP_ACC : CHIP_INK;
      const label = n.dataset.label || n.textContent.trim();
      if (on) { n.classList.remove(...ON); n.classList.add(...CHIP_OFF); n.innerHTML = label; }
      else { n.classList.remove(...CHIP_OFF); n.classList.add(...ON); n.innerHTML = ic('check') + label; }
      n.dataset.on = on ? '0' : '1';
    }
    function actStar(n) {
      const wrap = n.closest('[data-act="stars"]'), i = +n.dataset.i;
      [...wrap.children].forEach((sEl, k) => {
        sEl.classList.toggle('text-[#E8901A]', k < i);
        sEl.classList.toggle('text-road-200', k >= i);
        sEl.classList.toggle('dark:text-road-600', k >= i);
      });
    }
    function actPick(n) {
      const box = n.closest('[data-pick]');
      const ON = (box.dataset.on || '').split(' ').filter(Boolean);

    $('#mPv').onclick = () => step(-1);
    $('#mNx').onclick = () => step(1);
    $('#mTheme').onclick = () => { const dark = document.documentElement.classList.contains('dark'); setTheme(dark ? 'light' : 'dark'); $('#mTheme').innerHTML = ic(dark ? 'moon' : 'sun'); };

    /* ---- boot ---- */
    let saved = 'light'; try { saved = localStorage.getItem('vat-theme') || 'light'; } catch (e) { }
    setTheme(saved === 'dark' ? 'dark' : 'light');
    buildDeviceBar();
    applyDevice();
    buildTree();
    wireInteractions(el.vp);
    go('splash');
  </script>
</body>

</html>
