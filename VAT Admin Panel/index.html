  <style>
    /* ============================================================
       PRESENTER SHELL — browser frame, not a handset. The admin
       panel is the one surface of this platform that is used at a
       desk, so it is shown in a window rather than a phone.
       ============================================================ */
    * {
      -webkit-tap-highlight-color: transparent
    }

    body {
      margin: 0
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none
    }

    .thin-scroll::-webkit-scrollbar {
      width: 8px;
      height: 8px
    }

    .thin-scroll::-webkit-scrollbar-thumb {
      background: #D9DFE7;
      border-radius: 4px
    }

    .icon {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block
    }

    .icon-fill {
      fill: currentColor;
      stroke: none
    }

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      overflow: hidden;
      color: #EAEEF3;
      background:
        radial-gradient(900px 520px at 6% -10%, rgba(244, 102, 27, .30) 0%, rgba(244, 102, 27, 0) 62%),
        radial-gradient(760px 520px at 104% 106%, rgba(255, 138, 31, .16) 0%, rgba(255, 138, 31, 0) 60%),
        linear-gradient(160deg, #1A1D23 0%, #23272E 46%, #191C21 100%);
    }

    #stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .20;
      background-image: radial-gradient(rgba(255, 255, 255, .16) 1px, transparent 1px);
      background-size: 26px 26px;
      -webkit-mask-image: radial-gradient(70% 60% at 26% 18%, #000 0%, transparent 76%);
      mask-image: radial-gradient(70% 60% at 26% 18%, #000 0%, transparent 76%);
    }

    #panel {
      position: relative;
      z-index: 2;
      width: 392px;
      flex: none;
      display: flex;
      flex-direction: column;
      padding: 34px 26px 22px 40px;
      min-height: 0
    }

    .pn-lock {
      width: 126px;
      display: block
    }

    .pn-kick {
      margin-top: 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #FF8A1F
    }

    #panel h1 {
      font-family: 'Barlow Condensed', Inter, system-ui, sans-serif;
      font-size: 38px;
      line-height: 1.02;
      font-weight: 700;
      margin: 10px 0 0
    }

    #panel h1 span {
      color: #FF8A1F
    }

    .pn-p {
      font-size: 13px;
      line-height: 1.6;
      color: #9AA4B1;
      margin: 12px 0 0;
      max-width: 320px
    }

    .pn-label {
      margin: 20px 0 9px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: #6F7A88
    }

    .pn-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px
    }

    .chip {
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      color: #C3CBD5;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .10);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      transition: .16s
    }

    .chip:hover {
      background: rgba(255, 255, 255, .11);
      color: #fff
    }

    .chip.on {
      background: #F4661B;
      border-color: #F4661B;
      color: #fff
    }

    .grp {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #FF8A1F;
      margin: 14px 0 7px
    }

    .grp:first-child {
      margin-top: 0
    }

    #screen-index {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding-right: 8px;
      -webkit-mask-image: linear-gradient(#000 calc(100% - 24px), transparent);
      mask-image: linear-gradient(#000 calc(100% - 24px), transparent)
    }

    #screen-index::-webkit-scrollbar {
      width: 5px
    }

    #screen-index::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .16);
      border-radius: 3px
    }

    .pn-foot {
      padding-top: 16px;
      display: flex;
      align-items: center;
      gap: 11px
    }

    .pn-restart {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font: inherit;
      font-size: 12.5px;
      font-weight: 700;
      color: #23272E;
      background: #fff;
      border: 0;
      border-radius: 999px;
      padding: 9px 16px;
      cursor: pointer
    }

    .pn-hint {
      font-size: 11.5px;
      color: #6F7A88
    }

    #stage-right {
      position: relative;
      z-index: 2;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 22px 22px 12px
    }

    #win-wrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden
    }

    #win {
      transform-origin: center center;
      transition: transform .18s ease
    }

    #win-caption {
      flex: none;
      padding-top: 12px;
      font-size: 11.5px;
      color: #6F7A88;
      text-align: center
    }

    /* ---- browser chrome ---- */
    .browser {
      border-radius: 14px;
      overflow: hidden;
      background: #E8ECF1;
      box-shadow: 0 34px 80px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .08)
    }

    .br-bar {
      height: 44px;
      background: #DDE3EA;
      border-bottom: 1px solid #CBD3DC;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 14px;
      flex: none
    }

    .br-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px
    }

    .br-url {
      flex: 1;
      height: 26px;
      border-radius: 999px;
      background: #F5F7FA;
      border: 1px solid #CBD3DC;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 12px;
      font-size: 12px;
      color: #5C6672;
      max-width: 460px
    }

    .viewport {
      background: #F5F7FA;
      color: #23272E;
      display: flex;
      overflow: hidden
    }

    /* ---- animation ---- */
    @keyframes vUp {
      0% {
        opacity: 0;
        transform: translateY(14px)
      }

      100% {
        opacity: 1;
        transform: none
      }
    }

    .an-up {
      animation: vUp .5s ease both
    }

    @keyframes vZoomOut {
      0% {
        transform: scale(1.1);
        opacity: 0
      }

      30% {
        opacity: 1
      }

      100% {
        transform: scale(1);
        opacity: 1
      }
    }

    .an-zoom {
      animation: vZoomOut 9s cubic-bezier(.16, .8, .3, 1) both
    }

    @keyframes vSpin {
      to {
        transform: rotate(360deg)
      }
    }

    .an-spin {
      animation: vSpin 1s linear infinite
    }

    /* ---- OTP ---- */
    .otp {
      width: 56px;
      height: 62px;
      border-radius: 14px;
      border: 1.6px solid #E6EAF0;
      background: #fff;
      text-align: center;
      font-size: 23px;
      font-weight: 700;
      color: #23272E;
      outline: none;
      transition: .15s
    }

    .otp:focus {
      border-color: #F4661B;
      box-shadow: 0 0 0 4px rgba(244, 102, 27, .13)
    }

    /* ---- side nav ---- */
    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 13px;
      border-radius: 11px;
      font-size: 13.5px;
      font-weight: 600;
      color: #A6B0BD;
      cursor: pointer;
      transition: .15s;
      width: 100%;
      text-align: left
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, .06);
      color: #fff
    }

    .nav-item.on {
      background: #F4661B;
      color: #fff
    }

    /* ---- table ---- */
    .tbl {
      width: 100%;
      border-collapse: collapse
    }

    .tbl th {
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: #8A939F;
      padding: 0 14px 10px;
      white-space: nowrap
    }

    .tbl td {
      padding: 13px 14px;
      border-top: 1px solid #EEF1F5;
      font-size: 13px;
      vertical-align: middle
    }

    .tbl tbody tr {
      cursor: pointer;
      transition: background .12s
    }

    .tbl tbody tr:hover {
      background: #FAFBFC
    }

    /* ---- toast ---- */
    #toast-root {
      position: absolute;
      right: 22px;
      bottom: 22px;
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none
    }

    @media (min-width:561px) and (max-width:1180px) {
      #stage {
        position: static;
        flex-direction: column;
        overflow: visible;
        height: auto;
        min-height: 100dvh
      }

      #panel {
        width: 100%;
        max-height: none;
        padding: 20px;
        overflow: visible
      }

      #screen-index {
        flex: 0 0 auto;
        overflow-y: visible;
        -webkit-mask-image: none;
        mask-image: none
      }

      #stage-right {
        padding: 10px 10px 26px;
        justify-content: flex-start
      }

      #win-wrap {
        flex: none;
        overflow: visible
      }
    }

    @media (max-width:560px) {

      #panel,
      #win-caption {
        display: none
      }

      #stage-right {
        padding: 8px
      }
    }
  </style>
</head>

    const COMMISSION = 0.18;
    const netOf = t => Math.round(t * (1 - COMMISSION) * 100) / 100;

    const money = n => '$' + (Math.round(n * 100) / 100).toFixed(2);

    /* `verified` is what this panel exists to set. A provider who has signed up

       verification" screen until an administrator approves them here. */
    let PROVIDERS = [
      { id: 'p1', name: 'Marcus Hale', email: 'marcus@haletowing.com', phone: '+1 201 555 0177', vehicle: 'Flatbed · Isuzu NPR', plate: 'KL 07 AT 4412', km: 1.8, online: true, verified: true, since: '2026-02-11', blocked: false },
      { id: 'p2', name: 'Dev Anand', email: 'dev@anandrecovery.com', phone: '+1 201 555 0164', vehicle: 'Flatbed · Tata 407', plate: 'KL 05 BX 7781', km: 3.4, online: true, verified: true, since: '2026-03-04', blocked: false },
      { id: 'p3', name: 'Sam Varghese', email: 'sam@varghesemotors.com', phone: '+1 201 555 0119', vehicle: 'Service Van · Force', plate: 'KL 01 CD 2290', km: 5.1, online: false, verified: true, since: '2026-04-22', blocked: false },
      { id: 'p4', name: 'Rahul Nair', email: 'rahul@nairtowing.com', phone: '+1 201 555 0143', vehicle: 'Wrecker · Ashok', plate: 'KL 11 EF 6634', km: 6.9, online: true, verified: true, since: '2026-05-30', blocked: false },
      { id: 'p5', name: 'Ayesha Karim', email: 'ayesha@karimroadside.com', phone: '+1 201 555 0188', vehicle: 'Flatbed · Eicher Pro', plate: 'KL 09 JK 5521', km: 2.7, online: false, verified: false, since: '2026-08-18', blocked: false },
      { id: 'p6', name: 'Luis Ferreira', email: 'luis@ferreirarecovery.com', phone: '+1 201 555 0126', vehicle: 'Service Van · Mahindra', plate: 'KL 02 LM 7734', km: 4.5, online: false, verified: false, since: '2026-08-19', blocked: false },
    ];
    const provOf = id => PROVIDERS.find(p => p.id === id) || null;
    const pending = () => PROVIDERS.filter(p => !p.verified);

    const TODAY = new Date();
    const MIN = 60000;
    const ago = m => new Date(TODAY.getTime() - m * MIN).toISOString();
    const MON3 = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function stampText(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      let h = d.getHours();
      const ap = h < 12 ? 'am' : 'pm';
      h = h % 12 || 12;
      return `${d.getDate()} ${MON3[d.getMonth()]} ${d.getFullYear()}, ${h}:${String(d.getMinutes()).padStart(2, '0')} ${ap}`;
    }
    const dateText = iso => { const d = new Date(iso); return `${d.getDate()} ${MON3[d.getMonth()]} ${d.getFullYear()}`; };

    const FLOW = ['searching', 'assigned', 'accepted', 'enroute', 'arrived', 'working', 'completed', 'paid', 'released'];
    const STATUS = {
      assigned: { label: 'Offered', tone: 'amber' },
      accepted: { label: 'Accepted', tone: 'amber' },
      enroute: { label: 'On the way', tone: 'blue' },

      paid: { label: 'Awaiting payment', tone: 'amber' },
      released: { label: 'Paid', tone: 'green' },
      cancelled: { label: 'Cancelled', tone: 'grey' },

    const TONE = {
      amber: 'bg-amber-50 text-amber-700', blue: 'bg-blue-50 text-blue-700',
      green: 'bg-emerald-50 text-emerald-700', grey: 'bg-slate-100 text-slate1',
    };
    const pill = st => `<span class="inline-block text-[11px] font-bold px-2.5 py-1 rounded-full whitespace-nowrap ${TONE[(STATUS[st] || {}).tone] || TONE.grey}">${(STATUS[st] || {}).label || st}</span>`;

    /* A job is charged at the service fee alone. Distance is still recorded and
       shown — how far away the provider is matters to everyone — but it is no
       longer billed, so `total` and `base` are the same figure. */
    function fareFor(svcId, km) {
      const base = svcOf(svcId).base;
      return { base, total: base };
    }
    /* ---- what a job is charged for ----
       A job is no longer one service at a price. It is a list of lines, each
       recording what it is, what it costs, and who put it there. Two things
       follow from that: the customer can ask for more than one thing at once,
       and the provider can add work they actually did on site.

       Who added a line decides whether it can be refused. A line the customer
       asked for is theirs; a line the provider added is a claim, and the
       customer settles it or declines it when they pay. Declined lines are kept
       on the record rather than deleted — the provider and the administrator
       both need to see that the claim was made and refused. */
    let lineSeq = 100;
    const lineId = () => 'L' + (++lineSeq);
    const svcLine = (svcId, by) => ({ id: lineId(), kind: 'service', svc: svcId, label: svcOf(svcId).name, amount: svcOf(svcId).base, by, rejected: false });
    const customLine = (label, amount, by) => ({ id: lineId(), kind: 'custom', label, amount: Math.round(amount * 100) / 100, by, rejected: false });

    const liveLines = j => (j.items || []).filter(i => !i.rejected);
    const jobTotal = j => Math.round(liveLines(j).reduce((t, i) => t + i.amount, 0) * 100) / 100;
    // Lines the provider added that the customer has not yet settled or refused.
    const claimLines = j => (j.items || []).filter(i => i.by === 'provider');
    const openClaims = j => claimLines(j).filter(i => !i.rejected);
    const rejectedLines = j => (j.items || []).filter(i => i.rejected);
    /* `fare.total` is read all over the three apps, so it is kept in step with
       the lines rather than replaced. */
    function syncFare(j) {
      j.fare = j.fare || {};
      j.fare.total = jobTotal(j);
      j.fare.base = j.fare.total;
      return j;
    }
    // The service that names the job — the first thing the customer asked for.
    const primarySvc = j => (j.items && j.items.find(i => i.kind === 'service') || {}).svc || j.service;
    /* How a job is named when there is only room for one line. A request can
       carry several services now, so the first one names it and the rest are
       counted: "Flat Tyre +2" is three services in all. Declined lines are not
       counted, because they are not part of the job any more. */
    const svcCount = j => (j.items || []).filter(i => i.kind === 'service' && !i.rejected).length;
    function svcLabel(j) {
      const name = svcOf(primarySvc(j)).name, n = svcCount(j);
      return n > 1 ? `${name} <span class="font-normal text-slate2">+${n - 1}</span>` : name;
    }
    // The same thing without markup, for a page title or a plain string.
    function svcLabelText(j) {
      const name = svcOf(primarySvc(j)).name, n = svcCount(j);
      return n > 1 ? `${name} +${n - 1}` : name;
    }

    function mkJob(o) {
      const j = Object.assign({ fare: fareFor(o.service, o.km) }, o);
      /* Every job is born with at least one line — the service it was raised
         for — so nothing reaches the settlement with an empty bill. */
      if (!j.items) j.items = [svcLine(j.service, 'customer')];
      return syncFare(j);
    }
    const STEP_AT = { searching: 0, assigned: 3, accepted: 7, enroute: 15, arrived: 37, working: 41, completed: 87, paid: 94, released: 130 };

    let JOBS = [
      mkJob({ id: 'VAT-1036', service: 'battery', km: 2.1, provider: 'p2', status: 'released', customer: 'Priya Menon', phone: '+1 201 555 0110', address: '8 Mill St, Teaneck', make: 'Hyundai', model: 'i20', plate: 'KL 03 XY 8890', note: 'Lights left on overnight, battery flat in the driveway.', createdAt: ago(4200) }),
      mkJob({ id: 'VAT-1037', service: 'tow', km: 4.2, provider: 'p1', status: 'released', customer: 'Daniel Cruz', phone: '+1 201 555 0188', address: '14 Harbour Rd, Fort Lee', make: 'Honda', model: 'Civic', plate: 'KL 09 AB 1122', note: 'Would not start after a knocking sound. Recovered to the garage on Main St.', createdAt: ago(2880) }),
      mkJob({ id: 'VAT-1038', service: 'mech', km: 3.6, provider: 'p1', status: 'released', customer: 'Sara Whitfield', phone: '+1 201 555 0164', address: 'Sylvan Ave, Englewood Cliffs', make: 'Ford', model: 'Focus', plate: 'KL 05 MN 7712', note: 'Clutch slipping badly, would not hold in third.', createdAt: ago(1500) }),
      mkJob({ id: 'VAT-1039', service: 'flat', km: 2.4, provider: 'p4', status: 'released', customer: 'Marta Silva', phone: '+1 201 555 0151', address: 'Overpeck County Park, Leonia', make: 'Nissan', model: 'Micra', plate: 'KL 06 PL 3318', note: 'Kerbed the front nearside tyre on the park road.', createdAt: ago(11500) }),
      mkJob({ id: 'VAT-1042', service: 'fuel', km: 2.8, provider: 'p1', status: 'paid', customer: 'Owen Blake', phone: '+1 201 555 0129', address: 'Route 17 North, Paramus', make: 'Kia', model: 'Seltos', plate: 'KL 02 RT 5540', note: 'Ran dry two miles short of the services.', createdAt: ago(190) }),
      mkJob({ id: 'VAT-1045', service: 'tow', km: 6.3, provider: 'p1', status: 'paid', customer: 'Helen Amari', phone: '+1 201 555 0146', address: 'Palisades Interstate Pkwy, Fort Lee', make: 'Volvo', model: 'XC40', plate: 'KL 12 SN 8850', note: 'Gearbox would not select drive. Recovered to the dealer.', createdAt: ago(320) }),
      mkJob({ id: 'VAT-1046', service: 'mech', km: 3.1, provider: 'p2', status: 'paid', customer: 'Ravi Deshpande', phone: '+1 201 555 0158', address: 'Sylvan Ave, Englewood Cliffs', make: 'Renault', model: 'Duster', plate: 'KL 03 HT 6612', note: 'Brakes grinding badly, not safe to drive on.', createdAt: ago(260) }),
      mkJob({ id: 'VAT-1047', service: 'flat', km: 3.0, provider: 'p1', status: 'working', customer: 'Alex Rivera', phone: '+1 201 555 0142', address: '221 Palisade Ave, Englewood', make: 'Toyota', model: 'RAV4', plate: 'KL 07 QQ 3321', note: 'Rear right tyre punctured on the kerb.', createdAt: ago(35) }),
      mkJob({ id: 'VAT-1048', service: 'engine', km: 1.9, provider: 'p4', status: 'enroute', customer: 'Nadia Haddad', phone: '+1 201 555 0173', address: 'Main St & Cedar Ln, Teaneck', make: 'Volkswagen', model: 'Polo', plate: 'KL 08 GH 2264', note: 'Engine cut out at the lights and will not turn over.', createdAt: ago(14) }),
    ];

    /* Every seeded job gets its line. A few carry an extra — a second service
       the customer added later, or a charge the provider raised on site — so the
       screens have something real to show without anyone having to build it. */
    JOBS.forEach(j => {
      if (!j.items) j.items = [svcLine(j.service, 'customer')];
      syncFare(j);
    });

    // Two jobs carry a provider's extra charge: one settled, one still open.
    (() => {
      const a = JOBS.find(x => x.id === 'VAT-1037');
      if (a) { a.items.push(customLine('Winch recovery from verge', 25, 'provider')); syncFare(a); }
      const b = JOBS.find(x => x.id === 'VAT-1042');
      if (b) { b.items.push(customLine('Fuel supplied, 10 litres', 22, 'provider')); syncFare(b); }
      const c = JOBS.find(x => x.id === 'VAT-1038');
      if (c) {
        const line = customLine('Replacement clutch cable', 40, 'provider');
        line.rejected = true;                    // the customer refused this one
        c.items.push(line); syncFare(c);
      }
      const d = JOBS.find(x => x.id === 'VAT-1047');
      if (d) { d.items.push(svcLine('battery', 'customer')); syncFare(d); }
    })();

    /* One request called off by the customer and one by the provider, so the
       record of a cancellation — who, when and why — is visible without anyone
       having to create it. */
    (() => {
      const a = JOBS.find(x => x.id === 'VAT-1046');
      if (a) {
        a.status = 'cancelled';
        a.cancel = { by: 'customer', name: 'Ravi Deshpande', reason: 'A neighbour towed the car to the garage before the provider arrived.', at: ago(240), from: 'enroute' };
      }
      const b = JOBS.find(x => x.id === 'VAT-1045');
      if (b) {
        b.status = 'cancelled';
        b.cancel = { by: 'provider', name: 'Marcus Hale', reason: 'Vehicle needed a low-loader I do not carry. Returned to the platform for reassignment.', at: ago(300), from: 'arrived' };
      }
    })();

    // Every job carries the times it passed each step, so a detail page can say
    // when, not merely what.
    JOBS.forEach(j => {
      const base = new Date(j.createdAt).getTime();
      j.stamps = {};
      const reached = j.cancel ? j.cancel.from : j.status;
      FLOW.slice(0, FLOW.indexOf(reached) + 1)

      if (j.cancel) j.stamps.cancelled = j.cancel.at;

    // FLOW has no 'cancelled', so indexOf is -1 and a cancelled job falls out
    // of "in progress" on its own — but say so, rather than relying on it.
    const live = () => JOBS.filter(j => j.status !== 'cancelled' && FLOW.indexOf(j.status) > -1 && FLOW.indexOf(j.status) < FLOW.indexOf('completed'));
    const awaitingRelease = () => JOBS.filter(j => j.status === 'paid');
    const settledJobs = () => JOBS.filter(j => j.status === 'released');
    const processed = () => JOBS.filter(j => ['paid', 'released'].includes(j.status));
    const commissionEarned = () => processed().reduce((t, j) => t + cutOf(j.fare.total), 0);
    const grossProcessed = () => processed().reduce((t, j) => t + j.fare.total, 0);

    /* ================= STATE ================= */
    const ADMIN = { email: 'admin@vat.com', password: 'Vat@dmin1', name: 'Priya Menon', role: 'Administrator' };

    const SETTINGS = { radiusMiles: 10 };

      reveal: false,         // password field visibility
      forgotEmail: '',
    };

    /* ================= CHROME ================= */
    function toast(msg, icon = 'check') {

      t.innerHTML = `<span class="text-flame">${ic(icon, 15)}</span> ${msg}`;

      setTimeout(() => { t.style.transition = 'opacity .3s,transform .3s'; t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; setTimeout(() => t.remove(), 320); }, 2400);
    }

    /* ================= RENDER ================= */
    function render() {
      const v = el('viewport'); if (!v) return;
      v.innerHTML = S.screen === 'app' ? appShell() : authShell();

    const esc = v => String(v == null ? '' : v).replace(/"/g, '&quot;');

    /* ================= AUTH =================

       a thirty-second resend lock. */
    const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v).trim());

    function authShell() {

      /* Half photograph, half form. The image is on its own side of the split

         costing the form any contrast. */

    const authHead = (title, sub) => `<div class="mb-7">

    function loginCard() {

        <b class="text-ink">${ADMIN.email}</b> with <b class="text-ink">${ADMIN.password}</b>.</span>

    function codeCard() {

    /* ---- resend, and the thirty-second lock ----
       Identical in behaviour to both apps: live on arrival, locked for thirty
       seconds once pressed, and pressing it clears whatever was typed. */
    let resendLeft = 0, resendTimer = null;
    function resendHTML() {
      const locked = resendLeft > 0;
      return `<button data-act="resend" ${locked ? 'disabled' : ''} class="inline-flex items-center gap-1.5 text-[12.5px] font-bold rounded-full transition ${locked ? 'text-slate2 cursor-not-allowed' : 'text-brand hover:opacity-80'}">

    function paintResend() { const s = el('resend-slot'); if (s) s.innerHTML = resendHTML(); }
    function stopResend() { clearInterval(resendTimer); resendLeft = 0; }
    function startResend() {
      clearInterval(resendTimer);

        resendLeft--;

    }
    const readCode = () => [...document.querySelectorAll('.otp')].map(i => i.value).join('');
    function clearOtp() {
      document.querySelectorAll('.otp').forEach(i => i.value = '');
      const f = document.querySelector('.otp'); if (f) f.focus();
    }

    /* ---- the new password ----
       Five rules, each shown as its own line and ticked as it is met, because a
       single "password not strong enough" leaves the reader guessing which of
       the five they have missed. */
    const RULES = [
      { id: 'len', label: 'At least 8 characters', test: v => v.length >= 8 },
      { id: 'upper', label: 'One upper-case letter', test: v => /[A-Z]/.test(v) },
      { id: 'lower', label: 'One lower-case letter', test: v => /[a-z]/.test(v) },
      { id: 'digit', label: 'One number', test: v => /\d/.test(v) },
      { id: 'special', label: 'One special character', test: v => /[^A-Za-z0-9]/.test(v) },
    ];
    const rulesMet = v => RULES.every(r => r.test(v));
    function ruleList(v) {
      return RULES.map(r => {
        const ok = r.test(v);
        return `<div class="flex items-center gap-2 text-[12.5px] ${ok ? 'text-emerald-700' : 'text-slate2'}">
