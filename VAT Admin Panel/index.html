      }).join('');
    }
    function resetCard() {
      return `${authHead('Choose a new password', 'It must meet all five rules below.')}
    <div class="space-y-4">
      <div><label class="${LABEL}">New password</label>
        <div class="flex items-center border border-line rounded-xl px-4 bg-white focus-within:border-brand transition">
          <span class="text-faint shrink-0">${ic('lock', 17)}</span>
          <input id="r-pass" type="${S.reveal ? 'text' : 'password'}" autocomplete="new-password" class="flex-1 py-3 px-2.5 text-[14.5px] bg-transparent outline-none text-ink">
          <button data-act="reveal" aria-label="Show password" class="text-faint shrink-0 hover:text-slate1">${ic(S.reveal ? 'eye-off' : 'eye', 17)}</button></div></div>
      <div><label class="${LABEL}">Confirm password</label>
        <div class="flex items-center border border-line rounded-xl px-4 bg-white focus-within:border-brand transition">
          <span class="text-faint shrink-0">${ic('lock', 17)}</span>
          <input id="r-pass2" type="${S.reveal ? 'text' : 'password'}" autocomplete="new-password" class="flex-1 py-3 px-2.5 text-[14.5px] bg-transparent outline-none text-ink"></div>
        <div id="match-note" class="text-[12px] mt-1.5"></div></div>
    </div>
    <div class="${CARD} p-4 mt-4 space-y-2" id="rule-list">${ruleList('')}</div>
    <button data-act="save-password" class="${BTN} mt-6">${ic('check', 17)} Update password</button>
    <button data-act="back-login" class="w-full text-center text-[12.5px] font-semibold text-slate2 mt-5 py-2">Back to sign in</button>`;
    }

    function doneCard() {
      return `<div class="text-center pt-6">
    <span class="w-16 h-16 rounded-full bg-emerald-50 text-emerald-600 grid place-items-center mx-auto">${ic('check', 30)}</span>
    <h1 class="font-display font-bold text-ink leading-none mt-6" style="font-size:29px">Password updated</h1>
    <p class="text-[13.5px] text-slate1 leading-relaxed mt-3">You can sign in with your new password now.</p>
  </div>
  <button data-act="back-login" class="${BTN} mt-8">Back to sign in ${ic('arrow-right', 17)}</button>`;
    }

    /* ================= APP SHELL ================= */
    const NAVS = [
      ['dashboard', 'Dashboard', 'dash'],
      ['requests', 'Requests', 'list'],
      ['providers', 'Providers', 'users'],
      ['payouts', 'Payouts', 'wallet'],
      ['services', 'Services', 'wrench'],
      ['account', 'Account', 'user'],
    ];
    function appShell() {
      const pageTitle = {
        dashboard: 'Dashboard', requests: 'Requests', providers: 'Providers',
        payouts: 'Payouts', services: 'Services', account: 'Account',
      }[S.tab];
      const body = S.jobId ? requestDetail(S.jobId)
        : S.provId ? providerDetail(S.provId)
          : { dashboard: dashboard, requests: requestsPage, providers: providersPage, payouts: payoutsPage, services: servicesPage, account: accountPage }[S.tab]();
      const nPend = pending().length, nRel = awaitingRelease().length;
      return `<aside class="flex-none flex flex-col" style="width:236px;background:#1E2228">
    <div class="px-5 pt-6 pb-5">
      <img src="${ART.lockLight}" alt="VAT" style="width:84px">
    </div>
    <nav class="px-3 space-y-1">
      ${NAVS.map(([k, label, icon]) => {
        const badge = k === 'providers' ? nPend : k === 'payouts' ? nRel : 0;
        return `<button data-tab="${k}" class="nav-item ${S.tab === k && !S.jobId && !S.provId ? 'on' : ''}">
        ${ic(icon, 18)}<span class="flex-1">${label}</span>
        ${badge ? `<span class="text-[11px] font-bold rounded-full px-1.5 py-0.5 ${S.tab === k ? 'bg-white/25 text-white' : 'bg-brand text-white'}">${badge}</span>` : ''}</button>`;
      }).join('')}
    </nav>
    <div class="mt-auto p-3">
      <div class="rounded-xl p-3" style="background:rgba(255,255,255,.05)">
        <div class="flex items-center gap-2.5">
          <span class="w-9 h-9 rounded-lg bg-brand text-white grid place-items-center font-bold text-[13px] shrink-0">${S.user.name.split(' ').map(w => w[0]).join('')}</span>
          <div class="min-w-0 flex-1">
            <div class="text-[13px] font-bold text-white truncate">${S.user.name}</div>
            <div class="text-[11px] text-slate2 truncate">${S.user.role}</div>
          </div>
        </div>
        <button data-act="logout" class="nav-item mt-2" style="padding:8px 10px">${ic('logout', 16)} Log out</button>
      </div>
    </div>
  </aside>

  <div class="flex-1 min-w-0 flex flex-col bg-paper">
    <header class="flex-none h-16 bg-white border-b border-line px-7 flex items-center gap-3">
      ${S.jobId || S.provId ? `<button data-act="back" class="w-9 h-9 rounded-lg grid place-items-center text-slate1 hover:bg-paper">${ic('chev-left', 20)}</button>` : ''}
      <h1 class="font-bold text-ink text-[18px]">${S.jobId ? 'Request ' + S.jobId : S.provId ? provOf(S.provId).name : pageTitle}</h1>
      <div class="ml-auto flex items-center gap-2 text-[12px] text-slate2">
        ${ic('globe', 14)} admin.myverichain.com
      </div>
    </header>
    <div id="main-scroll" class="flex-1 overflow-y-auto thin-scroll">
      <div class="px-7 py-6">${body}</div>
    </div>
  </div>`;
    }

    /* ================= DASHBOARD ================= */
    const statCard = (label, value, sub, icon, tone) => `<div class="${CARD} p-5">
    <span class="w-10 h-10 rounded-xl grid place-items-center ${tone || 'bg-brand/10 text-brand'} mb-4">${ic(icon, 19)}</span>
    <div class="font-display font-bold text-ink leading-none" style="font-size:27px">${value}</div>
    <div class="text-[12.5px] font-semibold text-ink mt-1.5">${label}</div>
    ${sub ? `<div class="text-[11.5px] text-slate2 mt-0.5">${sub}</div>` : ''}
  </div>`;

    function dashboard() {
      const nPend = pending().length;
      return `<div class="relative overflow-hidden rounded-2xl mb-6" style="height:132px">
    <img src="${ART.keysWide}" alt="" class="absolute inset-0 w-full h-full object-cover">
    <span class="absolute inset-0" style="background:linear-gradient(90deg,rgba(20,24,30,.90) 0%,rgba(20,24,30,.72) 46%,rgba(20,24,30,.30) 100%)"></span>
    <div class="relative h-full flex flex-col justify-center px-7">
      <div class="text-[11px] font-bold uppercase tracking-[.16em] text-flame">${dateText(TODAY.toISOString())}</div>
      <div class="font-display font-bold text-white leading-none mt-2" style="font-size:26px">Good day, ${S.user.name.split(' ')[0]}</div>
      <div class="text-[12.5px] text-white/70 mt-1.5">${live().length} requests in progress · ${nPend} provider${nPend !== 1 ? 's' : ''} awaiting verification</div>
    </div>
  </div>

  <div class="grid grid-cols-4 gap-4">
    ${statCard('Commission earned', money(commissionEarned()), `${Math.round(COMMISSION * 100)}% of ${money(grossProcessed())} processed`, 'wallet')}
    ${statCard('Requests in progress', live().length, 'Across all providers', 'list', 'bg-blue-50 text-blue-700')}
    ${statCard('Awaiting payment', awaitingRelease().length, money(awaitingRelease().reduce((t, j) => t + netOf(j.fare.total), 0)) + ' owed to providers', 'clock', 'bg-amber-50 text-amber-700')}
    ${statCard('Providers to verify', nPend, nPend ? 'Waiting on you' : 'Nothing outstanding', 'shield', nPend ? 'bg-amber-50 text-amber-700' : 'bg-emerald-50 text-emerald-700')}
  </div>

  <div class="grid grid-cols-3 gap-4 mt-6">
    <div class="col-span-2 ${CARD} p-5">
      <div class="flex items-center mb-3">
        <h2 class="font-bold text-ink text-[15px]">Latest requests</h2>
        <button data-tab="requests" class="ml-auto text-[12.5px] font-bold text-brand">View all</button>
      </div>
      ${jobTable(JOBS.slice().reverse().slice(0, 6), true)}
    </div>
    <div class="${CARD} p-5">
      <h2 class="font-bold text-ink text-[15px] mb-3">Awaiting verification</h2>
      ${nPend ? `<div class="space-y-2.5">${pending().map(p => `<button data-prov="${p.id}" class="w-full flex items-center gap-3 border border-line rounded-xl p-3 text-left hover:bg-paper transition">
        <span class="w-9 h-9 rounded-lg bg-ink text-white grid place-items-center font-bold text-[12px] shrink-0">${p.name.split(' ').map(w => w[0]).join('')}</span>
        <span class="min-w-0 flex-1"><span class="block text-[13px] font-bold text-ink truncate">${p.name}</span>
          <span class="block text-[11.5px] text-slate2 truncate">Applied ${dateText(p.since)}</span></span>
        ${ic('chev-left', 15, 'rotate-180 text-faint shrink-0')}</button>`).join('')}</div>`
          : `<p class="text-[12.5px] text-slate2 py-6 text-center">Every provider has been reviewed.</p>`}
    </div>
  </div>`;
    }

    /* ================= REQUESTS ================= */
    const svcCell = j => `<div class="flex items-center gap-2.5">
    <span class="w-8 h-8 rounded-lg grid place-items-center bg-brand/10 text-brand shrink-0">${ic(svcOf(j.service).ic, 16)}</span>
    <span class="font-semibold text-ink whitespace-nowrap">${svcLabel(j)}</span></div>`;

    function jobTable(rows, compact) {
      if (!rows.length) return `<p class="text-[13px] text-slate2 text-center py-10">No requests match this filter.</p>`;
      return `<table class="tbl">
    <thead><tr>
      <th>Request</th><th>Service</th><th>Customer</th>${compact ? '' : '<th>Provider</th>'}<th>Status</th><th class="text-right">Total</th>
    </tr></thead>
    <tbody>${rows.map(j => `<tr data-job="${j.id}">
      <td class="font-bold text-ink whitespace-nowrap">${j.id}</td>
      <td>${svcCell(j)}</td>
      <td class="text-slate1 whitespace-nowrap">${j.customer}</td>
      ${compact ? '' : `<td class="text-slate1 whitespace-nowrap">${j.provider ? provOf(j.provider).name : '<span class="text-faint">Unassigned</span>'}</td>`}
      <td>${pill(j.status)}</td>
      <td class="text-right font-bold text-ink whitespace-nowrap">${money(j.fare.total)}</td>
    </tr>`).join('')}</tbody>
  </table>`;
    }

    /* ---- filters shared by Requests and Payouts ----
       Both screens ask the same three questions of a list — which service, over
       what dates, and does anything match this text — so they ask them with one
       control rather than two that drift apart. The tab is applied first and
       these narrow whatever it returned, which is what makes them work "within
       each tab" rather than replacing the tab. */
    const blankFilter = () => ({ q: '', svc: 'all', from: '', to: '' });
    function filterBar(scope, placeholder) {
      const f = S[scope];
      const active = f.q || f.svc !== 'all' || f.from || f.to;
      return `<div class="${CARD} p-3 mb-4 flex items-center gap-2.5 flex-wrap">
    <div class="flex items-center border border-line rounded-lg px-3 bg-white focus-within:border-brand transition" style="min-width:260px">
      ${ic('search', 16, 'text-faint shrink-0')}
      <input data-filter="${scope}" data-key="q" value="${esc(f.q)}" placeholder="${placeholder}"
        class="flex-1 min-w-0 py-2 px-2.5 text-[13px] bg-transparent outline-none text-ink">
    </div>
    <div class="relative">
      <select data-filter="${scope}" data-key="svc" class="appearance-none border border-line rounded-lg bg-white pl-3 pr-8 py-2 text-[13px] text-ink outline-none focus:border-brand transition">
        <option value="all" ${f.svc === 'all' ? 'selected' : ''}>All services</option>
        ${SERVICES.map(x => `<option value="${x.id}" ${f.svc === x.id ? 'selected' : ''}>${x.name}</option>`).join('')}
      </select>
      <span class="absolute right-2 top-1/2 -translate-y-1/2 text-faint pointer-events-none">${ic('chev-down', 14)}</span>
    </div>
    <div class="flex items-center gap-2 text-[12.5px] text-slate2">
      <span>From</span>
      <input type="date" data-filter="${scope}" data-key="from" value="${f.from}" class="border border-line rounded-lg px-2.5 py-2 text-[13px] text-ink bg-white outline-none focus:border-brand transition">
      <span>to</span>
      <input type="date" data-filter="${scope}" data-key="to" value="${f.to}" class="border border-line rounded-lg px-2.5 py-2 text-[13px] text-ink bg-white outline-none focus:border-brand transition">
    </div>
    ${active ? `<button data-act="clear-filter" data-id="${scope}" class="text-[12.5px] font-bold text-brand ml-auto px-2">Clear</button>` : ''}
  </div>`;
    }
    const dayOf = iso => new Date(iso).toISOString().slice(0, 10);
    /* One predicate for both screens. Text matches the request number, the
       customer or the provider, because those are the three things anyone
       actually has to hand when they come looking for a job. */
    function matchesFilter(j, f) {
      if (f.svc !== 'all' && j.service !== f.svc) return false;
      const d = dayOf(j.createdAt);
      if (f.from && d < f.from) return false;
      if (f.to && d > f.to) return false;
      if (f.q) {
        const q = f.q.trim().toLowerCase();
        const prov = j.provider ? provOf(j.provider).name : '';
        if (![j.id, j.customer, prov].some(v => String(v).toLowerCase().includes(q))) return false;
      }
      return true;
    }

    const REQ_FILTERS = [
      ['all', 'All'], ['live', 'In progress'], ['completed', 'Awaiting payment'], ['released', 'Paid'], ['cancelled', 'Cancelled'],
    ];
    function filteredJobs() {
      const f = S.reqFilter;
      const base = f === 'live' ? live()
        : f === 'all' ? JOBS.slice().reverse()
          : JOBS.filter(j => j.status === f).reverse();
      return base.filter(j => matchesFilter(j, S.reqf));
    }
    function requestsPage() {
      const rows = filteredJobs();
      return `<div class="flex items-center gap-2 mb-4">
    ${REQ_FILTERS.map(([k, label]) => `<button data-reqfilter="${k}" class="px-3.5 py-2 rounded-lg text-[12.5px] font-bold border transition ${S.reqFilter === k ? 'bg-ink text-white border-ink' : 'bg-white text-slate1 border-line hover:bg-paper'}">${label}</button>`).join('')}
    <span class="ml-auto text-[12.5px] text-slate2">${rows.length} request${rows.length !== 1 ? 's' : ''}</span>
  </div>
  ${filterBar('reqf', 'Search by request ID, customer or provider')}
  <div class="${CARD} p-5">${jobTable(rows)}</div>`;
    }

    /* The six moments a request passes through, dated. The same list the two
       apps show from their own side of the job. */
    const TIMELINE = [
      { key: 'searching', label: 'Request raised' },
      { key: 'assigned', label: 'Provider assigned' },
      { key: 'enroute', label: 'On the way' },
      { key: 'arrived', label: 'Arrived' },
      { key: 'completed', label: 'Completed' },
      { key: 'released', label: 'Payout released' },
    ];
    function timeline(j) {
      const at = j.cancel ? FLOW.indexOf(j.cancel.from) : FLOW.indexOf(j.status);
      const st = j.stamps || {};
      return TIMELINE.map((step, i) => {
        const done = at >= FLOW.indexOf(step.key), last = i === TIMELINE.length - 1;
        return `<div class="flex gap-3">
      <div class="flex flex-col items-center">
        <span class="w-[18px] h-[18px] rounded-full grid place-items-center shrink-0 ${done ? 'bg-brand text-white' : 'bg-line text-faint'}">${done ? ic('check', 10) : `<span class="w-1.5 h-1.5 rounded-full bg-white"></span>`}</span>
        ${last ? '' : `<span class="w-px flex-1 ${done && at > FLOW.indexOf(step.key) ? 'bg-brand' : 'bg-line'}" style="min-height:20px"></span>`}
      </div>
      <div class="min-w-0 flex-1" style="padding-bottom:${last ? 0 : 8}px">
        <div class="text-[12.5px] font-semibold ${done ? 'text-ink' : 'text-slate2'} leading-tight">${step.label}</div>
        <div class="text-[11px] ${done ? 'text-slate2' : 'text-faint'} leading-tight" style="margin-top:2px">${st[step.key] ? stampText(st[step.key]) : 'Not yet'}</div>
      </div></div>`;
      }).join('') + (!j.cancel ? '' : `<div class="flex gap-3">
    <div class="flex flex-col items-center">
      <span class="w-[18px] h-[18px] rounded-full grid place-items-center shrink-0 bg-red-100 text-red-600">${ic('x', 10)}</span>
    </div>
    <div class="min-w-0 flex-1">
      <div class="text-[12.5px] font-semibold text-red-700 leading-tight">Cancelled by the ${j.cancel.by}</div>
      <div class="text-[11px] text-slate2 leading-tight" style="margin-top:2px">${j.cancel.name} · ${stampText(j.cancel.at)}</div>
      <div class="text-[12px] text-slate1 leading-relaxed mt-2 rounded-lg bg-paper px-3 py-2">${j.cancel.reason}</div>
    </div></div>`);
    }

    const detailRow = (l, v) => `<div class="flex justify-between gap-4 py-2.5 border-b border-line last:border-0">
    <span class="text-[12.5px] text-slate2 shrink-0">${l}</span>
    <span class="text-[13px] font-semibold text-ink text-right">${v}</span></div>`;

    function requestDetail(id) {
      const j = JOBS.find(x => x.id === id); if (!j) return '';
      const p = j.provider ? provOf(j.provider) : null;
      return `<div class="grid grid-cols-3 gap-5">
    <div class="col-span-2 space-y-5">
      <div class="${CARD} p-5">
        <div class="flex items-center gap-3 mb-4">
          <span class="w-11 h-11 rounded-xl grid place-items-center bg-brand/10 text-brand shrink-0">${ic(svcOf(j.service).ic, 21)}</span>
          <div class="min-w-0 flex-1">
            <div class="font-bold text-ink text-[16px]">${svcLabel(j)}</div>
            <div class="text-[12px] text-slate2">Raised ${stampText(j.stamps.searching)}</div>
          </div>
          ${pill(j.status)}
        </div>
        <div class="grid grid-cols-2 gap-x-8">
          <div>
            ${detailRow('Customer', j.customer)}
            ${detailRow('Phone', j.phone)}
            ${detailRow('Location', j.address)}
          </div>
          <div>
            ${detailRow('Vehicle', j.make + ' ' + j.model)}
            ${detailRow('Licence plate', j.plate)}
            ${detailRow('Provider', p ? p.name : '<span class="text-faint">Unassigned</span>')}
          </div>
        </div>
        <div class="mt-4 pt-4 border-t border-line">
          <div class="text-[12.5px] text-slate2 mb-1">Reported issue</div>
          <p class="text-[13px] text-ink leading-relaxed">${j.note}</p>
        </div>
      </div>

      <div class="${CARD} p-5">
        <h2 class="font-bold text-ink text-[15px] mb-4">Settlement</h2>
        <!-- The bill line by line, with who put each line there. Lines the
             customer declined stay on the record struck through: a claim that
             was made and refused is a fact about the job, and deleting it would
             leave the provider's and the customer's accounts disagreeing. -->
        <div class="mb-3">
          ${(j.items || []).map(i => `<div class="flex items-center gap-3 py-2 border-b border-line last:border-0 ${i.rejected ? 'opacity-50' : ''}">
            <span class="min-w-0 flex-1">
              <span class="text-[13px] text-ink ${i.rejected ? 'line-through' : ''}">${i.label}</span>
              <span class="block text-[11px] text-slate2">${i.by === 'provider' ? 'Added by the provider' : 'Requested by the customer'}${i.rejected ? ' · declined by the customer' : ''}</span>
            </span>
            <b class="text-[13px] text-ink shrink-0 ${i.rejected ? 'line-through' : ''}">${money(i.amount)}</b>
          </div>`).join('')}
        </div>
        <div class="grid grid-cols-2 gap-x-8">
          <div>
            ${detailRow('Customer paid', money(j.fare.total))}
            ${detailRow(`Commission · ${Math.round(COMMISSION * 100)}%`, money(cutOf(j.fare.total)))}
          </div>
          <div>
            ${detailRow('Provider payout', money(netOf(j.fare.total)))}
            ${detailRow('Released', j.status === 'released' ? stampText(j.stamps.released) : '<span class="text-faint">Not yet</span>')}
          </div>
        </div>
        ${j.status === 'paid' ? `<button data-act="release" data-id="${j.id}" class="${BTN} mt-5">${ic('wallet', 17)} Release ${money(netOf(j.fare.total))} to ${p.name}</button>`
          : `<p class="text-[12px] text-slate2 mt-4">${j.status === 'released' ? 'This payout has been released to the provider.'
            : j.status === 'cancelled' ? 'The request was cancelled, so nothing was charged and nothing is owed. Whether a cancellation fee applies is a commercial rule still to be set.'
              : 'Nothing to release until the customer has paid.'}</p>`}
      </div>
    </div>

    <div class="space-y-5">
      <div class="${CARD} p-5">
        <h2 class="font-bold text-ink text-[15px] mb-4">Progress</h2>
        ${timeline(j)}
      </div>
      ${p ? `<div class="${CARD} p-5">
        <h2 class="font-bold text-ink text-[15px] mb-3">Provider</h2>
        <button data-prov="${p.id}" class="w-full flex items-center gap-3 text-left">
          <span class="w-10 h-10 rounded-lg bg-ink text-white grid place-items-center font-bold text-[13px] shrink-0">${p.name.split(' ').map(w => w[0]).join('')}</span>
          <span class="min-w-0 flex-1"><span class="block text-[13.5px] font-bold text-ink truncate">${p.name}</span>
            <span class="block text-[11.5px] text-slate2 truncate">${p.vehicle}</span></span>
          ${ic('chev-left', 15, 'rotate-180 text-faint shrink-0')}</button>
      </div>` : ''}
    </div>
  </div>`;
    }

    /* ================= PROVIDERS ================= */
    function providerRows() {
      const q = S.provq.trim().toLowerCase();
      return PROVIDERS.slice()
        .sort((x, y) => (x.verified === y.verified) ? 0 : x.verified ? 1 : -1)
        .filter(p => !q || [p.name, p.email, p.phone].some(v => String(v).toLowerCase().includes(q)));
    }
    const provStatus = p => !p.verified
      ? `<span class="inline-block text-[11px] font-bold px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 whitespace-nowrap">Awaiting verification</span>`
      : p.blocked
        ? `<span class="inline-block text-[11px] font-bold px-2.5 py-1 rounded-full bg-red-50 text-red-700">Blocked</span>`
        : `<span class="inline-block text-[11px] font-bold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700">Verified</span>`;

    /* Actions differ by where the provider stands. An approved account can be
       blocked — a reversible pause that stops work being routed to them — or
       deleted outright. One still waiting is approved, rejected, or deleted;
       there is nothing to pause. */
    /* Three labelled buttons would not sit on one line beside a status pill that
       reads "Awaiting verification", so they wrapped and broke the row. The
       destructive and reversible actions become square icon buttons — labelled
       for screen readers and on hover — and only the one an administrator is
       actually here to press keeps its words. */
    const actBtn = (a2, id, label, icon, tone) => `<button data-act="${a2}" data-id="${id}"
    class="inline-flex items-center gap-1.5 rounded-lg px-2.5 h-8 text-[12px] font-bold border transition whitespace-nowrap ${tone}">${ic(icon, 13)} ${label}</button>`;
    const iconBtn = (a2, id, label, icon, tone) => `<button data-act="${a2}" data-id="${id}" title="${label}" aria-label="${label}"
    class="w-8 h-8 grid place-items-center rounded-lg border transition shrink-0 ${tone}">${ic(icon, 14)}</button>`;
    function provActions(p) {
      const del = iconBtn('delete-prov', p.id, 'Delete', 'trash', 'bg-white text-red-600 border-line hover:bg-red-50');
      if (!p.verified) return `<div class="flex items-center gap-1.5 justify-end whitespace-nowrap">
      ${actBtn('approve', p.id, 'Approve', 'check', 'bg-brand text-white border-brand hover:opacity-90')}
      ${iconBtn('reject', p.id, 'Reject', 'x', 'bg-white text-slate1 border-line hover:bg-paper')}
      ${del}
    </div>`;
      return `<div class="flex items-center gap-1.5 justify-end whitespace-nowrap">
      ${p.blocked
          ? actBtn('unblock', p.id, 'Unblock', 'check', 'bg-white text-emerald-700 border-line hover:bg-emerald-50')
          : actBtn('block', p.id, 'Block', 'ban', 'bg-white text-slate1 border-line hover:bg-paper')}
      ${del}
    </div>`;
    }

    function providersPage() {
      const rows = providerRows(), nPend = pending().length;
      return `${nPend ? `<div class="rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 mb-4 flex items-center gap-2.5">
    <span class="text-amber-700 shrink-0">${ic('alert', 17)}</span>
    <span class="text-[13px] text-amber-800"><b>${nPend} provider${nPend !== 1 ? 's are' : ' is'} waiting to be verified.</b>
      Until approved they cannot go online or receive requests.</span></div>` : ''}
  <div class="${CARD} p-3 mb-4 flex items-center gap-2.5">
    <div class="flex items-center border border-line rounded-lg px-3 bg-white focus-within:border-brand transition" style="min-width:320px">
      ${ic('search', 16, 'text-faint shrink-0')}
      <input data-provq value="${esc(S.provq)}" placeholder="Search by name, email or phone"
        class="flex-1 min-w-0 py-2 px-2.5 text-[13px] bg-transparent outline-none text-ink">
    </div>
    <span class="ml-auto text-[12.5px] text-slate2">${rows.length} provider${rows.length !== 1 ? 's' : ''}</span>
  </div>
  <div class="${CARD} p-5">
    ${rows.length ? `<table class="tbl">
      <thead><tr><th>Provider</th><th>Joined</th><th>Status</th><th>Availability</th><th class="text-right">Jobs</th><th class="text-right">Actions</th></tr></thead>
      <tbody>${rows.map(p => {
        const n = JOBS.filter(j => j.provider === p.id).length;
        return `<tr data-prov="${p.id}">
        <td>
          <div class="flex items-center gap-2.5">
            <span class="w-8 h-8 rounded-lg bg-ink text-white grid place-items-center font-bold text-[11.5px] shrink-0">${p.name.split(' ').map(w => w[0]).join('')}</span>
            <!-- Email and phone stacked rather than run together. On one line
                 this cell alone ran to ~250px and pushed the table past the
                 edge of its card, taking the action buttons with it. -->
            <div class="min-w-0"><div class="font-bold text-ink whitespace-nowrap">${p.name}</div>
              <div class="text-[11.5px] text-slate2 whitespace-nowrap">${p.email}</div>
              <div class="text-[11.5px] text-slate2 whitespace-nowrap">${p.phone}</div></div>
          </div>
        </td>
        <td class="text-slate1 whitespace-nowrap">${dateText(p.since)}</td>
        <td>${provStatus(p)}</td>
        <td class="whitespace-nowrap">${p.verified && !p.blocked ? `<span class="inline-flex items-center gap-1.5 text-[12.5px] font-semibold ${p.online ? 'text-emerald-700' : 'text-slate2'}">
          <span class="w-1.5 h-1.5 rounded-full ${p.online ? 'bg-emerald-500' : 'bg-slate2'}"></span>${p.online ? 'Online' : 'Offline'}</span>` : '<span class="text-faint text-[12.5px]">—</span>'}</td>
        <td class="text-right font-semibold text-ink">${n}</td>
        <td data-stop class="text-right whitespace-nowrap" style="width:1%">${provActions(p)}</td>
      </tr>`;
      }).join('')}</tbody>
    </table>` : `<p class="text-[13px] text-slate2 text-center py-10">No providers match that search.</p>`}
  </div>`;
    }

    function providerDetail(id) {
      const p = provOf(id); if (!p) return '';
      const mine = JOBS.filter(j => j.provider === p.id);
      const earned = mine.filter(j => j.status === 'released').reduce((t, j) => t + netOf(j.fare.total), 0);
      return `<div class="grid grid-cols-3 gap-5">
    <div class="col-span-2 space-y-5">
      <div class="${CARD} p-5">
        <div class="flex items-center gap-4">
          <span class="w-14 h-14 rounded-xl bg-ink text-white grid place-items-center font-bold text-[18px] shrink-0">${p.name.split(' ').map(w => w[0]).join('')}</span>
          <div class="min-w-0 flex-1">
            <div class="font-bold text-ink text-[18px]">${p.name}</div>
            <div class="text-[12.5px] text-slate2 mt-0.5">Applied ${dateText(p.since)}</div>
          </div>
          ${provStatus(p)}
        </div>
        <div class="grid grid-cols-2 gap-x-8 mt-4 pt-4 border-t border-line">
          <div>
            ${detailRow('Email', p.email)}
            ${detailRow('Phone', p.phone)}
          </div>
          <div>
            ${detailRow('Vehicle', p.vehicle)}
            ${detailRow('Plate', p.plate)}
          </div>
        </div>
      </div>

      ${!p.verified ? `<div class="${CARD} p-5">
        <h2 class="font-bold text-ink text-[15px]">Verification</h2>
        <p class="text-[13px] text-slate1 leading-relaxed mt-2">Approving opens the account: the provider can go online and
          jobs will be routed to them. Rejecting leaves the account closed and notifies them. Deleting removes the
          application altogether.</p>
        <div class="flex gap-3 mt-4">
          <button data-act="approve" data-id="${p.id}" class="${BTN}" style="width:auto;flex:1">${ic('check', 17)} Approve provider</button>
          <button data-act="reject" data-id="${p.id}" class="${BTN2}">${ic('x', 16)} Reject</button>
          <button data-act="delete-prov" data-id="${p.id}" class="${BTN2} text-red-600">${ic('trash', 16)} Delete</button>
        </div>
      </div>` : `<div class="${CARD} p-5">
        <div class="flex items-center gap-3 mb-3">
          <h2 class="font-bold text-ink text-[15px] flex-1">Jobs</h2>
          ${provActions(p)}
        </div>
        ${mine.length ? jobTable(mine.slice().reverse(), true) : `<p class="text-[13px] text-slate2 text-center py-8">No jobs yet.</p>`}
      </div>`}
    </div>

    <div class="space-y-4">
      ${statCard('Paid out', money(earned), 'After commission', 'wallet')}
      ${statCard('Jobs taken', mine.length, p.verified ? 'Since joining' : 'Not yet active', 'list', 'bg-blue-50 text-blue-700')}
    </div>
  </div>`;
    }

    /* ================= PAYOUTS ================= */
    function payoutRows() {
      const base = (S.payTab === 'released' ? settledJobs() : awaitingRelease()).slice().reverse();
      return base.filter(j => matchesFilter(j, S.payf));
    }
    function payoutsPage() {
      const pend = awaitingRelease();
      const rows = payoutRows();
      const tab = (k, label, n) => `<button data-paytab="${k}" class="px-4 py-2 rounded-lg text-[12.5px] font-bold border transition ${S.payTab === k ? 'bg-ink text-white border-ink' : 'bg-white text-slate1 border-line hover:bg-paper'}">${label}${n ? ` · ${n}` : ''}</button>`;
      return `<div class="grid grid-cols-3 gap-4 mb-6">
    ${statCard('Awaiting payment', money(pend.reduce((t, j) => t + j.fare.total, 0)), `${pend.length} job${pend.length !== 1 ? 's' : ''} yet to be paid`, 'clock', 'bg-amber-50 text-amber-700')}
    ${statCard('Owed to providers', money(pend.reduce((t, j) => t + netOf(j.fare.total), 0)), 'After commission', 'wallet')}
    ${statCard('Commission earned', money(commissionEarned()), `${Math.round(COMMISSION * 100)}% of ${money(grossProcessed())} processed`, 'shield', 'bg-blue-50 text-blue-700')}
  </div>

  <div class="flex items-center gap-2 mb-4">
    ${tab('pending', 'Awaiting payment', pend.length)}${tab('released', 'Paid', settledJobs().length)}
    <span class="ml-auto text-[12.5px] text-slate2">${rows.length} payout${rows.length !== 1 ? 's' : ''}</span>
  </div>

  ${filterBar('payf', 'Search by request ID, customer or provider')}

  <div class="${CARD} p-5">
    ${rows.length ? `<table class="tbl">
    <thead><tr><th>Request</th><th>Service</th><th>Provider</th><th>Customer paid</th><th>Commission</th><th>Payout</th><th class="text-right">${S.payTab === 'released' ? 'Paid on' : 'Raised'}</th></tr></thead>
    <tbody>${rows.map(j => `<tr data-job="${j.id}">
      <td class="font-bold text-ink whitespace-nowrap">${j.id}</td>
      <td>${svcCell(j)}</td>
      <td class="text-slate1 whitespace-nowrap">${provOf(j.provider).name}</td>
      <td class="whitespace-nowrap">${money(j.fare.total)}</td>
      <td class="text-slate1 whitespace-nowrap">${money(cutOf(j.fare.total))}</td>
      <td class="font-bold text-ink whitespace-nowrap">${money(netOf(j.fare.total))}</td>
      <!-- No action here. Paying a provider is done on the request itself, where
           the whole job can be read first rather than settled from a row. -->
      <td class="text-right whitespace-nowrap text-[12px] text-slate2">${S.payTab === 'released'
          ? stampText(j.stamps.released)
          : stampText(j.stamps.completed || j.createdAt)}</td>
    </tr>`).join('')}</tbody></table>`
          : `<p class="text-[13px] text-slate2 text-center py-10">Nothing matches this view.</p>`}
  </div>`;
    }

    /* ================= SERVICES ================= */
    /* What each service costs. This is the only price on the platform now that
       travel is not charged, so it is the single number that decides what a
       customer pays and what a provider earns.

       Changing a price does not reach back into jobs already raised: every line
       on a bill records the amount it was charged at, so a request placed
       yesterday keeps yesterday's price. Only new work takes the new figure. */
    function servicesPage() {
      /* Each price is edited on its own. A single form over all six meant every
         visit ended in a save that touched every service, whether or not it had
         been changed — and one bad field blocked the rest. */
      const row = x => {
        const editing = S.editSvc === x.id;
        return `<tr>
      <td>
        <div class="flex items-center gap-2.5">
          <span class="w-9 h-9 rounded-xl grid place-items-center bg-brand/10 text-brand shrink-0">${ic(x.ic, 18)}</span>
          <span class="font-bold text-ink whitespace-nowrap">${x.name}</span>
        </div>
      </td>
      <td data-stop class="text-right" style="width:1%">
        ${editing ? `<div class="inline-flex items-center gap-1.5">
          <div class="inline-flex items-center border border-brand rounded-lg px-2.5 bg-white" style="width:110px">
            <span class="text-faint font-bold text-[13px] shrink-0">$</span>
            <input id="price-input" data-price="${x.id}" value="${x.base.toFixed(2)}" inputmode="decimal"
              class="w-full py-2 px-1.5 text-[13.5px] bg-transparent outline-none text-ink text-right">
          </div>
          <button data-act="save-price" data-id="${x.id}" title="Save" aria-label="Save"
            class="w-8 h-8 grid place-items-center rounded-lg bg-brand text-white shrink-0">${ic('check', 15)}</button>
          <button data-act="cancel-price" title="Cancel" aria-label="Cancel"
            class="w-8 h-8 grid place-items-center rounded-lg border border-line text-slate1 shrink-0 hover:bg-paper">${ic('x', 15)}</button>
        </div>`
            : `<div class="inline-flex items-center gap-2.5">
          <b class="text-ink text-[14px]">${money(x.base)}</b>
          <button data-act="edit-price" data-id="${x.id}" title="Edit ${x.name} fee" aria-label="Edit ${x.name} fee"
            class="w-8 h-8 grid place-items-center rounded-lg border border-line text-slate1 shrink-0 hover:bg-paper hover:text-brand transition">${ic('edit', 15)}</button>
        </div>`}
      </td>
    </tr>`;
      };
      return `<div class="${CARD} p-3 mb-4 flex items-start gap-2.5">
    <span class="text-brand shrink-0 mt-0.5">${ic('alert', 16)}</span>
    <p class="text-[12.5px] text-slate1 leading-relaxed">A new price applies to work raised from now on. Requests already
      placed keep the price they were quoted.</p>
  </div>
  <div class="${CARD} p-5">
    <div class="overflow-x-auto"><table class="tbl">
      <thead><tr><th>Service</th><th class="text-right">Service fee</th></tr></thead>
      <tbody>${SERVICES.map(row).join('')}</tbody>
    </table></div>
  </div>`;
    }

    /* ================= ACCOUNT ================= */
    /* Changing a password you already know is a different transaction from
       resetting one you have forgotten: it needs the current password rather
       than a code. The five rules are the same ones, from the same list. */
    function accountPage() {
      return `<div class="grid grid-cols-3 gap-5">
    <div class="col-span-2 space-y-5">
      <div class="${CARD} p-5">
        <h2 class="font-bold text-ink text-[15px]">Administrator</h2>
        <div class="mt-3">
          ${detailRow('Name', S.user.name)}
          ${detailRow('Role', S.user.role)}
          ${detailRow('Email', ADMIN.email)}
        </div>
      </div>

      <div class="${CARD} p-5">
        <h2 class="font-bold text-ink text-[15px]">Service allocation</h2>
        <p class="text-[12.5px] text-slate1 mt-1.5 mb-4">A request is offered to verified providers who are within this
          radius from the customer's vehicle location.</p>
        <div class="flex items-end gap-3" style="max-width:400px">
          <div class="flex-1">
            <label class="${LABEL}">Search radius</label>
            <div class="flex items-center border border-line rounded-xl px-4 bg-white focus-within:border-brand transition">
              <span class="text-faint shrink-0">${ic('pin', 17)}</span>
              <input id="s-radius" inputmode="decimal" value="${SETTINGS.radiusMiles}" class="flex-1 py-3 px-2.5 text-[14.5px] bg-transparent outline-none text-ink">
              <span class="text-slate2 text-[13.5px] font-semibold shrink-0">miles</span></div>
          </div>
          <button data-act="save-radius" class="inline-flex items-center justify-center gap-2 bg-brand text-white font-semibold rounded-xl px-5 h-[46px] shadow-btn active:scale-[.99] transition text-[14px]">${ic('check', 16)} Save</button>
        </div>
        <div class="flex gap-2 mt-3">
          ${[5, 10, 15, 25].map(m => `<button data-act="set-radius" data-id="${m}" class="px-3 py-1.5 rounded-lg text-[12.5px] font-bold border transition ${SETTINGS.radiusMiles === m ? 'bg-ink text-white border-ink' : 'bg-white text-slate1 border-line hover:bg-paper'}">${m} mi</button>`).join('')}
        </div>
      </div>

      <div class="${CARD} p-5">
        <h2 class="font-bold text-ink text-[15px]">Change password</h2>
        <p class="text-[12.5px] text-slate1 mt-1.5 mb-4">Confirm the password you use now, then choose a new one.</p>
        <div class="space-y-4" style="max-width:400px">
          <div><label class="${LABEL}">Current password</label>
            <div class="flex items-center border border-line rounded-xl px-4 bg-white focus-within:border-brand transition">
              <span class="text-faint shrink-0">${ic('lock', 17)}</span>
              <input id="c-cur" type="${S.reveal ? 'text' : 'password'}" autocomplete="current-password" class="flex-1 py-3 px-2.5 text-[14.5px] bg-transparent outline-none text-ink">
              <button data-act="reveal" aria-label="Show passwords" class="text-faint shrink-0 hover:text-slate1">${ic(S.reveal ? 'eye-off' : 'eye', 17)}</button></div></div>
          <div><label class="${LABEL}">New password</label>
            <div class="flex items-center border border-line rounded-xl px-4 bg-white focus-within:border-brand transition">
              <span class="text-faint shrink-0">${ic('lock', 17)}</span>
              <input id="r-pass" type="${S.reveal ? 'text' : 'password'}" autocomplete="new-password" class="flex-1 py-3 px-2.5 text-[14.5px] bg-transparent outline-none text-ink"></div></div>
          <div><label class="${LABEL}">Confirm new password</label>
            <div class="flex items-center border border-line rounded-xl px-4 bg-white focus-within:border-brand transition">
              <span class="text-faint shrink-0">${ic('lock', 17)}</span>
              <input id="r-pass2" type="${S.reveal ? 'text' : 'password'}" autocomplete="new-password" class="flex-1 py-3 px-2.5 text-[14.5px] bg-transparent outline-none text-ink"></div>
            <div id="match-note" class="text-[12px] mt-1.5"></div></div>
        </div>
        <button data-act="change-password" class="${BTN} mt-5" style="max-width:400px">${ic('check', 17)} Update password</button>
      </div>
    </div>
    <div>
      <div class="${CARD} p-5">
        <h2 class="font-bold text-ink text-[15px] mb-3">Password rules</h2>
        <div class="space-y-2" id="rule-list">${ruleList('')}</div>
      </div>
    </div>
  </div>`;
    }

    /* ================= ACTIONS ================= */
    function releasePayout(id) {
      const j = JOBS.find(x => x.id === id);
      if (!j || j.status !== 'paid') return;
      j.status = 'released';
      j.stamps.released = new Date().toISOString();
      render();
      toast(`${money(netOf(j.fare.total))} released to ${provOf(j.provider).name}`, 'wallet');
    }
    function setVerified(id, ok) {
      const p = provOf(id); if (!p) return;
      if (ok) { p.verified = true; p.blocked = false; toast(p.name + ' approved', 'check'); }
      else { PROVIDERS = PROVIDERS.filter(x => x.id !== id); S.provId = null; toast(p.name + ' rejected', 'x'); }
      render();
    }
    /* Blocking is reversible and keeps the record; deleting is not and does not.
       They are deliberately different weights of the same idea. */
    function setBlocked(id, on) {
      const p = provOf(id); if (!p) return;
      p.blocked = on;
      if (on) p.online = false;
      render();
      toast(p.name + (on ? ' blocked' : ' unblocked'), on ? 'ban' : 'check');
    }
    function deleteProvider(id) {
      const p = provOf(id); if (!p) return;
      PROVIDERS = PROVIDERS.filter(x => x.id !== id);
      if (S.provId === id) S.provId = null;
      render();
      toast(p.name + ' deleted', 'trash');
    }

    /* ================= EVENTS ================= */
    document.addEventListener('click', e => {
      const t = e.target;
      const act = t.closest('[data-act]'), tab = t.closest('[data-tab]');
      const job = t.closest('[data-job]'), prov = t.closest('[data-prov]');
      const rf = t.closest('[data-reqfilter]'), pt = t.closest('[data-paytab]');
      const scr = t.closest('[data-scr]'), restart = t.closest('#btn-restart');

      if (restart) { goScreen('login'); return; }
      if (scr) { goScreen(scr.dataset.scr); return; }

      if (act) {
        const a = act.dataset.act, id = act.dataset.id;
        switch (a) {
          case 'reveal': S.reveal = !S.reveal; render(); break;
          case 'login': {
            const em = (el('l-email') || {}).value || '', pw = (el('l-pass') || {}).value || '';
            if (!validEmail(em)) { toast('Enter a valid email', 'alert'); return; }
            if (!pw) { toast('Enter your password', 'alert'); return; }
            if (em.trim().toLowerCase() !== ADMIN.email || pw !== ADMIN.password) {
              toast('Those credentials are not recognised', 'alert'); return;
            }
            S.user = { name: ADMIN.name, role: ADMIN.role };
            S.screen = 'app'; S.tab = 'dashboard'; S.jobId = null; S.provId = null;
            render(); scrollTop(); toast('Signed in', 'check'); break;
          }
          /* No "which email?" step. There is one administrator account and the
             platform already knows its address, so asking for it would be
             asking the reader to tell us something we just told them. */
          case 'go-forgot': {
            S.forgotEmail = ADMIN.email;
            S.screen = 'code'; stopResend(); render();
            setTimeout(() => { const f = document.querySelector('.otp'); if (f) f.focus(); }, 60);
            toast('Code sent to ' + ADMIN.email, 'mail'); break;
          }
          case 'back-login': stopResend(); S.screen = 'login'; render(); break;
          case 'resend': clearOtp(); startResend(); toast('New code sent to ' + S.forgotEmail, 'refresh'); break;
          case 'save-password': {
            const p1 = (el('r-pass') || {}).value || '', p2 = (el('r-pass2') || {}).value || '';
            if (!rulesMet(p1)) { toast('The password does not meet all five rules', 'alert'); return; }
            if (p1 !== p2) { toast('The two passwords do not match', 'alert'); return; }
            ADMIN.password = p1;
            stopResend(); S.screen = 'done'; render();
            break;
          }
          case 'logout': S.user = null; S.screen = 'login'; S.reveal = false; render(); break;
          case 'back': { if (S.jobId) S.jobId = null; else S.provId = null; render(); scrollTop(); break; }
          case 'release': releasePayout(id); break;
          case 'approve': setVerified(id, true); break;
          case 'reject': setVerified(id, false); break;
          case 'block': setBlocked(id, true); break;
          case 'unblock': setBlocked(id, false); break;
          case 'delete-prov': deleteProvider(id); break;
          case 'clear-filter': S[id] = blankFilter(); render(); break;
          case 'edit-price': S.editSvc = id; render(); focusPrice(); break;
          case 'cancel-price': S.editSvc = null; render(); break;
          case 'save-price': {
            const x = svcOf(id);
            const v = parseFloat((el('price-input') || {}).value || '');
            if (!(v > 0)) { toast('Enter a price for ' + x.name, 'alert'); return; }
            if (v > 9999) { toast('That price looks wrong', 'alert'); return; }
            const next = Math.round(v * 100) / 100;
            const changed = x.base !== next;
            x.base = next; S.editSvc = null; render();
            toast(changed ? x.name + ' set to ' + money(next) : 'No change to save', changed ? 'check' : 'alert');
            break;
          }
          case 'set-radius': SETTINGS.radiusMiles = +id; render(); toast('Radius set to ' + id + ' miles', 'pin'); break;
          case 'save-radius': {
            const v = parseFloat((el('s-radius') || {}).value || '');
            if (!(v > 0)) { toast('Enter a radius in miles', 'alert'); return; }
            if (v > 100) { toast('100 miles is the maximum', 'alert'); return; }
            SETTINGS.radiusMiles = Math.round(v * 10) / 10;
            render(); toast('Radius set to ' + SETTINGS.radiusMiles + ' miles', 'pin'); break;
          }
          case 'change-password': {
            const cur = (el('c-cur') || {}).value || '', p1 = (el('r-pass') || {}).value || '', p2 = (el('r-pass2') || {}).value || '';
            if (cur !== ADMIN.password) { toast('That is not your current password', 'alert'); return; }
            if (!rulesMet(p1)) { toast('The new password does not meet all five rules', 'alert'); return; }
            if (p1 === cur) { toast('Choose a password you have not used', 'alert'); return; }
            if (p1 !== p2) { toast('The two passwords do not match', 'alert'); return; }
            ADMIN.password = p1;
            render();
            toast('Password updated', 'check'); break;
          }
        }
        return;
      }
      // Buttons inside a table cell act on the row without opening it.
      if (t.closest('[data-stop]')) return;
      if (tab) { S.tab = tab.dataset.tab; S.jobId = null; S.provId = null; S.editSvc = null; render(); scrollTop(); return; }
      if (job) { S.jobId = job.dataset.job; S.provId = null; render(); scrollTop(); return; }
      if (prov) { S.provId = prov.dataset.prov; S.jobId = null; render(); scrollTop(); return; }
      if (rf) { S.reqFilter = rf.dataset.reqfilter; render(); return; }
      if (pt) { S.payTab = pt.dataset.paytab; render(); return; }
    });

    /* OTP: digits only, auto-advance, and the fourth digit submits. Any four are
       accepted — no code was really sent, and refusing what was never issued
       teaches the reader a password rather than the flow. */
    document.addEventListener('input', e => {
      if (e.target.classList && e.target.classList.contains('otp')) {
        e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 1);
        const boxes = [...document.querySelectorAll('.otp')];
        if (e.target.value) { const i = +e.target.dataset.i; if (boxes[i + 1]) boxes[i + 1].focus(); else e.target.blur(); }
        if (boxes.every(b => b.value)) {
          setTimeout(() => {
            if (readCode().length < 4) return;
            stopResend(); S.screen = 'reset'; render();
            setTimeout(() => { const f = el('r-pass'); if (f) f.focus(); }, 60);
          }, 180);
        }
        return;
      }
      /* Filter fields write straight to state and redraw. The text boxes put the
         caret back where it was, since a list that narrows as you type is worth
         having and losing your place mid-word is not. */
      const fscope = e.target.dataset && e.target.dataset.filter;
      if (fscope) {
        S[fscope][e.target.dataset.key] = e.target.value;
        const id = e.target.dataset.key, pos = e.target.selectionStart;
        render();
        const again = document.querySelector(`[data-filter="${fscope}"][data-key="${id}"]`);
        if (again && id === 'q') { again.focus(); try { again.setSelectionRange(pos, pos); } catch (x) { } }
        return;
      }
      if (e.target.dataset && e.target.dataset.provq !== undefined) {
        S.provq = e.target.value;
        const pos = e.target.selectionStart;
        render();
        const again = document.querySelector('[data-provq]');
        if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (x) { } }
        return;
      }
      // The rule list ticks off as the password is typed. Patched in place, or
      // the field would lose focus on every keystroke.
      if (e.target.id === 'r-pass' || e.target.id === 'r-pass2' || e.target.id === 'c-cur') {
        const p1 = (el('r-pass') || {}).value || '', p2 = (el('r-pass2') || {}).value || '';
        const list = el('rule-list'); if (list) list.innerHTML = ruleList(p1);
        const note = el('match-note');
        if (note) {
          note.innerHTML = !p2 ? '' : p1 === p2
            ? `<span class="text-emerald-700 font-semibold">Passwords match</span>`
            : `<span class="text-red-600 font-semibold">Passwords do not match</span>`;
        }
      }
    });
    document.addEventListener('keydown', e => {
      if (e.target.classList && e.target.classList.contains('otp') && e.key === 'Backspace' && !e.target.value) {
        const boxes = [...document.querySelectorAll('.otp')]; const i = +e.target.dataset.i;
        if (boxes[i - 1]) boxes[i - 1].focus();
      }
    });

    /* ================= PRESENTER ================= */
    const VIEW = { w: 1280, h: 800 };
    function buildWindow() {
      el('win').innerHTML = `<div class="browser" style="width:${VIEW.w}px">
    <div class="br-bar">
      <span class="br-dot" style="background:#FF5F57"></span>
      <span class="br-dot" style="background:#FEBC2E"></span>
      <span class="br-dot" style="background:#28C840"></span>
      <div class="br-url"><svg class="icon" width="12" height="12" style="stroke-width:2.4"><use href="#i-lock"/></svg>admin.myverichain.com</div>
    </div>
    <div id="viewport" class="viewport" style="height:${VIEW.h}px"></div>
    <div id="toast-root"></div>
  </div>`;
      render(); fitWindow();
    }
    function fitWindow() {
      const w = el('win'), wrap = el('win-wrap');
      if (!w || !wrap) return;
      const availW = wrap.clientWidth - 20, availH = wrap.clientHeight - 20;
      if (availW <= 0) { w.style.transform = 'none'; return; }
      const W = VIEW.w, H = VIEW.h + 44;
      const stacked = matchMedia('(min-width:561px) and (max-width:1180px)').matches;
      let s = Math.min(1, availW / W, availH > 0 && !stacked ? availH / H : 1);
      s = Math.max(0.3, s);
      w.style.transform = `scale(${s})`;
      wrap.style.minHeight = stacked ? Math.ceil(H * s + 16) + 'px' : '';
      el('win-caption').textContent = `Desktop · ${VIEW.w} × ${VIEW.h} · ${Math.round(s * 100)}%`;
    }
    window.addEventListener('resize', fitWindow);

    /* ---- screen index ---- */
    const IDX = [
      { g: 'Getting in', items: [['login', 'Sign in'], ['code', 'Verify code'], ['reset', 'New password'], ['done', 'Password updated']] },
      { g: 'Running the platform', items: [['dashboard', 'Dashboard'], ['requests', 'Requests'], ['request', 'Request detail'], ['payouts', 'Payouts'], ['released', 'Released payouts']] },
      { g: 'Providers', items: [['providers', 'Providers'], ['provider', 'Provider detail'], ['verify', 'Verify a provider']] },
      { g: 'Account', items: [['services', 'Services and prices'], ['account', 'Change password']] },
    ];
    function buildIndex() {
      el('screen-index').innerHTML = IDX.map(s =>
        `<div class="grp">${s.g}</div><div class="pn-chips">${s.items.map(i => `<button class="chip" data-scr="${i[0]}">${i[1]}</button>`).join('')}</div>`).join('');
    }

    const signedIn = () => { S.user = { name: ADMIN.name, role: ADMIN.role }; S.screen = 'app'; S.jobId = null; S.provId = null; };
    const NAV = {
      login: () => { S.user = null; S.screen = 'login'; S.reveal = false; },
      code: () => { S.user = null; S.screen = 'code'; S.forgotEmail = ADMIN.email; },
      reset: () => { S.user = null; S.screen = 'reset'; S.reveal = false; },
      done: () => { S.user = null; S.screen = 'done'; },

      dashboard: () => { signedIn(); S.tab = 'dashboard'; },
      requests: () => { signedIn(); S.tab = 'requests'; S.reqFilter = 'all'; },
      request: () => { signedIn(); S.tab = 'requests'; S.jobId = 'VAT-1042'; },
      payouts: () => { signedIn(); S.tab = 'payouts'; S.payTab = 'pending'; },
      released: () => { signedIn(); S.tab = 'payouts'; S.payTab = 'released'; },
      providers: () => { signedIn(); S.tab = 'providers'; },
      provider: () => { signedIn(); S.tab = 'providers'; S.provId = 'p1'; },
      verify: () => { signedIn(); S.tab = 'providers'; S.provId = (pending()[0] || PROVIDERS[0]).id; },
      services: () => { signedIn(); S.tab = 'services'; S.editSvc = null; },
      account: () => { signedIn(); S.tab = 'account'; S.reveal = false; },
    };
    function goScreen(k) {
      stopResend();
      if (NAV[k]) NAV[k]();
      render(); scrollTop();
    }
    function currentKey() {
      if (S.screen !== 'app') return S.screen;
      if (S.jobId) return 'request';
      if (S.provId) return provOf(S.provId) && !provOf(S.provId).verified ? 'verify' : 'provider';
      if (S.tab === 'payouts') return S.payTab === 'released' ? 'released' : 'payouts';
      return S.tab;
    }
    function syncIndex() {
      const k = currentKey();
      document.querySelectorAll('#screen-index .chip').forEach(c => c.classList.toggle('on', c.dataset.scr === k));
    }

    /* ---- boot ---- */
    el('pn-logo').src = ART.lockLight;
    buildIndex();
    buildWindow();
  </script>
</body>

</html>
