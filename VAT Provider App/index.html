            if (!validPhone(a2.phone)) { toast('That phone number does not look right', 'alert'); return; }
            sendCode(a2.email.trim(), 'email'); break;
          }
          case 'login-next': {
            readAuthFields();
            const a3 = S.auth, byEmail = a3.method === 'email';
            if (byEmail) {
              if (!a3.email.trim()) { toast('Enter your email', 'alert'); return; }
              if (!validEmail(a3.email)) { toast('That email does not look right', 'alert'); return; }
              sendCode(a3.email.trim(), 'code');
            } else {
              if (!a3.phone.trim()) { toast('Enter your phone number', 'alert'); return; }
              if (!validPhone(a3.phone)) { toast('That phone number does not look right', 'alert'); return; }
              sendCode(fullPhone(a3), 'code');
            }
            break;
          }
          // Resending kills the old code, so anything already typed goes with it.
          case 'resend': clearOtp(); startResend(); toast('New code sent to ' + S.auth.target, 'refresh'); break;

          case 'go-back': goBack(); break;
          case 'close-sheet': closeSheet(); break;
          case 'advance-job': advanceJob(id); break;
          case 'add-work': { const j = jobById(id); if (j) addWorkSheet(j); break; }
          case 'cancel-job': { const j = jobById(id); if (j) cancelSheet(j); break; }
          case 'drop-line': {
            const j = jobById(act.dataset.job); if (!j) break;
            const line = (j.items || []).find(i => i.id === id); if (!line || line.by !== 'provider') break;
            // Never the last service on the job.
            if (line.kind === 'service' && (j.items || []).filter(i => i.kind === 'service' && !i.rejected).length < 2) {
              toast('A job needs at least one service', 'alert'); return;
            }
            j.items = j.items.filter(i => i.id !== line.id); syncFare(j);
            render(); toast('Removed', 'x'); break;
          }
          case 'confirm-cancel': {
            const j = jobById(id); if (!j) break;
            const reason = ((el('cx-reason') || {}).value || '').trim();
            if (!reason) { toast('Please give a reason', 'alert'); return; }
            if (!cancelJob(j, 'provider', userName(S.user), reason)) { closeSheet(); return; }
            closeSheet(); S.stack = [];
            render(); scrollTop();
            toast('Job cancelled', 'x'); break;
          }
          case 'toggle-work-pick': {
            S.pick = S.pick.includes(id) ? S.pick.filter(x => x !== id) : S.pick.concat(id);
            const j = jobById(act.dataset.job); if (j) paintWorkSheet(j);
            break;
          }
          case 'add-job-svc': {
            const j = jobById(act.dataset.job); if (!j || !S.pick.length) break;
            const n = S.pick.length;
            S.pick.forEach(x => j.items.push(svcLine(x, 'provider')));
            syncFare(j); S.pick = [];
            closeSheet(); render();
            toast(n > 1 ? n + ' services added' : 'Service added', 'check'); break;
          }
          case 'add-job-fee': {
            const j = jobById(act.dataset.job) || jobById(S.stack.length ? S.stack[S.stack.length - 1].id : null); if (!j) break;
            const label = ((el('w-label') || {}).value || '').trim();
            const amount = parseFloat((el('w-amount') || {}).value || '');
            if (!label) { toast('Say what the charge is for', 'alert'); return; }
            if (!(amount > 0)) { toast('Enter an amount', 'alert'); return; }
            j.items.push(customLine(label, amount, 'provider')); syncFare(j);
            closeSheet(); render();
            toast('Charge added', 'check'); break;
          }
          case 'accept-offer': acceptOffer(); break;
          case 'decline-offer': declineOffer(); break;
          case 'toggle-online': toggleOnline(); break;
          case 'clear-range': S.from = ''; S.to = ''; render(); break;
          case 'navigate': toast('Opening navigation…', 'nav'); break;
          case 'call': e.preventDefault(); toast('Calling…', 'phone'); break;

          case 'edit-profile': S.edit = Object.assign({}, S.user); openPage('editProfile'); break;
          case 'save-profile': saveProfile(); break;
          case 'delete-account': deleteAccountSheet(); break;
          case 'confirm-delete': {
            closeSheet();
            S.user = null; S.stack = []; S.jobId = null; S.screen = 'welcome';
            render(); toast('Account deleted', 'check'); break;
          }
          case 'logout': {
            clearInterval(resendTimer);
            S.user = null; S.stack = []; S.jobId = null; S.offer = null; S.screen = 'welcome';
            render(); break;
          }
        }
        return;
      }
      if (tab) { setTab(tab.dataset.tab); return; }
      if (pt) { S.payTab = pt.dataset.paytab; render(); return; }
      if (jo) { openPage('job', jo.dataset.jobopen); return; }
    });

    function readAuthFields() {
      const a = S.auth;
      const first = el('f-first'), last = el('f-last'), em = el('f-email'), ph = el('f-phone'),
        lg = el('f-login'), dl = el('f-dial');
      if (first) a.first = first.value;
      if (last) a.last = last.value;
      if (em) a.email = em.value;
      if (ph) a.phone = ph.value;
      if (dl) a.dial = dl.value;
      if (lg) { if (a.method === 'email') a.email = lg.value; else a.phone = lg.value; }
    }
    /* OTP boxes: digits only, auto-advance, auto-submit on the fourth. */
    /* The earnings date fields. A date picker fires `change`, not `click`, so
       these are read here rather than in the click handler. */
    document.addEventListener('change', e => {
      const f = e.target.dataset && e.target.dataset.erange;
      if (!f) return;
      S[f] = e.target.value;
      render();
    });

    document.addEventListener('input', e => {
      /* Card fields are groomed as they are typed: digits only, spaced in
         fours, and a slash dropped into the expiry after the month. Doing it
         here rather than on save means the field always looks like a card. */
      if (e.target.id === 'nc-num') {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 16).replace(/(.{4})/g, '$1 ').trim();
        return;
      }
      if (e.target.id === 'nc-exp') {
        const v = e.target.value.replace(/\D/g, '').slice(0, 4);
        e.target.value = v.length > 2 ? v.slice(0, 2) + '/' + v.slice(2) : v;
        return;
      }
      if (e.target.id === 'nc-cvv') { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); return; }
      // Suggestions narrow as the address is typed. Only the results list is
      // rewritten, so the caret stays where it was.
      if (e.target.id === 'loc-q') { const r = el('loc-results'); if (r) r.innerHTML = placeResults(e.target.value); return; }
      if (!e.target.classList || !e.target.classList.contains('otp')) return;
      e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 1);
      const boxes = [...document.querySelectorAll('.otp')];
      if (e.target.value) { const i = +e.target.dataset.i; if (boxes[i + 1]) boxes[i + 1].focus(); else e.target.blur(); }
      // The fourth digit submits. A short beat first so the last box is seen
      // to fill before the screen changes under it.
      if (boxes.every(b => b.value)) setTimeout(verifyCode, 180);
    });
    document.addEventListener('keydown', e => {
      if (e.target.classList && e.target.classList.contains('otp') && e.key === 'Backspace' && !e.target.value) {
        const boxes = [...document.querySelectorAll('.otp')]; const i = +e.target.dataset.i;
        if (boxes[i - 1]) boxes[i - 1].focus();
      }
    });

    /* ================= PRESENTER ================= */
    const DEVICES = [
      { id: 'ip15', name: 'iPhone 15 Pro', w: 393, h: 852, bez: 13, ro: 58, ri: 46, status: 54, island: true, home: true },
      { id: 'ipse', name: 'iPhone SE', w: 375, h: 667, bez: 11, bezV: 62, ro: 26, ri: 4, status: 22, home: false },
      { id: 'px8', name: 'Pixel 8', w: 412, h: 915, bez: 11, ro: 38, ri: 28, status: 36, punch: true, home: true },
    ];
    let CURDEV = DEVICES[0];
    const BARE = () => matchMedia('(max-width:560px), (pointer: coarse) and (max-height:560px)').matches;

    const SB = `<div class="sb-r">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect y="7.6" width="3" height="3.4" rx="1"/><rect x="4.7" y="5.4" width="3" height="5.6" rx="1"/><rect x="9.4" y="2.9" width="3" height="8.1" rx="1"/><rect x="14" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M1.4 4.3a10 10 0 0 1 13.2 0"/><path d="M3.9 7a6.3 6.3 0 0 1 8.2 0"/><path d="M6.4 9.6a2.7 2.7 0 0 1 3.2 0"/></svg>
    <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".6" y=".6" width="21" height="10.8" rx="3.4" stroke="currentColor" stroke-opacity=".4" stroke-width="1.1"/><rect x="2.3" y="2.3" width="15" height="7.4" rx="2.1" fill="currentColor"/><path d="M23.4 4.3c1 .5 1 2.9 0 3.4V4.3Z" fill="currentColor" fill-opacity=".45"/></svg>
  </div>`;

    function buildDevice() {
      const d = CURDEV, bare = BARE();
      const bezH = bare ? 0 : d.bez, bezV = bare ? 0 : (d.bezV || d.bez);
      const frame = bare
        ? `<div class="glass" style="width:100vw;height:100dvh;border-radius:0">__INNER__</div>`
        : `<div class="bezel" style="width:${d.w + bezH * 2}px;height:${d.h + bezV * 2}px;border-radius:${d.ro}px;padding:${bezV}px ${bezH}px">
        <div class="glass" style="width:${d.w}px;height:${d.h}px;border-radius:${d.ri}px">__INNER__</div></div>`;
      const inner = `${!bare && d.island ? '<div class="island"></div>' : ''}
    ${!bare && d.punch ? '<div class="island" style="width:12px;height:12px;top:12px;left:auto;right:18px;transform:none"></div>' : ''}
    <div class="statusbar" style="height:${bare ? 0 : d.status}px;${bare ? 'display:none' : ''}">
      <span>9:41</span>${SB}</div>
    <div id="app"></div>
    <div id="sheet-root"></div>
    <div id="toast-root"></div>
    ${!bare && d.home ? '<div class="homebar"></div>' : ''}`;
      el('device').innerHTML = frame.replace('__INNER__', inner);
      render(); fitDevice();
    }
    const STACKED = () => matchMedia('(min-width:561px) and (max-width:1080px)').matches;
    function fitDevice() {
      const dev = el('device'), wrap = el('device-wrap');
      if (!dev || !wrap) return;
      if (BARE()) { dev.style.transform = 'none'; dev.style.marginBottom = ''; wrap.style.minHeight = ''; el('dev-caption').textContent = ''; return; }
      const d = CURDEV, W = d.w + d.bez * 2, H = d.h + (d.bezV || d.bez) * 2;
      /* Guarded: before the wrapper has been laid out its client box reads 0,
         and dividing that through gave a negative scale that flipped the phone
         inside out. Nothing to measure means nothing to shrink. */
      const availW = wrap.clientWidth - 24, availH = wrap.clientHeight - 24;
      if (availW <= 0) { dev.style.transform = 'none'; return; }
      const byW = availW / W;
      let s = Math.min(1, byW, availH > 0 ? availH / H : 1);
      /* Stacked, height is no longer a constraint — the document scrolls — so
         the phone is sized to the width it has and kept above a floor rather
         than shrunk until it is unreadable. A transform does not affect layout,
         so the wrapper is told how tall the scaled phone actually is; without
         that the page would have nothing to scroll. */
      if (STACKED()) {
        s = Math.min(1, byW);
        wrap.style.minHeight = Math.ceil(H * s + 16) + 'px';
      } else wrap.style.minHeight = '';
      s = Math.max(0.25, s);
      dev.style.transform = `scale(${s})`;
      el('dev-caption').textContent = `${d.name} · ${d.w} × ${d.h} · ${Math.round(s * 100)}%`;
    }
    function buildChips() {
      el('dev-chips').innerHTML = DEVICES.map(d => `<button class="chip ${d.id === CURDEV.id ? 'on' : ''}" data-dev="${d.id}">${d.name}</button>`).join('');
    }

    /* ---- screen index ---- */
    const IDX = [
      { g: 'Getting in', items: [['splash', 'Splash'], ['welcome', 'Welcome'], ['signup', 'Sign up'], ['verify-email', 'Verify email'], ['verify-phone', 'Verify phone'], ['login', 'Log in'], ['login-code', 'Login code'], ['pending', 'Under review']] },
      { g: 'Working', items: [['d-jobs', 'Jobs'], ['d-offline', 'Offline'], ['d-offer', 'New offer'], ['d-request', 'Request detail'], ['d-accepted', 'Accepted'], ['d-enroute', 'On the way'], ['d-arrived', 'At the vehicle'], ['d-working', 'In progress'], ['d-done', 'Payout pending']] },
      { g: 'Money', items: [['d-earnings', 'Earnings'], ['d-paid', 'Paid out'], ['d-payout', 'Settled job']] },
      { g: 'Account', items: [['d-profile', 'Profile'], ['d-edit', 'Edit profile'], ['terms', 'Terms of Use'], ['privacy', 'Privacy Policy']] },
    ];
    function buildIndex() {
      el('screen-index').innerHTML = IDX.map(s =>
        `<div class="grp">${s.g}</div><div class="pn-chips">${s.items.map(i => `<button class="chip" data-scr="${i[0]}">${i[1]}</button>`).join('')}</div>`).join('');
    }

    /* Each entry stands its own state up rather than clicking through to it, so
       any screen can be reached directly and looked at. */
    const DEMO_USER = { first: 'Marcus', last: 'Hale', email: 'marcus@haletowing.com', phone: '201 555 0177', dial: 'us' };
    function signedIn() { S.screen = 'app'; S.user = Object.assign({}, DEMO_USER); S.tab = 'home'; S.stack = []; }
    /* Each index entry stands its own state up rather than clicking through to
       it, so any screen can be reached and looked at directly. Setting a job's
       status here does not advance anything — you are inspecting that moment. */
    /* Puts the offer back the way it started and clears any copy of it that was
       accepted earlier in the session, so the offer screens can be revisited. */
    function resetOffer() {
      const i = JOBS.findIndex(j => j.id === OFFER.id);
      if (i > -1) JOBS.splice(i, 1);
      OFFER.status = 'assigned'; OFFER.provider = null; OFFER.stamps = {};
      return OFFER;
    }
    function jobAt(status) {
      const j = JOBS.find(x => x.id === 'VAT-1043');
      j.status = status; j.provider = ME; S.jobId = j.id;
      // Jumping straight to a status has to bring its history with it, or the
      // timeline shows a completed job whose steps never happened.
      const base = new Date(j.createdAt).getTime();
      j.stamps = {};
      FLOW.slice(0, FLOW.indexOf(status) + 1)
        .filter(k => k !== 'searching')
        .forEach(k => { j.stamps[k] = new Date(base + STEP_AT[k] * MIN).toISOString(); });
      return j;
    }
    const authState2 = authState;
    const NAV = {
      splash: () => { S.screen = 'splash'; S.splashAuto = false; },
      welcome: () => { S.screen = 'welcome'; },
      signup: () => { S.screen = 'auth'; S.auth = authState({}); },
      login: () => { S.screen = 'auth'; S.auth = authState({ mode: 'login' }); },
      'verify-email': () => { S.screen = 'auth'; S.auth = authState({ step: 'email', first: 'Marcus', last: 'Hale', email: 'marcus@haletowing.com', phone: '201 555 0177', target: 'marcus@haletowing.com' }); },
      'verify-phone': () => { S.screen = 'auth'; S.auth = authState({ step: 'phone', first: 'Marcus', last: 'Hale', email: 'marcus@haletowing.com', phone: '201 555 0177', method: 'phone', target: '+1 201 555 0177', verified: { email: true } }); },
      'login-code': () => { S.screen = 'auth'; S.auth = authState({ mode: 'login', step: 'code', email: 'marcus@haletowing.com', target: 'marcus@haletowing.com' }); },
      pending: () => { S.user = null; S.screen = 'pending'; S.auth = authState({ verified: { email: true, phone: true } }); },

      'd-jobs': () => { signedIn(); S.online = true; S.offer = null; jobAt('enroute'); },
      'd-offline': () => { signedIn(); S.online = false; S.offer = null; jobAt('enroute'); },
      'd-offer': () => { signedIn(); S.online = true; S.offer = resetOffer(); jobAt('enroute'); },
      'd-request': () => { signedIn(); S.online = true; S.offer = resetOffer(); S.stack = [{ type: 'job', id: OFFER.id }]; },
      'd-accepted': () => { signedIn(); const j = jobAt('accepted'); S.stack = [{ type: 'job', id: j.id }]; },
      'd-enroute': () => { signedIn(); const j = jobAt('enroute'); S.stack = [{ type: 'job', id: j.id }]; },
      'd-arrived': () => { signedIn(); const j = jobAt('arrived'); S.stack = [{ type: 'job', id: j.id }]; },
      'd-working': () => { signedIn(); const j = jobAt('working'); S.stack = [{ type: 'job', id: j.id }]; },
      'd-done': () => { signedIn(); const j = jobAt('completed'); S.stack = [{ type: 'job', id: j.id }]; },

      'd-earnings': () => { signedIn(); S.tab = 'earnings'; S.payTab = 'pending'; },
      'd-paid': () => { signedIn(); S.tab = 'earnings'; S.payTab = 'paid'; },
      'd-payout': () => { signedIn(); S.tab = 'earnings'; S.stack = [{ type: 'job', id: 'VAT-1037' }]; },

      'd-profile': () => { signedIn(); S.tab = 'profile'; },
      'd-edit': () => { signedIn(); S.tab = 'profile'; S.edit = Object.assign({}, S.user); S.stack = [{ type: 'editProfile' }]; },
      terms: () => { signedIn(); S.tab = 'profile'; S.legal = 'terms'; S.legalBack = 'app'; S.screen = 'legal'; },
      privacy: () => { signedIn(); S.tab = 'profile'; S.legal = 'privacy'; S.legalBack = 'app'; S.screen = 'legal'; },
    };
    function goScreen(k) {
      clearInterval(resendTimer); clearTimeout(splashTimer);
      const r = el('sheet-root'); if (r) r.innerHTML = '';
      let after = null;
      if (NAV[k]) after = NAV[k]();
      render(); scrollTop();
      if (typeof after === 'function') after();
    }
    function currentKey() {
      if (S.screen === 'splash') return 'splash';
      if (S.screen === 'welcome') return 'welcome';
      if (S.screen === 'pending') return 'pending';
      if (S.screen === 'legal') return S.legal;
      if (S.screen === 'auth') {
        const a2 = S.auth;
        if (a2.step === 'form') return a2.mode === 'signup' ? 'signup' : 'login';
        return a2.step === 'email' ? 'verify-email' : a2.step === 'phone' ? 'verify-phone' : 'login-code';
      }
      const top = S.stack.length ? S.stack[S.stack.length - 1] : null;
      if (top && top.type === 'editProfile') return 'd-edit';
      if (top && top.type === 'job') {
        const j = jobById(top.id) || {};
        if (j.status === 'released') return 'd-payout';
        return {
          assigned: 'd-request', accepted: 'd-accepted', enroute: 'd-enroute', arrived: 'd-arrived',
          working: 'd-working', completed: 'd-done', paid: 'd-done'
        }[j.status] || 'd-enroute';
      }
      if (S.tab === 'home') return !S.online ? 'd-offline' : S.offer ? 'd-offer' : 'd-jobs';
      if (S.tab === 'earnings') return S.payTab === 'paid' ? 'd-paid' : 'd-earnings';
      return 'd-' + S.tab;
    }
    function syncIndex() {
      const k = currentKey();
      document.querySelectorAll('#screen-index .chip').forEach(c => c.classList.toggle('on', c.dataset.scr === k));
    }

    document.addEventListener('click', e => {
      const dev = e.target.closest('[data-dev]');
      if (dev) { CURDEV = DEVICES.find(d => d.id === dev.dataset.dev); buildChips(); buildDevice(); return; }
      const scr = e.target.closest('[data-scr]');
      if (scr) { goScreen(scr.dataset.scr); return; }
      if (e.target.closest('#btn-restart')) { goScreen('splash'); S.splashAuto = true; armSplash(); }
    });
    let WAS_BARE = null;
    window.addEventListener('resize', () => {
      if (BARE() === WAS_BARE) { fitDevice(); return; }
      WAS_BARE = BARE(); buildDevice();
    });

    function armSplash() {
      clearTimeout(splashTimer);
      if (S.screen === 'splash' && S.splashAuto) splashTimer = setTimeout(() => { S.screen = 'welcome'; render(); }, 2400);
    }

    /* ---- boot ---- */
    el('pn-logo').src = ART.lockLight;
    buildChips(); buildIndex();
    WAS_BARE = BARE();
    buildDevice();
    armSplash();
  </script>
</body>

</html>
