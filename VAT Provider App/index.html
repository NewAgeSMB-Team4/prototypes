      max-height: 88%;
      overflow-y: auto;
      transition: transform .28s cubic-bezier(.22, 1, .36, 1)
    }

    /* ---- status timeline ---- */
    .tl-dot {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      flex: none
    }

    .tl-dot-sm {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      flex: none
    }

    .tl-line {
      width: 2px;
      flex: 1;
      min-height: 22px;
      background: #E6EAF0;
      margin: 2px 0
    }

    .tl-line.on {
      background: #F4661B
    }

    /* ---- toast ---- */
    #toast-root {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 96px;
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      padding: 0 18px
    }

    /* ---- responsive ---- */
    /* Stacked, and the page scrolls.
       The stage is fixed and clipped on a wide screen because the phone always
       fits beside the panel there. Stacked above it in a short window the two
       cannot both fit, and a fixed, overflow-hidden stage has no answer to that:
       the panel got squeezed, the phone was scaled down towards nothing, and
       there was no way to scroll to whatever had been pushed off. So in this
       range the stage stops being fixed and becomes an ordinary tall document —
       the panel takes its natural height, the phone keeps a legible size, and
       the window scrolls to reach either. */
    @media (min-width:561px) and (max-width:1080px) {
      #stage {
        position: static;
        flex-direction: column;
        overflow: visible;
        height: auto;
        min-height: 100dvh
      }

      #panel {
        width: 100%;
        max-height: none;
        padding: 20px 20px 14px;
        overflow: visible
      }

      #screen-index {
        flex: 0 0 auto;
        overflow-y: visible;
        -webkit-mask-image: none;
        mask-image: none
      }

      #panel h1 {
        font-size: 30px
      }

      #stage-right {
        padding: 10px 10px 26px;
        justify-content: flex-start
      }

      #device-wrap {
        flex: none;
        overflow: visible
      }
    }

    @media (max-width:560px),
    (pointer:coarse) and (max-height:560px) {

      #panel,
      #dev-caption {
        display: none
      }

      #stage-right {
        padding: 0
      }

      #device-wrap {
        overflow: visible
      }
    }
  </style>
</head>

      { id: 'fuel', name: 'Out of Fuel', ic: 'fuel', base: 35, blurb: 'Enough fuel delivered to reach the nearest station.' },
    ];
    const svcOf = id => SERVICES.find(s => s.id === id) || SERVICES[0];

    /* The providers the platform can route to. `online` is theirs to set in the
       driver app; here it is only read, to pick who the request goes to. */
    const PROVIDERS = [
      { id: 'p1', name: 'Marcus Hale', vehicle: 'Flatbed · Isuzu NPR', plate: 'KL 07 AT 4412', km: 1.8, online: true },
      { id: 'p2', name: 'Dev Anand', vehicle: 'Flatbed · Tata 407', plate: 'KL 05 BX 7781', km: 3.4, online: true },
      { id: 'p3', name: 'Sam Varghese', vehicle: 'Service Van · Force', plate: 'KL 01 CD 2290', km: 5.1, online: false },
      { id: 'p4', name: 'Rahul Nair', vehicle: 'Wrecker · Ashok', plate: 'KL 11 EF 6634', km: 6.9, online: true },
    ];
    const provOf = id => PROVIDERS.find(p => p.id === id);
    // Whose app this is. Everything below is filtered to this provider.
    const ME = 'p1';
    const me = () => provOf(ME);
    /* What the platform keeps on every completed job. The same figure the admin
       panel books and the customer never sees. */
    const COMMISSION = 0.18;
    const netOf = total => Math.round(total * (1 - COMMISSION) * 100) / 100;
    const cutOf = total => Math.round(total * COMMISSION * 100) / 100;

    const TODAY = new Date();
    const ago = m => new Date(TODAY.getTime() - m * 60000).toISOString();

    /* A job moves through these in order. The customer app, the driver app and
       the admin panel all read this one list, which is what keeps the three
       surfaces telling the same story. */
    /* The same lifecycle the customer app runs, read from the other end: a job
       the customer sees as "on the way" is one this provider is driving to. Two
       stages exist only here — `paid` means the customer has paid and the money
       is held, `released` means the platform has settled it into earnings. */
    const FLOW = ['searching', 'assigned', 'accepted', 'enroute', 'arrived', 'working', 'completed', 'paid', 'released'];
    const STATUS = {
      searching: { label: 'Unassigned', tone: 'grey' },
      assigned: { label: 'New offer', tone: 'amber' },
      accepted: { label: 'Accepted', tone: 'amber' },
      enroute: { label: 'On the way', tone: 'blue' },
      arrived: { label: 'At the vehicle', tone: 'blue' },
      working: { label: 'Service in progress', tone: 'blue' },
      /* Waiting on the customer and waiting on the platform are two different
         mechanics, but from the provider's side they are the same fact: the
         money has not landed yet. One label for both. */
      completed: { label: 'Payout pending', tone: 'amber' },
      paid: { label: 'Payout pending', tone: 'amber' },
      released: { label: 'Paid out', tone: 'green' },
      cancelled: { label: 'Cancelled', tone: 'grey' },
    };
    const TONE = {
      amber: 'bg-amber-50 text-amber-700', blue: 'bg-blue-50 text-blue-700',
      green: 'bg-emerald-50 text-emerald-700', grey: 'bg-slate-100 text-slate1',
    };

    const money = n => '$' + (Math.round(n * 100) / 100).toFixed(2);
    const userName = u => [u.first, u.last].filter(Boolean).join(' ');
    const userPhone = u => dialOf(u.dial).dial + ' ' + String(u.phone).trim();
    let JOB_N = 1042;
    const jobNo = () => 'VAT-' + (++JOB_N);

    /* A job is charged at the service fee alone. Distance is still recorded and
       shown — how far away the provider is matters to everyone — but it is no
       longer billed, so `total` and `base` are the same figure. */
    function fareFor(svcId, km) {
      const base = svcOf(svcId).base;
      return { base, total: base };
    }
    /* ---- what a job is charged for ----
       A job is no longer one service at a price. It is a list of lines, each
       recording what it is, what it costs, and who put it there. Two things
       follow from that: the customer can ask for more than one thing at once,
       and the provider can add work they actually did on site.

       Who added a line decides whether it can be refused. A line the customer
       asked for is theirs; a line the provider added is a claim, and the
       customer settles it or declines it when they pay. Declined lines are kept
       on the record rather than deleted — the provider and the administrator
       both need to see that the claim was made and refused. */
    let lineSeq = 100;
    const lineId = () => 'L' + (++lineSeq);
    const svcLine = (svcId, by) => ({ id: lineId(), kind: 'service', svc: svcId, label: svcOf(svcId).name, amount: svcOf(svcId).base, by, rejected: false });
    const customLine = (label, amount, by) => ({ id: lineId(), kind: 'custom', label, amount: Math.round(amount * 100) / 100, by, rejected: false });

    const liveLines = j => (j.items || []).filter(i => !i.rejected);
    const jobTotal = j => Math.round(liveLines(j).reduce((t, i) => t + i.amount, 0) * 100) / 100;
    // Lines the provider added that the customer has not yet settled or refused.
    const claimLines = j => (j.items || []).filter(i => i.by === 'provider');
    const openClaims = j => claimLines(j).filter(i => !i.rejected);
    const rejectedLines = j => (j.items || []).filter(i => i.rejected);
    /* `fare.total` is read all over the three apps, so it is kept in step with
       the lines rather than replaced. */
    function syncFare(j) {
      j.fare = j.fare || {};
      j.fare.total = jobTotal(j);
      j.fare.base = j.fare.total;
      return j;
    }
    // The service that names the job — the first thing the customer asked for.
    const primarySvc = j => (j.items && j.items.find(i => i.kind === 'service') || {}).svc || j.service;
    /* How a job is named when there is only room for one line. A request can
       carry several services now, so the first one names it and the rest are
       counted: "Flat Tyre +2" is three services in all. Declined lines are not
       counted, because they are not part of the job any more. */
    const svcCount = j => (j.items || []).filter(i => i.kind === 'service' && !i.rejected).length;
    function svcLabel(j) {
      const name = svcOf(primarySvc(j)).name, n = svcCount(j);
      return n > 1 ? `${name} <span class="font-normal text-slate2">+${n - 1}</span>` : name;
    }
    // The same thing without markup, for a page title or a plain string.
    function svcLabelText(j) {
      const name = svcOf(primarySvc(j)).name, n = svcCount(j);
      return n > 1 ? `${name} +${n - 1}` : name;
    }

    function mkJob(o) {
      const f = fareFor(o.service, o.km);
      const j = Object.assign({
        id: jobNo(), fare: f, createdAt: new Date().toISOString(),
        customer: 'Alex Rivera', phone: '+1 (201) 555-0142',
      }, o, { fare: o.fare || f });
      /* Every job is born with at least one line — the service it was raised
         for. Jobs created after load (a new request, the demo job) would
         otherwise reach the bill with nothing on it. */
      if (!j.items) j.items = [svcLine(j.service, 'customer')];
      return syncFare(j);
    }
    const MIN = 60000;
    /* When each step happened. Written the moment a status changes and seeded on
       the historical jobs, because a timeline with no times on it is only a list
       of words the provider already knows. */
    function stampNow(j, status) {
      j.stamps = j.stamps || {};
      j.stamps[status] = new Date().toISOString();
      return j;
    }
    const MON3 = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function stampText(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      let h = d.getHours();
      const ap = h < 12 ? 'am' : 'pm';
      h = h % 12 || 12;
      return `${d.getDate()} ${MON3[d.getMonth()]} ${d.getFullYear()}, ${h}:${String(d.getMinutes()).padStart(2, '0')} ${ap}`;
    }
    /* Reads the vehicle back off a job. The three parts are recorded separately
       when the customer raises the request; older records carry a single line,
       so those are split on the separator rather than being left blank. */
    function vehParts(j) {
      if (j.plate) return { make: j.make || '', model: j.model || '', plate: j.plate };
      const bits = String(j.vehicle || '').split(' · ');
      const mm = (bits[0] || '').split(' ');
      return { make: mm[0] || '', model: mm.slice(1).join(' '), plate: bits[1] || '' };
    }

    /* The provider's own book of work: one offer waiting, one job part-way
       through, and a run of finished ones in the two settlement states so the
       earnings screen has both a balance and something still pending. */
    let JOBS = [
      mkJob({ id: 'VAT-1036', service: 'battery', km: 2.1, provider: ME, status: 'released', customer: 'Priya Menon', phone: '+1 (201) 555-0110', address: '8 Mill St, Teaneck', plate: 'KL 03 XY 8890', make: 'Hyundai', model: 'i20', vehicle: 'Hyundai i20 · KL 03 XY 8890', note: 'Lights left on overnight, battery flat in the driveway.', createdAt: ago(4200) }),
      mkJob({ id: 'VAT-1037', service: 'tow', km: 4.2, provider: ME, status: 'released', customer: 'Daniel Cruz', phone: '+1 (201) 555-0188', address: '14 Harbour Rd, Fort Lee', plate: 'KL 09 AB 1122', make: 'Honda', model: 'Civic', vehicle: 'Honda Civic · KL 09 AB 1122', note: 'Would not start after a knocking sound. Recovered to the garage on Main St.', createdAt: ago(2880) }),
      mkJob({ id: 'VAT-1038', service: 'mech', km: 3.6, provider: ME, status: 'released', customer: 'Sara Whitfield', phone: '+1 (201) 555-0164', address: 'Sylvan Ave, Englewood Cliffs', plate: 'KL 05 MN 7712', make: 'Ford', model: 'Focus', vehicle: 'Ford Focus · KL 05 MN 7712', note: 'Clutch slipping badly, would not hold in third.', createdAt: ago(1500) }),
      mkJob({ id: 'VAT-1039', service: 'flat', km: 2.4, provider: ME, status: 'released', customer: 'Marta Silva', phone: '+1 (201) 555-0151', address: 'Overpeck County Park, Leonia', plate: 'KL 06 PL 3318', make: 'Nissan', model: 'Micra', vehicle: 'Nissan Micra · KL 06 PL 3318', note: 'Kerbed the front nearside tyre on the park road.', createdAt: ago(11500) }),
      mkJob({ id: 'VAT-1040', service: 'engine', km: 5.1, provider: ME, status: 'released', customer: 'Tobias Renn', phone: '+1 (201) 555-0192', address: 'Garden State Plaza, Paramus', plate: 'KL 04 VB 9027', make: 'Skoda', model: 'Octavia', vehicle: 'Skoda Octavia · KL 04 VB 9027', note: 'Warning light and a heavy misfire pulling out of the car park.', createdAt: ago(8600) }),
      mkJob({ id: 'VAT-1041', service: 'battery', km: 1.6, provider: ME, status: 'released', customer: 'Grace Okonkwo', phone: '+1 (201) 555-0137', address: 'Main St & Cedar Ln, Teaneck', plate: 'KL 10 DK 4471', make: 'Mazda', model: 'CX-5', vehicle: 'Mazda CX-5 · KL 10 DK 4471', note: 'Dead on the drive after a fortnight away.', createdAt: ago(720) }),
      mkJob({ id: 'VAT-1042', service: 'fuel', km: 2.8, provider: ME, status: 'paid', customer: 'Owen Blake', phone: '+1 (201) 555-0129', address: 'Route 17 North, Paramus', plate: 'KL 02 RT 5540', make: 'Kia', model: 'Seltos', vehicle: 'Kia Seltos · KL 02 RT 5540', note: 'Ran dry two miles short of the services.', createdAt: ago(190) }),
      mkJob({ id: 'VAT-1045', service: 'tow', km: 6.3, provider: ME, status: 'paid', customer: 'Helen Amari', phone: '+1 (201) 555-0146', address: 'Palisades Interstate Pkwy, Fort Lee', plate: 'KL 12 SN 8850', make: 'Volvo', model: 'XC40', vehicle: 'Volvo XC40 · KL 12 SN 8850', note: 'Gearbox would not select drive. Recovered to the dealer.', createdAt: ago(320) }),
      mkJob({ id: 'VAT-1046', service: 'mech', km: 3.1, provider: ME, status: 'completed', customer: 'Ravi Deshpande', phone: '+1 (201) 555-0158', address: 'Sylvan Ave, Englewood Cliffs', plate: 'KL 03 HT 6612', make: 'Renault', model: 'Duster', vehicle: 'Renault Duster · KL 03 HT 6612', note: 'Brakes grinding badly, not safe to drive on.', createdAt: ago(95) }),
      mkJob({ id: 'VAT-1043', service: 'flat', km: 3.0, provider: ME, status: 'working', customer: 'Alex Rivera', phone: '+1 (201) 555-0142', address: '221 Palisade Ave, Englewood', plate: 'KL 07 QQ 3321', make: 'Toyota', model: 'RAV4', vehicle: 'Toyota RAV4 · KL 07 QQ 3321', note: 'Rear right tyre punctured on the kerb.', createdAt: ago(35) }),
    ];
    /* Historical jobs need their steps dated too. Offsets are minutes after the
       job arrived, so each timeline reads as a plausible sequence rather than
       every step landing on the same minute. */
    const STEP_AT = { assigned: 0, accepted: 4, enroute: 12, arrived: 34, working: 38, completed: 84, paid: 90, released: 96 };
    JOBS.forEach(j => {
      const base = new Date(j.createdAt).getTime();
      j.stamps = {};
      FLOW.slice(0, FLOW.indexOf(j.status) + 1)
        .filter(k => k !== 'searching')
        .forEach(k => { j.stamps[k] = new Date(base + STEP_AT[k] * MIN).toISOString(); });
    });


    /* Every seeded job gets its line. A few carry an extra — a second service
       the customer added later, or a charge the provider raised on site — so the
       screens have something real to show without anyone having to build it. */
    JOBS.forEach(j => {
      if (!j.items) j.items = [svcLine(j.service, 'customer')];
      syncFare(j);
    });

    /* The offer sitting on the doormat. Held apart from JOBS until it is
       accepted, because a job you have not taken is not yours yet. */
    const OFFER = syncFare(Object.assign(mkJob({
      id: 'VAT-1044', service: 'engine', km: 1.9, provider: null, status: 'assigned',
      customer: 'Nadia Haddad', phone: '+1 (201) 555-0173', address: 'Main St & Cedar Ln, Teaneck',
      plate: 'KL 08 GH 2264', make: 'Volkswagen', model: 'Polo', vehicle: 'Volkswagen Polo · KL 08 GH 2264',
      note: 'Engine cut out at the lights and will not turn over.', createdAt: ago(1),
    }), { items: [svcLine('engine', 'customer')] }));

    // The job the index screens open carries a second service the customer
    // added later, so "+1" is visible where a job is named.
    (() => {
      const j = JOBS.find(x => x.id === 'VAT-1043');
      if (j && !j.items.some(i => i.svc === 'battery')) { j.items.push(svcLine('battery', 'customer')); syncFare(j); }
      const k = JOBS.find(x => x.id === 'VAT-1042');
      if (k && !k.items.some(i => i.by === 'provider')) { k.items.push(customLine('Fuel supplied, 10 litres', 22, 'provider')); syncFare(k); }
    })();

    const myJobs = () => JOBS.filter(j => j.provider === ME);
    const LIVE = ['accepted', 'enroute', 'arrived', 'working'];
    // 'cancelled' is in neither LIVE nor the settlement states, so it drops out
    // of the jobs in progress and never reaches earnings.
    const activeJobs = () => myJobs().filter(j => LIVE.includes(j.status));
    const settled = () => myJobs().filter(j => j.status === 'released');
    const pendingPay = () => myJobs().filter(j => ['completed', 'paid'].includes(j.status));
    const balance = () => settled().reduce((t, j) => t + netOf(j.fare.total), 0);
    const pendingTotal = () => pendingPay().reduce((t, j) => t + netOf(j.fare.total), 0);

    /* ---- cancelling a job ----
       Either side can call it off, but only up to the moment the provider marks
       the work complete: after that there is finished work to be paid for and
       the argument is about the bill, not the booking.

       A cancellation is a record, not a deletion. It keeps who called it off,
       why, when, and how far the job had got — the reason is the part that
       matters later, when someone asks why this job never happened.

       No cancellation fee is applied here. Whether one is charged, to whom, and
       from which stage is a commercial decision, and inventing an answer in a
       prototype would bury it. The record carries everything such a rule would
       need to be applied against. */
    const CANCELLABLE = j => FLOW.indexOf(j.status) > -1 && FLOW.indexOf(j.status) < FLOW.indexOf('completed');
    function cancelJob(j, by, name, reason) {
      if (!j || !CANCELLABLE(j)) return false;
      j.cancel = { by, name, reason: String(reason).trim(), at: new Date().toISOString(), from: j.status };
      j.status = 'cancelled';
      j.stamps = j.stamps || {};
      j.stamps.cancelled = j.cancel.at;
      return true;
    }
    // The row a cancelled job carries at the foot of its progress list.
    const cancelRow = j => !j.cancel ? '' : `<div class="flex gap-2.5">
    <div class="flex flex-col items-center">
      <span class="tl-dot-sm bg-red-100 text-red-600">${ic('x', 10)}</span>
    </div>
    <div class="min-w-0 flex-1">
      <div class="text-[12px] font-semibold text-red-700 leading-tight">Cancelled by ${j.cancel.by === 'provider' ? 'the provider' : 'the customer'} · ${j.cancel.name}</div>
      <div class="text-[10.5px] text-slate2 leading-tight" style="margin-top:2px">${stampText(j.cancel.at)}</div>
      <div class="text-[11.5px] text-slate1 leading-relaxed mt-1.5 rounded-lg bg-paper px-2.5 py-2">${j.cancel.reason}</div>
    </div></div>`;

    /* ================= STATE ================= */
    const S = {
      screen: 'splash',      // splash | welcome | auth | app
      splashAuto: true,
      user: null,
      // one auth object for both flows; `step` is which card is on screen
      auth: { mode: 'signup', step: 'form', first: '', last: '', email: '', phone: '', dial: 'us', method: 'email', target: '', verified: { email: false, phone: false } },
      edit: null,            // the profile being edited
      legal: null,           // which legal page is open
      legalBack: 'auth',     // and where closing it returns to
      tab: 'home',
      stack: [],             // inner pages, on top of the tab
      online: true,          // availability — nothing is routed here while off
      offer: null,           // the request waiting to be answered
      pick: [],              // services ticked in the add-work sheet
      payTab: 'pending',     // Payouts: Pending or Paid
      from: '', to: '',      // Earnings date range, either end optional
      jobId: null,           // the job whose page is open
    };
    const openJob = () => JOBS.find(j => j.id === S.jobId);

    /* ================= CHROME ================= */
    function toast(msg, icon = 'check') {
      const t = document.createElement('div');
      t.className = 'bg-ink text-white px-4 py-2.5 rounded-xl text-[13px] font-semibold shadow-pop flex items-center gap-2 pointer-events-none';
      t.innerHTML = `<span class="text-flame">${ic(icon, 15)}</span> ${msg}`;
      const r = el('toast-root'); if (!r) return;
      r.appendChild(t);
      setTimeout(() => { t.style.transition = 'opacity .3s,transform .3s'; t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; setTimeout(() => t.remove(), 320); }, 2200);
    }
    function openSheet(html) {
      el('sheet-root').innerHTML = `<div id="sheet-wrap" class="absolute inset-0 z-[80] opacity-0 transition-opacity duration-200">
    <div class="absolute inset-0 bg-ink/45" data-act="close-sheet"></div>
    <div class="sheet absolute left-0 right-0 bottom-0 translate-y-full">${html}</div></div>`;
      requestAnimationFrame(() => {
        const w = el('sheet-wrap'); if (!w) return;
        w.classList.remove('opacity-0');
        w.querySelector('.sheet').classList.remove('translate-y-full');
      });
    }
    /* Repaints a sheet that is already open. openSheet rebuilds the overlay and
       replays its entrance, which reads as a flicker on every tap. */
    function repaintSheet(html) {
      const inner = document.querySelector('#sheet-root .sheet');
      if (!inner) return false;
      inner.innerHTML = html;
      return true;
    }
    function closeSheet() {
      const w = el('sheet-wrap'); if (!w) return;
      w.classList.add('opacity-0');
      w.querySelector('.sheet').classList.add('translate-y-full');
      setTimeout(() => { const r = el('sheet-root'); if (r) r.innerHTML = ''; }, 260);
    }

    /* ================= RENDER ================= */
    function render() {
      const d = el('device'); if (!d) return;
      const app = d.querySelector('#app');
      if (app) app.innerHTML = appHTML();
      syncIndex();
    }
    function appHTML() {
      if (S.screen === 'splash') return splashScreen();
      if (S.screen === 'welcome') return welcomeScreen();
      if (S.screen === 'auth') return authScreen();
      if (S.screen === 'pending') return pendingScreen();
      if (S.screen === 'legal') return legalScreen();
      return roleApp();
    }
    function openPage(type, id) { S.stack.push({ type, id: id || null }); render(); scrollTop(); }
    function goBack() { S.stack.pop(); render(); }
    function setTab(k) { S.tab = k; S.stack = []; render(); scrollTop(); }
    function scrollTop() { const s = el('screen'); if (s) s.scrollTop = 0; }

    /* ---- 1. splash ----
       The badge lands first, the wordmark follows it up, and a lit strip of
       road runs underneath both. Everything is CSS keyframes on three elements;
       nothing here waits on a network. */
    let splashTimer = null;
    function splashScreen() {
      /* The customer app opens dark with the mark in white. This one is its
         negative — daylight, the dark lockup, an orange road — so the two are
         recognisably the same product and unmistakably not the same app. Anyone
         holding both phones can tell at a glance which is which. */

      <div class="relative an-badge">

    }

    /* ---- 2. welcome ----
       The photograph does the selling, so it takes the top two-thirds and drifts
       slowly under a scrim while the card rises over it. The three doors out are
       the three surfaces of the platform. */
    function welcomeScreen() {
      return `<div class="flex-1 relative overflow-hidden bg-paper">
    <div class="absolute left-0 right-0 top-0 overflow-hidden" style="height:70%">
      <!-- Two movements, not one. The rig rolls in from the right and settles,
           which is the truck arriving; then the frame breathes outwards so it
           ends on the whole vehicle. A single slow zoom would have read as a
           still photograph with a wobble. -->
      <img src="${ART.splash}" alt="" class="an-roll w-full object-cover" style="height:calc(100% + 2px)">
      <span class="absolute" style="inset:0 0 -1px;background:linear-gradient(180deg,rgba(20,23,27,.34) 0%,rgba(20,23,27,.06) 30%,rgba(20,23,27,.02) 76%,rgba(245,247,250,.58) 90%,#F5F7FA 99%,#F5F7FA 100%)"></span>
      <span class="absolute left-0 right-0 top-0" style="height:150px;background:linear-gradient(180deg,rgba(12,16,22,.32) 0%,rgba(12,16,22,0) 100%)"></span>

    </div>

    <div class="absolute left-0 right-0 bottom-0 px-5 pb-7 an-up" style="animation-delay:.34s">
      <h1 class="font-display font-bold text-ink leading-[1.02]" style="font-size:33px">Jobs near you.<br><span class="text-brand">Paid through the app.</span></h1>
      <p class="text-[13px] text-slate1 leading-relaxed mt-2">Go online and we send you the closest requests. Work the job,
        mark it complete, and your payout follows.</p>

      <div class="flex items-center gap-4 mt-4 mb-5">
        ${[['nav', 'Nearest first'], ['wallet', 'Weekly payouts'], ['shield', 'Verified work']].map(([i, t]) => `<span class="inline-flex items-center gap-1.5 text-[11.5px] font-semibold text-slate1">
          <span class="text-brand">${ic(i, 14)}</span>${t}</span>`).join('')}
      </div>

      <button data-act="go-signup" class="${BTN}">Get started ${ic('arrow-right', 17)}</button>
      <button data-act="go-login" class="${BTN2} mt-2.5">I already have an account</button>
    </div>
  </div>`;
    }

    /* ================= AUTH ================= */
    /* Two ways in, and no password on either. Signing up collects the account
       and then proves the email and the phone in turn; logging in proves
       whichever of the two you offered. The code is the whole of the
       credential — nothing is stored, checked or compared against a secret. */
    const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v).trim());
    const validPhone = v => String(v).replace(/[^\d]/g, '').length >= 7;

    /* Dial codes carried with the number rather than baked into it: a customer
       who keeps a foreign mobile should not have to fake a local one. `id`
       rather than the dial itself is the option value, because +1 belongs to
       two countries and a select cannot tell them apart by value alone. */
    const DIALS = [
      { id: 'us', flag: '🇺🇸', dial: '+1', name: 'United States' },
      { id: 'ca', flag: '🇨🇦', dial: '+1', name: 'Canada' },
      { id: 'gb', flag: '🇬🇧', dial: '+44', name: 'United Kingdom' },
      { id: 'ie', flag: '🇮🇪', dial: '+353', name: 'Ireland' },
      { id: 'in', flag: '🇮🇳', dial: '+91', name: 'India' },
      { id: 'ae', flag: '🇦🇪', dial: '+971', name: 'United Arab Emirates' },
      { id: 'sa', flag: '🇸🇦', dial: '+966', name: 'Saudi Arabia' },
      { id: 'au', flag: '🇦🇺', dial: '+61', name: 'Australia' },
      { id: 'de', flag: '🇩🇪', dial: '+49', name: 'Germany' },
      { id: 'fr', flag: '🇫🇷', dial: '+33', name: 'France' },
      { id: 'es', flag: '🇪🇸', dial: '+34', name: 'Spain' },
      { id: 'it', flag: '🇮🇹', dial: '+39', name: 'Italy' },
      { id: 'nl', flag: '🇳🇱', dial: '+31', name: 'Netherlands' },
      { id: 'sg', flag: '🇸🇬', dial: '+65', name: 'Singapore' },
      { id: 'za', flag: '🇿🇦', dial: '+27', name: 'South Africa' },
    ];
    const dialOf = id => DIALS.find(d => d.id === id) || DIALS[0];
    /* A fresh auth run. Everything the two flows share lives here so a screen
       jumped to from the index starts in the same shape one walked to does.

       Every field arrives filled in. This is a prototype being clicked through
       rather than an account really being opened, and typing a name, an address
       and a phone number on a simulated handset to reach the screen after it is
       friction with nothing to teach. Clear any field to see its validation. */
    const authState = o => Object.assign({
      mode: 'signup', step: 'form',
      first: 'Alex', last: 'Rivera', email: 'alex@example.com', phone: '201 555 0142',
      dial: 'us', method: 'email', target: '', verified: {},
    }, o);
    const fullPhone = a => dialOf(a.dial).dial + ' ' + String(a.phone).trim();

    function authScreen() {
      const a = S.auth;
      const head = (title, sub) => `<div class="mb-6">
      <h1 class="font-display font-bold text-ink leading-none" style="font-size:30px">${title}</h1>
      <p class="text-[13px] text-slate1 leading-relaxed mt-2">${sub}</p></div>`;
      const body = a.step === 'form'
        ? (a.mode === 'signup' ? signupCard(head) : loginCard(head))
        : verifyCard(head);
      /* Back always returns to the welcome screen rather than unwinding one
         step. Half-way through proving a phone number there is nothing useful
         to go back *to* — the form behind it has already been accepted — so the
         only honest destination is the start. */
      /* The code screens hold four boxes and a line of text, and on a tall
         handset that left most of the screen empty. The photograph returns
         underneath them — heavily washed out so the digits keep their contrast,
         and only on those screens, since the forms fill the space themselves. */
      /* The code screens and the login form are the sparse ones — a single
         field or four boxes and little else. The sign-up form fills its own
         screen, so it is left plain. */
      const bare = a.step !== 'form' || a.mode === 'login';
      return `<div class="flex-1 flex flex-col bg-paper overflow-hidden relative">
    <!-- The same treatment the profile carries, rather than a second one of its
         own: the wheel change anchored to the foot of the screen at full
         strength, so the job it depicts is actually legible. The auth screens
         previously used a washed-out full-bleed version, which showed the
         photograph everywhere and read it nowhere. -->
    ${bare ? pageBackdrop(ART.wheel, true) : ''}
    <div class="relative shrink-0 h-14 flex items-center px-2">
      <button data-act="auth-exit" aria-label="Back to welcome" class="w-10 h-10 rounded-full grid place-items-center text-ink active:scale-95">${ic('chev-left', 22)}</button>
      <img src="${ART.lockDark}" alt="VAT" class="ml-1" style="width:68px">
    </div>
    <div id="screen" class="relative flex-1 overflow-y-auto no-scrollbar px-5 pb-8">${body}</div>
  </div>`;
    }

    /* ---- sign up ----
       Every field is required, so none of them is marked optional and the
       button says so by refusing rather than by being greyed out — a disabled
       button that will not say what is missing is the worse of the two. */
    function signupCard(head) {
      const a = S.auth;
      return `${head('Create your account', 'A few details and two quick checks — one code to your email, one to your phone.')}
    <div class="space-y-3.5">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="${LABEL}">First name</label><input id="f-first" value="${esc(a.first)}" placeholder="Alex" autocomplete="given-name" class="${FIELD}"></div>
        <div><label class="${LABEL}">Last name</label><input id="f-last" value="${esc(a.last)}" placeholder="Rivera" autocomplete="family-name" class="${FIELD}"></div>
      </div>
      <div><label class="${LABEL}">Email</label>
        <div class="flex items-center border border-line rounded-2xl px-4 bg-white focus-within:border-brand transition">
          <span class="text-faint shrink-0">${ic('mail', 17)}</span>
          <input id="f-email" value="${esc(a.email)}" inputmode="email" autocomplete="email" placeholder="you@example.com" class="flex-1 py-3.5 px-2.5 text-[15px] bg-transparent outline-none text-ink"></div></div>
      <div><label class="${LABEL}">Phone number</label>
        <div class="flex items-stretch gap-2">
          <div class="relative shrink-0">
            <select id="f-dial" class="appearance-none h-full border border-line rounded-2xl bg-white pl-3.5 pr-8 text-[15px] text-ink outline-none focus:border-brand transition">
              ${DIALS.map(d => `<option value="${d.id}" ${a.dial === d.id ? 'selected' : ''}>${d.flag} ${d.dial}</option>`).join('')}
            </select>
            <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-faint pointer-events-none">${ic('chev-down', 15)}</span>
          </div>
          <div class="flex items-center border border-line rounded-2xl px-4 bg-white focus-within:border-brand transition flex-1 min-w-0">
            <span class="text-faint shrink-0">${ic('phone', 17)}</span>
            <input id="f-phone" value="${esc(a.phone)}" inputmode="tel" autocomplete="tel" placeholder="201 555 0142" class="flex-1 min-w-0 py-3.5 px-2.5 text-[15px] bg-transparent outline-none text-ink"></div>
        </div></div>
    </div>
    <button data-act="signup-next" class="${BTN} mt-6">Continue ${ic('arrow-right', 17)}</button>
    <p class="text-[11.5px] text-slate2 leading-relaxed text-center mt-3.5">By signing up I agree to the
      <button data-act="legal" data-val="terms" class="text-brand font-semibold underline">Terms of Use</button> and
      <button data-act="legal" data-val="privacy" class="text-brand font-semibold underline">Privacy Policy</button>.</p>
    <p class="text-center text-[12.5px] text-slate2 mt-5">Already registered?
      <button data-act="auth-mode" data-val="login" class="text-brand font-bold">Log in</button></p>`;
    }

    /* ---- log in ----
       One field, and you choose which one it is. */
    function loginCard(head) {
      const a = S.auth, byEmail = a.method === 'email';
      const tab = (m, label, icon) => `<button data-act="auth-method" data-val="${m}" class="flex-1 inline-flex items-center justify-center gap-1.5 py-2.5 rounded-xl text-[13px] font-bold transition ${a.method === m ? 'bg-white text-ink shadow-card' : 'text-slate2'}">${ic(icon, 15)} ${label}</button>`;
      return `${head('Welcome back', 'We will send a 4-digit code to confirm it is you. No password needed.')}
    <div class="flex gap-1.5 bg-line/60 p-1.5 rounded-2xl mb-4">${tab('email', 'Email', 'mail')}${tab('phone', 'Phone', 'phone')}</div>
    ${byEmail
          ? `<div><label class="${LABEL}">Email</label>
        <div class="flex items-center border border-line rounded-2xl px-4 bg-white focus-within:border-brand transition">
          <span class="text-faint shrink-0">${ic('mail', 17)}</span>
          <input id="f-login" value="${esc(a.email)}" inputmode="email" autocomplete="email" placeholder="you@example.com" class="flex-1 py-3.5 px-2.5 text-[15px] bg-transparent outline-none text-ink"></div></div>`
          : `<div><label class="${LABEL}">Phone number</label>
        <div class="flex items-stretch gap-2">
          <div class="relative shrink-0">
            <select id="f-dial" class="appearance-none h-full border border-line rounded-2xl bg-white pl-3.5 pr-8 text-[15px] text-ink outline-none focus:border-brand transition">
              ${DIALS.map(d => `<option value="${d.id}" ${a.dial === d.id ? 'selected' : ''}>${d.flag} ${d.dial}</option>`).join('')}
            </select>
            <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-faint pointer-events-none">${ic('chev-down', 15)}</span>
          </div>
          <div class="flex items-center border border-line rounded-2xl px-4 bg-white focus-within:border-brand transition flex-1 min-w-0">
            <span class="text-faint shrink-0">${ic('phone', 17)}</span>
            <input id="f-login" value="${esc(a.phone)}" inputmode="tel" autocomplete="tel" placeholder="201 555 0142" class="flex-1 min-w-0 py-3.5 px-2.5 text-[15px] bg-transparent outline-none text-ink"></div>
        </div></div>`}
    <button data-act="login-next" class="${BTN} mt-6">Login ${ic('arrow-right', 17)}</button>
    <p class="text-center text-[12.5px] text-slate2 mt-5">No account yet?
      <button data-act="auth-mode" data-val="signup" class="text-brand font-bold">Get started</button></p>`;
    }

    /* ---- the code screen ----
       Serves all three checks — sign-up email, sign-up phone, and login —
       because they differ only in what is being proved and where the flow goes
       after it. */
    function verifyCard(head) {
      const a = S.auth, isPhone = a.step === 'phone';
      const what = a.mode === 'signup' ? (isPhone ? 'phone' : 'email') : a.method;
      const stepNote = a.mode === 'signup'
        ? `<div class="inline-flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wide text-brand bg-brand/10 rounded-full px-2.5 py-1 mb-3">Step ${isPhone ? 2 : 1} of 2</div>`
        : '';
      /* No submit button: the fourth digit is the submit. A button under four
         boxes that fill themselves is a second thing to press for something
         already decided, and every code field a customer has used elsewhere
         behaves this way. */
      return `${stepNote}${head(`Verify your ${what}`, `Enter the 4-digit code sent to <b class="text-ink">${esc(a.target)}</b>.`)}
    <div class="flex gap-3 justify-center" id="otp-wrap">
      ${[0, 1, 2, 3].map(i => `<input class="otp" inputmode="numeric" maxlength="1" data-i="${i}" aria-label="Digit ${i + 1}">`).join('')}
    </div>
    <div class="text-center mt-6" id="resend-slot">${resendHTML()}</div>`;
    }

    /* ---- resend, and the 30-second lock ----
       The lock belongs to the act of resending, not to arriving: a customer who
       lands here and finds the button already greyed out has been punished for
       a code they did not ask for. So the button starts live, and the countdown
       begins the first time it is pressed and on every press after.

       While locked it counts down in place rather than disappearing and coming
       back, so nothing under it moves. Pressing it clears whatever digits were
       already typed — the old code is dead the moment a new one is sent.

       The countdown rewrites only its own node; re-rendering the screen each
       second would empty the boxes on every tick. */
    let resendLeft = 0, resendTimer = null;
    function resendHTML() {
      const locked = resendLeft > 0;
      return `<button data-act="resend" ${locked ? 'disabled' : ''} class="inline-flex items-center gap-1.5 text-[12.5px] font-bold rounded-full px-3.5 py-2 transition ${locked ? 'text-slate2 cursor-not-allowed' : 'text-brand active:scale-95'}">
      ${ic('refresh', 13)}<span>${locked ? `Resend code in <b class="text-ink" id="resend-n">${resendLeft}</b>s` : 'Resend code'}</span></button>`;
    }
    function paintResend() { const slot = el('resend-slot'); if (slot) slot.innerHTML = resendHTML(); }
    function stopResend() { clearInterval(resendTimer); resendLeft = 0; }
    function startResend() {
      clearInterval(resendTimer);
      resendLeft = 30;
      paintResend();
      resendTimer = setInterval(() => {
        resendLeft--;
        if (resendLeft <= 0) { clearInterval(resendTimer); paintResend(); return; }
        const n = el('resend-n');
        if (n) n.textContent = resendLeft; else paintResend();
      }, 1000);
    }
    function clearOtp() {
      document.querySelectorAll('.otp').forEach(i => i.value = '');
      const f = document.querySelector('.otp'); if (f) f.focus();
    }
    function sendCode(target, step) {
      S.auth.target = target; S.auth.step = step;
      stopResend();           // a fresh screen starts with the button live
      render();
      setTimeout(() => { const f = document.querySelector('.otp'); if (f) f.focus(); }, 60);
      toast('Code sent to ' + target, 'check');
    }
    const readCode = () => [...document.querySelectorAll('.otp')].map(i => i.value).join('');
    /* Any four digits are accepted. There is no code to be right about — no
       message was really sent — and a prototype that rejects what it never
       issued only teaches the reviewer a password. */
    function verifyCode() {
      if (readCode().length < 4) return;
      stopResend();
      const a = S.auth;
      if (a.mode === 'signup' && a.step === 'email') {
        a.verified.email = true;
        toast('Email verified', 'check');
        sendCode(fullPhone(a), 'phone');
        return;
      }
      if (a.mode === 'signup') {
        /* A provider is not turned loose on live jobs the moment they finish a
           form. Signing up ends here, at a holding screen, and the account is
           opened once the platform has checked them out. */
        a.verified.phone = true;
        S.screen = 'pending'; render(); scrollTop();
        return;
      }
      finishAuth();
    }
    function finishAuth() {
      const a = S.auth;
      /* Stored in the parts it was collected in, not as one joined line — the
         profile has to be able to put the same form back on screen. */
      S.user = {
        first: a.first || 'Alex', last: a.last || 'Rivera',
        email: a.email || 'alex@example.com',
        phone: a.phone || '201 555 0142', dial: a.dial || 'us',
      };
      S.screen = 'app'; S.tab = 'home'; S.stack = [];
      render(); scrollTop();
      toast(a.mode === 'signup' ? 'Account created' : 'Logged in', 'check');
    }
    const esc = v => String(v == null ? '' : v).replace(/"/g, '&quot;');

    /* ================= LEGAL ================= */
    /* Real pages rather than a link that goes nowhere: the sign-up screen asks
       the customer to agree to these, and agreeing to something you cannot read
       is the one part of a sign-up flow a prototype should not fake.

       They are reachable from sign-up and from the profile, and both routes
       come back to wherever they were opened from — `S.legalBack` remembers
       which, so reading the terms mid-sign-up does not drop the form. */
    const LEGAL = {
      terms: {
        title: 'Terms of Use',
        intro: 'These terms cover your use of the VAT app to request roadside assistance.',
        secs: [
          ['Accepting these terms', 'By creating an account and using VAT you agree to these Terms of Use. If you do not agree, please do not use the app.'],
          ['What VAT does', 'VAT connects you with independent roadside assistance providers. We route your request to the nearest available provider and handle payment. The service itself is carried out by that provider, not by VAT.'],
          ['Your account', 'You are responsible for the accuracy of the details you give us and for activity under your account. We verify your email and phone number when you sign up so we can reach you about a job in progress.'],
          ['Requests and cancellation', 'A request is an offer to pay for the service you selected. You may cancel before a provider arrives at no charge. Once work has begun the job is chargeable.'],
          ['Payment', 'You are charged through the app when the provider marks the job complete. The amount is the call-out fee for the service you chose plus distance. Any estimate shown beforehand is an estimate.'],
          ['Liability', 'VAT is a demo prototype. Nothing here is a live service, no real payment is taken, and no real provider is dispatched.'],
        ],
      },
      privacy: {
        title: 'Privacy Policy',
        intro: 'What VAT collects when you use the app, and what it is used for.',
        secs: [
          ['What we collect', 'Your name, email address and phone number when you sign up. For each request, the location you select, your vehicle details and anything you add in the notes.'],
          ['Verification codes', 'Codes sent to your email and phone are used only to confirm those details belong to you. VAT does not use or store passwords.'],
          ['How it is used', 'Your contact details let the provider assigned to your job reach you. Your location is shared with that provider so they can find you, and with nobody else.'],
          ['Payment details', 'Card details are handled by our payment processor. VAT stores only the last four digits so you can recognise the card.'],
          ['Keeping it', 'Request history is kept so you can see past jobs and receipts. You can ask us to delete your account and its history at any time.'],
          ['This prototype', 'This is a demo. Nothing you enter here leaves your browser, and no data is transmitted or stored anywhere.'],
        ],
      },
    };
    function legalScreen() {
      const L = LEGAL[S.legal] || LEGAL.terms;
      return `<div class="flex-1 flex flex-col bg-paper overflow-hidden relative">
    <div class="relative shrink-0 h-14 flex items-center gap-1 px-2 border-b border-line bg-paper/95 backdrop-blur">
      <button data-act="legal-back" aria-label="Back" class="w-10 h-10 rounded-full grid place-items-center text-ink active:scale-95">${ic('chev-left', 22)}</button>
      <div class="font-bold text-[16.5px] text-ink truncate">${L.title}</div>
    </div>
    <div id="screen" class="relative flex-1 overflow-y-auto no-scrollbar px-5 py-5">
      <p class="text-[13px] text-slate1 leading-relaxed">${L.intro}</p>
      <p class="text-[11.5px] text-faint mt-2">Last updated ${['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][TODAY.getMonth()]} ${TODAY.getFullYear()} · Demo content</p>
      ${L.secs.map((sec, i) => `<div class="mt-5">
        <div class="font-bold text-ink text-[14.5px] mb-1.5">${i + 1}. ${sec[0]}</div>
        <p class="text-[13px] text-slate1 leading-relaxed">${sec[1]}</p></div>`).join('')}
      <div class="h-6"></div>
    </div>
  </div>`;
    }

    /* ---- awaiting verification ----
       The end of sign-up, and deliberately not the app: the account exists but
       nothing can be done with it yet. The note underneath is for whoever is
       reviewing this prototype rather than for a real applicant — without it,
       the obvious reading is that the demo has dead-ended here. */
    function pendingScreen() {
      return `<div class="flex-1 flex flex-col bg-paper overflow-hidden relative">
    ${pageBackdrop(ART.keys)}
    <div id="screen" class="relative flex-1 overflow-y-auto no-scrollbar px-6 pt-16 pb-8">
      <div class="text-center">
        <span class="w-20 h-20 rounded-full bg-white shadow-card text-brand grid place-items-center mx-auto an-badge">${ic('shield', 38)}</span>
        <h1 class="font-display font-bold text-ink leading-tight mt-6" style="font-size:27px">Your account is under verification</h1>
        <p class="text-[14px] text-slate1 leading-relaxed mt-3">You will be notified as soon as the account is approved.</p>
      </div>

      <div class="${CARD} p-4 mt-8 flex items-start gap-3">
        <span class="text-brand shrink-0">${ic('alert', 17)}</span>
        <p class="text-[12.5px] text-slate1 leading-relaxed">Use <b class="text-ink">I already have an account</b> on the
          welcome screen to log in as an approved provider and see the full set of features.</p>
      </div>

      <button data-act="pending-login" class="${BTN} mt-5">${ic('arrow-right', 17)} Go to log in</button>
    </div>
  </div>`;
    }

    /* ================= APP SHELL ================= */
    /* ---- the page backdrop ----
       Flat paper behind every list left the app looking like a wireframe on the
       screens that are mostly white space — a profile, an empty list, a short
       form. This sits behind everything at low strength: a warm wash at the top
       where the header is, and the photograph anchored to the foot of the
       screen, well under the content that has to stay readable.

       It lives outside #screen so it does not scroll away, and it is
       pointer-events:none so nothing on it can be tapped by accident. */
    const pageBackdrop = (art, animate) => `<div class="absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <span class="absolute" style="top:-70px;right:-60px;width:260px;height:260px;border-radius:999px;background:radial-gradient(circle,rgba(244,102,27,.13) 0%,transparent 70%)"></span>
    <span class="absolute" style="top:120px;left:-90px;width:240px;height:240px;border-radius:999px;background:radial-gradient(circle,rgba(35,39,46,.06) 0%,transparent 70%)"></span>
    <div class="absolute left-0 right-0 bottom-0 overflow-hidden" style="height:44%">
      <img src="${art || ART.wheel}" alt="" class="w-full h-full object-cover${animate ? ' an-zoom' : ''}" style="opacity:.62">
      <span class="absolute inset-0" style="background:linear-gradient(180deg,#F5F7FA 0%,rgba(245,247,250,.80) 22%,rgba(245,247,250,.30) 58%,rgba(245,247,250,.34) 100%)"></span>
    </div>
  </div>`;
    /* A different photograph per screen. One image repeated on every tab starts
       to read as wallpaper; changing it gives each screen its own place without
       any of them shouting. */
    const backdropFor = () => (S.stack.length
      ? PAGE_ART_MAP()[S.stack[S.stack.length - 1].type]
      : TAB_ART()[S.tab]) || null;
    /* Which photograph sits behind which screen — and, as often, none at all.
       A backdrop belongs on a screen that would otherwise be mostly empty; on a
       list or a form it competes with the content and reads as noise. The jobs
       list is the clearest case: cards over a close-up of a jack said nothing
       and swallowed the tab bar. */
    const TAB_ART = () => ({ home: null, earnings: null, profile: ART.wheel });
    const PAGE_ART_MAP = () => ({ job: null, editProfile: null });
    function roleApp() {
      const inner = S.stack.length ? pageShell() : tabShell();
      const art = backdropFor();
      return `<div class="flex-1 flex flex-col min-h-0 bg-paper relative">${art ? pageBackdrop(art) : ''}${inner}</div>`;
    }
    function tabShell() {
      const s = screenFor();
      return `${s.bar}<div id="screen" class="relative flex-1 overflow-y-auto no-scrollbar">${s.html}</div>${bottomNav()}`;
    }
    function pageShell() {
      const p = S.stack[S.stack.length - 1], pc = pageContent(p);
      return `<div class="shrink-0 sticky top-0 z-30 bg-paper/95 backdrop-blur border-b border-line px-1.5 h-14 flex items-center gap-1">
    <button data-act="go-back" class="w-10 h-10 rounded-full grid place-items-center text-ink active:scale-95">${ic('chev-left', 22)}</button>
    <div class="font-bold text-[16.5px] text-ink truncate pr-3">${pc.title}</div></div>
  <div id="screen" class="relative flex-1 overflow-y-auto no-scrollbar">${pc.html}</div>`;
    }
    function pageContent(p) {
      switch (p.type) {
        case 'job': { const j = jobById(p.id); return { title: j ? svcLabelText(j) : '', html: dJob(p.id) }; }
        case 'editProfile': return { title: 'Edit profile', html: editProfilePage() };
      }
      return { title: '', html: '' };
    }
    function topBar(title, right) {
      return `<div class="shrink-0 sticky top-0 z-20 bg-paper/95 backdrop-blur border-b border-line px-4 h-14 flex items-center justify-between gap-3">
    <div class="font-bold text-[17px] text-ink truncate">${title}</div>
    <div class="flex items-center gap-2 shrink-0">${right || ''}</div></div>`;
    }
    function screenFor() {
      return {
        home: { bar: topBar('Jobs', onlineDot()), html: dJobs() },
        earnings: { bar: topBar('Earnings'), html: dEarnings() },
        profile: { bar: topBar('Profile'), html: profile() },
      }[S.tab];
    }
    const TABS = [['home', 'Jobs', 'truck'], ['earnings', 'Earnings', 'wallet'], ['profile', 'Profile', 'user']];
    // Availability, readable from any screen without having to go and look.
    const onlineDot = () => `<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[11.5px] font-bold ${S.online ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate1'}">
    <span class="w-1.5 h-1.5 rounded-full ${S.online ? 'bg-emerald-500' : 'bg-slate2'}"></span>${S.online ? 'Online' : 'Offline'}</span>`;
    function bottomNav() {
      const tabs = TABS.map(([k, label, icon]) => {
        const on = S.tab === k;
        return `<button data-tab="${k}" class="flex-1 flex flex-col items-center gap-1 py-1 ${on ? 'text-brand' : 'text-faint'} active:scale-95 transition">
      <span class="w-11 h-7 rounded-full grid place-items-center transition ${on ? 'bg-brand/10' : ''}">${ic(icon, 20)}</span>
      <span class="text-[10px] font-bold">${label}</span></button>`;
      }).join('');
      /* `relative` is doing real work: the page backdrop is absolutely
         positioned, and a positioned element paints above a static one in the
         same stacking context regardless of source order — so without this the
         photograph was drawn over the tab bar. */
      return `<div class="relative z-10 shrink-0 bg-white border-t border-line shadow-nav px-2 pt-1 pb-[max(8px,env(safe-area-inset-bottom))] flex items-center justify-around">${tabs}</div>`;
    }

    /* ================= SHARED PIECES ================= */
    const statusPill = st => `<span class="inline-block text-[10.5px] font-bold px-2.5 py-1 rounded-full ${TONE[(STATUS[st] || {}).tone] || TONE.grey}">${(STATUS[st] || {}).label || st}</span>`;

    /* A drawn map rather than a real one: a prototype does not need tiles from a
       vendor, it needs to show that a location was picked and roughly where. */
    /* `move` is how far along the route the provider is, 0 to 1. The marker is
       placed on the same curve the dashed line is drawn along, so it reads as
       travelling towards the pin rather than floating over the picture. */
    /* ---- the map ----
       One curve drives everything. The road is stroked from these four control
       points, the customer's pin is planted on the last of them, and the
       provider's marker is placed by evaluating the same cubic — so the truck
       cannot drift off the road, and at the end of the journey it arrives at
       the pin rather than sailing past it to a corner of the picture, which is
       what it used to do: the pin sat at one fixed spot and the marker followed
       an unrelated set of points that ended somewhere else entirely. */
    const ROUTE = { a: [-26, 160], b: [60, 158], c: [96, 104], d: [180, 98] };
    const ROUTE_ON = 'M-26 160C60 158 96 104 180 98';        // the leg being travelled
    const ROUTE_PAST = 'C250 94 300 80 386 58';              // the road carries on past the pin
    const ROAD = ROUTE_ON + ROUTE_PAST;
    function routeAt(t) {
      const { a, b, c, d } = ROUTE, m = 1 - t;
      const x = m * m * m * a[0] + 3 * m * m * t * b[0] + 3 * m * t * t * c[0] + t * t * t * d[0];
      const y = m * m * m * a[1] + 3 * m * m * t * b[1] + 3 * m * t * t * c[1] + t * t * t * d[1];
      // the viewBox is 360x180, and the markers are positioned in percentages
      return [x / 360 * 100, y / 180 * 100];
    }
    const PIN_AT = routeAt(1);
    function mapCard(h = 150, pinLabel, move) {
      const truck = move == null ? null : routeAt(Math.max(0, Math.min(1, move)));
      return `<div class="relative overflow-hidden rounded-2xl bg-[#E9EDF2]" style="height:${h}px">
    <svg viewBox="0 0 360 180" class="absolute inset-0 w-full h-full">
      <rect width="360" height="180" fill="#E9EDF2"/>
      <path d="M-10 130h380M-10 34h380M64 -10v200M290 -10v200" stroke="#DCE2E9" stroke-width="13"/>
      <path d="${ROAD}" stroke="#fff" stroke-width="15" fill="none"/>
      <path d="${ROUTE_ON}" stroke="#F4661B" stroke-width="2.8" stroke-dasharray="9 9" fill="none" opacity=".85"/>
      <rect x="96" y="6" width="52" height="22" rx="5" fill="#DFE5EC"/>
      <rect x="312" y="140" width="44" height="30" rx="5" fill="#DFE5EC"/>
      <rect x="14" y="142" width="34" height="26" rx="5" fill="#DFE5EC"/>
    </svg>
    <!-- the customer, planted on the end of the route -->
    <div class="absolute" style="left:${PIN_AT[0]}%;top:${PIN_AT[1]}%;transform:translate(-50%,-100%)">
      <span class="block w-9 h-9 rounded-full bg-brand text-white grid place-items-center shadow-btn">${ic('pin', 18)}</span>
    </div>
    ${truck ? `<div class="absolute" style="left:${truck[0]}%;top:${truck[1]}%;transform:translate(-50%,-50%);transition:left 1.1s ease-in-out,top 1.1s ease-in-out">
      <span class="block w-9 h-9 rounded-full bg-ink text-white grid place-items-center shadow-pop ring-2 ring-white">${ic('truck', 18)}</span>
    </div>` : ''}
    ${pinLabel ? `<div class="absolute left-3 right-3 bottom-3 bg-white/95 backdrop-blur rounded-xl px-3 py-2 flex items-center gap-2 shadow-card">
      <span class="text-brand shrink-0">${ic('pin', 15)}</span>
      <span class="text-[12px] text-ink font-semibold truncate">${pinLabel}</span></div>` : ''}
  </div>`;
    }
    /* Who is coming, and how to reach them. The provider's own vehicle and plate
       used to sit under the name; neither is what a customer waiting at the
       roadside is looking at this row to find out. */
    function providerCard(p, extra) {
      return `<div class="flex items-center gap-3">
    <span class="w-12 h-12 rounded-2xl bg-ink text-white grid place-items-center font-bold text-[15px] shrink-0">${p.name.split(' ').map(w => w[0]).slice(0, 2).join('')}</span>
    <div class="min-w-0 flex-1">
      <div class="font-bold text-ink text-[15px] truncate">${p.name}</div>
      <div class="text-[11.5px] text-slate2 mt-0.5">Your service provider</div>
    </div>${extra || ''}</div>`;
    }
    /* The bill in two groups: what the customer asked for, then what this
       provider added on site. One heading for the second group rather than a
       tag on every line.

       A provider can take back a line they added — a charge entered wrongly, or
       work that turned out not to be needed — but never one the customer
       requested, and never the last service on the job. */
    function billCard(j, editable) {
      const mine = (j.items || []).filter(i => i.by === 'customer');
      const theirs = (j.items || []).filter(i => i.by === 'provider');
      const svcTotal = (j.items || []).filter(i => i.kind === 'service' && !i.rejected).length;
      const canEdit = editable && FLOW.indexOf(j.status) < FLOW.indexOf('paid') && j.status !== 'assigned';
      const dropBtn = i => (canEdit && !(i.kind === 'service' && svcTotal < 2))
        ? `<button data-act="drop-line" data-job="${j.id}" data-id="${i.id}" aria-label="Remove ${i.label}"
      class="w-7 h-7 rounded-lg grid place-items-center text-slate2 active:scale-90 shrink-0">${ic('x', 14)}</button>`
        : (canEdit ? '<span class="w-7 shrink-0"></span>' : '');
      return `${mine.map(i => `<div class="flex justify-between items-center gap-2.5 text-[13px] py-1.5">
      <span class="text-slate1 min-w-0 flex-1">${i.label}</span>
      <b class="text-ink shrink-0">${money(i.amount)}</b>
      ${canEdit ? '<span class="w-7 shrink-0"></span>' : ''}</div>`).join('')}
    ${theirs.length ? `<div class="mt-3 pt-3 border-t border-line">
      <div class="text-[12px] font-bold text-ink">Added by you</div>
      ${theirs.map(i => `<div class="flex justify-between items-center gap-2.5 text-[13px] py-1.5 ${i.rejected ? 'opacity-50' : ''}">
        <span class="min-w-0 flex-1 text-slate1 ${i.rejected ? 'line-through' : ''}">${i.label}${i.rejected ? '<span class="block text-[11px] text-slate2">Declined by the customer</span>' : ''}</span>
        <b class="text-ink shrink-0 ${i.rejected ? 'line-through' : ''}">${money(i.amount)}</b>
        ${i.rejected ? (canEdit ? '<span class="w-7 shrink-0"></span>' : '') : dropBtn(i)}</div>`).join('')}
    </div>` : ''}
    <div class="flex justify-between items-end mt-2.5 pt-2.5 border-t border-line"><span class="font-bold text-ink text-[14px]">Job total</span><b class="text-ink text-[17px]">${money(jobTotal(j))}</b></div>`;
    }
    const lineRows = j => billCard(j, false);

    // Kept for the estimate on the request form, where there is no job yet.
    const fareRows = f => `<div class="flex justify-between items-end"><span class="font-bold text-ink text-[14px]">Service fee</span><b class="text-ink text-[17px]">${money(f.total)}</b></div>`;

    /* ================= SERVICE PROVIDER ================= */
    /* ---- jobs ----
       Availability first, because nothing else on this screen means anything
       while it is off, then whatever needs answering, then whatever is running.
       A provider glances at this between jobs; the order is the order of
       urgency, not of category. */
    function dJobs() {
      const live = activeJobs(), offer = S.offer && !S.online ? null : S.offer;
      // Cancelled jobs are listed with the finished ones — closed, but part of
      // the provider's record rather than something that quietly disappears.
      const done = myJobs().filter(j => ['completed', 'paid', 'released', 'cancelled'].includes(j.status)).slice().reverse();
      return `<div class="px-5 py-4 pb-24">
    <div class="${CARD} p-4">
      <div class="flex items-center gap-3">
        <span class="w-11 h-11 rounded-2xl grid place-items-center shrink-0 ${S.online ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate2'}">${ic('power', 20)}</span>
        <div class="min-w-0 flex-1">
          <div class="font-bold text-ink text-[15px]">${S.online ? 'You are online' : 'You are offline'}</div>
          <div class="text-[11.5px] text-slate2 mt-0.5">${S.online ? 'Requests near you are being routed to you' : 'Go online to start receiving requests'}</div>
        </div>
        <button data-act="toggle-online" role="switch" aria-checked="${S.online}"
          class="shrink-0 w-[52px] h-8 rounded-full p-1 transition ${S.online ? 'bg-brand' : 'bg-line'}">
          <span class="block w-6 h-6 rounded-full bg-white shadow-card transition-transform ${S.online ? 'translate-x-5' : ''}"></span>
        </button>
      </div>
    </div>

    ${offer ? `<div class="mt-4">
      <h2 class="text-[13px] font-bold text-slate1 uppercase tracking-wide mb-2.5">New request</h2>
      ${offerCard(offer)}
    </div>` : ''}

    ${live.length ? `<div class="mt-5">
      <h2 class="text-[13px] font-bold text-slate1 uppercase tracking-wide mb-2.5">In progress</h2>
      <div class="space-y-3">${live.map(jobRow).join('')}</div>
    </div>` : ''}

    ${!offer && !live.length ? `<div class="text-center text-slate2 py-14">
      ${ic('truck', 34, 'mx-auto mb-3 text-faint')}
      <div class="font-bold text-ink text-[15px]">Nothing right now</div>
      <div class="text-[13px] mt-1 px-6 leading-relaxed">${S.online ? 'You are online. The next request near you will land here.' : 'You are offline, so nothing is being sent to you.'}</div>
    </div>` : ''}

    ${done.length ? `<div class="mt-6">
      <h2 class="text-[13px] font-bold text-slate1 uppercase tracking-wide mb-2.5">Completed</h2>
      <div class="space-y-3">${done.map(jobRow).join('')}</div>
    </div>` : ''}
  </div>`;
    }

    /* An offer has to answer three questions before it is worth reading further:
       what is it, how far, and what does it pay me. Everything else waits for
       the job page. */
    function offerCard(j) {
      const v = vehParts(j);
      // Tappable, because an offer is judged on more than the summary: the
      // customer's own description of the fault sits on the detail page, and
      // Accept and Decline are repeated there so it can be answered from either.
      return `<div data-jobopen="${j.id}" class="${CARD} p-4 border-2 border-brand cursor-pointer active:scale-[.99] transition">
    <div class="flex items-center gap-2 mb-3">
      <span class="inline-flex items-center gap-1.5 text-[10.5px] font-bold uppercase tracking-wide text-brand bg-brand/10 rounded-full px-2.5 py-1">
        <span class="w-1.5 h-1.5 rounded-full bg-brand"></span>New offer</span>
      <span class="text-[11.5px] text-slate2 ml-auto">${j.id}</span>
    </div>
    <div class="flex items-center gap-2.5">
      <span class="w-11 h-11 rounded-2xl grid place-items-center bg-brand/10 text-brand shrink-0">${ic(svcOf(j.service).ic, 21)}</span>
      <div class="min-w-0 flex-1">
        <div class="font-bold text-ink text-[15px]">${svcLabel(j)}</div>
        <div class="text-[11.5px] text-slate2 truncate">${[v.make, v.model].filter(Boolean).join(' ')} · ${v.plate}</div>
      </div>
      <div class="text-right shrink-0">
        <div class="font-bold text-ink text-[15px]">${money(netOf(j.fare.total))}</div>
        <div class="text-[10.5px] text-slate2">you earn</div>
      </div>
    </div>
    <div class="mt-3 pt-3 border-t border-line space-y-1.5 text-[12px] text-slate1">
      <div class="flex items-start gap-2">${ic('pin', 14)}<span class="flex-1">${j.address}</span></div>
      <div class="flex items-center gap-2">${ic('nav', 14)}<span>${j.km} km away · about ${Math.max(3, Math.round(j.km * 4))} min</span></div>
    </div>
    <div class="mt-3 pt-3 border-t border-line flex items-center gap-2 text-brand font-bold text-[12.5px]">
      ${ic('arrow-right', 14)} View the full request
    </div>
    <div class="grid grid-cols-2 gap-2.5 mt-3">
      <button data-act="decline-offer" class="${BTN2}">Decline</button>
      <button data-act="accept-offer" class="${BTN}">Accept</button>
    </div>
  </div>`;
    }

    const jobRow = j => `<button data-jobopen="${j.id}" class="w-full ${CARD} p-4 text-left active:scale-[.99] transition">
    <div class="flex items-center gap-2 mb-2">${statusPill(j.status)}<span class="text-[11.5px] text-slate2 ml-auto">${j.id}</span></div>
    <div class="flex items-center gap-2.5">
      <span class="w-9 h-9 rounded-xl grid place-items-center bg-brand/10 text-brand shrink-0">${ic(svcOf(j.service).ic, 18)}</span>
      <div class="min-w-0 flex-1"><div class="font-bold text-ink text-[14px] truncate">${svcLabel(j)}</div>
        <div class="text-[11.5px] text-slate2 truncate">${j.customer} · ${j.address}</div></div>
      <b class="text-ink text-[14px] shrink-0">${money(netOf(j.fare.total))}</b>
    </div>
    ${LIVE.includes(j.status) ? `<div class="mt-3 pt-3 border-t border-line flex items-center gap-2 text-brand font-bold text-[12.5px]">
      ${ic('arrow-right', 14)} ${NEXT_LABEL[j.status]}</div>` : ''}
  </button>`;

    /* ---- adding work done on site ----
       A provider often finds more than was reported: a second fault, or parts
       and labour that were not part of the original request. Both go on the
       bill here, up until the customer pays. Anything added is a claim, not a
       charge — the customer settles or declines it at payment, and the provider
       is told which way it went. */
    function addWorkSheet(j) {
      S.pick = [];
      paintWorkSheet(j);
    }
    function paintWorkSheet(j) {
      const already = (j.items || []).map(i => i.svc).filter(Boolean);
      const left = SERVICES.filter(x => !already.includes(x.id));
      const n = S.pick.length;
      /* The one-off charge sits in the same sheet as the service picker, so a
         repaint would wipe whatever had been typed into it. Carry it across. */
      const keptLabel = (el('w-label') || {}).value || '';
      const keptAmount = (el('w-amount') || {}).value || '';
      const html = `<div class="font-display font-bold text-ink" style="font-size:22px">Add to this job</div>
    <p class="text-[13px] text-slate1 mt-1.5">The customer approves or declines anything you add when they pay.</p>

    <div class="text-[11px] font-bold text-slate1 uppercase tracking-wide mt-5 mb-2">Another service</div>
    ${left.length ? `<div class="grid grid-cols-2 gap-2.5">
      ${left.map(x => {
        const on = S.pick.includes(x.id);
        return `<button data-act="toggle-work-pick" data-id="${x.id}" data-job="${j.id}"
        class="${CARD} p-3 text-left active:scale-[.97] transition border-2 ${on ? 'border-brand' : 'border-transparent'}">
        <span class="w-9 h-9 rounded-xl grid place-items-center mb-2 ${on ? 'bg-brand text-white' : 'bg-brand/10 text-brand'}">${on ? ic('check', 17) : ic(x.ic, 18)}</span>
        <div class="font-bold text-ink text-[13px] leading-tight">${x.name}</div>
        <div class="text-[11px] text-slate2 mt-0.5">${money(x.base)}</div></button>`;
      }).join('')}
    </div>
    <button data-act="add-job-svc" data-job="${j.id}" ${n ? '' : 'disabled'} class="${BTN} mt-3 ${n ? '' : 'opacity-40'}">
      ${ic('plus', 17)} ${n ? `Add ${n} service${n > 1 ? 's' : ''} · ${money(S.pick.reduce((t, id) => t + svcOf(id).base, 0))}` : 'Select a service'}</button>`
          : `<p class="text-[12.5px] text-slate2">Every service is already on this job.</p>`}

    <div class="text-[11px] font-bold text-slate1 uppercase tracking-wide mt-5 mb-2">Or a one-off charge</div>
    <div class="space-y-3">
      <div><label class="${LABEL}">What was done</label>
        <input id="w-label" value="${esc(keptLabel)}" placeholder="e.g. replacement valve and balancing" class="${FIELD}"></div>
      <div><label class="${LABEL}">Amount</label>
        <div class="flex items-center border border-line rounded-2xl px-4 bg-white focus-within:border-brand transition">
          <span class="text-faint shrink-0 font-bold text-[15px]">$</span>
          <input id="w-amount" value="${esc(keptAmount)}" inputmode="decimal" placeholder="0.00" class="flex-1 py-3.5 px-2.5 text-[15px] bg-transparent outline-none text-ink"></div></div>
    </div>
    <button data-act="add-job-fee" data-job="${j.id}" class="${BTN2} w-full mt-4">${ic('plus', 16)} Add charge</button>
    <button data-act="close-sheet" class="${BTN2} w-full mt-2">Cancel</button>`;
      if (!repaintSheet(html)) openSheet(html);
    }

    /* A provider calling off a job they have taken. The reason is required: it
       is the only account of why a customer was left waiting, and it is what an
       administrator will look for. */
    function cancelSheet(j) {
      openSheet(`<div class="font-display font-bold text-ink" style="font-size:22px">Cancel this job?</div>
    <p class="text-[13px] text-slate1 leading-relaxed mt-2">${j.customer} is expecting you. The request goes back to the
      platform to be routed to someone else. Tell us why.</p>
    <div class="mt-4">
      <label class="${LABEL}">Reason for cancelling</label>
      <textarea id="cx-reason" rows="3" placeholder="e.g. vehicle needs equipment I do not carry" class="${FIELD} resize-none"></textarea>
    </div>
    <div class="grid grid-cols-2 gap-2.5 mt-5">
      <button data-act="close-sheet" class="${BTN2}">Keep it</button>
      <button data-act="confirm-cancel" data-id="${j.id}" class="w-full inline-flex items-center justify-center gap-2 bg-red-600 text-white font-semibold rounded-2xl px-5 py-3.5 active:scale-[.98] transition text-[15px]">Cancel job</button>
    </div>`);
    }

    /* ---- one job ----
       The provider's side of the screen the customer is watching. One action at
       a time, because on a roadside there is only ever one next thing to do. */
    const NEXT_STEP = { accepted: 'enroute', enroute: 'arrived', arrived: 'working', working: 'completed' };
    const NEXT_LABEL = { accepted: 'On the way', enroute: 'Mark arrived', arrived: 'Start service', working: 'Complete job' };
    const MOVE = { assigned: 0.10, accepted: 0.16, enroute: 0.58, arrived: 1, working: 1 };
    const jobById = id => JOBS.find(x => x.id === id) || (OFFER && OFFER.id === id ? OFFER : null);
    /* The six moments worth recording. `paid` and `released` are one line to the
       provider — both mean the money side is done — so they share a row and
       whichever stamp exists is the one shown. */
    const TIMELINE = [
      { key: 'assigned', label: 'Request assigned' },
      { key: 'accepted', label: 'Accepted' },
      { key: 'enroute', label: 'On the way' },
      { key: 'arrived', label: 'Arrived' },
      { key: 'completed', label: 'Completed' },
      /* No `paid` fallback here. `paid` means the customer has settled but the
         platform has not released the money — exactly the state the provider
         sees as "Payout pending" — so ticking Payment done against it
         contradicted the status pill three inches above it. */
      { key: 'released', label: 'Payment done' },
    ];
    function jobTimeline(j) {
      const at = j.cancel ? FLOW.indexOf(j.cancel.from) : FLOW.indexOf(j.status);
      const st = j.stamps || {};
      /* Set smaller than the cards around it. This is a record of what has
         already happened — worth having, rarely the reason the page was
         opened — so the time sits under its own step rather than in a second
         column competing for the eye. */
      return `<div class="${CARD} p-3.5 mt-3">
    <div class="font-bold text-slate1 text-[11px] uppercase tracking-wide mb-2.5">Progress</div>
    ${TIMELINE.map((step, i) => {
        const stamp = st[step.key] || '';
        const done = at >= FLOW.indexOf(step.key);
        const last = i === TIMELINE.length - 1;
        return `<div class="flex gap-2.5">
      <div class="flex flex-col items-center">
        <span class="tl-dot-sm ${done ? 'bg-brand text-white' : 'bg-line text-faint'}">${done ? ic('check', 10) : `<span class="w-1.5 h-1.5 rounded-full bg-white"></span>`}</span>
        ${last ? '' : `<span class="tl-line ${done && at > FLOW.indexOf(step.key) ? 'on' : ''}"></span>`}
      </div>
      <div class="min-w-0 flex-1" style="padding-bottom:${last ? 0 : 8}px">
        <div class="text-[12px] font-semibold ${done ? 'text-ink' : 'text-slate2'} leading-tight">${step.label}</div>

    /* ================= FLOW ACTIONS ================= */
    /* Taking a job puts it in the book and opens it; declining hands it back to
       the platform to route elsewhere. Either way the offer is gone from this
       screen, because an offer answered is not an offer any more. */
    function acceptOffer() {
      const o = S.offer; if (!o) return;
      /* The accepted job is a copy. Pushing the offer object itself put the
         template into the book, so the next time an offer was shown it was the
         same record — and it appeared twice, once as an offer and once as the
         job it had already become. */
      const job = Object.assign({}, o, { provider: ME, status: 'accepted', stamps: {} });
      stampNow(job, 'assigned'); stampNow(job, 'accepted');
      JOBS.push(job); S.offer = null;
      // Accepting from the offer's own page should stay on it rather than
      // stacking a second copy of the same screen.
      const top = S.stack[S.stack.length - 1];
      if (top && top.type === 'job' && top.id === job.id) render();
      else openPage('job', job.id);
      toast('Job accepted', 'check');
    }
    function declineOffer() {
      if (!S.offer) return;
      S.offer = null;

      if (S.stack.length) { S.stack = []; }
      render(); scrollTop();
      toast('Offer declined', 'x');

    /* ================= EVENTS ================= */

      if (act) {
        const a = act.dataset.act, id = act.dataset.id;
        switch (a) {
          case 'splash-done': clearTimeout(splashTimer); S.screen = 'welcome'; render(); break;
          case 'go-signup': case 'go-login': {
            S.auth = authState({ mode: a === 'go-signup' ? 'signup' : 'login' });
            S.screen = 'auth'; render(); scrollTop(); break;
          }
          case 'auth-mode': {
            readAuthFields();
            S.auth.mode = act.dataset.val; S.auth.step = 'form';
            render(); scrollTop(); break;
          }
          case 'auth-method': readAuthFields(); S.auth.method = act.dataset.val; render(); break;
          // Every auth screen backs out to the same place: the welcome screen.
          case 'auth-exit': clearInterval(resendTimer); S.screen = 'welcome'; render(); break;
          case 'pending-login': {
            S.auth = authState({ mode: 'login' });
            S.screen = 'auth'; render(); scrollTop(); break;
          }
          // Opened from sign-up, so whatever has been typed is kept first.
          case 'legal': {
            if (S.screen === 'auth') readAuthFields();
            S.legalBack = S.screen; S.legal = act.dataset.val; S.screen = 'legal';
            render(); scrollTop(); break;
          }
          case 'legal-back': S.screen = S.legalBack || 'auth'; render(); scrollTop(); break;
          case 'signup-next': {
            readAuthFields();
            const a2 = S.auth;
            if (!a2.first.trim()) { toast('Enter your first name', 'alert'); return; }
            if (!a2.last.trim()) { toast('Enter your last name', 'alert'); return; }
