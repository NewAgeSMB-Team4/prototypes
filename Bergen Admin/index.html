          ${t.demand ? `<button class="${C.btnSm} ${C.primary}" data-act="new-event" data-town="${esc(town)}">${icon('plus', 15)} Schedule an event</button>` : ''}`
      });
    }

  </script>
  <script>
    /* ═══════════════ 2. PARENT ACCOUNTS ═══════════════ */
    function parentsView() {
      const f = state.f.parents;
      const rows = FILTERED.parents();
      const stats = [
        ['Total parents', PARENTS.length, 'users', '#e2ebfa|#2d5a8e'],
        ['Active', PARENTS.filter(p => p.status === 'active').length, 'check', '#e3f2e9|#20643d'],
        ['Blocked', PARENTS.filter(p => p.status === 'blocked').length, 'ban', '#fbe4e1|#a3271c']
      ];
      return `<div class="grid gap-5">
        ${miniStats(stats)}
        ${panel('All parent accounts', `<span class="${C.pill} ${PILL.navy}">${rows.length} shown</span>`, `
          ${toolbar(`${searchBox('parents', 'Search by name, email or phone…')}
            ${selectBox('parents', 'status', [['active', 'Active'], ['blocked', 'Blocked']], 'All statuses')}
            <button class="${C.btnSm} ${C.ghost}" data-act="export" data-what="parents">${icon('download', 15)} Export</button>`)}
          ${tableWrap(`<thead><tr><th>Parent</th><th>Contact</th><th>Joined</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>${rows.length ? rows.map(p => `<tr>
              <!-- A signup's preferences run to a dozen values across two
                   sets — too much for columns. The row carries the shape of
                   them (a count each, in that set's own colour) and the
                   values themselves open in the preferences popup. -->
              <td><div class="flex items-center gap-[0.7rem] min-w-0">${avatar(p.name, 38, p.photo)}
                <div class="min-w-0">
                  <div class="font-bold truncate">${esc(p.name)}</div>
                  <!-- Signup does not force these, so a parent may have none.
                       An empty row of zeroes labelled "Preferences" invites a
                       click that opens nothing, so it is simply absent. -->
                  ${(p.ages || []).length || (p.towns || []).length ? `
                  <button class="group flex items-center gap-[0.3rem] mt-[3px] text-[0.72rem] font-bold" data-act="view-parent" data-id="${p.id}" title="View preferences">
                    ${(p.ages || []).length ? `<span class="inline-flex items-center gap-[0.2rem] px-[0.4rem] py-[0.1rem] rounded-[100px] bg-mint text-brand">${icon('users', 10)}${p.ages.length}</span>` : ''}
                    ${(p.towns || []).length ? `<span class="inline-flex items-center gap-[0.2rem] px-[0.4rem] py-[0.1rem] rounded-[100px] bg-sel text-head">${icon('pin', 10)}${p.towns.length}</span>` : ''}
                    <span class="text-muted font-semibold group-hover:text-brand group-hover:underline">Preferences</span>
                  </button>` : ''}
                </div></div></td>
              <td><div class="text-[0.86rem] leading-[1.45]"><div class="flex items-center gap-[0.35rem] text-head">${icon('mail', 13, 'text-muted')} ${esc(p.email)}</div>
                <div class="flex items-center gap-[0.35rem] text-muted mt-[2px]">${icon('phone', 13)} ${p.phone}</div></div></td>
              <td class="text-muted text-[0.86rem]">${fmtDate(p.joined)}</td>
              <td>${sp(p.status)}</td>
              <!-- No view button. Everything a profile popup would show is
                   already a column on this row; the only thing it cannot hold
                   is the preference sets, and the Preferences link under the
                   name opens those. -->
              <td><div class="flex gap-[0.4rem]">
                <button class="${C.iconbtn} ${p.status === 'active' ? C.iconWarn : C.iconOk}" data-act="toggle-block" data-kind="parent" data-id="${p.id}" title="${p.status === 'active' ? 'Block' : 'Unblock'}">${icon(p.status === 'active' ? 'ban' : 'unlock', 15)}</button>
                <button class="${C.iconbtn} ${C.iconBad}" data-act="delete" data-kind="parent" data-id="${p.id}" title="Delete">${icon('trash', 15)}</button>
              </div></td></tr>`).join('') : emptyRow(5, 'No parents found')}</tbody>`)}`)}
      </div>`;
    }

    function miniStats(items) {
      return `<div class="grid gap-4 max1200:!grid-cols-2 max560:!grid-cols-1" style="grid-template-columns:repeat(${items.length},minmax(0,1fr))">
        ${items.map(([label, val, ic, tone]) => {
        const [bg, fg] = tone.split('|'); return `
          <div class="${C.card} p-[1.1rem] flex items-center gap-[0.9rem]">
            <span class="w-[44px] h-[44px] rounded-[12px] tint inline-flex items-center justify-center shrink-0" style="--chip-bg:${bg};--chip-fg:${fg}">${icon(ic, 21)}</span>
            <div class="min-w-0"><div class="font-serif text-[1.5rem] font-black text-head leading-none">${typeof val === 'number' ? num(val) : val}</div>
            <!-- Wraps to a second line rather than truncating. A tile that reads
                 "Featured on main pa…" has lost the word that gave it meaning,
                 and four tiles across leave no room for a long label on one line. -->
            <div class="text-[0.82rem] text-muted font-semibold mt-[0.2rem] leading-[1.3]">${label}</div></div>
          </div>`;
      }).join('')}
      </div>`;
    }

    /* ═══════════════ 3. BUSINESS ACCOUNTS ═══════════════ */

    /* ═══════════════ 4. ADVERTISER ACCOUNTS ═══════════════ */
    function advertisersView() {
      const f = state.f.advertisers;
      const rows = FILTERED.advertisers();
      const pend = ADVERTISERS.filter(a => a.status === 'pending');
      const stats = [
        ['Total advertisers', ADVERTISERS.length, 'megaphone', '#ede6f8|#5c4382'],
        ['Approved', ADVERTISERS.filter(a => a.status === 'approved').length, 'verified', '#e3f2e9|#20643d'],
        ['Pending', pend.length, 'clock', '#fdeed5|#8a5200'],
        ['Total revenue', money(rows.reduce((s, x) => s + x.spend, 0)).replace('.00', ''), 'dollar', '#ddf1ec|#14685a']
      ];
      return `<div class="grid gap-5">
        ${miniStats(stats)}
        ${panel('All advertiser accounts', `<span class="${C.pill} ${PILL.navy}">${rows.length} shown</span>`, `
          ${toolbar(`${searchBox('advertisers', 'Search by advertiser name, email or phone…')}
            ${selectBox('advertisers', 'status', [['approved', 'Approved'], ['pending', 'Pending'], ['blocked', 'Blocked']], 'All statuses')}
            ${selectBox('advertisers', 'adv', ADVERTISERS.map(a => [a.id, a.company]), 'All advertisers')}
            <button class="${C.btnSm} ${C.ghost}" data-act="export" data-what="advertisers">${icon('download', 15)} Export</button>`)}
          ${tableWrap(`<thead><tr><th>Company</th><th>Contact Person</th><th>Joined</th><th>Ads</th><th>Revenue</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>${rows.length ? rows.map(a => `<tr>
              <!-- Where the business is, and its site, belong with the company
                   name rather than in columns of their own — the table already
                   carries seven. A site is optional, so say so when there is
                   none instead of leaving a gap. The account picture leads the
                   row here; initials fall back to the company, not the person. -->
              <td><div class="flex items-start gap-[0.7rem] min-w-0 max-w-[264px]">
                ${avatar(a.company, 40, a.photo)}
                <div class="min-w-0 text-[0.86rem] leading-[1.45]">
                <div class="font-bold text-head truncate">${esc(a.company)}</div>
                <div class="text-muted flex items-start gap-[0.3rem] mt-[3px]">${icon('pin', 12, 'shrink-0 mt-[2px]')}
                  <span class="min-w-0">${esc([a.address, a.town].filter(Boolean).join(', ')) || '—'}</span></div>
                <!-- A pill, not the URL: domains vary wildly in length and were
                     stretching the column. The address is on the link and in
                     the tooltip, so nothing is lost. -->
                ${a.website
          ? `<a href="https://${esc(a.website)}" target="_blank" rel="noopener" title="${esc(a.website)}"
               class="${C.pill} ${PILL.green} mt-[5px] hover:brightness-110 transition-all">Website link ${icon('arrow-right', 11)}</a>`
          : `<span class="${C.pill} ${PILL.grey} mt-[5px]">No website</span>`}
              </div></div></td>
              <td><div class="text-[0.86rem] leading-[1.45] min-w-0"><div class="font-semibold text-head truncate">${esc(a.contact)}</div>
                <div class="text-muted flex items-center gap-[0.3rem] mt-[2px]">${icon('mail', 12)} <span class="truncate">${esc(a.email)}</span></div>
                <div class="text-muted flex items-center gap-[0.3rem] mt-[2px]">${icon('phone', 12)} ${a.phone}</div></div></td>
              <td class="text-muted text-[0.86rem]">${fmtDate(a.joined)}</td>
              <td class="font-semibold">${a.campaigns}</td>
              <td class="font-semibold">${a.spend ? money(a.spend).replace('.00', '') : '—'}</td>
              <td>${sp(a.status)}</td>
              <td><div class="flex gap-[0.4rem]">
                ${a.status === 'pending' ? `<button class="${C.iconbtn} ${C.iconOk}" data-act="approve" data-kind="advertiser" data-id="${a.id}" title="Approve account">${icon('check', 15)}</button>` :
          `<button class="${C.iconbtn} ${a.status === 'approved' ? C.iconWarn : C.iconOk}" data-act="toggle-block" data-kind="advertiser" data-id="${a.id}" title="${a.status === 'approved' ? 'Block' : 'Unblock'}">${icon(a.status === 'approved' ? 'ban' : 'unlock', 15)}</button>`}
                <button class="${C.iconbtn} ${C.iconBad}" data-act="delete" data-kind="advertiser" data-id="${a.id}" title="Delete">${icon('trash', 15)}</button>
              </div></td></tr>`).join('') : emptyRow(7, 'No advertisers found')}</tbody>`)}`)}
      </div>`;
    }

    /* ═══════════════ 5. CATEGORIES ═══════════════ */
    function categoriesView() {
      const feat = featuredCats();
      const full = feat.length >= FEATURED_MAX;
      const stats = [
        ['Main categories', CATEGORIES.length, 'tag', '#f8e6ef|#a3277c'],
        ['Subcategories', CATEGORIES.reduce((n, c) => n + c.subs.length, 0), 'list', '#e2ebfa|#2d5a8e'],
        ['Active Categories', CATEGORIES.filter(c => c.active).length, 'check', '#e3f2e9|#20643d'],
        /* A fraction rather than a bare number: the home page has exactly four
           slots, so "3" alone does not say whether there is room left. */
        ['Featured on main page', `${feat.length} / ${FEATURED_MAX}`, 'star', '#fdeed5|#8a5200']
      ];
      return `<div class="grid gap-5">
        ${miniStats(stats)}
        <div class="flex items-center justify-between gap-3 flex-wrap">
          <p class="${C.sub} max-w-[60ch]">Any 4 categories can be chosen to be featured on the main page of the website.</p>
          <button class="${C.btn} ${C.primary}" data-act="new-category">${icon('plus', 16)} New main category</button>
        </div>

        <div class="grid grid-cols-2 gap-5 max1024:grid-cols-1">
          ${CATEGORIES.map(c => {
        /* Featuring is blocked for two different reasons, and a checkbox
           that just goes dead explains neither — so each carries its own
           line, shown under the box rather than only in a tooltip. */
        const why = c.featured ? ''
          : !c.active ? 'Hidden categories cannot be featured — list it in the directory first'
            : full ? `Four are already featured. Unfeature one to free a slot.` : '';
        return `<div class="${C.card} overflow-hidden ${c.active ? '' : 'opacity-[0.66]'}">
              <div class="h-[74px] flex items-center justify-between px-5 text-white relative overflow-hidden" style="background:${c.grad}">
                <div class="flex items-center gap-3 relative z-[1]">
                  <span class="w-[44px] h-[44px] rounded-[12px] bg-white/[0.2] inline-flex items-center justify-center backdrop-blur-sm">${icon(c.icon, 22)}</span>
                  <div><div class="font-serif text-[1.1rem] font-black leading-tight">${esc(c.name)}</div>
                  <div class="text-[0.78rem] text-white/80 font-semibold">${c.subs.length} subcategor${c.subs.length === 1 ? 'y' : 'ies'}</div></div>
                </div>
                <div class="absolute -right-[20px] -bottom-[30px] opacity-[0.14] pointer-events-none">${icon(c.icon, 110)}</div>
                <button class="relative z-[1] shrink-0" data-act="toggle-cat" data-id="${c.id}" aria-label="Toggle directory listing" title="${c.active ? 'Hide from the directory listing' : 'List in the directory'}">
                  <!-- Sits on the category's own gradient, so the track and
                       knob are literal white in both themes rather than the
                       surface token. -->
                  <span class="block w-[44px] h-[25px] rounded-[100px] relative transition-colors duration-200 ${c.active ? 'bg-white' : 'bg-white/[0.3]'}">
                    <span class="absolute top-[3px] left-[3px] w-[19px] h-[19px] rounded-full shadow-[0_1px_4px_rgba(0,0,0,0.25)] transition-transform duration-200 ${c.active ? 'translate-x-[19px] bg-grass-ink' : 'bg-white'}"></span>
                  </span>
                </button>
              </div>
              <div class="p-5">
                <div class="flex items-center justify-between gap-2 mb-3 flex-wrap">
                  <div class="${C.eyebrow}">Subcategories</div>
                  <span class="flex items-center gap-2">
                    ${c.featured ? pill('amber', 'On main page', 'star') : ''}
                    ${c.active ? pill('green', 'Listed') : pill('grey', 'Hidden')}
                  </span>
                </div>
                <div class="flex flex-wrap gap-2 mb-4 min-h-[38px]">
                  ${c.subs.map(s => `<span class="cat-tint inline-flex items-center gap-[0.4rem] text-[0.84rem] font-semibold px-[0.8rem] py-[0.35rem] rounded-[100px] text-head border-[1.5px] border-line2" style="--cat:${c.tint};background:var(--cat)">
                    ${esc(s)}<button class="text-muted hover:text-danger-t leading-[0]" data-act="del-sub" data-id="${c.id}" data-sub="${esc(s)}" aria-label="Remove ${esc(s)}">${icon('x', 12)}</button></span>`).join('')}
                  ${!c.subs.length ? `<span class="text-[0.85rem] text-muted italic">No subcategories yet</span>` : ''}
                </div>
                <!-- Home-page slot. It lives on the card rather than in the
                     category form because it is a choice across all nine
                     categories — four in, the rest out — and that only makes
                     sense where you can see the others. -->
                <div class="mb-4 pb-4 border-b border-b-line2">
                  <button type="button" role="checkbox" aria-checked="${!!c.featured}" ${why ? 'disabled' : ''}
                    data-act="toggle-featured" data-id="${c.id}"
                    class="w-full flex items-center gap-3 p-[0.7rem] rounded-[11px] border-[1.5px] text-left transition-colors duration-150 ${c.featured ? 'border-grass-ink bg-mint' : why ? 'border-line2 bg-surface-2 cursor-not-allowed' : 'border-line hover:border-head cursor-pointer'}">
                    <span class="w-[18px] h-[18px] rounded-[5px] border-[1.5px] inline-flex items-center justify-center shrink-0 transition-colors ${c.featured ? 'bg-grass-ink border-grass-ink text-white' : 'border-line bg-surface'}">${c.featured ? icon('check', 12) : ''}</span>
                    <span class="min-w-0 flex-1">
                      <span class="block text-[0.88rem] font-bold ${why ? 'text-muted' : 'text-head'}">Feature on main page</span>
                      ${why ? `<span class="block text-[0.76rem] text-muted leading-[1.45]">${why}</span>` : ''}
                    </span>
                    ${c.featured ? `<span class="text-brand shrink-0">${icon('star', 15)}</span>` : ''}
                  </button>
                </div>

                <div class="flex gap-2 flex-wrap">
                  <button class="${C.btnSm} ${C.ghost}" data-act="add-sub" data-id="${c.id}">${icon('plus', 14)} Add subcategory</button>
                  <button class="${C.btnSm} ${C.ghost}" data-act="edit-category" data-id="${c.id}">${icon('edit', 14)} Edit</button>
                  <button class="${C.btnSm} ${C.ghost} !text-danger-t hover:!border-danger-t ml-auto" data-act="delete" data-kind="category" data-id="${c.id}">${icon('trash', 14)} Delete</button>
                </div>
              </div>
            </div>`;
      }).join('')}
        </div>
      </div>`;
    }
  </script>
  <script>
    /* ═══════════════ 7. EVENTS & CALENDAR ═══════════════ */
    function eventsView() {
      const f = state.f.events;
      const rows = EVENTS.filter(e =>
        (!f.q || (e.name + e.town + e.organizer).toLowerCase().includes(f.q.toLowerCase())) &&
        (!f.status || e.status === f.status) &&
        (!f.from || (e.endDate || e.date) >= f.from) &&
        (!f.to || e.date <= f.to));
      const stats = [
        ['Total events', EVENTS.length, 'calendar', '#e7f0fd|#2d5a8e'],
        ['Published', EVENTS.filter(e => e.status === 'published').length, 'check', '#e3f2e9|#20643d'],
        ['Drafts', EVENTS.filter(e => e.status === 'draft').length, 'edit', '#e6ebf1|#465569'],
        ["Today's events", EVENTS.filter(e => e.date === d(0)).length, 'clock', '#fdeed5|#8a5200']
      ];
      const onReq = state.eventSection === 'requests';
      /* Two lists, one screen. Requests carry a person and a decision; events
         are already live. Splitting them keeps an approval queue from being
         mistaken for the schedule. */
      const secTabs = `<div class="flex gap-1 p-1 rounded-[100px] bg-surface-3">
          ${[['events', 'Events', 'calendar', EVENTS.length], ['requests', 'Event Requests', 'mail', EVENT_REQUESTS.filter(r => r.status === 'pending').length]]
        .map(([id, l, ic, n]) => `<button data-tab="eventSection" data-val="${id}" class="inline-flex items-center gap-[0.4rem] px-[0.9rem] py-[0.4rem] rounded-[100px] text-[0.85rem] font-bold min-h-[36px] transition-all ${state.eventSection === id ? 'bg-surface text-head shadow-[0_2px_8px_rgba(26,46,74,0.12)]' : 'text-muted hover:text-head'}">${icon(ic, 14)} ${l}${n ? `<span class="ml-[2px] min-w-[20px] h-[20px] px-[5px] rounded-[100px] ${id === 'requests' ? 'bg-sun text-[#1a2e4a]' : 'bg-surface-3 text-muted'} text-[0.7rem] font-extrabold inline-flex items-center justify-center">${n}</span>` : ''}</button>`).join('')}
        </div>`;

      if (onReq) return `<div class="grid gap-5">
        ${miniStats([
        ['Requests', EVENT_REQUESTS.length, 'mail', '#e7f0fd|#2d5a8e'],
        ['Pending', EVENT_REQUESTS.filter(r => r.status === 'pending').length, 'clock', '#fdeed5|#8a5200'],
        ['Rejected', EVENT_REQUESTS.filter(r => r.status === 'rejected').length, 'x', '#fbe9e7|#a8322a'],
        ['Approved to date', EVENTS.filter(e => e.fromRequest).length, 'check', '#e3f2e9|#20643d'],
      ])}
        ${panel('Event requests', secTabs, requestsTable())}
      </div>`;

      return `<div class="grid gap-5">
        ${miniStats(stats)}
        ${panel('Event management',
        `<div class="flex gap-2 items-center flex-wrap">
            ${secTabs}
            <button class="${C.btnSm} ${C.primary}" data-act="new-event">${icon('plus', 15)} Create event</button>
          </div>`,
        `
          ${toolbar(`${searchBox('events', 'Search event, town, or organizer…')}
            ${selectBox('events', 'status', [['published', 'Published'], ['draft', 'Draft'], ['past', 'Past']], 'All statuses')}
            ${calRangeChip()}
            ${clearFilters('events')}`)}
          <div class="grid grid-cols-[1fr_360px] gap-5 items-start max1200:grid-cols-1 p-5">
          <div class="min-w-0 order-1 max1200:order-2">
          ${tableWrap(`<thead><tr><th>Event</th><th>Date & time</th><th>Category</th><th>Town</th><th>Ages</th><th>Organizer</th><th>Status</th><th class="text-right">Actions</th></tr></thead>
            <tbody>${rows.length ? rows.map(e => `<tr class="${e.status === 'past' ? 'opacity-[0.62]' : ''}">
              <td><div class="flex items-center gap-[0.7rem] min-w-0">
                ${photoTile('w-[38px] h-[38px] rounded-[10px]', catOf(e.cat).tint, e.icon, 18, e.img)}
                <div class="min-w-0"><div class="font-bold truncate max-w-[200px]">${esc(e.name)}</div><div class="text-[0.78rem] text-muted truncate max-w-[200px]">${esc(e.desc)}</div></div></div></td>
              <td><div class="text-[0.86rem]"><div class="font-semibold text-head">${fmtDate(e.date)}</div><div class="text-muted flex items-center gap-[0.3rem] mt-[2px]">${icon('clock', 12)}${e.time}</div></div></td>
              <!-- Subcategory rides under its category rather than taking a
                   tenth column: it only ever means anything next to the
                   category it narrows. -->
              <td><div class="flex flex-col items-start gap-[0.25rem]">${catPill(e.cat)}
                ${e.sub ? `<span class="text-[0.76rem] font-semibold text-muted truncate max-w-[130px]" title="${esc(e.sub)}">${esc(e.sub)}</span>` : ''}</div></td>
              <td class="text-[0.88rem]">${e.town}</td><td class="text-[0.88rem]">${e.ages}</td>
              <td class="text-[0.86rem] text-muted">${esc(e.organizer)}</td>
              <td>${sp(e.status)}</td>
              <td><div class="flex gap-[0.4rem] justify-end">
                <button class="${C.iconbtn}" data-act="view-event" data-id="${e.id}" title="View">${icon('eye', 15)}</button>
                <!-- A past event is not edited or deleted, it is run again. The
                     one action offered opens the form with the dates cleared,
                     because a repeat always needs new ones. -->
                ${e.status === 'past' ? `
                <button class="${C.iconbtn} ${C.iconOk}" data-act="republish-event" data-id="${e.id}" title="Republish">${icon('refresh', 15)}</button>`
        : `
                <button class="${C.iconbtn}" data-act="edit-event" data-id="${e.id}" title="Edit">${icon('edit', 15)}</button>
                <button class="${C.iconbtn} ${C.iconOk}" data-act="toggle-event" data-id="${e.id}" title="${e.status === 'published' ? 'Unpublish' : 'Publish'}">${icon(e.status === 'published' ? 'eye-off' : 'check', 15)}</button>
                <button class="${C.iconbtn} ${C.iconBad}" data-act="delete" data-kind="event" data-id="${e.id}" title="Delete">${icon('trash', 15)}</button>`}
              </div></td></tr>`).join('') : emptyRow(8, 'No events found')}</tbody>`)}
          </div>
          <!-- The calendar is the date filter. Dots mark the days that have
               something on them, and picking two days sets the range — which
               is the question a From/To pair was asking in a clumsier way. -->
          <div class="min-w-0 order-2 max1200:order-1">${calendarPanel()}</div>
          </div>`)}
      </div>`;
    }

    /* The chip that says what the calendar has selected, and the only way to
       clear it other than picking again. */
    function calRangeChip() {
      const f = state.f.events;
      if (!f.from && !f.to) return `<span class="inline-flex items-center gap-[0.4rem] px-[0.9rem] min-h-[46px] rounded-[12px] border-[1.5px] border-dashed border-line text-[0.85rem] font-semibold text-muted">${icon('calendar', 14)} Pick dates on the calendar</span>`;
      const label = f.from && f.to && f.from !== f.to ? `${fmtDate(f.from)} — ${fmtDate(f.to)}` : fmtDate(f.from || f.to);
      return `<span class="inline-flex items-center gap-[0.5rem] px-[0.9rem] min-h-[46px] rounded-[12px] border-[1.5px] border-grass-ink bg-mint text-[0.85rem] font-bold text-brand">${icon('calendar', 14)} ${label}
        <button data-act="cal-clear" title="Clear dates" class="text-brand hover:opacity-70 leading-[0]">${icon('x', 13)}</button></span>`;
    }

    function requestsTable() {
      const rows = EVENT_REQUESTS;
      return tableWrap(`<thead><tr><th>Event</th><th>Requested by</th><th>Date &amp; time</th><th>Category</th><th>Town</th><th>Ages</th><th>Organizer</th><th>Status</th><th class="text-right">Actions</th></tr></thead>
        <tbody>${rows.length ? rows.map(r => `<tr class="${r.status === 'rejected' ? 'opacity-[0.62]' : ''}">
          <td><div class="flex items-center gap-[0.7rem] min-w-0">
            ${photoTile('w-[38px] h-[38px] rounded-[10px]', catOf(r.cat).tint, r.icon, 18, r.img)}
            <div class="min-w-0"><div class="font-bold truncate max-w-[190px]">${esc(r.name)}</div>
            <div class="text-[0.78rem] text-muted truncate max-w-[190px]">${catOf(r.cat).name}</div></div></div></td>
          <td><div class="min-w-0">
            <div class="font-semibold text-[0.88rem] truncate max-w-[200px]">${esc(r.reqName)}</div>
            <div class="text-[0.78rem] text-muted truncate max-w-[200px] flex items-center gap-[0.3rem]">${icon('mail', 11)}${esc(r.reqEmail)}</div>
            <div class="text-[0.78rem] text-muted truncate max-w-[200px] flex items-center gap-[0.3rem]">${icon('phone', 11)}${esc(r.reqPhone)}</div></div></td>
          <td><div class="text-[0.86rem]"><div class="font-semibold text-head">${fmtDate(r.date)}</div>
            <div class="text-muted flex items-center gap-[0.3rem] mt-[2px]">${icon('clock', 12)}${r.time}</div></div></td>
          <td><div class="flex flex-col items-start gap-[0.25rem]">${catPill(r.cat)}
            ${r.sub ? `<span class="text-[0.76rem] font-semibold text-muted truncate max-w-[130px]" title="${esc(r.sub)}">${esc(r.sub)}</span>` : ''}</div></td>
          <td class="text-[0.88rem]">${r.town}</td>
          <td class="text-[0.88rem]">${esc(r.ages)}</td>
          <td class="text-[0.86rem] text-muted">${esc(r.organizer)}</td>
          <td>${r.status === 'pending' ? `<span class="${C.pill} ${PILL.amber}">Pending</span>` : `<span class="${C.pill} ${PILL.red}">Rejected</span>`}</td>
          <!-- One button, not three. Approving or rejecting is a judgement about
               a submission, and the row does not show enough of it to judge on —
               so both decisions live on the screen that does. -->
          <td><div class="flex gap-[0.4rem] justify-end items-center">
            <button class="${C.iconbtn}" data-act="review-request" data-id="${r.id}"
              title="${r.status === 'pending' ? 'Review, approve or reject' : 'View request'}">${icon('eye', 15)}</button>
          </div></td></tr>`).join('') : emptyRow(9, 'No event requests')}</tbody>`);
    }

    /* The side calendar. A dot under a day means something is on; clicking one
       day starts a range and clicking a second closes it, which is the same
       question the old From/To boxes asked with two more clicks and a keyboard. */
    function calendarPanel() {
      const { y, m } = state.cal;
      const first = new Date(y, m, 1).getDay();
      const days = new Date(y, m + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < first; i++) cells.push(null);
      for (let i = 1; i <= days; i++) cells.push(i);
      while (cells.length % 7) cells.push(null);
      const iso = day => `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const todayIso = TODAY.toISOString().slice(0, 10);
      const f = state.f.events;
      const inRange = dIso => f.from && f.to && dIso >= f.from && dIso <= f.to;
      const isEnd = dIso => dIso === f.from || dIso === f.to;
      return `<div class="${C.card} p-4">
        <div class="flex items-center justify-between mb-3 gap-2">
          <button class="${C.iconbtn}" data-act="cal-prev" aria-label="Previous month">${icon('chev-left', 16)}</button>
          <div class="font-serif text-[1rem] font-black text-head text-center flex-1">${MONTHS_FULL[m]} ${y}</div>
          <button class="${C.iconbtn}" data-act="cal-next" aria-label="Next month">${icon('chev-right', 16)}</button>
        </div>
        <div class="grid grid-cols-7 gap-[3px] mb-1">
          ${DOW.map(dw => `<div class="text-center text-[0.62rem] font-bold uppercase tracking-[0.06em] text-adlabel py-1">${dw[0]}</div>`).join('')}
        </div>
        <div class="grid grid-cols-7 gap-[3px]">
          ${cells.map(day => {
        if (!day) return `<div class="h-[38px]"></div>`;
        const dIso = iso(day);
        const has = EVENTS.some(e => e.date === dIso);
        const sel = isEnd(dIso), mid = inRange(dIso) && !sel;
        return `<button data-act="cal-range" data-cal-day="${dIso}" class="h-[38px] rounded-[9px] relative flex flex-col items-center justify-center text-[0.82rem] font-bold transition-colors
            ${sel ? 'bg-grass-ink text-white' : mid ? 'bg-mint text-brand' : dIso === todayIso ? 'border-[1.5px] border-grass-ink text-head' : 'text-head hover:bg-surface-3'}">
            <span>${day}</span>
            ${has ? `<span class="absolute bottom-[5px] w-[5px] h-[5px] rounded-full ${sel ? 'bg-white' : 'bg-sun'}"></span>` : ''}
          </button>`;
      }).join('')}
        </div>
        <div class="flex items-center justify-between gap-2 mt-3 pt-3 border-t border-t-line2">
          <span class="inline-flex items-center gap-[0.4rem] text-[0.76rem] font-semibold text-muted">
            <span class="w-[6px] h-[6px] rounded-full bg-sun"></span> Has events</span>
          <button class="text-[0.78rem] font-bold text-muted hover:text-head" data-act="cal-today">Today</button>
        </div>
        <p class="text-[0.76rem] text-muted leading-[1.5] mt-2">${f.from && !f.to ? 'Now pick the second date to close the range.' : 'Pick two dates to filter the list by range.'}</p>
      </div>`;
    }

    const CAL_YEARS = Array.from({ length: 7 }, (_, i) => TODAY.getFullYear() - 2 + i);
    function calendarGrid() {
      const { y, m } = state.cal;
      const first = new Date(y, m, 1).getDay();
      const days = new Date(y, m + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < first; i++) cells.push(null);
      for (let i = 1; i <= days; i++) cells.push(i);
      while (cells.length % 7) cells.push(null);
      const iso = (day) => `${y}-${String(m + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const todayIso = TODAY.toISOString().slice(0, 10);
      return `
      <div class="flex items-center justify-between mb-5 flex-wrap gap-3">
        <div class="flex items-center gap-2">
          <button class="${C.iconbtn}" data-act="cal-prev" aria-label="Previous month">${icon('chev-left', 16)}</button>
          <div class="font-serif text-[1.15rem] font-black text-head min-w-[190px] text-center">${MONTHS_FULL[m]} ${y}</div>
          <button class="${C.iconbtn}" data-act="cal-next" aria-label="Next month">${icon('chev-right', 16)}</button>
        </div>
        <div class="flex items-center gap-2">
          <select id="cal-year" class="${C.inp} !w-auto !min-h-[42px] !py-[0.5rem] !pr-8 cursor-pointer font-semibold text-[0.88rem] !bg-surface">
            ${CAL_YEARS.map(yr => `<option value="${yr}" ${yr === y ? 'selected' : ''}>${yr}</option>`).join('')}
          </select>
          <button class="${C.btnSm} ${C.ghost}" data-act="cal-today">Today</button>
        </div>
      </div>
      <div class="grid grid-cols-7 gap-[6px] mb-2">
        ${DOW.map(dw => `<div class="text-center text-[0.72rem] font-bold uppercase tracking-[0.08em] text-adlabel py-1">${dw}</div>`).join('')}
      </div>
      <div class="grid grid-cols-7 gap-[6px]">
        ${cells.map(day => {
        if (!day) return `<div class="min-h-[104px] rounded-[12px] bg-surface-2 border-[1.5px] border-transparent"></div>`;
        const dayIso = iso(day);
        const evs = EVENTS.filter(e => e.date === dayIso);
        const isToday = dayIso === todayIso;
        return `<button data-act="cal-day" data-date="${dayIso}" class="min-h-[104px] rounded-[12px] border-[1.5px] p-2 text-left transition-all duration-150 flex flex-col gap-1 ${isToday ? 'border-grass-ink bg-mint' : 'border-line2 bg-surface hover:border-head hover:shadow-[0_4px_16px_rgba(26,46,74,0.08)]'}">
            <div class="flex items-center justify-between">
              <span class="text-[0.82rem] font-bold ${isToday ? 'text-brand' : 'text-head'}">${day}</span>
              ${evs.length ? `<span class="text-[0.65rem] font-extrabold px-[5px] py-px rounded-[100px] bg-sun text-[#1a2e4a]">${evs.length}</span>` : ''}
            </div>
            ${evs.slice(0, 2).map(e => `<span class="text-[0.7rem] font-semibold cat-tint text-head truncate px-[5px] py-[2px] rounded-[5px] block" style="--cat:${catOf(e.cat).tint};background:var(--cat)">${esc(e.name)}</span>`).join('')}
            ${evs.length > 2 ? `<span class="text-[0.68rem] text-muted font-semibold">+${evs.length - 2} more</span>` : ''}
          </button>`;
      }).join('')}
      </div>
      <div class="flex flex-wrap gap-x-4 gap-y-2 mt-5 pt-4 border-t border-t-line2">
        ${CATEGORIES.slice(0, 8).map(c => `<span class="inline-flex items-center gap-[0.4rem] text-[0.78rem] font-semibold text-muted">
          <i class="cat-tint w-[10px] h-[10px] rounded-[3px] not-italic border-[1.5px] border-line" style="--cat:${c.tint};background:var(--cat)"></i>${c.name.split(' ')[0]}</span>`).join('')}
      </div>`;
    }

    /* ═══════════════ 8. EDITORIAL ═══════════════ */

    /* The visibility switch reads as "is this article visible", so ON is the
       visible state: green track, knob to the right. It used to be wired the
       other way round — a live article showed a grey, knob-left switch, which
       every reader takes to mean "off" — so visible articles looked hidden and
       hidden ones looked live. `on` and the colours now agree. */
    function visibilityToggle(a) {
      const on = !a.hidden;   // on = visible to the public
      return `<button role="switch" aria-checked="${on}" data-act="toggle-article-hidden" data-id="${a.id}" title="${on ? 'Hide from public' : 'Show to public'}"
          class="relative w-[42px] h-[24px] rounded-[100px] transition-colors shrink-0 ${on ? 'bg-grass-ink' : 'bg-surface-5'}">
          <span class="absolute top-[3px] w-[18px] h-[18px] rounded-full bg-surface shadow-[0_1px_4px_rgba(15,26,44,0.3)] transition-all ${on ? 'left-[21px]' : 'left-[3px]'}"></span>
        </button>
        <span class="text-[0.8rem] font-semibold ${on ? 'text-brand' : 'text-muted'} mr-1">${on ? 'Visible' : 'Hidden'}</span>`;
    }

    /* Every article can be read, so View leads on all four rows.
       Published: view + hide-toggle + delete · Draft: view + edit + delete ·
       Expired: view + edit + delete — an expired article is not a dead record,
       it is one whose run ended, so editing it back into a draft or a fresh
       publish is the whole point of keeping it. `open` = already on the
       article's own page, where View would only reload what you are reading. */
    function articleActions(a, open) {
      const view = open ? '' : `<button class="${C.iconbtn}" data-act="view-article" data-id="${a.id}" title="View article">${icon('eye', 15)}</button>`;
      const edit = `<button class="${C.iconbtn}" data-act="edit-article" data-id="${a.id}" title="Edit">${icon('edit', 15)}</button>`;
      const del = `<button class="${C.iconbtn} ${C.iconBad}" data-act="delete" data-kind="article" data-id="${a.id}" title="Remove">${icon('trash', 15)}</button>`;
      if (a.status === 'published') return view + visibilityToggle(a) + del;
      return view + edit + del;   // draft · expired
    }
    /* ── Article detail (full page) ─────────────────────────────
       An article is a document, and a modal is the wrong shape for reading
       one — the body alone is longer than any dialog should be. So it takes
       over the Editorial view exactly the way the ad detail takes over
       Advertisements: state.artDetail holds the id, null means the list. */

    // Body is stored as plain text; a blank line starts a new paragraph.
    const bodyParas = (body) => String(body || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
    const wordCount = (body) => bodyParas(body).join(' ').split(/\s+/).filter(Boolean).length;
    // ~200 wpm, floored at a minute — same shape as the `read` strings above.
    const readTime = (body) => `${Math.max(1, Math.round(wordCount(body) / 200))} min`;

    function articleDetailView(a) {
      const c = catOf(a.cat);
      const paras = bodyParas(a.body);
      const visible = a.status === 'published' && !a.hidden;

      return `<div class="grid gap-5">

        <!-- Back bar + the actions that were on the row -->
        <div class="flex items-center gap-3 flex-wrap">
          <button class="${C.btnSm} ${C.ghost}" data-act="article-back">${icon('chev-left', 15)} Back to articles</button>
          <span class="ml-auto flex items-center gap-2 flex-wrap">${sp(a.status)}${catPill(a.cat)}${a.status === 'published' ? (visible ? pill('green', 'Visible', 'eye') : pill('grey', 'Hidden', 'eye-off')) : ''}</span>
          <span class="flex gap-[0.4rem] items-center">${articleActions(a, true)}</span>
        </div>

        ${miniStats([
        ['Views', a.views ? num(a.views) : '—', 'eye', '#e2ebfa|#2d5a8e'],
        ['Published', a.status === 'draft' ? 'Not yet' : fmtDate(a.date), 'calendar', '#e3f2e9|#20643d'],
      ])}

        <div class="grid grid-cols-[1.55fr_1fr] gap-5 max1200:grid-cols-1 items-start">

          <!-- ── LEFT: the article as a reader sees it ── -->
          <div class="grid gap-5 min-w-0">
            ${panel('Article', `<span class="text-[0.8rem] text-muted font-semibold">${a.status === 'draft' ? 'Draft preview' : a.status === 'expired' ? 'Ended ' + fmtDate(a.endDate || a.date) : 'Live on the site'}</span>`, `
              <div class="relative h-[240px] max700:h-[180px] cat-tint overflow-hidden flex items-center justify-center text-head" style="--cat:${c.tint};background:var(--cat)">
                ${icon(c.icon, 44)}
                ${hasArt(a.img) ? `<img src="${artSrc(a.img, 1100)}" alt="" loading="lazy" class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()">` : ''}
              </div>
              <div class="p-5 max700:px-4">
                <h3 class="font-serif text-[1.75rem] max700:text-[1.35rem] font-black text-head tracking-[-0.02em] leading-[1.2] mb-3">${esc(a.title)}</h3>
                <p class="text-[1.02rem] text-muted leading-[1.65] font-medium mb-4">${esc(a.excerpt)}</p>
                <div class="flex items-center gap-3 pb-5 mb-5 border-b border-b-line2">
                  ${avatar(a.author, 40)}
                  <div class="min-w-0">
                    <div class="text-[0.92rem] font-bold text-head truncate">${esc(a.author)}</div>
                    <div class="text-[0.82rem] text-muted truncate">${a.status === 'draft' ? 'Unpublished' : fmtDate(a.date)}</div>
                  </div>
                </div>
                ${paras.length
          ? `<div class="grid gap-4">${paras.map((p, i) => `<p class="text-[1.02rem] text-head leading-[1.8] ${i === 0 ? 'first-letter:font-serif first-letter:text-[2.6rem] first-letter:font-black first-letter:float-left first-letter:leading-[0.9] first-letter:mr-[0.5rem] first-letter:mt-[0.35rem] first-letter:text-brand' : ''}">${esc(p)}</p>`).join('')}</div>`
          /* An article with no body is not an error — it is a draft someone
             started from the headline. Say that, and offer the way forward. */
          : `<div class="flex flex-col items-center gap-2 py-12 text-muted text-center">
                    <span class="w-[52px] h-[52px] rounded-[14px] bg-surface-3 inline-flex items-center justify-center">${icon('news', 22)}</span>
                    <div class="font-bold text-head">No body written yet</div>
                    <div class="text-[0.88rem] mb-2">This article has a headline and an excerpt, but no copy.</div>
                    <button class="${C.btnSm} ${C.primary}" data-act="edit-article" data-id="${a.id}">${icon('edit', 15)} Write the body</button>
                  </div>`}
              </div>`)}
          </div>

          <!-- ── RIGHT: the record behind the document ── -->
          <div class="grid gap-5 min-w-0">

            ${panel('Article details', '', `<div class="p-5">
              ${infoRow('Status', sp(a.status))}
              ${infoRow('Category', `<span class="cat-tint inline-flex items-center text-[0.85rem] font-bold px-[0.7rem] py-[0.25rem] rounded-[100px] text-head border-[1.5px] border-line2" style="--cat:${c.tint};background:var(--cat)">${esc(c.name)}</span>`)}
              ${infoRow('Author', esc(a.author))}
              ${infoRow('Published', a.status === 'draft' ? '<span class="text-muted italic font-normal">Not published</span>' : fmtDate(a.date))}
              ${infoRow('End date', a.endDate ? fmtDate(a.endDate) : '<span class="text-muted italic font-normal">No end date</span>')}
              ${infoRow('Views', a.views ? num(a.views) : '—')}
            </div>`)}

            ${a.status === 'published'
          ? panel('Visibility', '', `<div class="p-5">
              <div class="flex items-center gap-3 mb-3">${visibilityToggle(a)}</div>
              <p class="text-[0.86rem] text-muted leading-[1.6]">${visible
              ? 'This article is live and readable by anyone on the site. Switch it off to pull it from the public site without deleting it.'
              : 'This article is published but hidden from the public site. Switch it back on to make it readable again.'}</p>
            </div>`)
          /* Expired is the state this page exists for: the run ended, the
             copy is still good, and the only question is whether it goes
             back out now or waits in drafts. Both answers are one click. */
          : a.status === 'expired'
            ? panel('This article has expired', '', `<div class="p-5">
              <p class="text-[0.9rem] text-muted leading-[1.7] mb-4">Its run ended${a.endDate ? ` on <strong class="text-head">${fmtDate(a.endDate)}</strong>` : ''}, so it is off the public site. Nothing has been lost — edit it back into drafts, or publish it again with a new end date.</p>
              <div class="flex flex-wrap gap-2">
                <button class="${C.btnSm} ${C.primary}" data-act="republish-article" data-id="${a.id}">${icon('check', 15)} Publish again</button>
                <button class="${C.btnSm} ${C.ghost}" data-act="edit-article" data-id="${a.id}">${icon('edit', 15)} Edit</button>
              </div>
            </div>`)
            : panel('This article is a draft', '', `<div class="p-5">
              <p class="text-[0.9rem] text-muted leading-[1.7] mb-4">Nobody outside this console can read it yet. Publishing it dates it today and puts it on the site straight away.</p>
              <div class="flex flex-wrap gap-2">
                <button class="${C.btnSm} ${C.primary}" data-act="approve-article" data-id="${a.id}">${icon('check', 15)} Publish now</button>
                <button class="${C.btnSm} ${C.ghost}" data-act="edit-article" data-id="${a.id}">${icon('edit', 15)} Edit</button>
              </div>
            </div>`)}

          </div>
        </div>
      </div>`;
    }

    function editorialView() {
      // A selected article takes the whole view; the list is the null case.
      if (state.artDetail) {
        const open = ARTICLES.find(x => x.id === state.artDetail);
        if (open) return articleDetailView(open);
        state.artDetail = null;   // deleted while open — fall back to the list
      }
      const f = state.f.editorial;
      const rows = ARTICLES.filter(a =>
        (!f.q || (a.title + a.author).toLowerCase().includes(f.q.toLowerCase())) &&
        (!f.cat || a.cat === f.cat) &&
        (!f.status || a.status === f.status));
      /* The three statuses sum to the article count, so they carry the total
         between them — and Expired earns a tile of its own now that an
         expired article is something you act on rather than only delete. */
      const stats = [
        ['Articles', ARTICLES.length, 'news', '#f8e6ef|#a3277c'],
        ['Published', ARTICLES.filter(a => a.status === 'published').length, 'check', '#e3f2e9|#20643d'],
        ['Draft', ARTICLES.filter(a => a.status === 'draft').length, 'edit', '#e6ebf1|#465569'],
        ['Total Views', ARTICLES.reduce((a, x) => a + x.views, 0), 'eye', '#e2ebfa|#2d5a8e']
      ];
      return `<div class="grid gap-5">
        ${miniStats(stats)}

        ${panel('All articles', `<div class="flex items-center gap-3 flex-wrap">
          <span class="text-[0.8rem] text-muted font-semibold inline-flex items-center gap-[0.4rem]">${icon('grip', 14)} Drag rows to reorder</span>
          <button class="${C.btnSm} ${C.primary}" data-act="new-article">${icon('plus', 15)} New article</button></div>`, `
          ${toolbar(`${searchBox('editorial', 'Search title or author…')}
            ${selectBox('editorial', 'cat', CATEGORIES.map(c => [c.id, c.name]), 'All categories')}
            ${selectBox('editorial', 'status', [['published', 'Published'], ['draft', 'Draft'], ['expired', 'Expired']], 'All statuses')}`)}
          ${tableWrap(`<thead><tr><th class="!px-2"><span class="sr-only">Reorder</span></th><th>Article</th><th>Category</th><th>Author</th><th>Published</th><th>Views</th><th>Status</th><th class="text-right">Actions</th></tr></thead>
            <tbody>${rows.length ? rows.map(a => `<tr draggable="true" data-drag-id="${a.id}" class="${a.status !== 'published' ? 'opacity-[0.75]' : ''}">
              <td class="!px-2 w-[34px]"><span class="grip leading-[0] inline-flex" aria-hidden="true">${icon('grip', 17)}</span></td>
              <!-- The headline opens the article. A title in a content table
                   is the thing everyone clicks first, and it used to do
                   nothing at all. -->
              <td><div class="flex items-center gap-[0.7rem] min-w-0">
                <!-- The category icon, not the article picture: not every
                     article carries an image, and a row that sometimes has a
                     thumbnail and sometimes a coloured square reads as broken. -->
                <span class="w-[38px] h-[38px] rounded-[10px] inline-flex items-center justify-center text-white shrink-0" style="background:${catOf(a.cat).grad}">${icon(catOf(a.cat).icon, 17)}</span>
                <div class="min-w-0"><button data-act="view-article" data-id="${a.id}" class="block text-left font-bold truncate max-w-[260px] hover:text-brand hover:underline transition-colors">${esc(a.title)}</button><div class="text-[0.78rem] text-muted truncate max-w-[260px]">${esc(a.excerpt)}</div></div></div></td>
              <td>${catPill(a.cat)}</td>
              <td class="text-[0.86rem]">${esc(a.author)}</td>
              <td class="text-muted text-[0.86rem]">${a.status === 'draft' ? '—' : fmtDate(a.date)}</td>
              <td class="font-semibold">${a.views ? num(a.views) : '—'}</td>
              <td>${sp(a.status)}</td>
              <td><div class="flex gap-[0.4rem] justify-end items-center">${articleActions(a)}</div></td>
            </tr>`).join('') : emptyRow(8, 'No articles found')}</tbody>`)}`)}
      </div>`;
    }

    /* ═══════════════ 9. ADVERTISING ═══════════════ */
    /* Pending ads are approved or rejected; everything else is read-only. No
       campaign is ever edited or deleted here — an ad is a paid record with a
       transaction behind it, so it is rejected or left to end, never removed. */
    // `open` = already on the ad's own page, where a View button would only
    // reload what you are looking at.
    function adActions(a, open) {
      // View comes first on a pending row — the creative and the submission are
      // what the approve/reject decision is made on.
      const view = open ? '' : `<button class="${C.iconbtn}" data-act="view-ad" data-id="${a.id}" title="View">${icon('eye', 15)}</button>`;
      if (a.status === 'pending') return `${view}
        <button class="${C.iconbtn} ${C.iconOk}" data-act="approve" data-kind="ad" data-id="${a.id}" title="Approve & publish">${icon('check', 15)}</button>
        <button class="${C.iconbtn} ${C.iconBad}" data-act="reject-ad" data-id="${a.id}" title="Reject">${icon('x', 15)}</button>`;
      return view; // live, rejected, ended
    }
    /* ── Ad detail (full page) ──────────────────────────────────
       The submission is too big for a modal: nine form fields, a creative
       gallery, the placements bought, the payment plan and a billing split.
       So it takes over the Advertisements view the same way the legal-doc
       editor takes over Content Management — state.adDetail holds the id,
       null means the list. */

    // Small stacked label/value used down the right-hand rail.
    const infoRow = (label, val, mono) => `<div class="flex items-start justify-between gap-4 py-[0.7rem] border-b border-b-line2 last:border-b-0">
      <span class="text-[0.85rem] font-semibold text-muted shrink-0">${label}</span>
      <span class="text-[0.92rem] font-semibold text-head text-right min-w-0 ${mono ? 'font-mono text-[0.82rem] break-all' : ''}">${val}</span></div>`;

    // Multi-select answers (towns, age groups) render as a wrapped chip set.
    const chipSet = (items, empty) => items && items.length
      ? `<div class="flex flex-wrap gap-[0.4rem]">${items.map(t => `<span class="inline-flex items-center text-[0.82rem] font-semibold px-[0.7rem] py-[0.3rem] rounded-[100px] bg-surface-5 text-head border border-line2">${esc(t)}</span>`).join('')}</div>`
      : `<span class="text-[0.88rem] text-muted italic">${empty}</span>`;

    // A labelled block inside the "Ad information" panel.
    const fieldBlock = (label, body, span) => `<div class="${span ? 'col-span-full' : ''} min-w-0">
      <div class="text-[0.72rem] font-bold tracking-[0.07em] uppercase text-adlabel mb-[0.4rem]">${label}</div>
      <div class="text-[0.93rem] text-head font-semibold leading-[1.55] min-w-0">${body}</div></div>`;

    const optional = (v) => v ? esc(v) : '<span class="text-muted italic font-normal">Not provided</span>';

    function adGallery(a) {
      /* A Basic listing is the one ad type that shows no images or video, so
         it arrives with nothing here. That is a normal state, not a missing
         image — say so plainly rather than falling back to a stock photo the
         advertiser never sent. */
      const imgs = a.imgs || [];
      const head = (right) => `<div class="flex items-center justify-between gap-3 px-5 py-4 border-b border-b-line2 flex-wrap">
          <h2 class="font-serif text-[1.05rem] font-black text-head tracking-[-0.01em]">Ad Gallery</h2>${right}</div>`;
      if (!imgs.length) return `<section data-rv class="${C.card} overflow-hidden">
        ${head(`<span class="${C.pill} ${PILL.grey}">No images</span>`)}
        <div class="p-5">
          <div class="rounded-[16px] border-[1.5px] border-dashed border-line2 bg-surface-2 aspect-[16/9] flex flex-col items-center justify-center gap-3 text-center px-6">
            <span class="w-[46px] h-[46px] rounded-[14px] bg-surface-5 text-muted inline-flex items-center justify-center">${icon('image', 20)}</span>
            <p class="text-[0.9rem] text-muted leading-[1.6] max-w-[380px]">${a.type === 'basic'
          ? 'A Basic listing appears in the directory without images or video, so it carries no gallery.'
          : `This is a ${esc(adTypeOf(a.type).label)} ad, which can carry up to ${MAX_AD_IMAGES} images and ${MAX_AD_VIDEOS} video — none have been uploaded yet.`}</p>
          </div>
        </div>
      </section>`;
      const lead = imgs[Math.min(state.adImg, imgs.length - 1)];
      return `<section data-rv class="${C.card} overflow-hidden">
        ${head(`<span class="${C.pill} ${PILL.grey}">${icon('image', 12)} ${imgs.length} image${imgs.length !== 1 ? 's' : ''}</span>`)}
        <div class="p-5">
          <!-- Lead slot. Fixed 16:9 so swapping thumbnails never reflows the
               page under the cursor. -->
          <div class="relative rounded-[16px] overflow-hidden bg-surface-2 border-[1.5px] border-line2 aspect-[16/9] mb-3 group">
            <img src="${adImg(lead, 1200)}" alt="" class="w-full h-full object-cover transition-transform duration-[600ms] group-hover:scale-[1.03]">
            <div class="absolute inset-x-0 bottom-0 h-1/3 bg-[linear-gradient(0deg,rgba(9,15,26,0.72),transparent)] pointer-events-none"></div>
            <div class="absolute left-4 bottom-3 right-4 flex items-end justify-between gap-3 pointer-events-none">
              <span class="text-white text-[0.86rem] font-bold" style="text-shadow:0 2px 10px rgba(9,15,26,0.6)">${esc(a.name)}</span>
              <span class="text-on-dark-3 text-[0.78rem] font-bold shrink-0" style="text-shadow:0 2px 10px rgba(9,15,26,0.6)">${(state.adImg % imgs.length) + 1} / ${imgs.length}</span>
            </div>
          </div>
          <div class="grid gap-3" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">
            ${imgs.map((n, i) => `<button data-act="ad-img" data-i="${i}" class="relative rounded-[11px] overflow-hidden aspect-[4/3] border-[2px] transition-all duration-200 hover:-translate-y-[3px] ${i === Math.min(state.adImg, imgs.length - 1) ? 'border-grass-ink shadow-[0_6px_18px_rgba(32,100,61,0.32)]' : 'border-line2 opacity-[0.72] hover:opacity-100 hover:border-head'}" aria-label="Show image ${i + 1}">
              <img src="${adImg(n, 320)}" alt="" class="w-full h-full object-cover"></button>`).join('')}
          </div>
        </div>
      </section>`;
    }

    function adDetailView(a) {
      const adv = advOf(a.advertiser);
      const c = catOf(a.cat);
      const ty = adTypeOf(a.type);
      const bill = adBill(a);
      const ctr = a.impressions ? (a.clicks / a.impressions * 100).toFixed(2) + '%' : '—';
      /* Cost per click on a house ad would be a hard zero, which reads as a
         result rather than as "nobody paid for this". */
      const cpc = isInternal(a) ? 'No cost' : a.clicks ? money(adSpend(a) / a.clicks) : '—';
      // Flight progress — how far through the booked window we are today.
      const t0 = new Date(a.start + 'T00:00'), t1 = new Date(a.end + 'T00:00'), now = new Date();
      const span = Math.max(1, (t1 - t0) / 864e5);
      const gone = Math.min(span, Math.max(0, (now - t0) / 864e5));
      const pct = Math.round(gone / span * 100);
      const left = Math.max(0, Math.round(span - gone));
      const wh = whOf(a.hours);

      return `<div class="grid gap-5">

        <!-- Back bar + the actions that were on the row -->
        <div class="flex items-center gap-3 flex-wrap">
          <button class="${C.btnSm} ${C.ghost}" data-act="ad-back">${icon('chev-left', 15)} Back to ads</button>
          <span class="ml-auto flex items-center gap-2 flex-wrap">${sp(a.status)}${planPill(a.type)}${adSpots(a).map(s => pill('navy', s.label, s.ic)).join('')}${(a.addons || []).map(id => pill('teal', addonOf(id).label, 'trending')).join('')}${isInternal(a) ? pill('green', 'Internal ad', 'shield') : ''}</span>
          <!-- The destination, kept as an action rather than as a field. The
               Click-through link row came off the details card to match the
               public panels, but unlike them this page has no Visit button at
               its foot — so removing the row outright would take the address
               off the console altogether. Here it is a control that opens it,
               which is what the row was for. -->
          ${a.link ? `<a href="${esc(a.link)}" target="_blank" rel="noopener" class="${C.btnSm} ${C.ghost}" title="${esc(a.link)}">${icon('globe', 14)} Visit Link</a>` : ''}
          <span class="flex gap-[0.4rem]">${adActions(a, true)}</span>
        </div>

        ${miniStats([
        ['Impressions', a.impressions ? num(a.impressions) : '—', 'eye', '#e2ebfa|#2d5a8e'],
        ['Clicks', a.clicks ? num(a.clicks) : '—', 'click', '#ede6f8|#5c4382'],
        ['CTR', ctr, 'trending', '#ddf1ec|#14685a'],
        ['Cost per click', cpc, 'dollar', '#e3f2e9|#20643d'],
      ])}

        <div class="grid grid-cols-[1.55fr_1fr] gap-5 max1200:grid-cols-1 items-start">

          <!-- ── LEFT: what the advertiser submitted ── -->
          <div class="grid gap-5 min-w-0">
            ${adGallery(a)}

            ${panel('Ad information', `<span class="text-[0.8rem] text-muted font-semibold">${isInternal(a) ? 'Created' : 'Submitted'} ${fmtDate(a.txnDate)}</span>`, `
              <div class="p-5 grid grid-cols-2 gap-x-5 gap-y-[1.15rem] max700:grid-cols-1">
                ${fieldBlock('Advertisement name', esc(a.name), true)}
                ${fieldBlock('Ad type', `${planPill(a.type)} <span class="font-normal text-muted text-[0.86rem]">${esc(ty.blurb)}</span>`, true)}
                <!-- Which slot on that page was bought — one of them or both.
                     A directory listing has no slot, so it says so. -->
                ${fieldBlock('Placement', ty.spots
        ? (adSpots(a).length
          ? `<span class="flex flex-wrap gap-[0.4rem]">${adSpots(a).map(s => pill('navy', s.label, s.ic)).join('')}</span>`
          : '<span class="text-muted italic font-normal">No slot chosen</span>')
        : `<span class="text-muted italic font-normal">Not applicable — ${esc(ty.where.toLowerCase())}</span>`, true)}
                <!-- A home ad runs on one page and answers to no category, so
                     the two fields that describe a category say so rather than
                     showing an empty value that looks like missing data. -->
                ${fieldBlock('Category', ty.noCat
          ? '<span class="text-muted italic font-normal">Not applicable — runs on the home page</span>'
          : a.cat
            ? `<span class="cat-tint inline-flex items-center text-[0.85rem] font-bold px-[0.7rem] py-[0.25rem] rounded-[100px] text-head border-[1.5px] border-line2" style="--cat:${c.tint};background:var(--cat)">${esc(c.name)}</span>`
            : '<span class="text-muted italic font-normal">Not set</span>')}
                ${fieldBlock('Subcategory', ty.noCat ? '<span class="text-muted italic font-normal">Not applicable</span>' : optional(a.sub))}
                <!-- The click-through link is the same field the public
                     panels called Website, and it comes off here for the same
                     reason: the ad's own header already carries it as the
                     link the title opens. -->
                ${fieldBlock(`Town <span class="text-muted font-medium normal-case tracking-normal">· ${ty.townOptional ? 'not required for this ad type' : `${(a.towns || []).length} selected`}</span>`,
              chipSet(a.towns, ty.townOptional ? 'Runs across every town' : 'No towns selected'), true)}
                ${fieldBlock('Age group <span class="text-muted font-medium normal-case tracking-normal">· optional</span>', chipSet((a.ages || []).map(ageOf), 'No age groups selected'), true)}
                ${fieldBlock('Address <span class="text-muted font-medium normal-case tracking-normal">· optional</span>', optional(a.address))}
                ${/* With its dial code, the way every other number in the console reads. */
                  fieldBlock('Phone <span class="text-muted font-medium normal-case tracking-normal">· optional</span>', optional(a.phone ? `${a.dial || '+1'} ${a.phone}` : ''))}
                ${fieldBlock('Description', `<p class="font-normal text-muted leading-[1.7]">${esc(a.desc || '')}</p>`, true)}
              </div>`)}

            ${panel('Working hours', `<span class="text-[0.8rem] text-muted font-semibold">Optional</span>`, `
              <div class="p-5">${wh ? `
                <div class="grid gap-[0.35rem]">
                  ${WH_DAYS.map(day => {
                const h = wh[day];
                return `<div class="flex items-center justify-between gap-4 px-[0.9rem] py-[0.55rem] rounded-[10px] ${h ? 'bg-surface-2' : 'bg-transparent'}">
                      <span class="text-[0.88rem] font-bold text-head w-[46px] shrink-0">${day}</span>
                      ${h ? `<span class="text-[0.88rem] font-semibold text-head [font-variant-numeric:tabular-nums]">${h[0]} — ${h[1]}</span>`
                    : `<span class="text-[0.85rem] font-semibold text-muted italic">Closed</span>`}
                    </div>`;
              }).join('')}
                </div>` : `<span class="text-[0.9rem] text-muted italic">No working hours provided</span>`}
              </div>`)}
          </div>

          <!-- ── RIGHT: what they bought and what they paid ── -->
          <div class="grid gap-5 min-w-0">

            ${isInternal(a)
          /* A house ad has no advertiser record to show — the site placed it.
             Saying that plainly beats rendering Bergen Kids' own address into
             an Advertiser panel as though someone had been sold something. */
          ? panel('Internal ad', '', `<div class="p-5">
              <div class="flex items-center gap-3 pb-4 mb-4 border-b border-b-line2">
                <span class="w-[46px] h-[46px] rounded-[12px] tint inline-flex items-center justify-center shrink-0" style="--chip-bg:#e3f2e9;--chip-fg:#20643d">${icon('shield', 21)}</span>

            </div>`)}

            ${panel('Ad type', '', `<div class="p-5">

            ${panel('Add-ons', `<span class="text-[0.8rem] text-muted font-semibold">${(a.addons || []).length} selected</span>`, `<div class="p-5 grid gap-[0.6rem]">
              ${(a.addons || []).map(p => {

                  <div class="min-w-0 flex-1"><div class="text-[0.9rem] font-bold text-head truncate">${pl.label}</div>
                  <div class="text-[0.78rem] text-muted truncate">${pl.spot}</div></div>
                  ${isInternal(a) ? '' : `<span class="text-[0.9rem] font-bold text-head shrink-0">${money(pl.rate).replace('.00', '')}</span>`}
                </div>`;
                }).join('') || `<span class="text-[0.88rem] text-muted italic">No add-ons taken</span>`}
            </div>`)}

            <!-- Money panels only where money changed hands. -->
            ${bill.internal ? '' : panel('Payment plan', '', `<div class="p-5">
              <div class="flex items-center gap-2 mb-4">
                ${a.payPlan === 'subscription' ? pill('teal', 'Subscription plan', 'clock') : pill('navy', 'One time fee', 'card')}
              </div>
              ${infoRow('Duration', `${bill.term.label} <span class="text-muted font-medium">(${bill.term.days} days)</span>`)}

            ${bill.internal ? '' : panel('Billing details', '', `<div class="p-5">

              </div>
              <!-- Never store or show a full PAN — Stripe returns the brand

              ${infoRow('Payment card', a.card ? `${esc(a.card.brand)} •••• ${esc(a.card.last4)}` : '—')}

    function adsView() {
      // A selected ad takes the whole view; the list is the null case.
      if (state.adDetail) {
        const a = ADS.find(x => x.id === state.adDetail);
        if (a) return adDetailView(a);
        state.adDetail = null;   // deleted while open — fall back to the list
      }
      const f = state.f.ads;
      const rows = ADS.filter(a =>
        (!f.q || (a.name + advOf(a.advertiser).company).toLowerCase().includes(f.q.toLowerCase())) &&
        (!f.addon || (a.addons || []).includes(f.addon)) &&
        (!f.adv || a.advertiser === f.adv) &&
        (!f.cat || a.cat === f.cat) &&
        (!f.adtype || a.type === f.adtype) &&
        (!f.status || a.status === f.status) &&
        (!f.from || a.end >= f.from) && (!f.to || a.start <= f.to));
      const stats = [
        ['Active ads', ADS.filter(a => a.status === 'live').length, 'megaphone', '#ede6f8|#5c4382'],
        ['Approved', ADS.filter(a => a.status !== 'pending' && a.status !== 'rejected').length, 'verified', '#e2ebfa|#2d5a8e'],
        ['Awaiting review', ADS.filter(a => a.status === 'pending').length, 'clock', '#fdeed5|#8a5200'],
        // Derived from the billing splits, so it agrees with Payments.
        ['Total revenue', money(ADS.reduce((s, x) => s + adSpend(x), 0)).replace('.00', ''), 'dollar', '#e3f2e9|#20643d']
      ];
      /* One list. Ad type is the single choice an ad is placed on, so it is
         one column and one filter; add-ons ride alongside it. */
      return `<div class="grid gap-5">
        ${miniStats(stats)}
        ${panel('Advertisement Management',
        `<div class="flex items-center gap-3 flex-wrap">
          <button class="${C.btnSm} ${C.primary}" data-act="new-ad">${icon('plus', 15)} New ad</button>

        `

            ${selectBox('ads', 'adv', [['internal', 'Internal Ads'], ...ADVERTISERS.map(x => [x.id, x.company])], 'All advertisers')}
            ${selectBox('ads', 'cat', CATEGORIES.map(c => [c.id, c.name]), 'All categories')}
            ${selectBox('ads', 'adtype', AD_TYPES.map(t => [t.id, t.label]), 'All ad types')}
            ${selectBox('ads', 'addon', AD_ADDONS.map(x => [x.id, x.label]), 'All add-ons')}
            ${selectBox('ads', 'status', [['pending', 'Pending'], ['rejected', 'Rejected'], ['live', 'Live'], ['ended', 'Ended']], 'All statuses')}
            ${dateBox('ads', 'from', 'From')}
            ${dateBox('ads', 'to', 'To')}
            ${clearFilters('ads')}`)}
          ${tableWrap(`<thead><tr><th>Ad</th><th>Advertiser</th><th>Ad type</th><th>Add-ons</th><th>Flight dates</th><th>Impressions</th><th>Clicks</th><th>CTR</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>${rows.length ? rows.map(a => `<tr>
              <td><div class="font-bold truncate max-w-[220px]">${esc(a.name)}</div></td>
              <td class="text-[0.86rem]">${advCell(a)}</td>
              <td>${planPill(a.type)}${spotCell(a)}</td>
              <td>${addonCell(a)}</td>
              <td class="text-[0.82rem] text-muted whitespace-nowrap">${a.status === 'pending'
            ? '—'
            : `${fmtDate(a.start)}<br>→ ${fmtDate(a.end)}`}</td>
              <td class="font-semibold">${a.impressions ? num(a.impressions) : '—'}</td>
              <td class="font-semibold">${a.clicks ? num(a.clicks) : '—'}</td>
              <td>${a.impressions ? `<span class="font-bold text-brand">${((a.clicks / a.impressions) * 100).toFixed(2)}%</span>` : '—'}</td>
              <td>${sp(a.status)}</td>
              <td><div class="flex gap-[0.4rem] justify-start items-center">${adActions(a)}</div></td></tr>`).join('') : emptyRow(10, 'No ads found')}</tbody>`)}`)}
      </div>`;

    /* ═══════════════ 10. PAYMENTS ═══════════════ */
    function paymentsView() {
      const f = state.f.payments;
      // Only settled payments are shown — pending, refunded, and failed ones are not transactions to report on.
      // Only settled payments are listed; the stats therefore describe the
      // same set the table shows rather than data you cannot see.
      const rows = FILTERED.transactions();
      const paid = TX.filter(t => t.status === 'paid');
      const gross = paid.reduce((a, t) => a + txOf(t).amount, 0);
      const stats = [
        ['Ad revenue', money(gross).replace('.00', ''), 'dollar', '#e3f2e9|#20643d'],
        ['Transactions', paid.length, 'card', '#e2ebfa|#2d5a8e'],
        ['Average charge', money(paid.length ? gross / paid.length : 0).replace('.00', ''), 'trending', '#ede6f8|#5c4382']
      ];
      const rev = revenueSeries(state.payYear);
      const revAds = rev.ads.reduce((a, v) => a + v, 0);
      const bestMonth = MONTHS_YEAR[rev.ads.indexOf(Math.max(...rev.ads))];
      return `<div class="grid gap-5">
        ${miniStats(stats)}

        ${panel('Revenue by month',
        `<select id="pay-year" class="${C.inp} !w-auto !min-h-[38px] !py-[0.35rem] !pr-8 cursor-pointer font-semibold text-[0.85rem] !bg-surface">

          </select>`,
        `<div class="p-5">

                 second series; the console reports on advertising now, so the
                 chart is a single series and needs no legend. -->
            ${moneyBar(rev.ads, MONTHS_YEAR)}
            <div class="grid grid-cols-3 gap-4 mt-6 pt-5 border-t border-t-line2">
              <div><div class="text-[0.78rem] font-bold uppercase tracking-[0.08em] text-adlabel mb-1">Ad revenue</div><div class="font-serif text-[1.4rem] font-black text-brand">${money(revAds).replace('.00', '')}</div></div>
              <div><div class="text-[0.78rem] font-bold uppercase tracking-[0.08em] text-adlabel mb-1">Monthly average</div><div class="font-serif text-[1.4rem] font-black text-head">${money(revAds / 12).replace('.00', '')}</div></div>
              <div><div class="text-[0.78rem] font-bold uppercase tracking-[0.08em] text-adlabel mb-1">Best month</div><div class="font-serif text-[1.4rem] font-black text-head">${bestMonth}</div></div>
            </div>
          </div>`)}

        ${panel('Transactions', `<button class="${C.btnSm} ${C.ghost}" data-act="export" data-what="transactions">${icon('download', 15)} Export</button>`, `
          ${toolbar(`${searchBox('payments', 'Search transaction ID, advertiser, or ad…')}
            ${selectBox('payments', 'adv', ADVERTISERS.map(a => [a.id, a.company]), 'All advertisers')}
            ${selectBox('payments', 'adtype', AD_TYPES.map(t => [t.id, t.label]), 'All ad types')}
            ${dateBox('payments', 'from', 'From')}
            ${dateBox('payments', 'to', 'To')}
            ${clearFilters('payments')}`)}
          ${tableWrap(`<thead><tr><th>Payment ID</th><th>Advertiser</th><th>Ad</th><th>Type</th><th>Add-ons</th><th>Payment Card</th><th>Date</th><th>Amount</th><th class="!text-center">Actions</th></tr></thead>
            <tbody>${rows.length ? rows.map(t => {
          const x = txOf(t); return `<tr>
              <td><span class="font-bold font-mono text-[0.85rem]">${t.id}</span></td>
              <td><div class="flex items-center gap-[0.6rem] min-w-0">${avatar(x.adv.contact || x.adv.company, 32, x.adv.photo)}<span class="font-semibold truncate max-w-[170px] text-[0.9rem]">${esc(x.adv.company)}</span></div></td>
              <td><span class="font-semibold text-head text-[0.9rem] truncate max-w-[210px] block">${esc(x.ad.name)}</span></td>
              <td>${planPill(x.ad.type)}${spotCell(x.ad)}</td>
              <td>${addonCell(x.ad)}</td>
              <td><span class="text-[0.84rem] text-muted inline-flex items-center gap-[0.4rem] whitespace-nowrap">${icon('card', 14)}${x.method}</span></td>
              <td class="text-muted text-[0.86rem] whitespace-nowrap">${fmtDate(t.date)}</td>
              <td><span class="font-serif font-black text-[1rem] text-head">${money(x.amount)}</span></td>
              <td class="!text-center"><div class="inline-flex justify-center w-full">
                <button class="${C.iconbtn}" data-act="view-tx" data-id="${t.id}" title="View receipt">${icon('eye', 15)}</button>
              </div></td></tr>`;

      </div>`;

    /* ═══════════════ 11. BUSINESS ANALYTICS ═══════════════ */

    /* ═══════════════ 12. AD ANALYTICS ═══════════════ */
    function adAnalyticsView() {
      const f = state.f.adanalytics;
      const rows = FILTERED.adanalytics();

      const imp = rows.reduce((a, x) => a + x.impressions, 0);
      const clk = rows.reduce((a, x) => a + x.clicks, 0);
      const live = rows.filter(a => a.status === 'live').length;
      const stats = [
        ['Impressions', imp, 'eye', '#e2ebfa|#2d5a8e'],
        ['Clicks', clk, 'click', '#e3f2e9|#20643d'],
        ['Live ads', live, 'megaphone', '#ede6f8|#5c4382'],
        ['Average CTR', ctrOf(imp, clk), 'trending', '#fdeed5|#8a5200']
      ];
      const COLORS = ['#20643d', '#f5a623', '#5c4382', '#1e8c7a'];
      const placeSegs = AD_TYPES.map((p, i) => ({
        n: p.short,
        v: rows.filter(a => a.type === p.id).reduce((s, a) => s + a.clicks, 0),
        c: COLORS[i]
      })).filter(s => s.v);

      return `<div class="grid gap-5">
        ${miniStats(stats)}

        ${panel('Clicks and Impressions', `<button class="${C.btnSm} ${C.ghost}" data-act="export" data-what="ad analytics">${icon('download', 14)} Export</button>`,
        filterBar(`
            ${filterSearch('Ad', 'adanalytics', 'Search ad name…')}
            ${filterSelect('Advertiser', 'adanalytics', 'adv', [['internal', 'Internal Ads'], ...ADVERTISERS.map(a => [a.id, a.company])], 'All advertisers')}
            ${filterSelect('Category', 'adanalytics', 'cat', CATEGORIES.map(c => [c.id, c.name]), 'All categories')}
            ${filterSelect('Ad type', 'adanalytics', 'adtype', AD_TYPES.map(t => [t.id, t.label]), 'All ad types')}
            ${filterSelect('Add-on', 'adanalytics', 'addon', AD_ADDONS.map(x => [x.id, x.label]), 'All add-ons')}
            ${filterDate('Start date', 'adanalytics', 'from')}
            ${filterDate('End date', 'adanalytics', 'to')}`, 'adanalytics') +
        /* The two charts share one row so the table below can take the full
           width. It carries ten columns; in a 1.6fr column it was forced to
           scroll sideways, which is no way to read a leaderboard. */
        `<div class="p-5 grid grid-cols-[1.55fr_1fr] gap-6 max1024:grid-cols-1">
            <div class="min-w-0">
              <div class="text-[0.85rem] text-muted font-semibold mb-4">Last 6 weeks</div>
              ${dualBar(weekly(imp), weekly(clk), WEEK_LABELS)}
              <div class="mt-4">${chartLegend()}</div>
            </div>
            <div class="min-w-0 flex flex-col border-l border-l-line2 pl-6 max1024:border-l-0 max1024:pl-0 max1024:pt-6 max1024:border-t max1024:border-t-line2">
              <div class="text-[0.85rem] text-muted font-semibold mb-4">Clicks by ad type</div>
              <div class="flex flex-col items-center gap-5 flex-1 justify-center">
                ${placeSegs.length ? donut(placeSegs.map(s => ({ v: s.v, c: s.c })), 150) : `<div class="text-[0.9rem] text-muted py-10">No clicks in this selection</div>`}
                <div class="w-full flex flex-col gap-2">
                  ${placeSegs.map(s => `<div class="flex items-center gap-2 text-[0.85rem]">
                    <i class="w-[10px] h-[10px] rounded-full shrink-0 not-italic" style="background:${s.c}"></i>
                    <span class="text-muted font-medium">${s.n}</span><span class="ml-auto font-bold text-head">${num(s.v)}</span></div>`).join('')}
                </div>
              </div>
            </div>
          </div>`)}

          ${panel('Top performing ads by CTR', '', tableWrap(`<thead><tr><th>Advertiser</th><th>Ad</th><th>Category</th><th>Ad type</th><th>Add-ons</th><th>Status</th><th>Impressions</th><th>Clicks</th><th>CTR</th><th class="text-right">Actions</th></tr></thead>
            <tbody>${rows.length ? byCtr(rows).map(a => `<tr>
              <!-- Capped so a long company name cannot push the ten-column
                   table past the panel and reintroduce the sideways scroll. -->
              <td><div class="flex items-center gap-[0.6rem] min-w-0">${avatar(advOf(a.advertiser).contact || advOf(a.advertiser).company, 32, advOf(a.advertiser).photo)}
                <span class="text-[0.88rem] font-semibold text-head truncate max-w-[120px]" title="${esc(advOf(a.advertiser).company)}">${esc(advOf(a.advertiser).company)}</span>
                ${isInternal(a) ? pill('green', 'Internal', 'shield') : ''}</div></td>
