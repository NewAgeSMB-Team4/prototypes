              <td>${planPill(a.type)}</td>
              <td>${addonCell(a)}</td>
              <td>${sp(a.status)}</td>
              <td class="font-semibold">${a.impressions ? num(a.impressions) : '—'}</td>
              <td class="font-semibold">${a.clicks ? num(a.clicks) : '—'}</td>
              <td><span class="font-bold text-brand">${ctrOf(a.impressions, a.clicks)}</span></td>
              <td><div class="flex justify-end"><button class="${C.iconbtn}" data-act="view-ad" data-id="${a.id}" title="View ad">${icon('eye', 15)}</button></div></td>
            </tr>`).join('') : emptyRow(10, 'No ads match these filters')}</tbody>`, TIGHT))}
      </div>`;
    }
    /* ═══════════════ 13. ADMIN PROFILE ═══════════════
       Two things live here, and they belong together: who is signed in, and
       the platform-wide configuration only they can change. Ad and plan
       pricing moved off Payments for that reason — Payments reports on money
       taken, this decides what money is asked for. */

    // Each plan carries its own gradient so the four read as a set of offers
    // rather than four rows of numbers.
    const PLAN_SKIN = {
      30: { grad: 'linear-gradient(135deg,#2d7a4f,#20643d)', ic: 'clock' },
      90: { grad: 'linear-gradient(135deg,#2d5a8e,#1a2e4a)', ic: 'calendar' },
      180: { grad: 'linear-gradient(135deg,#7b5ea7,#5c4382)', ic: 'trending' },
      365: { grad: 'linear-gradient(135deg,#e8892a,#f5a623)', ic: 'star' },
    };

    function planCards() {
      return `<div class="p-5 grid grid-cols-2 gap-4 max1200:grid-cols-2 max900:grid-cols-1">
        ${AD_TERMS.map(t => {
        const skin = PLAN_SKIN[t.id] || PLAN_SKIN[30];
        // What a subscriber saves against buying the same span outright.
        const saving = t.once - t.sub;
        const best = t.id === 365;
        return `<div class="relative rounded-[18px] overflow-hidden border-[1.5px] ${best ? 'border-sun' : 'border-line2'} bg-surface transition-[transform,box-shadow] duration-[250ms] hover:-translate-y-[4px] hover:shadow-[var(--sh-2)]">
          <div class="relative px-5 py-4 text-white overflow-hidden" style="background:${skin.grad}">
            <div class="absolute -right-5 -bottom-7 opacity-[0.18] pointer-events-none">${icon(skin.ic, 92)}</div>
            <div class="relative flex items-center justify-between gap-2">
              <div class="min-w-0">
                <div class="font-serif text-[1.15rem] font-black leading-tight truncate">${t.label}</div>
                <div class="text-[0.78rem] text-on-dark-3 font-semibold">${t.days} days</div>
              </div>
              ${best ? `<span class="${C.pill} bg-sun text-[#1a2e4a] shrink-0">${icon('star', 11, 'solid')} Best value</span>` : ''}
            </div>
          </div>

          <div class="p-5 grid gap-3">
            <div class="rounded-[13px] border-[1.5px] border-line2 bg-surface-4 px-4 py-3">
              <div class="text-[0.7rem] font-bold tracking-[0.08em] uppercase text-adlabel mb-[0.2rem]">Subscription</div>
              <div class="flex items-baseline gap-2">
                <span class="font-serif text-[1.7rem] font-black text-brand leading-none [font-variant-numeric:tabular-nums]">${money(t.sub).replace('.00', '')}</span>
                <span class="text-[0.78rem] text-muted font-semibold">renews every ${t.days} days</span>
              </div>
            </div>
            <div class="rounded-[13px] border-[1.5px] border-line2 bg-surface-2 px-4 py-3">
              <div class="text-[0.7rem] font-bold tracking-[0.08em] uppercase text-adlabel mb-[0.2rem]">One time fee</div>
              <div class="flex items-baseline gap-2">
                <span class="font-serif text-[1.7rem] font-black text-head leading-none [font-variant-numeric:tabular-nums]">${money(t.once).replace('.00', '')}</span>
                <span class="text-[0.78rem] text-muted font-semibold">paid once</span>
              </div>
            </div>
            <div class="flex items-center justify-between gap-3 pt-1">
              ${saving > 0 ? `<span class="${C.pill} ${PILL.green}">${icon('trending', 11)} Saves ${money(saving).replace('.00', '')}/ad</span>`
            : `<span class="text-[0.8rem] text-muted font-semibold">Same either way</span>`}
              <button class="${C.btnSm} ${C.ghost}" data-act="edit-term" data-id="${t.id}">${icon('edit', 13)} Edit</button>
            </div>
          </div>
        </div>`;
      }).join('')}
      </div>`;
    }

    /* One card shape, two lists: the four ad types and the add-ons that ride
       on top of them. Tinted by the same AD_TYPE_TONE the pills use, so a
       price card and a table pill are recognisably the same thing. */
    const priceCard = (x, s, sub, act) => `
      <div class="rounded-[16px] border-[1.5px] border-line2 bg-surface p-4 flex items-start gap-3 transition-[transform,border-color,box-shadow] duration-[250ms] hover:-translate-y-[3px] hover:border-brand hover:shadow-[var(--sh-2)]">
        <span class="w-[42px] h-[42px] rounded-[12px] tint inline-flex items-center justify-center shrink-0" style="--chip-bg:${s.bg};--chip-fg:${s.fg}">${icon(s.ic, 19)}</span>
        <div class="min-w-0 flex-1">
          <div class="text-[0.95rem] font-bold text-head truncate" title="${esc(x.label)}">${esc(x.label)}</div>
          <div class="text-[0.78rem] text-muted leading-[1.5]">${esc(sub)}</div>
          <div class="flex items-center justify-between gap-3 mt-3 pt-3 border-t border-t-line2">
            <span class="font-serif text-[1.3rem] font-black ${x.rate ? 'text-head' : 'text-brand'} [font-variant-numeric:tabular-nums]">${x.rate ? money(x.rate).replace('.00', '') : 'Free'}</span>
            <button class="${C.btnSm} ${C.ghost}" data-act="${act}" data-id="${x.id}">${icon('edit', 13)} Edit</button>
          </div>
        </div>
      </div>`;

    const AD_TYPE_SKIN = {
      basic: { bg: '#e6ebf1', fg: '#465569', ic: 'list' },
      deluxe: { bg: '#fdeed5', fg: '#8a5200', ic: 'star' },
      home: { bg: '#e2ebfa', fg: '#2d5a8e', ic: 'dashboard' },
      category: { bg: '#ede6f8', fg: '#5c4382', ic: 'tag' },
    };

    /* A price card for a type that sells two slots: a line per slot, each with
       its own figure and its own Edit. One card with one number could not say
       what a leaderboard costs against a sidebar, and the editor behind it
       could only move the pair together. */
    const slotPriceCard = (x, s) => `
      <div class="rounded-[16px] border-[1.5px] border-line2 bg-surface p-4 flex items-start gap-3 transition-[transform,border-color,box-shadow] duration-[250ms] hover:-translate-y-[3px] hover:border-brand hover:shadow-[var(--sh-2)]">
        <span class="w-[42px] h-[42px] rounded-[12px] tint inline-flex items-center justify-center shrink-0" style="--chip-bg:${s.bg};--chip-fg:${s.fg}">${icon(s.ic, 19)}</span>
        <div class="min-w-0 flex-1">
          <div class="text-[0.95rem] font-bold text-head truncate">${esc(x.label)}</div>
          <div class="text-[0.78rem] text-muted leading-[1.5]">${esc(x.where)} · priced per slot</div>
          ${AD_SPOTS.map(sp => `<div class="flex items-center justify-between gap-3 mt-3 pt-3 border-t border-t-line2">
            <span class="min-w-0">
              <span class="block text-[0.8rem] font-bold text-head">${icon(sp.ic, 12)} ${esc(sp.label)}</span>
              <span class="font-serif text-[1.15rem] font-black text-head [font-variant-numeric:tabular-nums]">${money(spotRate(x, sp.id)).replace('.00', '')}</span>
            </span>
            <button class="${C.btnSm} ${C.ghost}" data-act="edit-adtype" data-id="${x.id}" data-spot="${sp.id}">${icon('edit', 13)} Edit</button>
          </div>`).join('')}
        </div>
      </div>`;

    /* Basic has no Edit. It is the floor — the free tier every listing starts
       on — and a button offering to price it was offering something the product
       does not have: whatever number were typed, Basic is what an advertiser
       gets for nothing. The card still shows, marked Free, because the pricing
       page is the list of what exists and leaving it out would read as though
       Basic had been withdrawn. */
    const freePriceCard = (x, s, sub) => `
      <div class="rounded-[16px] border-[1.5px] border-line2 bg-surface p-4 flex items-start gap-3">
        <span class="w-[42px] h-[42px] rounded-[12px] tint inline-flex items-center justify-center shrink-0" style="--chip-bg:${s.bg};--chip-fg:${s.fg}">${icon(s.ic, 19)}</span>
        <div class="min-w-0 flex-1">
          <div class="text-[0.95rem] font-bold text-head truncate">${esc(x.label)}</div>
          <div class="text-[0.78rem] text-muted leading-[1.5]">${esc(sub)}</div>
          <div class="flex items-center justify-between gap-3 mt-3 pt-3 border-t border-t-line2">
            <span class="font-serif text-[1.3rem] font-black text-brand [font-variant-numeric:tabular-nums]">Free</span>
            <span class="text-[0.78rem] text-muted font-semibold">Always free — not priced</span>
          </div>
        </div>
      </div>`;

    function adTypeCards() {
      return `<div class="p-5 grid grid-cols-2 gap-4 max900:grid-cols-1">
        ${AD_TYPES.map(x => x.id === 'basic'
          ? freePriceCard(x, AD_TYPE_SKIN[x.id], `${x.where} · ${x.blurb}`)
          : x.rates
            ? slotPriceCard(x, AD_TYPE_SKIN[x.id])
            : priceCard(x, AD_TYPE_SKIN[x.id], `${x.where} · ${x.blurb}`, 'edit-adtype')).join('')}
      </div>`;
    }

    function addonCards() {
      return `<div class="p-5 grid grid-cols-2 gap-4 max900:grid-cols-1">
        ${addonList().map(x => priceCard(x, { bg: '#ddf1ec', fg: '#14685a', ic: 'trending' }, x.spot, 'edit-addon')).join('')}
      </div>`;
    }

    /* ═══════════════ SUB ADMINS ═══════════════ */
    function subAdminsView() {
      const rows = SUB_ADMINS;
      const stats = [
        ['Sub admins', rows.length, 'shield', '#e3f2e9|#20643d'],
        ['Active', rows.filter(x => x.active).length, 'check', '#e2ebfa|#2d5a8e'],
        ['Blocked', rows.filter(x => !x.active).length, 'lock', '#fdeed5|#8a5200'],
      ];
      return `<div class="grid gap-5">
        ${miniStats(stats)}
        <div class="flex items-center justify-between gap-3 flex-wrap">
          <p class="${C.sub} max-w-[60ch]">A sub admin signs in to this console and sees only the sections you switch on for them.</p>
          <button class="${C.btn} ${C.primary}" data-act="new-subadmin">${icon('plus', 16)} Add sub admin</button>
        </div>
        ${panel('All sub admins', `<span class="${C.pill} ${PILL.navy}">${rows.length} total</span>`, `
          ${tableWrap(`<thead><tr><th>Sub admin</th><th>Phone</th><th>Sections</th><th>Status</th><th class="text-right">Actions</th></tr></thead>
          <tbody>${rows.length ? rows.map(x => `<tr>
            <td><div class="flex items-center gap-[0.7rem] min-w-0">
              ${avatar(x.name, 38)}
              <div class="min-w-0"><div class="font-bold truncate max-w-[220px]">${esc(x.name)}</div>
              <div class="text-[0.78rem] text-muted truncate max-w-[220px]">${esc(x.email)}</div></div></div></td>
            <td class="text-[0.86rem] whitespace-nowrap">${esc(showPhone(x))}</td>
            <td><div class="flex flex-wrap gap-[0.3rem] max-w-[320px]">
              ${x.tabs.slice(0, 3).map(t => `<span class="${C.pill} ${PILL.navy}">${esc((SUB_TABS.find(v => v[0] === t) || [, t])[1])}</span>`).join('')}
              ${x.tabs.length > 3 ? `<span class="${C.pill} ${PILL.grey}">+${x.tabs.length - 3} more</span>` : ''}</div></td>
            <td>${x.active ? `<span class="${C.pill} ${PILL.green}">Active</span>` : `<span class="${C.pill} ${PILL.amber}">Blocked</span>`}</td>
            <td><div class="flex gap-[0.4rem] justify-end items-center">
              <button class="${C.iconbtn}" data-act="edit-subadmin" data-id="${x.id}" title="Edit">${icon('edit', 15)}</button>
              <!-- Same word and the same pair of actions parents and advertisers
                   use, so one status means one thing across every user type. -->
              <button class="${C.iconbtn} ${x.active ? C.iconBad : C.iconOk}" data-act="toggle-subadmin" data-id="${x.id}"
                title="${x.active ? 'Block' : 'Unblock'}">${icon(x.active ? 'lock' : 'check', 15)}</button>
              <button class="${C.iconbtn} ${C.iconBad}" data-act="del-subadmin" data-id="${x.id}" title="Remove">${icon('trash', 15)}</button>
            </div></td>
          </tr>`).join('') : emptyRow(5, 'No sub admins yet')}</tbody>`)}`)}
      </div>`;
    }

    /* Add / edit. Name, email and phone are all required; the email has to be
       unused across the console including the super admin's own, while a phone
       may be shared — one number often covers a desk rather than a person.
       At least one section must be on, because a sub admin with no sections
       can sign in and see nothing at all. */
    function subAdminForm(id) {
      const x = id ? SUB_ADMINS.find(v => v.id === id) : null;
      let picked = new Set(x ? x.tabs : []);
      modal(x ? 'Edit sub admin' : 'Add sub admin', `<div class="grid gap-4">
        <div class="grid grid-cols-2 gap-4 max560:grid-cols-1">
          ${field('First name' + REQ, input('sa-first', 'e.g. Megan', x ? x.first : ''))}
          ${field('Last name' + REQ, input('sa-last', 'e.g. Whitfield', x ? x.last : ''))}
        </div>
        ${field('Email address' + REQ, input('sa-email', 'name@bergenkids.com', x ? x.email : '', 'email'))}
        <!-- The code is picked, not typed: it is a closed list, and leaving it
             inside the number field means every screen that shows a number has
             to parse one back out. -->
        ${field('Phone number' + REQ, phoneField('sa-phone', x ? x.dial : '+1', x ? x.phone : ''))}
        ${field('Sections this sub admin can open' + REQ, `
          <div class="grid gap-[0.35rem]">
            <!-- One control for the whole set, in the same shape as the rows it
                 governs: on turns every section on, off turns every one off, and
                 it reads back the current state rather than being a pair of
                 one-way buttons. -->
            <button type="button" id="sa-all" class="flex items-center justify-between gap-3 px-[0.85rem] py-[0.6rem] rounded-[11px] border-[1.5px] border-line2 bg-surface text-left mb-1">
              <span class="text-[0.9rem] font-bold text-head">Select all</span>
              <span id="sa-all-sw" class="w-[38px] h-[22px] rounded-[100px] relative shrink-0 transition-colors bg-line2">
                <span class="absolute top-[3px] w-4 h-4 rounded-full bg-white shadow-[0_1px_4px_rgba(0,0,0,0.25)] transition-[left] duration-150" style="left:3px"></span>
              </span>
            </button>
            <div class="text-[0.78rem] text-muted font-semibold mb-1" id="sa-count">${picked.size} of ${SUB_TABS.length} on</div>
            ${SUB_TABS.map(([tid, label]) => `
            <button type="button" data-sa-tab="${tid}" class="flex items-center justify-between gap-3 px-[0.85rem] py-[0.6rem] rounded-[11px] border-[1.5px] transition-colors text-left ${picked.has(tid) ? 'border-grass-ink bg-mint' : 'border-line bg-surface-2'}">
              <span class="text-[0.9rem] font-semibold text-head">${label}</span>
              <span data-sa-sw class="w-[38px] h-[22px] rounded-[100px] relative shrink-0 transition-colors ${picked.has(tid) ? 'bg-grass-ink' : 'bg-line2'}">
                <span class="absolute top-[3px] w-4 h-4 rounded-full bg-white shadow-[0_1px_4px_rgba(0,0,0,0.25)] transition-[left] duration-150" style="left:${picked.has(tid) ? '19px' : '3px'}"></span>
              </span>
            </button>`).join('')}
          </div>`)}
      </div>`,
        `<button class="${C.btn} ${C.ghost}" data-close="1">Cancel</button>
         <button class="${C.btn} ${C.primary}" id="sa-save">${x ? 'Save changes' : 'Add sub admin'}</button>`, { w: '520px' });

      const paintTabs = () => {
        $$('[data-sa-tab]', el('modal-root')).forEach(b => {
          const on = picked.has(b.dataset.saTab);
          b.className = `flex items-center justify-between gap-3 px-[0.85rem] py-[0.6rem] rounded-[11px] border-[1.5px] transition-colors text-left ${on ? 'border-grass-ink bg-mint' : 'border-line bg-surface-2'}`;
          const sw = b.querySelector('[data-sa-sw]');
          sw.className = `w-[38px] h-[22px] rounded-[100px] relative shrink-0 transition-colors ${on ? 'bg-grass-ink' : 'bg-line2'}`;
          sw.firstElementChild.style.left = on ? '19px' : '3px';
        });
        el('sa-count').textContent = `${picked.size} of ${SUB_TABS.length} on`;
        const all = picked.size === SUB_TABS.length;
        const sw = el('sa-all-sw');
        sw.className = `w-[38px] h-[22px] rounded-[100px] relative shrink-0 transition-colors ${all ? 'bg-grass-ink' : 'bg-line2'}`;
        sw.firstElementChild.style.left = all ? '19px' : '3px';
      };
      $$('[data-sa-tab]', el('modal-root')).forEach(b => b.onclick = () => {
        const t = b.dataset.saTab;
        picked.has(t) ? picked.delete(t) : picked.add(t);
        paintTabs();
      });
      el('sa-all').onclick = () => {
        if (picked.size === SUB_TABS.length) picked.clear();
        else SUB_TABS.forEach(([t]) => picked.add(t));
        paintTabs();
      };

      el('sa-save').onclick = () => {
        const first = el('sa-first').value.trim();
        const last = el('sa-last').value.trim();
        const email = el('sa-email').value.trim();
        const dial = el('sa-dial').value;
        const phone = el('sa-phone').value.trim();
        if (!first) return toast('Please enter a first name', 'x');
        if (!last) return toast('Please enter a last name', 'x');
        if (!validEmail(email)) return toast('Please enter a valid email address', 'x');
        if (emailTaken(email, x ? x.id : null)) return toast('That email is already used on this console', 'x');
        if (!phone) return toast('Please enter a phone number', 'x');
        if (!picked.size) return toast('Turn on at least one section', 'x');
        const tabs = SUB_TABS.map(([t]) => t).filter(t => picked.has(t));
        if (x) Object.assign(x, { first, last, email, dial, phone, tabs });
        else SUB_ADMINS.push({
          id: 'sa' + Date.now(), first, last, email, dial, phone, tabs,
          active: true, joined: d(0), lastLogin: '',
          get name() { return fullName(this); },
        });
        closeModal(); render(); toast(x ? 'Sub admin updated' : `${first} ${last} added as a sub admin`, 'check');
      };
    }

    function profileView() {
      const detail = (label, val, ic) => `<div class="flex items-start gap-3 py-[0.7rem] border-b border-b-line2 last:border-b-0">
        <span class="w-[32px] h-[32px] rounded-[9px] bg-surface-2 text-muted inline-flex items-center justify-center shrink-0 mt-[1px]">${icon(ic, 15)}</span>
        <div class="min-w-0 flex-1">
          <div class="text-[0.72rem] font-bold tracking-[0.07em] uppercase text-adlabel">${label}</div>
          <div class="text-[0.92rem] font-semibold text-head truncate">${val}</div>
        </div></div>`;

      return `<div class="grid gap-5">

        <!-- Hero. The brand wash makes the page read as "yours" rather than
             as another data screen. -->
        <section data-rv class="${C.card} overflow-hidden">
          <div class="relative h-[110px] bg-[linear-gradient(135deg,#1a2e4a_0%,#2d5a8e_55%,#2d7a4f_100%)]">
            <div class="absolute inset-0 opacity-[0.16] bg-[radial-gradient(circle_at_18%_120%,#f5a623_0%,transparent_55%)]"></div>
            <div class="absolute -right-6 -top-8 opacity-[0.13] text-white pointer-events-none">${icon('shield', 150)}</div>
          </div>
          <!-- Only the avatar overlaps the banner. Pulling the whole row up
               dragged the name onto the dark gradient with it, where navy
               text is unreadable. -->
          <div class="px-6 pt-4 pb-6 relative flex items-end gap-5 flex-wrap">
            <span class="-mt-[58px] rounded-[20px] ring-4 ring-[var(--surface)] shadow-[var(--sh-2)] inline-block">${avatar(me().name, 84, me().photo)}</span>
            <div class="min-w-0 flex-1">
              <h2 class="font-serif text-[1.5rem] font-black text-head leading-tight truncate">${esc(me().name)}</h2>
              <div class="text-[0.9rem] text-muted font-semibold truncate">${esc(me().email)}</div>
              <div class="flex items-center gap-2 mt-2 flex-wrap">
                ${pill('green', me().role, 'shield')}
              </div>
            </div>
            <!-- Changing the password lives in Security, next to when it was
                 last changed — one entry point, not two. -->
            <div class="flex gap-2 pb-1 flex-wrap">
              <button class="${C.btnSm} ${C.primary}" data-act="edit-profile">${icon('edit', 14)} Edit profile</button>
            </div>
          </div>
        </section>

        ${miniStats(isSub() ? [
        ['Role', me().role, 'shield', '#e3f2e9|#20643d'],
        ['Member since', fmtDate(me().joined), 'calendar', '#e2ebfa|#2d5a8e'],
      ] : [
        ['Role', me().role, 'shield', '#e3f2e9|#20643d'],
        ['Member since', fmtDate(ADMIN.joined), 'calendar', '#e2ebfa|#2d5a8e'],
        ['Last sign-in', fmtDate(ADMIN.lastLogin), 'clock', '#ede6f8|#5c4382'],
        ['Priced ad types', AD_TYPES.length, 'tag', '#fdeed5|#8a5200'],
      ])}

        <!-- A sub admin's profile is the left column only: their details and
             their password. Pricing is not theirs to see or set. -->
        <div class="grid ${isSub() ? 'grid-cols-1' : 'grid-cols-[1fr_1.75fr]'} gap-5 max1200:grid-cols-1 items-start">

          <div class="grid gap-5 min-w-0">
            ${panel('Basic details', `<button class="${C.btnSm} ${C.ghost}" data-act="edit-profile">${icon('edit', 13)} Edit</button>`, `<div class="p-5">
              ${detail('Full name', esc(me().name), 'user')}
              ${detail('Email address', esc(me().email), 'mail')}
              ${detail('Phone', esc(showPhone(me())), 'phone')}
              ${detail('Role', me().role, 'shield')}
              ${detail('Member since', fmtDate(me().joined), 'calendar')}
            </div>`)}


            ${panel('Security', '', `<div class="p-5 grid gap-3">
              <div class="flex items-center gap-3 p-[0.85rem] rounded-[12px] border-[1.5px] border-line2">
                <span class="w-[36px] h-[36px] rounded-[10px] tint inline-flex items-center justify-center shrink-0" style="--chip-bg:#e3f2e9;--chip-fg:#20643d">${icon('lock', 16)}</span>
                <div class="min-w-0 flex-1"><div class="text-[0.9rem] font-bold text-head">Password</div>
                <div class="text-[0.78rem] text-muted">Last changed 42 days ago</div></div>
                <button class="${C.btnSm} ${C.ghost} shrink-0" data-act="change-pass">Change</button>
              </div>
            </div>`)}
          </div>

          ${isSub() ? '' : `<div class="grid gap-5 min-w-0">
            ${panel('Ad type pricing', `<span class="text-[0.8rem] text-muted font-semibold">Every ad takes exactly one</span>`, adTypeCards())}
            ${panel('Plan pricing', `<span class="text-[0.8rem] text-muted font-semibold">Every ad takes one of these</span>`, planCards())}
            ${panel('Add-on pricing', `<span class="text-[0.8rem] text-muted font-semibold">Added on top of the type and plan</span>`, addonCards())}
          </div>`}
        </div>
      </div>`;
    }

  </script>
  <script>
    /* ═══════════════ MODAL BUILDERS ═══════════════ */
    const field = (label, inner) => `<div class="flex flex-col gap-[0.4rem]"><label class="${C.label}">${label}</label>${inner}</div>`;
    /* The marker on a field the form will not save without. One definition, so
       an asterisk means the same thing on every form in the console. */
    const REQ = ' <span class="text-danger-t" title="Required">*</span>';
    const input = (id, ph, val = '', type = 'text') => `<input id="${id}" type="${type}" class="${C.inp}" placeholder="${ph}" value="${esc(val)}">`;
    /* A password field inside a modal. Modals are not re-rendered by render(),
       so the toggle swaps the type and the icon in place — re-rendering here
       would throw away whatever had been typed into the other two fields. */
    const pwInput = (id, ph, val = '') => `<div class="relative flex items-center">
      <input id="${id}" type="password" class="${C.inp} !pr-[46px]" placeholder="${ph}" value="${esc(val)}" autocomplete="new-password">
      <button type="button" data-pw-eye="${id}" aria-label="Show password"
        class="absolute right-[10px] text-muted leading-[0] p-1 hover:text-head transition-colors">${icon('eye-off', 17)}</button>
    </div>`;
    /* The three eyes on the sign-in and reset cards. Same rule as the modal
       ones: the icon shows the state the field is in, and nothing re-renders. */
    function wireAuthEyes() {
      $$('[data-pw-eye]', document).forEach(btn => {
        const pair = AUTH_EYE[btn.dataset.pwEye];
        if (!pair) return;                       // a modal eye, wired elsewhere
        btn.onclick = () => {
          const f = el(pair[0]); if (!f) return;

    function adDesignPanel(g, typeLabel, spot, ctx) {

    function whEditor(current, onDone) {
      let map = JSON.parse(JSON.stringify(whOf(current) || WH_DEFAULT()));
      const host = document.createElement('div');
      const row = (d) => {
        const v = map[d];
        const on = !!v;
        const sel = (which, val) => `<select data-wh-day="${d}" data-wh-side="${which}" ${on ? '' : 'disabled'}
          class="${C.inp} !w-auto !min-h-[38px] !py-[0.3rem] !text-[0.86rem] cursor-pointer ${on ? '' : 'opacity-45 cursor-not-allowed'}">
          ${WH_TIMES.map(t => `<option value="${t}" ${t === val ? 'selected' : ''}>${t}</option>`).join('')}
        </select>`;
        return `<div class="flex items-center gap-3 py-[0.45rem] flex-wrap">
          <label class="flex items-center gap-2 w-[86px] shrink-0 cursor-pointer">
            <input type="checkbox" data-wh-on="${d}" ${on ? 'checked' : ''} class="w-[17px] h-[17px] accent-[#20643d] cursor-pointer shrink-0">
            <span class="text-[0.92rem] font-bold ${on ? 'text-head' : 'text-muted'}">${d}</span>
          </label>
          ${sel('from', on ? v[0] : '9:00 AM')}
          <span class="text-[0.84rem] ${on ? 'text-muted' : 'text-faint'}">to</span>
          ${sel('to', on ? v[1] : '5:00 PM')}
          ${on ? '' : '<span class="text-[0.84rem] text-muted italic">Closed</span>'}
        </div>`;
      };
      const paint = () => {
        host.querySelector('[data-wh-rows]').innerHTML = WH_DAYS.map(row).join('');
        wire();
      };
      const wire = () => {
        $$('[data-wh-on]', host).forEach(cb => cb.onchange = () => {
          const d = cb.dataset.whOn;
          // Turning a day back on restores the hours it had rather than a
          // blank pair — unchecking Sunday by mistake should cost nothing.
          map[d] = cb.checked ? (map['_' + d] || ['9:00 AM', '5:00 PM']) : (map['_' + d] = map[d], null);
          paint();
        });
        $$('[data-wh-day]', host).forEach(se => se.onchange = () => {
          const d = se.dataset.whDay;
          if (!map[d]) return;
          map[d][se.dataset.whSide === 'from' ? 0 : 1] = se.value;
        });
      };
      host.innerHTML = `
        <div class="fixed inset-0 bg-[rgba(9,15,26,0.6)] backdrop-blur-[3px] z-[95] flex items-center justify-center p-4 animate-fade">
          <div class="bg-surface border-[1.5px] border-line2 rounded-[20px] w-full max-h-[90vh] overflow-y-auto shadow-[var(--sh-3)] animate-pop" style="max-width:520px" role="dialog" aria-modal="true">
            <div class="flex items-start justify-between gap-4 px-6 pt-5">
              <div class="min-w-0">
                <h3 class="font-serif font-black text-[1.35rem] text-head tracking-[-0.01em]">Working hours</h3>
                <p class="${C.sub} text-[0.88rem] mt-[0.2rem]">Set the hours parents will see on your listing. Uncheck a day to mark it closed.</p>
              </div>
              <button class="${C.iconbtn} shrink-0" data-wh-cancel aria-label="Close">${icon('x', 16)}</button>
            </div>
            <div class="px-6 pt-4">
              <div class="rounded-[14px] border-[1.5px] border-line2 bg-surface-2 px-4 py-2" data-wh-rows></div>
            </div>
            <div class="flex gap-3 px-6 py-5 flex-wrap">
              <button class="${C.btn} ${C.primary}" data-wh-done>${icon('check', 16)} Done</button>
              <button class="${C.btn} ${C.ghost}" data-wh-cancel>Cancel</button>
            </div>
          </div>
        </div>`;
      el('modal-root').appendChild(host);
      paint();
      const close = () => host.remove();
      $$('[data-wh-cancel]', host).forEach(b => b.onclick = close);
      host.querySelector('[data-wh-done]').onclick = () => {
        // The remembered-hours keys are working state, not the answer.
        const out = {};
        WH_DAYS.forEach(d => out[d] = map[d] || null);
        close();
        onDone(out);
      };
    }

    function categoryForm(id) {
      const c = id ? CATEGORIES.find(x => x.id === id) : null;
      const ICONS = ['stethoscope', 'school', 'book', 'palette', 'soccer', 'music', 'tent', 'cake', 'sparkle', 'heart', 'leaf', 'theater'];
      /* Subcategories are a list, so they are edited as one.

         They were a single comma-separated text field, which is a list pretending
         to be a sentence: you could not see how many you had without counting
         commas, a stray one left a blank entry, and renaming the third meant
         finding it inside a run of text. Each is its own row now — add with the
         button, Enter or a comma, rename in place, clear to remove. */
      let cimg = c ? (c.img || null) : null;
      let subs = c ? [...c.subs] : [];
      // Whether featuring is even available. Four slots, and a hidden category
      // cannot hold one — the same rule the card enforces, said here too rather
      // than letting the box promise something the switch would refuse.
      const featFull = featuredCats().length >= FEATURED_MAX && !(c && c.featured);
      const featWhy = c && !c.active
        ? 'Hidden categories cannot be featured — list it in the directory first'
        : featFull ? `Four are already featured. Unfeature one to free a slot.` : '';

      modal(c ? 'Edit category' : 'New main category', `<div class="grid gap-4">
        ${field('Category name', input('cf-name', 'e.g. Medical & Health', c ? c.name : ''))}
        ${field('Category image' + REQ, `
        <div id="cf-drop" class="flex flex-col h-[190px] rounded-[12px] border-[1.5px] border-dashed border-line bg-surface-2 overflow-hidden cursor-pointer transition-colors duration-150 hover:border-brand">
          <input id="cf-file" type="file" accept="image/*" class="hidden">
          <div id="cf-empty" class="flex-1 flex flex-col items-center justify-center gap-[0.3rem] text-center px-4">
            <span class="text-muted leading-[0]">${icon('upload', 22)}</span>
            <span class="text-[0.86rem] font-bold text-head leading-[1.35]">Drop an image here<br>or click to upload</span>
            <span class="text-[0.76rem] text-muted leading-[1.4]">Square · 600 × 600 px · JPG or PNG up to 2 MB</span>
          </div>
          <div id="cf-shot" class="hidden flex-1 min-h-0 items-center justify-center p-2 bg-surface-3">
            <img id="cf-img" alt="" class="max-w-full max-h-full w-auto h-auto object-contain rounded-[8px]">
          </div>
          <div id="cf-overlay" class="hidden items-center justify-between gap-2 shrink-0 px-[0.7rem] py-[0.5rem] border-t border-t-line2 bg-surface">
            <span class="text-[0.76rem] font-semibold text-muted truncate">Click to replace</span>
            <button type="button" id="cf-img-clear" class="shrink-0 text-[0.76rem] font-bold text-danger-t hover:underline">Remove</button>
          </div>
        </div>`)}
        ${field('Icon', `<div class="grid grid-cols-6 gap-2 max560:grid-cols-4">${ICONS.map(i => `
          <button type="button" data-pick-icon="${i}" class="h-[52px] rounded-[12px] border-[1.5px] inline-flex items-center justify-center transition-all ${(c ? c.icon : ICONS[0]) === i ? 'border-grass-ink bg-mint text-brand' : 'border-line text-muted hover:border-head hover:text-head'}">${icon(i, 20)}</button>`).join('')}</div>`)}

        <div>
          <div class="flex items-baseline justify-between gap-3 mb-[0.4rem]">
            <span class="text-[0.82rem] font-bold text-head uppercase tracking-[0.04em]">Subcategories</span>
            <span class="text-[0.78rem] text-muted font-semibold" id="cf-sub-count"></span>
          </div>
          <div class="flex gap-2">
            <input id="cf-sub-input" type="text" class="${C.inp}" placeholder="Pediatricians, Dentists, Therapy">
            <button type="button" id="cf-sub-add" class="shrink-0 w-[46px] rounded-[11px] border-[1.5px] border-line bg-surface-2 text-head inline-flex items-center justify-center transition-colors duration-150 hover:border-brand hover:text-brand">${icon('plus', 17)}</button>
          </div>
          <div id="cf-sub-list" class="grid gap-2 mt-2"></div>
          <p class="text-[0.78rem] text-muted leading-[1.55] mt-[0.45rem]">Press Enter or comma to add each one. Click a subcategory to rename it, or clear it to remove it.</p>
        </div>

        <!-- The home page has four slots, and which categories take them is a
             decision worth making while naming one rather than only afterwards
             on the card. The switch on the card still works and still governs
             the same field; this is a second way to the same answer. -->
        <label class="flex items-center gap-3 p-[0.8rem] rounded-[12px] border-[1.5px] ${featWhy ? 'border-line2 bg-surface-2 cursor-not-allowed' : 'border-grass-ink bg-mint cursor-pointer'}">
          <input type="checkbox" id="cf-featured" ${c && c.featured ? 'checked' : ''} ${featWhy ? 'disabled' : ''} class="w-[17px] h-[17px] accent-[#20643d] shrink-0 ${featWhy ? '' : 'cursor-pointer'}">
          <span class="min-w-0">
            <span class="block text-[0.88rem] font-bold text-head">Feature this category on the website</span>
            ${featWhy ? `<span class="block text-[0.76rem] text-muted leading-[1.45]">${esc(featWhy)}</span>` : ''}
          </span>
        </label>
      </div>`,
        `<button class="${C.btn} ${C.ghost}" data-close="1">Cancel</button>
         <button class="${C.btn} ${C.primary}" id="cf-save">${c ? 'Save changes' : 'Create category'}</button>`);

      const root = el('modal-root');

      /* One row per subcategory, each an input you can type over. A row emptied
         is a row removed — which is what "clear it to remove it" has to mean,
         and it saves reaching for the bin for the common case of a typo you
         would rather delete than fix. */
      const paintSubList = () => {
        el('cf-sub-count').textContent = subs.length ? `${subs.length} added` : '';
        el('cf-sub-list').innerHTML = subs.map((sName, i) => `
          <div class="flex gap-2">
            <input type="text" data-sub-idx="${i}" value="${esc(sName)}" class="${C.inp}">
            <button type="button" data-sub-del="${i}" title="Remove" class="shrink-0 w-[46px] rounded-[11px] border-[1.5px] border-line bg-surface-2 text-muted inline-flex items-center justify-center transition-colors duration-150 hover:border-danger-t hover:text-danger-t">${icon('trash', 16)}</button>
          </div>`).join('');
        $$('[data-sub-idx]', root).forEach(inp => {
          inp.oninput = () => { subs[+inp.dataset.subIdx] = inp.value; };
          inp.onblur = () => {
            if (inp.value.trim()) { subs[+inp.dataset.subIdx] = inp.value.trim(); return; }
            subs.splice(+inp.dataset.subIdx, 1);
            paintSubList();
          };
        });
        $$('[data-sub-del]', root).forEach(b => b.onclick = () => {
          subs.splice(+b.dataset.subDel, 1);
          paintSubList();
        });
      };
      /* Commas split, so pasting the whole list at once works as readily as
         typing them one at a time — and a duplicate is dropped rather than
         added twice, since two identical subcategories filter the same. */
      const addSubs = () => {
        const box = el('cf-sub-input');
        const added = box.value.split(',').map(x => x.trim()).filter(Boolean);
        if (!added.length) return;
        added.forEach(x => { if (!subs.some(y => y.toLowerCase() === x.toLowerCase())) subs.push(x); });
        box.value = '';
        paintSubList();
        box.focus();
      };
      el('cf-sub-add').onclick = addSubs;
      el('cf-sub-input').onkeydown = (ev) => {
        if (ev.key === 'Enter' || ev.key === ',') { ev.preventDefault(); addSubs(); }
      };
      paintSubList();

      const cdrop = el('cf-drop');
      const paintCat = () => {
        const on = hasArt(cimg);
        if (on) el('cf-img').src = artSrc(cimg, 600);
        el('cf-shot').classList.toggle('hidden', !on);
        el('cf-shot').classList.toggle('flex', on);
        el('cf-empty').classList.toggle('hidden', on);
        el('cf-empty').classList.toggle('flex', !on);
        el('cf-overlay').classList.toggle('hidden', !on);
        el('cf-overlay').classList.toggle('flex', on);
        cdrop.classList.toggle('border-dashed', !on);
      };
      const takeCatFile = (f) => {
        if (!f) return;
        if (!/^image\//.test(f.type)) return toast('Choose an image file', 'x');
        if (f.size > 2 * 1024 * 1024) return toast('That image is over 2 MB', 'x');
        const rd = new FileReader();
        rd.onload = () => { cimg = rd.result; paintCat(); toast('Image added', 'image'); };
        rd.readAsDataURL(f);
      };
      cdrop.onclick = (ev) => { if (ev.target.closest('#cf-img-clear')) return; el('cf-file').click(); };
      el('cf-file').onchange = (ev) => { const f = ev.target.files && ev.target.files[0]; ev.target.value = ''; takeCatFile(f); };
      el('cf-img-clear').onclick = (ev) => { ev.stopPropagation(); cimg = null; paintCat(); };
      cdrop.ondragover = (ev) => { ev.preventDefault(); cdrop.classList.add('border-brand'); };
      cdrop.ondragleave = () => cdrop.classList.remove('border-brand');
      cdrop.ondrop = (ev) => { ev.preventDefault(); cdrop.classList.remove('border-brand'); takeCatFile(ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0]); };
      paintCat();

      let picked = c ? c.icon : ICONS[0];
      $$('[data-pick-icon]', root).forEach(b => b.onclick = () => {
        picked = b.dataset.pickIcon;
        $$('[data-pick-icon]', root).forEach(x => x.className = `h-[52px] rounded-[12px] border-[1.5px] inline-flex items-center justify-center transition-all ${x.dataset.pickIcon === picked ? 'border-grass-ink bg-mint text-brand' : 'border-line text-muted hover:border-head hover:text-head'}`);
      });

      el('cf-save').onclick = () => {
        const name = el('cf-name').value.trim();
        if (!name) return toast('Please enter a category name', 'x');
        /* The image is required, and checked here rather than trusted to the
           asterisk. A category tile with no picture falls back to a flat
           gradient on the directory, which reads as a category that has not
           been finished rather than one that chose not to have one. */
        if (!hasArt(cimg)) return toast('Please add a category image', 'x');
        // Anything still sitting in the box counts — nobody should lose a
        // subcategory for pressing Save instead of Enter.
        addSubs();
        const clean = subs.map(x => x.trim()).filter(Boolean);
        const featured = el('cf-featured').checked && !featWhy;
        if (c) Object.assign(c, { name, img: cimg, icon: picked, subs: clean, featured });
        else CATEGORIES.push({
          id: name.toLowerCase().replace(/[^a-z]+/g, '-'), name, img: cimg, icon: picked,
          tint: '#eef1f5', grad: 'linear-gradient(135deg,#1a2e4a,#2d5a8e)',
          subs: clean, active: true, featured,
        });
        closeModal(); render(); toast(c ? 'Category updated' : 'Category created');
      };
    }

    /* Reviewing a request. It is the event form with the submission's answers
       already in it, so anything wrong can be corrected before it becomes a
       public listing — which is what "edit before approving" has to mean.

       One screen carries both decisions. Approve and Reject are the same
       judgement made two ways, and a row in a table does not show enough of a
       submission to make either on.

       Approving files it as a Draft, never straight to Published: an admin who
       approves ten requests has not decided that ten events should go live this
       second, and the toast says so, because a silent draft looks like nothing
       happened. */
    function requestForm(id) {
      const r = reqOf(id); if (!r) return;
      const ageNums = (r.ages || '').match(/\d+/g) || [];
      const done = r.status !== 'pending';
      modal(done ? 'Event request' : 'Review event request', `<div class="grid gap-4">
        ${done ? `<div class="flex items-start gap-3 p-[0.9rem] rounded-[12px] bg-red-bg border-[1.5px] border-[color-mix(in_srgb,var(--danger-text)_22%,transparent)]">
          <span class="text-danger-t leading-[0] mt-[2px]">${icon('x', 16)}</span>
          <span class="text-[0.85rem] text-head">This request was rejected${r.rejectedOn ? ` on ${fmtDate(r.rejectedOn)}` : ''}. No further action can be taken on it.</span>
        </div>` : ''}
        <div class="flex items-start gap-3 p-[0.9rem] rounded-[12px] bg-surface-2 border-[1.5px] border-line2">
          <span class="text-brand leading-[0] mt-[2px]">${icon('user', 16)}</span>
          <div class="min-w-0 text-[0.85rem]">
            <div class="font-bold text-head">${esc(r.reqName)}</div>
            <div class="text-muted">${esc(r.reqEmail)} · ${esc(r.reqPhone)}</div>
            <div class="text-muted">Requested ${fmtDate(r.reqOn)}</div>
          </div>
        </div>
        ${field('Event name' + REQ, input('rf-name', 'e.g. Family Fun Fair', r.name))}
        <div class="grid grid-cols-2 gap-4 max560:grid-cols-1">
          ${field('Category' + REQ, select('rf-cat', CATEGORIES.map(c => [c.id, c.name]), r.cat))}
          ${field('Subcategory' + REQ, `<select id="rf-sub" class="${C.inp} cursor-pointer"></select>`)}
        </div>
        <div class="grid grid-cols-2 gap-4 max560:grid-cols-1">
          ${field('Date' + REQ, input('rf-date', '', r.date, 'date'))}
          ${field('Town' + REQ, input('rf-town', 'e.g. Paramus', r.town))}
        </div>
        <div class="grid grid-cols-2 gap-4 max560:grid-cols-1">
          ${field('Start time' + REQ, input('rf-time', 'e.g. 10:00 AM', r.time))}
          ${field('End time' + REQ, input('rf-end-time', 'e.g. 4:00 PM', r.endTime || '4:00 PM'))}
        </div>
        <div class="grid grid-cols-2 gap-4 max560:grid-cols-1">
          ${field('Age range' + REQ, `<div class="flex items-center gap-3">
            <input id="rf-age-min" type="number" min="0" max="18" class="${C.inp}" placeholder="3" value="${ageNums[0] || ''}">
            <span class="text-[0.9rem] text-muted shrink-0">to</span>
            <input id="rf-age-max" type="number" min="0" max="18" class="${C.inp}" placeholder="12" value="${ageNums[1] || ''}">
          </div>`)}
          ${field('Organizer' + REQ, input('rf-org', 'e.g. Bergen Kids', r.organizer))}
        </div>
        ${field('Description' + REQ, `<textarea id="rf-desc" class="${C.inp} min-h-[90px] resize-y leading-[1.6]">${esc(r.desc)}</textarea>`)}
        ${mediaEditor('rf', null)}
        ${done ? '' : `<div class="flex items-start gap-3 p-[0.9rem] rounded-[12px] bg-mint border-[1.5px] border-mint-2">
          <span class="text-brand leading-[0] mt-[2px]">${icon('info', 16)}</span>
          <span class="text-[0.85rem] text-head">Edit anything that needs correcting first. Approving files it as a <b>Draft</b> in Events — publish it there when you are ready for families to see it.</span>
        </div>`}
      </div>`,
        done
          ? `<button class="${C.btn} ${C.ghost}" data-close="1">Close</button>`
          /* Both decisions sit together, with Reject given the quieter
             treatment: it is the one that cannot be walked back. */
          : `<button class="${C.btn} ${C.ghost}" data-close="1">Cancel</button>
         <button class="${C.btn} ${C.ghost} !text-danger-t !border-[color-mix(in_srgb,var(--danger-text)_35%,transparent)]" id="rf-reject">${icon('x', 16)} Reject</button>
         <button class="${C.btn} ${C.primary}" id="rf-save">${icon('check', 16)} Approve as draft</button>`, { w: '620px' });

      const rfMedia = { imgs: evImgs(r), video: evVid(r) };
      wireMedia('rf', rfMedia);
      // A closed request is a record, so nothing on it can be typed over.
      if (done) $$('#modal-root input,#modal-root select,#modal-root textarea,#modal-root button[id^="rf-"]', document)
        .forEach(n => { n.disabled = true; n.style.opacity = '.75'; });

      const paintSubs = () => {
        const c = CATEGORIES.find(x => x.id === el('rf-cat').value);
        const subs = (c && c.subs) || [];
        el('rf-sub').innerHTML = `<option value="">${subs.length ? 'Select a subcategory' : 'This category has none'}</option>`
          + subs.map(x => `<option value="${esc(x)}" ${r.sub === x ? 'selected' : ''}>${esc(x)}</option>`).join('');
      };
      el('rf-cat').onchange = paintSubs;
      paintSubs();

      if (el('rf-reject')) el('rf-reject').onclick = () => {
        confirmDialog('Reject this request',
          `<p><b>${esc(r.name)}</b> stays in this list as rejected and no further action can be taken on it. ${esc(r.reqName)} is not notified automatically.</p>`,
          'Reject request', () => {
            r.status = 'rejected'; r.rejectedOn = d(0);
            closeModal(); render(); toast('Request rejected', 'x');
          }, true);
      };

      if (el('rf-save')) el('rf-save').onclick = () => {
        /* An approved request becomes a public listing, so it is held to the
           same completeness the create form is — the marks on the labels and
           the checks here are the one rule stated twice. */
        const need = [
          ['rf-name', 'Enter an event name'], ['rf-cat', 'Choose a category'],
          ['rf-date', 'Pick the date'], ['rf-town', 'Enter the town'],
          ['rf-time', 'Enter the start time'], ['rf-end-time', 'Enter the end time'],
          ['rf-age-min', 'Enter the youngest age'], ['rf-age-max', 'Enter the oldest age'],
          ['rf-org', 'Enter the organizer'], ['rf-desc', 'Enter a description'],
        ];
        for (const [id, msg] of need) {
          const n = el(id);
          if (n && !String(n.value).trim()) { n.focus(); return toast(msg, 'x'); }
        }
        if (el('rf-sub').options.length > 1 && !el('rf-sub').value) { el('rf-sub').focus(); return toast('Choose a subcategory', 'x'); }
        const name = el('rf-name').value.trim();
        const lo = el('rf-age-min').value.trim(), hi = el('rf-age-max').value.trim();
        if (+hi < +lo) return toast('The oldest age cannot be below the youngest', 'x');
        if (!rfMedia.imgs.length) return toast('Add at least one image', 'x');
        const data = {
          name, cat: el('rf-cat').value, sub: el('rf-sub').value,
          date: el('rf-date').value || r.date,
          time: el('rf-time').value.trim() || r.time,
          endTime: el('rf-end-time').value.trim() || '4:00 PM',
          town: el('rf-town').value.trim() || r.town,
          ages: lo && hi ? `${lo}–${hi}` : (r.ages || 'All ages'),
          organizer: el('rf-org').value.trim() || r.organizer,
          desc: el('rf-desc').value.trim(),
          imgs: rfMedia.imgs.slice(), video: rfMedia.video, img: rfMedia.imgs[0],
        };
        Object.assign(r, data);
        // The approved event joins the schedule; the request leaves the queue.
        EVENTS.unshift({
          id: 'e' + Date.now(), icon: catOf(data.cat).icon, rsvp: 0,
          status: 'draft', fromRequest: r.id, ...data,
        });
        EVENT_REQUESTS = EVENT_REQUESTS.filter(x => x.id !== r.id);
        closeModal();
        state.eventSection = 'events';
        state.f.events.status = 'draft';
        render();
        toast(`${data.name} approved as a draft — publish it from Events`, 'check');
      };
    }

    /* `town` prefills a new event when the form is opened from Town Coverage —
       "Schedule an event" on the Closter row has to arrive with Closter
       already filled in, or the button is just a link to a blank form. */
    /* ── Event media ──────────────────────────────────────────
       Up to five images and one video, the same allowance the ad creative has.
       Written once and used by the event form, the request review and the
       read-only detail, so the three can never disagree about what an event is
       allowed to carry.

       Images are held the way articles hold theirs: a number is an index into
       the stock gallery, a string is a data URL from an upload. The video is a
       single object with a name, so a file that cannot be played back in a
       prototype still shows that one is attached. */
    const MAX_EV_IMAGES = 5, MAX_EV_VIDEOS = 1;
    const evImgs = (e) => (e && Array.isArray(e.imgs) ? e.imgs : (e && typeof e.img === 'number' ? [e.img] : [])).slice(0, MAX_EV_IMAGES);
    const evVid = (e) => (e && e.video) || null;

    // Read-only strip, for the detail modal.
    function mediaStrip(imgs, video) {
      if (!imgs.length && !video) return `<p class="text-[0.85rem] text-muted">No images or video on this event.</p>`;
      return `<div class="grid grid-cols-5 gap-2 max560:grid-cols-3">
        ${imgs.map(i => `<div class="relative aspect-square rounded-[10px] overflow-hidden bg-surface-2">
          <img src="${artSrc(i, 320)}" alt="" class="absolute inset-0 w-full h-full object-cover"></div>`).join('')}
        ${video ? `<div class="relative aspect-square rounded-[10px] overflow-hidden bg-head text-white flex flex-col items-center justify-center gap-1">
          ${icon('video', 20)}<span class="text-[0.62rem] font-bold px-1 text-center truncate w-full">${esc(video.name || 'Video')}</span></div>` : ''}
      </div>`;
    }

    /* The editor. `ns` namespaces the ids so two of these could sit on one
       screen without colliding. Returns nothing — it writes into `store`, which
       the form reads back when it saves. */
    function mediaEditor(ns, store) {
      return field(`Images &amp; video` + REQ, `
      <div id="${ns}-media" class="grid gap-3">
        <div id="${ns}-grid" class="grid grid-cols-5 gap-2 max560:grid-cols-3"></div>
        <div class="flex gap-2 flex-wrap">
          <input id="${ns}-img-file" type="file" accept="image/*" multiple class="hidden">
          <input id="${ns}-vid-file" type="file" accept="video/*" class="hidden">
          <button type="button" id="${ns}-add-img" class="${C.btnSm} ${C.ghost}">${icon('image', 14)} Add images</button>
          <button type="button" id="${ns}-add-vid" class="${C.btnSm} ${C.ghost}">${icon('video', 14)} Add video</button>
          <span id="${ns}-count" class="text-[0.78rem] text-muted font-semibold self-center"></span>
        </div>
        <p class="text-[0.76rem] text-muted leading-[1.5]">Up to ${MAX_EV_IMAGES} images and ${MAX_EV_VIDEOS} video · JPG or PNG up to 2 MB each. At least one image is required.</p>
      </div>`);
    }

    // Wires an editor rendered by mediaEditor. Call once the modal is in the DOM.
    function wireMedia(ns, store) {
      const grid = el(ns + '-grid');
      const paint = () => {
        grid.innerHTML = store.imgs.map((src, i) => `
          <div class="relative aspect-square rounded-[10px] overflow-hidden bg-surface-2 group">
            <img src="${artSrc(src, 320)}" alt="" class="absolute inset-0 w-full h-full object-cover">
            <button type="button" data-rm-img="${i}" title="Remove"
              class="absolute top-1 right-1 w-[22px] h-[22px] rounded-full bg-[rgba(9,15,26,0.72)] text-white inline-flex items-center justify-center">${icon('x', 12)}</button>
          </div>`).join('')
          + (store.video ? `
          <div class="relative aspect-square rounded-[10px] overflow-hidden bg-head text-white flex flex-col items-center justify-center gap-1">
            ${icon('video', 20)}<span class="text-[0.62rem] font-bold px-1 text-center truncate w-full">${esc(store.video.name || 'Video')}</span>
            <button type="button" data-rm-vid="1" title="Remove"
              class="absolute top-1 right-1 w-[22px] h-[22px] rounded-full bg-[rgba(9,15,26,0.72)] text-white inline-flex items-center justify-center">${icon('x', 12)}</button>
          </div>` : '')
          + (!store.imgs.length && !store.video ? `<div class="col-span-5 max560:col-span-3 text-[0.85rem] text-muted py-3">Nothing added yet.</div>` : '');
        el(ns + '-count').textContent = `${store.imgs.length} of ${MAX_EV_IMAGES} images${store.video ? ' · 1 video' : ''}`;
        el(ns + '-add-img').disabled = store.imgs.length >= MAX_EV_IMAGES;
        el(ns + '-add-img').style.opacity = store.imgs.length >= MAX_EV_IMAGES ? '.45' : '1';
        el(ns + '-add-vid').disabled = !!store.video;
        el(ns + '-add-vid').style.opacity = store.video ? '.45' : '1';
        grid.querySelectorAll('[data-rm-img]').forEach(b => b.onclick = () => { store.imgs.splice(+b.dataset.rmImg, 1); paint(); });
        const rv = grid.querySelector('[data-rm-vid]');
        if (rv) rv.onclick = () => { store.video = null; paint(); };
      };
      el(ns + '-add-img').onclick = () => el(ns + '-img-file').click();
      el(ns + '-add-vid').onclick = () => el(ns + '-vid-file').click();
      el(ns + '-img-file').onchange = (ev) => {
        const files = [...(ev.target.files || [])];
        ev.target.value = '';
        // Trimmed to the room left rather than refusing the whole selection.
        const room = MAX_EV_IMAGES - store.imgs.length;
        if (!room) return toast(`That is the ${MAX_EV_IMAGES} image limit`, 'x');
        files.slice(0, room).forEach(f => {
          if (!/^image\//.test(f.type)) return toast('Choose image files', 'x');
          if (f.size > 2 * 1024 * 1024) return toast(`${f.name} is over 2 MB`, 'x');
          const rd = new FileReader();
          rd.onload = () => { store.imgs.push(rd.result); paint(); };
          rd.readAsDataURL(f);
        });
        if (files.length > room) toast(`Only ${room} more image${room === 1 ? '' : 's'} would fit`, 'x');
      };
      el(ns + '-vid-file').onchange = (ev) => {
        const f = ev.target.files && ev.target.files[0];
        ev.target.value = '';
        if (!f) return;
        if (!/^video\//.test(f.type)) return toast('Choose a video file', 'x');
        store.video = { name: f.name };
        paint();
        toast('Video attached', 'check');
      };
      paint();
    }

    /* The whole submission on one screen, read-only. The list shows what you
       scan by; this shows what you decide on, including the description and the
       picture that no column has room for. */
    function eventDetail(id) {
      const e = EVENTS.find(x => x.id === id); if (!e) return;
      const row = (label, val, ic) => `<div class="flex items-start gap-3 py-[0.65rem] border-b border-b-line2 last:border-b-0">
        <span class="w-[30px] h-[30px] rounded-[9px] bg-surface-2 text-muted inline-flex items-center justify-center shrink-0">${icon(ic, 14)}</span>
        <div class="min-w-0 flex-1">
          <div class="text-[0.7rem] font-bold tracking-[0.07em] uppercase text-adlabel">${label}</div>
          <div class="text-[0.9rem] font-semibold text-head">${val}</div></div></div>`;
      modal(e.name, `<div class="grid gap-4">
        <div class="relative h-[170px] rounded-[14px] overflow-hidden cat-tint inline-flex items-center justify-center text-head"
          style="--cat:${catOf(e.cat).tint};background:var(--cat)">
          ${icon(e.icon, 40)}
          ${typeof e.img === 'number' ? `<img src="${adImg(e.img, 900)}" alt="" class="absolute inset-0 w-full h-full object-cover">` : ''}
          <span class="absolute left-3 top-3">${sp(e.status)}</span>
        </div>
        <div class="flex flex-wrap items-center gap-2">${catPill(e.cat)}
          ${e.sub ? `<span class="${C.pill} ${PILL.grey}">${esc(e.sub)}</span>` : ''}</div>
        <p class="text-[0.92rem] text-head leading-[1.65]">${esc(e.desc)}</p>
        <div>
          <div class="text-[0.7rem] font-bold tracking-[0.07em] uppercase text-adlabel mb-2">Images &amp; video</div>
          ${mediaStrip(evImgs(e), evVid(e))}
        </div>
        <div class="rounded-[14px] border-[1.5px] border-line2 px-4">
          ${row('Date', fmtDate(e.date) + (e.endDate ? ` — ${fmtDate(e.endDate)}` : ''), 'calendar')}
          ${row('Time', `${esc(e.time)}${e.endTime ? ` — ${esc(e.endTime)}` : ''}`, 'clock')}
          ${row('Town', esc(e.town), 'pin')}
          ${row('Ages', esc(e.ages), 'users')}
          ${row('Organizer', esc(e.organizer), 'user')}
          ${e.fromRequest ? row('Source', 'Approved from an event request', 'check') : ''}
        </div>
      </div>`,
        `<button class="${C.btn} ${C.ghost}" data-close="1">Close</button>
         ${e.status === 'past'
          ? `<button class="${C.btn} ${C.primary}" data-act="republish-event" data-id="${e.id}">${icon('refresh', 16)} Republish</button>`
          : `<button class="${C.btn} ${C.primary}" data-act="edit-event" data-id="${e.id}">${icon('edit', 16)} Edit event</button>`}`,
        { w: '560px' });
    }

    function eventForm(id, town, republish) {
      const e = id ? EVENTS.find(x => x.id === id) : null;
      const ageNums = (e && e.ages ? e.ages.match(/\d+/g) : null) || [];
      const repeats = !!(e && e.endDate);
      // Same marker every form uses: an asterisk on what the save enforces.
      const req = REQ;
      /* Republishing clears the three fields that cannot carry over — a repeat
         of last month's event needs its own date and times — and leaves the
         rest to be edited if anything else has moved. */
      const reDate = republish ? '' : (e ? e.date : d(7));
      const reStart = republish ? '' : (e ? e.time : '10:00 AM');
      const reEnd = republish ? '' : (e && e.endTime ? e.endTime : '4:00 PM');
      modal(republish ? 'Republish event' : e ? 'Edit event' : 'Create event', `<div class="grid gap-4">
        ${republish ? `<div class="flex items-start gap-3 p-[0.9rem] rounded-[12px] bg-mint border-[1.5px] border-mint-2">
          <span class="text-brand leading-[0] mt-[2px]">${icon('info', 16)}</span>
          <span class="text-[0.85rem] text-head">The date and times have been cleared. Set the new ones, then republish — or save it as a draft and publish later.</span>
        </div>` : ''}
        ${field('Event name' + req, input('ef-name', 'e.g. Family Fun Fair', e ? e.name : ''))}
        <!-- Category and subcategory sit together: the second is a narrowing
             of the first, and the list in it is rebuilt whenever the first
             changes. Both are required — an event has to say which part of a
             category it belongs to. Date pairs with Town, which it displaced. -->
        <div class="grid grid-cols-2 gap-4 max560:grid-cols-1">
          ${field('Category' + req, select('ef-cat', CATEGORIES.map(c => [c.id, c.name]), e ? e.cat : 'parties'))}
          ${field('Subcategory' + req,
        `<select id="ef-sub" class="${C.inp} cursor-pointer"></select>`)}
        </div>
        <div class="grid grid-cols-2 gap-4 max560:grid-cols-1">
          ${field('Date' + REQ, input('ef-date', '', reDate, 'date'))}
          ${field('Town' + REQ, input('ef-town', 'e.g. Paramus', e ? e.town : (town || '')))}
        </div>
        <div class="grid grid-cols-2 gap-4 max560:grid-cols-1">
          ${field('Start time' + REQ, input('ef-time', 'e.g. 10:00 AM', reStart))}
          ${field('End time' + REQ, input('ef-end-time', 'e.g. 4:00 PM', reEnd))}
        </div>
        <label class="flex items-center gap-3 cursor-pointer p-[0.9rem] rounded-[12px] bg-mint border-[1.5px] border-mint-2">
          <input type="checkbox" id="ef-repeat" ${repeats ? 'checked' : ''} class="w-[18px] h-[18px] accent-[#20643d] cursor-pointer">
          <span class="text-[0.92rem] font-semibold text-head">Repeat until</span>
        </label>
        <div id="ef-end-date-row" class="${repeats ? '' : 'hidden'}">
          ${field('End date', input('ef-end-date', '', e && e.endDate ? e.endDate : d(14), 'date'))}
        </div>
        <div class="grid grid-cols-2 gap-4 max560:grid-cols-1">
          ${field('Age range' + REQ, `<div class="flex items-center gap-3">
            <input id="ef-age-min" type="number" min="0" max="18" class="${C.inp}" placeholder="3" value="${ageNums[0] || ''}">
            <span class="text-[0.9rem] text-muted shrink-0">to</span>
            <input id="ef-age-max" type="number" min="0" max="18" class="${C.inp}" placeholder="12" value="${ageNums[1] || ''}">
          </div>`)}
          ${field('Organizer' + REQ, input('ef-org', 'e.g. Bergen Kids', e ? e.organizer : ''))}
        </div>
        ${field('Description' + REQ, `<textarea id="ef-desc" class="${C.inp} min-h-[90px] resize-y leading-[1.6]" placeholder="What happens at this event?">${e ? esc(e.desc) : ''}</textarea>`)}
        ${mediaEditor('ef', null)}
        ${field('Status', select('ef-status', [['published', 'Published — Visible to public'], ['draft', 'Draft — Hidden from public']], republish ? 'published' : e ? e.status : 'draft'))}
      </div>`,
        `<button class="${C.btn} ${C.ghost}" data-close="1">Cancel</button>
         <button class="${C.btn} ${C.primary}" id="ef-save">${republish ? 'Republish' : e ? 'Save changes' : 'Create event'}</button>`, { w: '620px' });

      /* The label follows the status: choosing Draft turns Republish into Save
         as draft, so the button always names what pressing it will do. */
      if (republish) {
        const btn = el('ef-save'), st = el('ef-status');
        const paintBtn = () => { btn.textContent = st.value === 'draft' ? 'Save as draft' : 'Republish'; };
        st.addEventListener('change', paintBtn);
        paintBtn();
      }

      const efMedia = { imgs: evImgs(e), video: evVid(e) };
      wireMedia('ef', efMedia);

      el('ef-repeat').onchange = (ev) => el('ef-end-date-row').classList.toggle('hidden', !ev.target.checked);

      /* Rebuild the subcategory list against the chosen category. The event's
         own subcategory survives only if the new category also has it — a
         Pottery event moved to Sports is no longer a Pottery anything, so it
         falls back to none rather than keeping a label that no longer exists. */
      const paintSubs = () => {
        const c = CATEGORIES.find(x => x.id === el('ef-cat').value);
        const subs = (c && c.subs) || [];
        /* The blank option is a prompt, not an answer — the save blocks on it.
           A category with no subcategories at all is the one case where there
           is nothing to choose, and there the blank one stands. */
        el('ef-sub').innerHTML = `<option value="">${subs.length ? 'Select a subcategory' : 'This category has none'}</option>`
          + subs.map(s => `<option value="${esc(s)}" ${e && e.sub === s ? 'selected' : ''}>${esc(s)}</option>`).join('');
      };
      el('ef-cat').onchange = paintSubs;
      paintSubs();

      el('ef-save').onclick = () => {
        /* Every field is required. A half-filled event reaches families as a
           listing with a blank where the time or the town should be, so the
           form asks for all of it — the only allowance is the media, where one
           image is enough and the other four are optional. */
        const need = [
          ['ef-name', 'Enter an event name'], ['ef-cat', 'Choose a category'],
          ['ef-date', 'Pick the date'], ['ef-time', 'Enter the start time'], ['ef-end-time', 'Enter the end time'],
          ['ef-town', 'Enter the town'], ['ef-age-min', 'Enter the youngest age'], ['ef-age-max', 'Enter the oldest age'],
          ['ef-org', 'Enter the organizer'], ['ef-desc', 'Enter a description'],
        ];
        for (const [id, msg] of need) {
          const n = el(id);
          if (n && !String(n.value).trim()) { n.focus(); return toast(msg, 'x'); }
        }
        // Only where the category actually offers subcategories — several
        // do not, and a field with nothing in it cannot be required.
        if (el('ef-sub').options.length > 1 && !el('ef-sub').value) { el('ef-sub').focus(); return toast('Choose a subcategory', 'x'); }
        const name = el('ef-name').value.trim();
        if (+el('ef-age-max').value < +el('ef-age-min').value) return toast('The oldest age cannot be below the youngest', 'x');
        if (!efMedia.imgs.length) return toast('Add at least one image', 'x');
        if (republish) {
          if (!el('ef-date').value) return toast('Pick the new date', 'x');
          if (!el('ef-time').value.trim()) return toast('Enter the new start time', 'x');
          if (!el('ef-end-time').value.trim()) return toast('Enter the new end time', 'x');
        }
        // Required wherever there is one to pick — see paintSubs.
        const catSubs = (CATEGORIES.find(x => x.id === el('ef-cat').value) || {}).subs || [];
        if (catSubs.length && !el('ef-sub').value) return toast('Please choose a subcategory', 'x');
        const lo = el('ef-age-min').value.trim(), hi = el('ef-age-max').value.trim();
        const repeat = el('ef-repeat').checked;
        const data = {
          name, date: el('ef-date').value || d(7),
          time: el('ef-time').value.trim() || '10:00 AM',
          endTime: el('ef-end-time').value.trim() || '4:00 PM',
          endDate: repeat ? (el('ef-end-date').value || '') : '',
          cat: el('ef-cat').value, sub: el('ef-sub').value,
          town: el('ef-town').value.trim() || 'Bergen County',
          ages: lo && hi ? `${lo}–${hi}` : 'All ages',
          organizer: el('ef-org').value.trim() || 'Bergen Kids', desc: el('ef-desc').value.trim(), status: el('ef-status').value,
          imgs: efMedia.imgs.slice(), video: efMedia.video, img: efMedia.imgs[0]
        };
        if (e) Object.assign(e, data);
        else EVENTS.unshift({ id: 'e' + (EVENTS.length + 20), icon: catOf(data.cat).icon, rsvp: 0, ...data });
        closeModal(); render();
        toast(republish ? (data.status === 'draft' ? 'Saved as a draft' : `${data.name} republished`) : e ? 'Event updated' : 'Event created');
      };
    }

    /* `presetStatus` is how "Publish again" on an expired article arrives —
       the same editor, opened with Published already chosen, so republishing
       is still a review of the copy rather than a blind status flip.
       An expired article opened by plain Edit defaults to Draft: coming off a
       finished run, drafts is the safe landing, and Published is one field
       away for anyone who wants it. */
    function articleForm(id, presetStatus) {
      const a = id ? ARTICLES.find(x => x.id === id) : null;
      const status0 = presetStatus || (a && a.status === 'published' ? 'published' : 'draft');
      /* A stale end date would republish an article straight back into
         expiry, so a date that has already passed is replaced by a fresh
         30-day window rather than being carried over. */
      const end0 = a && a.endDate && a.endDate > d(0) ? a.endDate : d(30);
      modal(a ? 'Edit article' : 'New article', `<div class="grid gap-4">
        ${a && a.status === 'expired' ? `<div class="flex items-start gap-3 p-[0.85rem] rounded-[12px] border-[1.5px] border-line2 bg-surface-2">
          <span class="w-[34px] h-[34px] rounded-[10px] tint inline-flex items-center justify-center shrink-0" style="--chip-bg:#fdeed5;--chip-fg:#8a5200">${icon('clock', 16)}</span>
          <div class="min-w-0"><div class="text-[0.9rem] font-bold text-head">This article has expired</div>
          <div class="text-[0.82rem] text-muted leading-[1.55]">Save it as a <strong class="text-head">Draft</strong> to keep working on it, or set it back to <strong class="text-head">Published</strong> with a new end date to put it live again.</div></div>
        </div>` : ''}
        ${field('Headline' + REQ, input('af-title', 'e.g. Choosing the Right Pediatrician', a ? a.title : ''))}
        <div class="grid grid-cols-2 gap-4 max560:grid-cols-1">
          ${field('Category' + REQ, select('af-cat', CATEGORIES.map(c => [c.id, c.name]), a ? a.cat : 'medical'))}
          <!-- The one field the form will save without. Left blank it files
               under the house byline rather than blocking the save. -->
          ${field('Author', input('af-author', 'e.g. Marcus Feld', a ? a.author : ''))}
        </div>
        <!-- The picture, which the article carries at the top of the page and
             as its thumbnail in the list.

             One control, not three: the box IS the picture. Empty, it is the
             dashed drop zone the ad form already uses and says what to do;
             filled, the whole picture is shown inside it — contained, not
             cropped, because the point of a preview is to see what you
             uploaded rather than a slice of it. Clicking anywhere replaces it,
             and the bar underneath carries the one thing clicking cannot
             mean — Remove. The bar is solid rather than a scrim over the
             photo, so its text is legible whatever the image is. -->
        <!-- Half the width, with the two publishing fields taking the other
             half: a picture does not need the full span, and the row balances
             instead of ending in an empty right side. -->
        <div class="grid grid-cols-2 gap-4 max560:grid-cols-1">
          ${field('Image' + REQ, `
          <div id="af-drop" class="flex flex-col h-[190px] rounded-[12px] border-[1.5px] border-dashed border-line bg-surface-2 overflow-hidden cursor-pointer transition-colors duration-150 hover:border-brand">
            <input id="af-file" type="file" accept="image/*" class="hidden">
            <div id="af-empty" class="flex-1 flex flex-col items-center justify-center gap-[0.3rem] text-center px-4">
              <span class="text-muted leading-[0]">${icon('upload', 22)}</span>
              <span class="text-[0.86rem] font-bold text-head leading-[1.35]">Drop an image here<br>or click to upload</span>
              <span class="text-[0.76rem] text-muted leading-[1.4]">JPG or PNG · up to 2 MB</span>
            </div>
            <!-- min-h-0 so the picture area gives way rather than pushing the
                 bar out of the frame. -->
            <div id="af-shot" class="hidden flex-1 min-h-0 items-center justify-center p-2 bg-surface-3">
              <img id="af-img" alt="" class="max-w-full max-h-full w-auto h-auto object-contain rounded-[8px]">
            </div>
            <div id="af-overlay" class="hidden items-center justify-between gap-2 shrink-0 px-[0.7rem] py-[0.5rem] border-t border-t-line2 bg-surface">
              <span class="text-[0.76rem] font-semibold text-muted truncate">Click to replace</span>
              <button type="button" id="af-img-clear" class="shrink-0 text-[0.76rem] font-bold text-danger-t hover:underline">Remove</button>
            </div>
          </div>`)}
          <!-- content-start so these sit at the top of the row rather than
               stretching to the height of the picture beside them. -->
          <div class="grid content-start gap-4">
            ${field('Status' + REQ, select('af-status', [['published', 'Published'], ['draft', 'Draft']], status0))}
            <div id="af-end-date-row" class="${status0 === 'published' ? '' : 'hidden'}">
              ${field('End date' + REQ, input('af-end', '', end0, 'date'))}
            </div>
          </div>
        </div>
        ${field('Excerpt' + REQ, `<textarea id="af-excerpt" class="${C.inp} min-h-[80px] resize-y leading-[1.6]" placeholder="A one-line summary shown in listings.">${a ? esc(a.excerpt) : ''}</textarea>`)}
        ${field('Body' + REQ + ' <span class="font-normal text-muted normal-case tracking-normal">(leave a blank line between paragraphs)</span>',
        `<textarea id="af-body" class="${C.inp} min-h-[180px] resize-y leading-[1.7]" placeholder="Write the article…">${a ? esc(a.body || '') : ''}</textarea>`)}
      </div>`,
        `<button class="${C.btn} ${C.ghost}" data-close="1">Cancel</button>
         <button class="${C.btn} ${C.primary}" id="af-save">${a ? 'Save changes' : 'Create article'}</button>`, { w: '640px' });

      el('af-status').onchange = (ev) => el('af-end-date-row').classList.toggle('hidden', ev.target.value !== 'published');

      /* The picture lives in a local until the article is saved, so cancelling
         an edit leaves the published one alone. */
      let img = a ? a.img : null;
      const drop = el('af-drop');
      const paintImg = () => {
        const on = hasArt(img);
        if (on) el('af-img').src = artSrc(img, 900);
        el('af-shot').classList.toggle('hidden', !on);
        el('af-shot').classList.toggle('flex', on);
        el('af-empty').classList.toggle('hidden', on);
        el('af-empty').classList.toggle('flex', !on);
        el('af-overlay').classList.toggle('hidden', !on);
        el('af-overlay').classList.toggle('flex', on);
        // Dashed says "nothing here yet"; once there is a picture the frame is
        // holding content, so the border goes solid.
        drop.classList.toggle('border-dashed', !on);
      };
      // One route in for every way a file can arrive — picked or dropped.
      const takeFile = (f) => {
        if (!f) return;
        if (!/^image\//.test(f.type)) return toast('Choose an image file', 'x');
        if (f.size > 2 * 1024 * 1024) return toast('That image is over 2 MB', 'x');
        const rd = new FileReader();
        rd.onload = () => { img = rd.result; paintImg(); toast('Image added', 'image'); };
        rd.readAsDataURL(f);
      };
      drop.onclick = (ev) => { if (ev.target.closest('#af-img-clear')) return; el('af-file').click(); };
      el('af-file').onchange = (ev) => { const f = ev.target.files && ev.target.files[0]; ev.target.value = ''; takeFile(f); };
      el('af-img-clear').onclick = (ev) => { ev.stopPropagation(); img = null; paintImg(); };
      // A real drop target, which is what the empty state promises.
      drop.ondragover = (ev) => { ev.preventDefault(); drop.classList.add('border-brand'); };
      drop.ondragleave = () => drop.classList.remove('border-brand');
      drop.ondrop = (ev) => {
        ev.preventDefault(); drop.classList.remove('border-brand');
        takeFile(ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0]);
      };
      paintImg();

      el('af-save').onclick = () => {
        const title = el('af-title').value.trim();
        if (!title) return toast('Please enter a headline', 'x');
        if (!hasArt(img)) return toast('Please upload an image', 'x');
        const status = el('af-status').value;
        const body = el('af-body').value.trim();
        const excerpt = el('af-excerpt').value.trim();
        if (!excerpt) return toast('Please write a short excerpt', 'x');
        if (!body) return toast('Please write the article body', 'x');
        if (status === 'published' && !el('af-end').value) return toast('Please choose an end date', 'x');
        const data = {
          title, cat: el('af-cat').value, author: el('af-author').value.trim() || 'Bergen Kids Staff',
          status, endDate: status === 'published' ? (el('af-end').value || '') : '', img,
          // No body yet means nothing to time, so the old estimate stands.
          excerpt, body, read: body ? readTime(body) : (a && a.read) || '1 min'
        };
        /* Going live dates the article today. A draft or an expired piece
           carries an old date — publishing it under that date would file it
           behind articles it now sits in front of. */
        const goingLive = status === 'published' && (!a || a.status !== 'published');
        if (goingLive) { data.date = d(0); data.hidden = false; }
        if (a) Object.assign(a, data);
        else ARTICLES.unshift({ id: 'a' + (ARTICLES.length + 20), date: d(0), views: 0, ...data });
        closeModal(); render();
        toast(!a ? 'Article created'
          : goingLive ? `${title} published` : status === 'draft' ? 'Saved as draft' : 'Article updated');
      };
    }

    /* ── New ad ─────────────────────────────────────────────────
       An ad made here belongs to Bergen Kids. Nobody is billed for it, so the
       form carries no prices, no plan, no duration and no total — those exist
       for ads an advertiser buys on the public site, and the pricing behind
       them still lives on Admin Profile. There is no advertiser picker for the
       same reason: the console does not place ads on a customer's behalf, so
       everything it creates files under Bergen Kids as an internal ad.

       The ad type drives the rest of the form. A home ad runs on one page and
       answers to no category or town; a category ad needs both a category and
       a subcategory. So those fields appear and disappear with the choice
       rather than sitting there greyed out. */
    function adForm(id) {
      const a = id ? ADS.find(x => x.id === id) : null;
      const type0 = a ? a.type : 'basic';
      // The one-month term unless the ad already says otherwise. An internal ad carries no
      // charge, but it still runs for a length of time and that is what a plan
      // names — so the field is asked for and the fee is simply never raised.
      const term0 = (a && a.term) || AD_TERMS[0].id;
      // Towns typed by hand — anything not in the county list came in via Other.
      const chosenTowns = (a && a.towns) || [];
      const customTowns = chosenTowns.filter(t => !TOWNS.includes(t));
      const chosenSpots = (a && a.spots) || [];
      const chosenAges = (a && a.ages) || [];
      /* Mandatory fields carry the asterisk and nothing else carries a note —
         "(optional)" on half the labels made the other half ambiguous, since a
         field with no note could mean either. */
      const req = REQ;
      // Same tile whether it is a placement or an add-on being ticked.
      const checkTile = (on) => `flex items-start gap-3 p-[0.7rem] rounded-[11px] border-[1.5px] cursor-pointer transition-colors duration-150 ${on ? 'border-grass-ink bg-mint' : 'border-line hover:border-head'}`;

      const typeCard = (t, on) => `
        <button type="button" data-pick-type="${t.id}" class="text-left p-[0.9rem] rounded-[12px] border-[1.5px] transition-all flex items-start gap-3 ${on ? 'border-grass-ink bg-mint' : 'border-line hover:border-head'}">
          <span class="w-[32px] h-[32px] rounded-[9px] tint inline-flex items-center justify-center shrink-0" style="--chip-bg:${AD_TYPE_SKIN[t.id].bg};--chip-fg:${AD_TYPE_SKIN[t.id].fg}">${icon(t.ic, 15)}</span>
          <span class="min-w-0">
            <span class="block font-bold text-[0.9rem] text-head">${esc(t.label)}</span>
            <span class="block text-[0.78rem] text-muted leading-[1.5]">${esc(t.blurb)}</span>
          </span>

      modal(a ? 'Edit ad' : 'New ad', `<div class="grid gap-4">
