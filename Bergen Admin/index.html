        ${field('Subcategory name', input('sf-name', 'e.g. Speech Therapy'))}
      </div>`,
        `<button class="${C.btn} ${C.ghost}" data-close="1">Cancel</button>
         <button class="${C.btn} ${C.primary}" id="sf-save">Add subcategory</button>`, { w: '460px' });
      el('sf-save').onclick = () => {
        const v = el('sf-name').value.trim();
        if (!v) return toast('Please enter a name', 'x');
        c.subs.push(v); closeModal(); render(); toast(`"${v}" added to ${c.name}`);
      };
    }

    /* The feed is derived from the queue rather than being its own hardcoded
       list — a static NOTIFS array goes stale the moment you approve anything,
       and the rows were inert. These describe real records and navigate to
       them. */
    function notifPanel() {
      const items = queueItems().slice(0, 8);
      const body = items.length ? `<div class="flex flex-col gap-1 -m-2">
        ${items.map(n => {
        const [bg, fg] = n.tone.split('|'); return `
          <button class="w-full text-left flex items-start gap-3 p-3 rounded-[12px] hover:bg-surface-2 transition-colors" data-nav="approvals">
            <span class="w-[38px] h-[38px] rounded-[10px] tint inline-flex items-center justify-center shrink-0" style="--chip-bg:${bg};--chip-fg:${fg}">${icon(n.ic, 18)}</span>
            <div class="min-w-0 flex-1"><div class="font-bold text-[0.92rem] text-head truncate">${esc(n.title)}</div>
              <div class="text-[0.85rem] text-muted truncate">${esc(n.sub)}</div>
              <div class="text-[0.76rem] text-adlabel font-semibold mt-1">${n.label} · ${ago(n.date)}</div></div>
          </button>`;
      }).join('')}
      </div>` : `<div class="flex flex-col items-center gap-2 text-muted py-8 text-center">
        <span class="w-[52px] h-[52px] rounded-[14px] bg-mint text-brand inline-flex items-center justify-center">${icon('check', 24)}</span>
        <div class="font-bold text-head">You are all caught up</div>
        <div class="text-[0.88rem]">Nothing is waiting on a decision right now.</div>
      </div>`;
      modal('Notifications', body,
        `<button class="${C.btn} ${C.ghost}" data-close="1">Close</button>
         <button class="${C.btn} ${C.navyBtn}" data-act="mark-read">Mark all as read</button>`, { w: '480px' });
    }

    /* The one record the console lets you write about yourself. Email is the
       sign-in identity, so it is shown but not editable here — changing it
       would be an account-recovery flow, not a profile edit. */
    function profileForm() {
      modal('Edit profile', `<div class="grid gap-4">
        <div class="flex items-center gap-4 pb-4 border-b border-b-line2">
          ${avatar(me().name, 56, me().photo)}
          <div class="min-w-0"><div class="font-bold text-head truncate">${esc(me().email)}</div>
          <div class="text-[0.82rem] text-muted">Sign-in address — contact support to change</div></div>
        </div>
        <div class="grid grid-cols-2 gap-4 max560:grid-cols-1">
          ${field('First name' + REQ, input('pf-first', 'e.g. Jordan', me().first))}
          ${field('Last name' + REQ, input('pf-last', 'e.g. Alvarez', me().last))}
        </div>
        ${field('Phone', phoneField('pf-phone', me().dial, me().phone))}
      </div>`,
        `<button class="${C.btn} ${C.ghost}" data-close="1">Cancel</button>
         <button class="${C.btn} ${C.primary}" id="pf-save">${icon('check', 16)} Save changes</button>`, { w: '560px' });

      el('pf-save').onclick = () => {
        const first = el('pf-first').value.trim(), last = el('pf-last').value.trim();
        if (!first) return toast('Please enter your first name', 'x');
        if (!last) return toast('Please enter your last name', 'x');
        const target = ACTING || ADMIN;
        target.first = first;
        target.last = last;
        target.dial = el('pf-dial').value;
        target.phone = el('pf-phone').value.trim();
        closeModal(); render(); toast('Profile updated', 'check');
      };
    }

    /* Both pricing editors write straight into the live pricing arrays, so an
       ad billed after the change picks up the new number. Charges already
       settled keep the price they were sold at. */
    /* One editor for both price lists — an ad type and an add-on differ in
       what they buy, not in how a price is set. `what` names it so the copy
       and the toast read correctly either way. */
    function ratePriceForm(x, what, note, spotId) {
      // A slot on a two-slot type sets its own number; everything else sets the
      // type's. `spotId` is what tells the two apart.
      const sp = spotId ? AD_SPOTS.find(s => s.id === spotId) : null;
      const title = sp ? `${x.label} — ${sp.label}` : x.label;
      const current = sp ? spotRate(x, sp.id) : (x.rate || 0);
      modal(`Edit price · ${title}`, `<div class="grid gap-4">
        <p class="${C.sub} text-[0.84rem]">${esc(sp ? `${sp.label} — ${sp.blurb}, on the ${x.where.toLowerCase()}.` : (x.blurb || x.spot))}</p>
        ${field(`${what} price (USD)`, `<div class="flex items-center gap-2">
          <span class="font-serif text-[1.4rem] font-black text-head">$</span>
          <input id="ap-price" type="number" min="0" step="1" class="${C.inp}" value="${current}">
        </div>`)}
        <p class="${C.sub} text-[0.84rem]">${note}</p>
      </div>`,
        `<button class="${C.btn} ${C.ghost}" data-close="1">Cancel</button>
         <button class="${C.btn} ${C.primary}" id="ap-save">${icon('check', 16)} Save price</button>`, { w: '470px' });

      el('ap-save').onclick = () => {
        const v = parseInt(el('ap-price').value, 10);
        if (isNaN(v) || v < 0) return toast('Enter a valid price', 'x');
        if (sp) x.rates[sp.id] = v; else x.rate = v;
        closeModal(); render(); toast(`${title} set to ${v ? money(v).replace('.00', '') : 'free'}`, 'check');
      };
    }
    const addonPriceForm = (id) => ratePriceForm(addonOf(id), 'Add-on',
      'Charged on top of the ad type and the plan whenever an advertiser adds this to an ad. Ads the console places for Bergen Kids are never charged.');
    const adTypePriceForm = (id, spotId) => {
      const t = adTypeOf(id);
      // Basic is never priced, so it has no editor even if something reaches
      // for one — the card no longer offers the button either.
      if (t.id === 'basic') return toast('Basic is always free', 'info');
      return ratePriceForm(t, 'Ad type',
        spotId
          ? 'Charged once per ad that takes this slot, on top of the plan. An ad taking both slots pays both. Ads the console places for Bergen Kids are never charged.'
          : 'Charged once per ad of this type, on top of the plan. Set it to 0 to make the type free. Ads the console places for Bergen Kids are never charged.',
        spotId);
    };

    function termPriceForm(id) {
      const t = termOf(+id);
      modal(`Edit plan · ${t.label}`, `<div class="grid gap-4">
        <p class="${C.sub} text-[0.84rem]">${t.label} runs for ${t.days} days. An advertiser takes this duration either as a renewing subscription or as a single one time fee.</p>
        <div class="grid grid-cols-2 gap-4 max560:grid-cols-1">
          ${field('Subscription price (USD)', `<div class="flex items-center gap-2">
            <span class="font-serif text-[1.3rem] font-black text-head">$</span>
            <input id="tp-sub" type="number" min="0" step="1" class="${C.inp}" value="${t.sub}">
          </div>`)}
          ${field('One time fee (USD)', `<div class="flex items-center gap-2">
            <span class="font-serif text-[1.3rem] font-black text-head">$</span>
            <input id="tp-once" type="number" min="0" step="1" class="${C.inp}" value="${t.once}">
          </div>`)}
        </div>
        <p class="${C.sub} text-[0.84rem]">Add-on costs are added to whichever the advertiser chooses.</p>
      </div>`,
        `<button class="${C.btn} ${C.ghost}" data-close="1">Cancel</button>
         <button class="${C.btn} ${C.primary}" id="tp-save">${icon('check', 16)} Save prices</button>`, { w: '540px' });

      el('tp-save').onclick = () => {
        const sub = parseInt(el('tp-sub').value, 10), once = parseInt(el('tp-once').value, 10);
        if (isNaN(sub) || sub < 0 || isNaN(once) || once < 0) return toast('Enter valid prices', 'x');
        t.sub = sub; t.once = once;
        closeModal(); render(); toast(`${t.label} pricing updated`, 'check');
      };
    }
    function changePasswordPanel() {
      modal('Change password', `<div class="grid gap-4">
        ${field('Current password', pwInput('cp-cur', '••••••••'))}
        ${field('New password', pwInput('cp-new', 'At least 8 characters'))}
        <!-- The rules are shown while the password is typed and tick off as
             they are met, rather than being announced after a failed submit. -->
        <div class="grid grid-cols-2 gap-x-4 gap-y-[0.35rem] -mt-2 max560:grid-cols-1">
          ${PW_RULES.map(r => `<span data-cp-rule="${r.id}" class="inline-flex items-center gap-[0.4rem] text-[0.82rem] font-semibold text-muted transition-colors duration-150"><span class="leading-[0]">${icon('x', 12)}</span>${r.label}</span>`).join('')}
        </div>
        ${field('Confirm New Password', pwInput('cp-conf', 'Re-enter the new password'))}
      </div>`,
        `<button class="${C.btn} ${C.ghost}" data-close="1">Cancel</button>
         <button class="${C.btn} ${C.primary}" id="cp-save">${icon('lock', 16)} Update password</button>`, { w: '460px' });

      /* Each rule turns green the moment it is satisfied — the same behaviour
         the reset-password step already has, so the two agree. */
      const paintCpRules = () => {
        const v = el('cp-new') ? el('cp-new').value : '';
        PW_RULES.forEach(r => {
          const n = document.querySelector(`[data-cp-rule="${r.id}"]`); if (!n) return;
          const ok = r.test(v);
          n.className = `inline-flex items-center gap-[0.4rem] text-[0.82rem] font-semibold transition-colors duration-150 ${ok ? 'text-brand' : 'text-muted'}`;
          n.querySelector('span').innerHTML = icon(ok ? 'check' : 'x', 12);
        });
      };
      if (el('cp-new')) el('cp-new').addEventListener('input', paintCpRules);
      wirePwEyes(el('modal-root'));
      paintCpRules();

      el('cp-save').onclick = () => {
        const cur = el('cp-cur').value, next = el('cp-new').value, conf = el('cp-conf').value;
        if (!cur) return toast('Enter your current password', 'x');
        if (!pwOK(next)) return toast('New password does not meet all the requirements', 'x');
        if (next !== conf) return toast('New passwords do not match', 'x');
        closeModal(); toast('Password updated', 'lock');
      };
    }

    /* ── Outreach composer ────────────────────────────────────────────────
       Used by the renewal nudge in Approvals and the "invite a business"
       button on Town Coverage. Both are the same job — a pre-written email to
       one person — so both get the same composer, and it renders through the
       existing emailFrame() so a draft looks exactly like the templates on
       Content Management rather than like a second, unrelated email design. */
    function outreachModal(title, to, subject, body, onSend) {
      modal(title, `<div class="grid grid-cols-2 gap-5 max900:grid-cols-1">
        <div class="grid gap-4 content-start">
          ${field('To', input('ot-to', 'name@example.com', to))}
          ${field('Subject', input('ot-subject', 'Subject line', subject))}
          <!-- !min-h, because C.inp already carries min-h-[46px]: same
               specificity, so which one wins comes down to stylesheet order
               rather than class order, and the body collapsed to one line. -->
          ${field('Message', `<textarea id="ot-body" rows="12" class="${C.inp} !min-h-[260px] resize-y leading-[1.65]">${esc(body)}</textarea>`)}
        </div>
        <div class="grid gap-2 content-start">
          <div class="${C.eyebrow}">Preview</div>
          <div id="ot-preview">${emailFrame(to, subject, body)}</div>
        </div>
      </div>`,
        `<button class="${C.btn} ${C.ghost}" data-close="1">Cancel</button>
         <button class="${C.btn} ${C.primary}" id="ot-send">${icon('mail', 16)} Send email</button>`, { w: '860px' });

      /* Local listeners, not the delegated input handler — that one re-renders
         the whole page, which would tear down this modal mid-typing. */
      const paint = () => {
        el('ot-preview').innerHTML = emailFrame(el('ot-to').value, el('ot-subject').value, el('ot-body').value);
      };
      ['ot-to', 'ot-subject', 'ot-body'].forEach(id => { el(id).oninput = paint; });

      el('ot-send').onclick = () => {
        if (!el('ot-to').value.trim()) return toast('Add a recipient first', 'x');
        closeModal();
        if (onSend) onSend(); else toast('Email sent', 'mail');
      };
    }

    /* ═══════════════ ACTIONS ═══════════════ */
    const KIND = { parent: () => PARENTS, advertiser: () => ADVERTISERS, category: () => CATEGORIES, event: () => EVENTS, article: () => ARTICLES, ad: () => ADS };
    const nameOf = (o) => o.name || o.company || o.title || 'this item';
    function findIn(kind, id) { return KIND[kind]().find(x => x.id === id); }
    function removeFrom(kind, id) {
      const arr = KIND[kind]();
      const i = arr.findIndex(x => x.id === id);
      if (i > -1) arr.splice(i, 1);
    }

    /* Who this address belongs to: the super admin, an active sub admin, or
       nobody. A blocked sub admin is a real account that may not sign in, and
       is told so rather than being called unrecognised. */
    function accountFor(email) {
      const e = email.trim().toLowerCase();
      if (e === ADMIN.email.toLowerCase()) return { kind: 'super' };
      const sub = SUB_ADMINS.find(x => x.email.toLowerCase() === e);
      if (!sub) return { kind: 'none' };
      return { kind: sub.active ? 'sub' : 'blocked', sub };
    }
    function doLogin() {
      const e = el('lg-email'), p = el('lg-pass');
      const email = e ? e.value.trim() : '', pass = p ? p.value : '';
      /* The address is checked, the password is not: this is a prototype of the
         flow, and anything typed is accepted so a run-through is never blocked
         on a credential nobody has. */
      if (!email) return toast('Enter your email address', 'x');
      if (!validEmail(email)) return toast('Enter a valid email address', 'x');
      if (!pass) return toast('Enter your password', 'x');
      const acct = accountFor(email);
      if (acct.kind === 'none') return toast('No admin account uses that email address', 'x');
      if (acct.kind === 'blocked') return toast(`${acct.sub.name} is blocked — ask a super admin to restore access`, 'x');
      ACTING = acct.kind === 'sub' ? acct.sub : null;
      state.authed = true;
      state.view = ACTING ? (ACTING.tabs[0] || 'profile') : 'dashboard';
      render();
      toast(`Welcome back, ${me().name.split(' ')[0]}`, 'shield');
    }

    const ACTIONS = {
      'do-login': () => doLogin(),

      /* Reset flow. Whatever was typed in the sign-in email box comes along —
         an admin who mistyped a password has usually typed their address
         correctly, and asking for it twice is a small insult. */
      'forgot': () => {
        const e = el('lg-email');
        state.lg = { email: e ? e.value : state.lg.email, pass: el('lg-pass') ? el('lg-pass').value : state.lg.pass };
        state.auth = { ...state.auth, step: 'code', email: (e && e.value.trim()) || state.auth.email, code: '', p1: '', p2: '', showNew: false, showConf: false, resendIn: 0 };
        stopResend();
        render();
      },
      // Leaving the flow drops what was typed in it — a half-finished reset is
      // not something to come back to hours later.
      'auth-login': () => { state.auth = { ...state.auth, step: 'login', code: '', p1: '', p2: '', showNew: false, showConf: false }; render(); },
      // Back to step one with the address still in the box, ready to correct.
      'fp-edit-email': () => { state.auth.step = 'forgot'; state.auth.code = ''; stopResend(); render(); },
      /* Resending locks the button for thirty seconds. Without it the code can
         be requested four times in a row, which invalidates the first three and
         leaves the person holding a code that no longer works. */
      'fp-resend': () => {
        if (state.auth.resendIn > 0) return;
        state.auth.code = '';
        startResend(30);
        render();
        toast(`New code sent to ${maskEmail(state.auth.email)}`, 'mail');
      },
      // The caret comes back to the field whose eye was clicked, not to the
      // top of the form.
      /* On the login screen the fields are uncommitted markup, so their
         current values are carried across the re-render rather than
         snapping back to the defaults. */
      'theme': () => {
        if (!state.authed) {
          const e = el('lg-email'), p = el('lg-pass');
          if (e && p) state.lg = { email: e.value, pass: p.value };
          // Same for a reset in progress: changing the theme is not a reason
          // to lose a half-typed code or password.
          keepPw(); keepOtp();
        }
        setTheme(!isDark());
      },
      /* Its own action rather than a [data-tab]: that handler assigns
         dataset.val as a string, and every window comparison here is numeric. */
      'set-range': (b) => { state.range = +b.dataset.val; render(); },
      'cmd': () => openCmd(),
      'cmd-back': () => { cmdHelp = false; cmdPaint(); const i = el('cmd-input'); if (i) i.focus(); },
      'open-sidebar': () => { state.sidebar = true; render(); },
      'close-sidebar': () => { state.sidebar = false; render(); },
      'user-menu': () => { state.userMenu = !state.userMenu; render(); },
      'close-user-menu': () => { state.userMenu = false; render(); },
      /* Signing out is one tap from a menu and throws away whatever was on
         screen, so it asks first — the same confirm every other irreversible
         action in the console uses. */
      'logout': () => {
        state.userMenu = false;
        closeModal();
        confirmDialog('Sign out?', `"Are you sure you want to sign out of the Admin Console?” and upon proceeding it immediately signs the user out of the Admin Console.`,
          'Sign out', () => { state.authed = false; ACTING = null; state.view = 'dashboard'; render(); toast('Signed out securely', 'lock'); });
      },
      'clear-filters': (b) => {
        const scope = b.dataset.scope;
        Object.keys(state.f[scope]).forEach(k => state.f[scope][k] = '');
        render();
      },
      'notifs': () => { state.notifSeen = true; notifPanel(); },
      'mark-read': () => { state.notifSeen = true; closeModal(); render(); toast('All notifications marked as read'); },
      'new-subadmin': () => subAdminForm(),
      'edit-subadmin': (b) => subAdminForm(b.dataset.id),
      'del-subadmin': (b) => {
        const x = SUB_ADMINS.find(v => v.id === b.dataset.id); if (!x) return;
        confirmDialog('Remove sub admin', `<p>${esc(x.name)} will lose access to the console immediately. Their account is not recoverable from here.</p>`,
          'Remove', () => { SUB_ADMINS = SUB_ADMINS.filter(v => v.id !== x.id); render(); toast(`${x.name} removed`, 'trash'); }, true);
      },
      /* Opening the console as a sub admin, so the sections they were given can
         actually be seen rather than taken on trust. The banner is the way
         back — a preview with no exit is a trap. */
      'preview-subadmin': (b) => {
        const x = SUB_ADMINS.find(v => v.id === b.dataset.id); if (!x) return;
        ACTING = x;
        state.view = x.tabs[0] || 'profile';
        state.adDetail = null; state.artDetail = null; state.userMenu = false;
        closeModal(); window.scrollTo({ top: 0 }); render();
        toast(`Viewing as ${x.name}`, 'eye');
      },
      'exit-preview': () => { ACTING = null; state.view = 'subadmins'; render(); toast('Back to your own account', 'shield'); },
      'profile': () => { state.userMenu = false; state.view = 'profile'; state.adDetail = null; state.artDetail = null; closeModal(); window.scrollTo({ top: 0 }); render(); },
      'change-pass': () => changePasswordPanel(),
      'edit-profile': () => profileForm(),

      'view-parent': (b) => viewParent(b.dataset.id),
      'view-advertiser': (b) => viewAdvertiser(b.dataset.id),
      /* The ad detail is a page, not a modal — open it on the Advertisements
         view and reset the gallery to the first image. */
      'view-ad': (b) => { state.view = 'ads'; state.adDetail = b.dataset.id; state.adImg = 0; closeModal(); window.scrollTo({ top: 0 }); render(); },
      'ad-back': () => { state.adDetail = null; state.adImg = 0; window.scrollTo({ top: 0 }); render(); },
      'ad-img': (b) => { state.adImg = +b.dataset.i; render(); },
      'view-tx': (b) => viewTx(b.dataset.id),

      'toggle-block': (b) => {
        const { kind, id } = b.dataset;
        const o = findIn(kind, id);
        const blocking = o.status !== 'blocked';
        const act = () => {
          o.status = blocking ? 'blocked' : (kind === 'parent' ? 'active' : 'approved');
          closeModal(); render(); toast(`${nameOf(o)} ${blocking ? 'blocked' : 'unblocked'}`, blocking ? 'ban' : 'unlock');
        };
        if (blocking) confirmDialog('Block this account?', `<strong>${esc(nameOf(o))}</strong> will lose access immediately. You can unblock them at any time.`, 'Block account', act);
        else act();
      },
      'delete': (b) => {
        const { kind, id } = b.dataset;
        const o = findIn(kind, id);
        confirmDialog(`Delete ${kind}?`, `<strong>${esc(nameOf(o))}</strong> will be permanently removed${kind === 'category' ? ', and its listings will be left uncategorised' : ''}. This cannot be undone.`, 'Delete permanently',
          () => { removeFrom(kind, id); render(); toast(`${nameOf(o)} deleted`, 'trash'); });
      },
      'approve': (b) => {
        const { kind, id } = b.dataset;
        const o = findIn(kind, id);
        // Approving an ad puts it on the site there and then — there is no
        // waiting state between the two.
        o.status = kind === 'ad' ? 'live' : 'approved';
        closeModal(); render(); toast(`${nameOf(o)} approved`, 'verified');
      },
      'reject': (b) => {
        const { kind, id } = b.dataset;
        const o = findIn(kind, id);
        confirmDialog('Reject this submission?', `<strong>${esc(nameOf(o))}</strong> will be marked as rejected and the owner will be notified by email.`, 'Reject',
          () => { if (kind === 'business') removeFrom(kind, id); else o.status = 'rejected'; closeModal(); render(); toast(`${nameOf(o)} rejected`, 'x'); });
      },
      /* Drafts are the one pending thing that "approve" did not cover, because
         an unpublished article has no pending status of its own. */
      'approve-article': (b) => {
        const a = findIn('article', b.dataset.id);
        a.status = 'published'; a.hidden = false;
        a.date = d(0);
        closeModal(); render(); toast(`${a.title} published`, 'check');
      },
      'retry-payment': (b) => {
        const t = TX.find(x => x.id === b.dataset.id);
        const x = txOf(t);
        confirmDialog('Retry this charge?', `${esc(x.adv.company)} will be charged <strong>${money(x.bill.total).replace('.00', '')}</strong> again on ${esc(x.method)}.`, 'Retry charge',
          () => { t.status = 'paid'; t.date = d(0); closeModal(); render(); toast(`${money(x.bill.total).replace('.00', '')} captured from ${x.adv.company}`, 'card'); }, false);
      },
      'renew-ad': (b) => {
        const a = adOf(b.dataset.id);
        const adv = advOf(a.advertiser);
        const left = -dayDiff(a.end);
        outreachModal('Renewal reminder', adv.email,
          `Your ${adTypeOf(a.type).short} campaign ${left < 0 ? 'has ended' : 'ends soon'}`,
          `Hi ${greetName(adv.contact)},\n\n"${a.name}" on the ${adTypeOf(a.type).label} ad type ${left < 0 ? `ended ${-left} days ago` : left === 0 ? 'ends today' : `ends in ${left} days`}. It has delivered ${num(a.impressions)} impressions and ${num(a.clicks)} clicks so far.\n\nWould you like to renew for another term? Reply and we will keep the slot reserved for you.\n\n— ${ADMIN.name}\nBergen Kids`,
          () => toast(`Renewal reminder sent to ${adv.company}`, 'mail'));
      },
      'town-detail': (b) => townDetail(b.dataset.town),
      'town-parents': (b) => { closeModal(); townParentsDrawer(b.dataset.town); },
      /* Drill from the drawer to the actual account: close the drawer, land on
         Parent Accounts so the record is in its own context, then open it. The
         scroll reset matters — without it you arrive part-way down a page you
         have never seen. */

    /* Plain-text summary of a document body, cut on a word boundary.

       The card used to render the real HTML and clamp it with line-clamp-3
       plus a max-height. That cannot work here: -webkit-line-clamp needs a
       single block, and these bodies are several <p> elements whose margins
       defeat the height cap — so the cap fell mid-line and sliced the text
       through the middle of the glyphs. Truncating the text itself means the
       cut is always between words and always ends in an ellipsis.

       Parsing through a detached element rather than a tag-stripping regex
       so entities (&amp;, &quot;) decode to real characters before escaping. */
    function plainExcerpt(html, max = 190) {
      const el = document.createElement('div');
      el.innerHTML = String(html || '').replace(/<h2>.*?<\/h2>/g, ' ');
      const text = (el.textContent || '').replace(/\s+/g, ' ').trim();
      if (text.length <= max) return esc(text);

      /* Prefer to end on a finished sentence — "…events, and articles." reads
         as a summary, where a word-boundary cut leaves dangling fragments
         like "…and articles. Your…". Only taken if the sentence ends far
         enough in to still be a useful preview; otherwise fall back to the
         last whole word. */
      const sentence = Math.max(text.lastIndexOf('. ', max), text.lastIndexOf('! ', max), text.lastIndexOf('? ', max));
      if (sentence > max * 0.45) return esc(text.slice(0, sentence + 1)) + ' …';

      const word = text.lastIndexOf(' ', max);
      return esc(text.slice(0, word > 0 ? word : max).replace(/[,;:]$/, '')) + '…';
    }

    function emailTemplatesTab() {

          <tbody>${rows.length ? rows.map(t => `<tr>
            <td><div class="font-bold max-w-[240px]">${esc(t.scenario)}</div></td>

    function contentView() {
      /* An open editor takes over the whole view — no tabs or stats competing
         with it while you're writing. */
      if (state.contentTab === 'legal' && state.legalDoc) return legalEditor(state.legalDoc);
      if (state.contentTab === 'emails' && state.emailDoc) return emailEditor(state.emailDoc);
      if (state.contentTab === 'sms' && state.smsDoc) return smsEditor(state.smsDoc);

      const stats = [
        ['Legal pages', LEGAL_DOCS.length, 'book', '#e2ebfa|#2d5a8e'],
        ['Email templates', EMAIL_TEMPLATES.length, 'mail', '#e3f2e9|#20643d'],
        ['SMS templates', SMS_TEMPLATES.length, 'phone', '#ede6f8|#5c4382']
      ];
      const TABS = [['legal', 'Legal pages', 'book'], ['emails', 'Email templates', 'mail'], ['sms', 'SMS templates', 'phone']];

      return `<div class="grid gap-5">
        ${miniStats(stats)}

        <div class="flex items-center justify-between gap-3 flex-wrap">
          <div class="flex gap-1 p-1 rounded-[100px] bg-surface-3">
            ${TABS.map(([id, label, ic]) => `<button data-tab="contentTab" data-val="${id}"
              class="inline-flex items-center gap-[0.4rem] px-[0.9rem] py-[0.4rem] rounded-[100px] text-[0.85rem] font-bold min-h-[36px] transition-all ${state.contentTab === id ? 'bg-surface text-head shadow-[0_2px_8px_rgba(26,46,74,0.12)]' : 'text-muted hover:text-head'}">${icon(ic, 14)} ${label}</button>`).join('')}
          </div>
          <p class="${C.sub}  text-right max900:text-left">
            ${state.contentTab === 'legal'
          ? 'Published to the public site. Members accept the current version at signup.'
          : 'Sent automatically by the platform. Edit the wording, not the trigger.'}
          </p>
        </div>

        ${state.contentTab === 'legal' ? legalPicker()
          : state.contentTab === 'emails' ? emailTemplatesTab()
            : smsTemplatesTab()}

    }

    /** Read-only preview of a template as it lands in an inbox. */
    function emailPreview(id) {
      const t = emailTpl(id);
      modal('Email preview', emailFrame(t.to, t.subject, t.body),
        `<button class="${C.btn} ${C.primary}" data-close="1">Close</button>`, { w: '560px' });
    }

    function legalPreview(id) {
      const doc = legalDoc(id);
      modal(`${doc.title} — preview`,
        `<div class="rte">${doc.body}</div>`,
        `<button class="${C.btn} ${C.primary}" data-close="1">Close</button>`, { w: '680px' });
    }

    /* Nothing renders a section this session was not given — the nav hides the
       link, and this stops the route being opened by the palette, a deep link
       or a stale button. */
    function guardView(v) { return canSee(v) ? v : (isSub() ? (ACTING.tabs[0] || 'profile') : v); }
    const VIEWS = { dashboard: dashboardView, approvals: approvalsView, parents: parentsView, advertisers: advertisersView, categories: categoriesView, events: eventsView, editorial: editorialView, ads: adsView, payments: paymentsView, adanalytics: adAnalyticsView, towns: townsView, content: contentView, profile: profileView, subadmins: subAdminsView };

    /* ═══════════════ COMMAND MENU ═══════════════
       One dialog for the two things a console is asked for constantly: make
       something, or go somewhere. It opens on ⌘K / Ctrl-K or "/", lists what
       can be created and every page, and searches the records themselves the
       moment anything is typed.

       Each row also carries the chord that runs it without opening this at
       all — `g h` for the dashboard, `n a` for a new article — so the menu
       teaches the shortcuts rather than replacing them. `?` opens the list of
       every one of them.

       It lives in #cmd-root so typing never triggers the app's render() and
       never loses the caret, and rows dispatch through the existing ACTIONS
       registry, so opening a parent from here runs exactly the viewParent()
       the table row runs. */
    const CMD_GO = [
      ['dashboard', 'Dashboard', 'dashboard', 'h'],
      ['parents', 'Parent Accounts', 'users', 'p'],
      ['advertisers', 'Advertiser Accounts', 'megaphone', 'a'],
      ['ads', 'Advertisements', 'image', 'd'],
      ['categories', 'Category Management', 'tag', 'c'],
      ['events', 'Events & Calendar', 'calendar', 'e'],
      ['editorial', 'Editorial Content', 'news', 'n'],
      ['content', 'Content Management', 'book', 't'],
      ['payments', 'Payments', 'dollar', 'm'],
      ['adanalytics', 'Ad Analytics', 'trending', 'r'],
      ['profile', 'Admin Profile', 'settings', 's'],
    ];
    // What the console can make. Each opens the same form its own page does.
    const CMD_NEW = [
      ['new-ad', 'New advertisement', 'image', 'd', 'ads'],
      ['new-article', 'New article', 'news', 'a', 'editorial'],
      ['new-event', 'New event', 'calendar', 'e', 'events'],
      ['new-category', 'New category', 'tag', 'c', 'categories'],
    ];
    let cmdOpen = false, cmdSel = 0, cmdHits = [], cmdHelp = false, cmdQuery = '';

    /* Every record in the console, flattened into rows the menu can rank.
       Built on demand rather than kept in sync — the console holds a few
       hundred records, and a stale index is worse than a rebuilt one. */
    function cmdRecords() {
      const out = [];
      PARENTS.forEach(p => out.push({
        title: p.name, sub: `Parent · ${p.email} · ${p.town}`, ic: 'users',
        group: 'Parents', view: 'parents', act: 'view-parent', id: p.id,
      }));
      ADVERTISERS.forEach(a => out.push({
        title: a.company, sub: `Advertiser · ${a.contact} · ${a.town}`, ic: 'megaphone',
        group: 'Advertisers', view: 'advertisers', act: 'view-advertiser', id: a.id,
      }));
      ADS.forEach(a => out.push({
        title: a.name, sub: `Ad · ${advOf(a.advertiser).company} · ${adTypeOf(a.type).short}`, ic: 'image',
        group: 'Advertisements', view: 'ads', act: 'view-ad', id: a.id,
      }));
      EVENTS.forEach(e => out.push({
        title: e.name, sub: `Event · ${fmtDate(e.date)} · ${e.town}`, ic: 'calendar',
        group: 'Events', view: 'events', act: 'edit-event', id: e.id,
      }));
      ARTICLES.forEach(a => out.push({
        title: a.title, sub: `Article · ${a.author} · ${catOf(a.cat).name}`, ic: 'news',
        group: 'Editorial', view: 'editorial', act: 'view-article', id: a.id,
      }));
      TOWNS.forEach(t => out.push({
        title: t, sub: 'Town', ic: 'pin', group: 'Towns', view: 'towns', act: 'town-detail', town: t,
      }));
      return out;
    }
    // The three fixed groups, which are what the menu shows before anything is typed.
    function cmdStatic() {
      const out = [];
      CMD_NEW.forEach(([act, title, ic, k, view]) => out.push({ title, ic, group: 'Create', act, view, keys: ['n', k] }));
      CMD_GO.forEach(([view, title, ic, k]) => out.push({ title, ic, group: 'Go to', view, keys: ['g', k] }));
      out.push({ title: 'Keyboard shortcuts', ic: 'grip', group: 'Help', help: true, keys: ['?'] });
      out.push({ title: 'Sign out', ic: 'logout', group: 'Help', act: 'logout' });
      return out;
    }
    /* Ranked, not filtered: a title that starts with what was typed beats one
       that merely contains it, and the fixed commands beat records so "ev"
       still offers the Events page above the events themselves. */
    function cmdSearch(q) {
      const s = q.trim().toLowerCase();
      if (!s) return cmdStatic();
      const score = (r) => {
        const t = r.title.toLowerCase(), sub = (r.sub || '').toLowerCase();
        if (t.startsWith(s)) return 0;
        if (t.includes(s)) return 1;
        if (sub.includes(s)) return 2;
        return -1;
      };
      return [...cmdStatic(), ...cmdRecords()]
        .map((r, i) => ({ r, i, sc: score(r) }))
        .filter(x => x.sc > -1)
        .sort((a, b) => a.sc - b.sc || a.i - b.i)
        .slice(0, 40)
        .map(x => x.r);
    }

    const kbd = (k) => `<span class="inline-flex items-center justify-center min-w-[22px] h-[22px] px-[0.35rem] rounded-[6px] border-[1.5px] border-line bg-surface-2 text-[0.72rem] font-bold text-muted shrink-0">${k}</span>`;
    function cmdRows() {
      if (!cmdHits.length) {
        return `<div class="px-5 py-10 text-center text-muted">
          <div class="flex justify-center mb-2">${icon('search', 22)}</div>
          <div class="text-[0.92rem] font-bold text-head">Nothing matches “${esc(cmdQuery)}”</div>
          <div class="text-[0.84rem] mt-[0.15rem]">Try a name, a company, a town or a page.</div>
        </div>`;
      }
      let last = '';
      return cmdHits.map((r, i) => {
        const head = r.group !== last
          ? `<div class="px-5 pt-3 pb-1 text-[0.68rem] font-bold tracking-[0.14em] uppercase text-adlabel">${r.group}</div>` : '';
        last = r.group;
        const on = i === cmdSel;
        return `${head}<button data-ci="${i}" class="w-full text-left flex items-center gap-3 px-4 py-[0.55rem] mx-1 rounded-[12px] transition-colors ${on ? 'bg-mint' : 'hover:bg-surface-2'}" style="width:calc(100% - 0.5rem)">
          <span class="w-[34px] h-[34px] rounded-[10px] inline-flex items-center justify-center shrink-0 ${on ? 'bg-surface text-brand shadow-[0_2px_8px_rgba(26,46,74,0.10)]' : 'bg-surface-3 text-muted'}">${icon(r.ic, 16)}</span>
          <span class="min-w-0 flex-1">
            <span class="block text-[0.95rem] font-bold ${on ? 'text-brand' : 'text-head'} truncate">${esc(r.title)}</span>
            ${r.sub ? `<span class="block text-[0.78rem] text-muted truncate">${esc(r.sub)}</span>` : ''}
          </span>
          ${(r.keys || []).map(kbd).join('')}
          ${on ? kbd('&crarr;') : ''}
        </button>`;
      }).join('');
    }

    /* The shortcuts sheet, which is the same dialog with its body swapped —
       it is a page of this menu, not a second overlay on top of it. */
    function cmdHelpBody() {
      const col = (title, rows) => `<div class="min-w-0">
        <div class="text-[0.68rem] font-bold tracking-[0.14em] uppercase text-adlabel mb-[0.6rem]">${title}</div>
        <div class="grid gap-[0.15rem]">
          ${rows.map(([label, keys]) => `<div class="flex items-center gap-3 py-[0.3rem]">
            <span class="text-[0.88rem] text-head font-semibold min-w-0 flex-1 truncate">${label}</span>
            <span class="flex items-center gap-[0.25rem] shrink-0">${keys.map(kbd).join('')}</span>
          </div>`).join('')}
        </div>
      </div>`;
      return `<div class="grid grid-cols-2 gap-x-8 gap-y-5 p-5 max700:grid-cols-1">
        ${col('General', [
        ['Open command menu', [MOD_KEY, 'K']],
        ['Search / open menu', ['/']],
        ['This shortcuts list', ['?']],
        ['Close', ['Esc']],
      ])}
        ${col('Create', CMD_NEW.map(([, title, , k]) => [title, ['n', k]]))}
        ${col('Go to', CMD_GO.map(([, title, , k]) => [title, ['g', k]]))}
      </div>`;
    }

    function cmdPaint() {
      const body = el('cmd-body');
      if (!body) return;
      body.innerHTML = cmdHelp ? cmdHelpBody() : cmdRows();
      const foot = el('cmd-foot');
      if (foot) foot.innerHTML = cmdHelp
        ? `<span class="ml-auto">Esc to go back</span>`
        : `<span>&uarr;&darr; to navigate</span><span>&crarr; to select</span><span class="ml-auto inline-flex items-center gap-[0.4rem]">${kbd('?')} shortcuts</span>`;
      const head = el('cmd-head');
      if (head) head.classList.toggle('hidden', cmdHelp);
      const helpHead = el('cmd-help-head');
      if (helpHead) helpHead.classList.toggle('hidden', !cmdHelp);
      if (!cmdHelp) {
        const sel = body.querySelector(`[data-ci="${cmdSel}"]`);
        // Guarded: keeping the selection in view is a nicety, and it must not
        // be able to take the rest of the paint down with it.
        if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest' });
      }
    }

    function openCmd(help) {
      if (cmdOpen) { cmdHelp = !!help; return cmdPaint(); }
      cmdOpen = true; cmdSel = 0; cmdQuery = ''; cmdHelp = !!help;
      cmdHits = cmdSearch('');
      el('cmd-root').innerHTML = `
        <div class="fixed inset-0 z-[95] bg-[rgba(9,15,26,0.6)] backdrop-blur-[3px] animate-fade flex items-start justify-center pt-[12vh] px-4 max700:pt-[8vh]" data-cmd-backdrop>
          <div class="w-full max-w-[620px] ${C.card} !rounded-[20px] shadow-[var(--sh-3)] overflow-hidden animate-pop" role="dialog" aria-label="Command menu">
            <div id="cmd-head" class="flex items-center gap-3 px-5 py-[0.9rem] border-b border-b-line2">
              <span class="text-muted leading-[0]">${icon('search', 18)}</span>
              <input id="cmd-input" autocomplete="off" spellcheck="false"
                class="flex-1 min-w-0 bg-transparent outline-none text-[1.02rem] text-head placeholder:text-muted placeholder:opacity-100"
                placeholder="Search parents, advertisers, ads, events, or jump to…">
              ${kbd('Esc')}
            </div>
            <div id="cmd-help-head" class="hidden items-center gap-3 px-5 py-[0.9rem] border-b border-b-line2">
              <span class="text-brand leading-[0]">${icon('grip', 18)}</span>
              <span class="flex-1 font-serif text-[1.05rem] font-black text-head">Keyboard shortcuts</span>
              <button data-act="cmd-back" class="text-[0.85rem] font-bold text-muted hover:text-head transition-colors">&larr; Back</button>
            </div>
            <div id="cmd-body" class="max-h-[52vh] overflow-y-auto py-1"></div>
            <div id="cmd-foot" class="flex items-center gap-4 px-5 py-[0.6rem] border-t border-t-line2 bg-surface-2 text-[0.75rem] text-muted font-semibold flex-wrap"></div>
          </div>
        </div>`;
      /* Wired before the first paint, not after: a paint that throws must not
         be able to leave the field without its listener. */
      const input = el('cmd-input');
      /* Local listener, never the document-level input handler — that one
         calls render(), a full page rebuild, on every keystroke. */
      input.oninput = () => { cmdQuery = input.value; cmdHits = cmdSearch(cmdQuery); cmdSel = 0; cmdPaint(); };
      if (!cmdHelp) input.focus();
      cmdPaint();
    }
    function closeCmd() {
      if (!cmdOpen) return;
      cmdOpen = false; cmdHelp = false;
      el('cmd-root').innerHTML = '';
    }
    /* Navigate first, then fire the row's own action, so a detail opens on top
       of the page it belongs to rather than over whatever was showing. The
       action gets a hand-built stand-in for the button element, because every
       ACTIONS handler reads its arguments off `.dataset`. */
    function runCmdRow(r) {
      if (!r) return;
      if (r.help) { cmdHelp = true; return cmdPaint(); }
      closeCmd();
      if (r.view && r.view !== state.view) {
        state.view = r.view; state.adDetail = null; state.artDetail = null; state.sidebar = false;
      }
      window.scrollTo({ top: 0 });
      render();
      if (r.act && ACTIONS[r.act]) ACTIONS[r.act]({ dataset: { id: r.id, town: r.town } });
    }
    // A chord is two keys: the leader, then the one that picks the target.
    let chord = null, chordTimer = null;
    function armChord(k) {
      chord = k;
      clearTimeout(chordTimer);
      chordTimer = setTimeout(() => { chord = null; }, 1400);
    }
    function runChord(lead, k) {
      chord = null; clearTimeout(chordTimer);
      if (lead === 'g') {
        const hit = CMD_GO.find(x => x[3] === k);
        if (hit) return runCmdRow({ view: hit[0] });
      }
      if (lead === 'n') {
        const hit = CMD_NEW.find(x => x[3] === k);
        if (hit) return runCmdRow({ act: hit[0], view: hit[4] });
      }
    }
    // Typing in a field is typing, not a shortcut.
    const inField = (t) => !!t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);

    /* ── Scroll reveal ──────────────────────────────────────────
       Panels play the same entrance the public site uses as they come into
       view. One observer per render, disconnected on the next one so a
       long session does not accumulate them. The classes are stripped once
       the animation ends, leaving each element with its own styles and its
       hover transform intact. */
    let rvObserver = null;
    function mountReveal(scope) {
      if (rvObserver) rvObserver.disconnect();
      if (!('IntersectionObserver' in window)) return;
      const targets = Array.from(scope.querySelectorAll('[data-rv]'));
      if (!targets.length) return;
      targets.forEach(t => t.classList.add('rv'));
      rvObserver = new IntersectionObserver((entries, obs) => {
        entries.forEach(e => {
          if (!e.isIntersecting) return;
          obs.unobserve(e.target);
          e.target.classList.add('rv-in');
          e.target.addEventListener('animationend', () => e.target.classList.remove('rv', 'rv-in'), { once: true });
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });
      targets.forEach(t => rvObserver.observe(t));
    }

    /* Which page we are on, as far as the eye is concerned. Changing a filter,
       picking calendar dates or toggling a row is the same page — the numbers
       move but the reader has not gone anywhere. */
    const viewKey = () => `${state.view}|${state.adDetail || ''}|${state.artDetail || ''}|${state.eventSection || ''}|${state.authed}`;
    let lastViewKey = '';

    function render() {
      const root = el('root');
      /* The entrance animation belongs to arriving at a page, not to every
         repaint of the one you are already reading. It used to replay on each
         keystroke and each date click, which is what read as the page blinking.
         Scroll and focus are carried across a same-page repaint for the same
         reason: nothing moved, so nothing should appear to. */
      const key = viewKey();
      const viewChanged = key !== lastViewKey;
      lastViewKey = key;
      const keepScroll = viewChanged ? 0 : window.scrollY;
      const active = document.activeElement;
      /* Identified by whatever it stably has: an id, or the filter/search pair
         that names it. Filter inputs carry no id, and they are exactly the ones
         being typed into when a repaint happens. */
      const focusSel = (n) => !n ? null
        : n.id ? `#${n.id}`
          : n.dataset && n.dataset.search ? `[data-search="${n.dataset.search}"]`
            : n.dataset && n.dataset.filter ? `[data-filter="${n.dataset.filter}"][data-key="${n.dataset.key}"]`
              : null;
      const sel = viewChanged ? null : focusSel(active);
      const keepFocus = sel ? {
        sel,
        start: typeof active.selectionStart === 'number' ? active.selectionStart : null,
        end: typeof active.selectionEnd === 'number' ? active.selectionEnd : null,
      } : null;
      /* The bubble layer is mounted once and only ever told where to start:
         full width on the sign-in screen, after the sidebar once signed in. */
      mountBubbles();
      el('bubble-root').classList.toggle('bk-app', state.authed);

      if (!state.authed) { root.innerHTML = loginView(); afterAuthPaint(); startShots(); return; }
      stopShots();
      /* relative z-[1] lifts the whole shell above the fixed bubble layer at
         z-0, so bubbles pass behind every card and show through the gutters. */
      root.innerHTML = `
        <div class="relative z-[1] grid grid-cols-[268px_1fr] min-h-screen max1024:grid-cols-1">
          ${sidebar()}
          ${state.sidebar ? `<div class="fixed inset-0 bg-[rgba(9,15,26,0.6)] backdrop-blur-[2px] z-[70] animate-fade hidden max1024:block" data-act="close-sidebar"></div>` : ''}
          <main class="min-w-0 flex flex-col">
            ${topbar()}
            ${isSub() ? `<div class="flex items-center gap-3 flex-wrap px-[clamp(1rem,2.5vw,2rem)] py-[0.7rem] bg-mint border-b border-b-line2">
              <span class="text-brand leading-[0]">${icon('eye', 15)}</span>
              <span class="text-[0.86rem] font-semibold text-head">Viewing the console as <b>${esc(ACTING.name)}</b> — sub admin</span>
              <button class="${C.btnSm} ${C.ghost} ml-auto" data-act="exit-preview">Return to your account</button>
            </div>` : ''}
            <div class="p-[clamp(1rem,2.5vw,2rem)] flex-1${viewChanged ? ' animate-rise' : ''}">${VIEWS[guardView(state.view)]()}</div>
            <!-- Transparent, so the ambient bubbles drift on through it. -->
            <footer class="px-[clamp(1rem,2.5vw,2rem)] py-6 border-t border-t-line2 flex items-center justify-between gap-4 flex-wrap text-[0.82rem] text-muted">
              <span>© 2026 Bergen Kids Admin · All actions are logged</span>
              <span class="flex items-center gap-[0.4rem] font-semibold text-brand">${icon('shield', 14)} Secure session</span>
            </footer>
          </main>
        </div>`;
      // Sections above the fold are already on screen when the observer
      // arms, so they reveal immediately; the rest wait for the scroll.
      mountReveal(root);

      /* Put the reader back exactly where they were. Restoring scroll before
         the frame paints means the jump never reaches the screen, and the
         caret is returned to the character it was on so a search box can be
         typed into without the cursor leaping to the end. */
      if (keepScroll) window.scrollTo(0, keepScroll);
      if (keepFocus) {
        const n = document.querySelector(keepFocus.sel);
        if (n) {
          n.focus({ preventScroll: true });
          /* After the frame, not during it. Focusing a freshly created input
             puts the caret at the end, and on some paths the browser does that
             after the current task rather than inside it — so the caret is
             placed once the DOM has settled, or it lands at the end anyway. */
          if (keepFocus.start !== null) requestAnimationFrame(() => {
            try { n.setSelectionRange(keepFocus.start, keepFocus.end); } catch (_) { }
          });
        }
      }
    }

    document.addEventListener('click', (ev) => {
      /* The command menu sits above everything, so it claims the click first —
         a row must not also reach the [data-nav] / [data-act] handlers below,
         and a backdrop click must close it rather than fall through to
         whatever page element happens to be underneath. */
      if (cmdOpen) {
        const row = ev.target.closest('[data-ci]');
        if (row) { ev.preventDefault(); return runCmdRow(cmdHits[+row.dataset.ci]); }
        if (ev.target.closest('[data-cmd-backdrop]') && !ev.target.closest('#cmd-body, #cmd-input, [data-act]')) return closeCmd();
      }

      const nav = ev.target.closest('[data-nav]');
      // Leaving a section closes the ad or article open inside it, so coming
      // back lands on the list.
      if (nav) { state.view = nav.dataset.nav; state.sidebar = false; state.adDetail = null; state.artDetail = null; closeModal(); window.scrollTo({ top: 0 }); return render(); }

      const tab = ev.target.closest('[data-tab]');
      if (tab) { state[tab.dataset.tab] = tab.dataset.val; return render(); }

      /* Rich-text toolbar. `execCommand` is deprecated but is still the only
         one-liner that works in every browser without a library — fine for a
         prototype; the real build will use a proper editor component. */
      const rte = ev.target.closest('[data-rte]');
      if (rte) {
        ev.preventDefault();
        const target = el(rte.dataset.target);
        if (!target) return;
        target.focus();
        const cmd = rte.dataset.rte;
        if (cmd === 'h2' || cmd === 'h3' || cmd === 'p') {
          document.execCommand('formatBlock', false, cmd);
        } else if (cmd === 'createLink') {
          const url = prompt('Link URL', 'https://');
          if (url) document.execCommand('createLink', false, url);
        } else {
          document.execCommand(cmd, false, null);
        }
        return;
      }

      const act = ev.target.closest('[data-act]');
      /* An open account menu closes on the next click anywhere that is not the
         menu itself — which is what a menu is expected to do, and cheaper than
         a full-screen backdrop that would swallow the click that dismissed it. */
      if (state.userMenu && !ev.target.closest('[data-act="user-menu"]') && !ev.target.closest('#sidebar [data-act="profile"],#sidebar [data-act="logout"]')) {
        state.userMenu = false;
        if (!act || !ACTIONS[act.dataset.act]) return render();
      }
      if (act && ACTIONS[act.dataset.act]) { ev.preventDefault(); return ACTIONS[act.dataset.act](act); }
    });

    document.addEventListener('input', (ev) => {
      /* Template editors keep their own fields. A full render() would rebuild
         the textarea and throw the caret to the end on every keystroke, so
         these deliberately return before it. */
      if (ev.target.id === 'et-subject' || ev.target.id === 'et-body' || ev.target.id === 'st-body') return;

      /* One digit per box, and the caret walks itself to the next one — a code
         is typed as a single run of four keys, not four clicks and four keys.
         A pasted code fills the row and lands on the end of it. */
      if (ev.target.dataset && ev.target.dataset.otp !== undefined) {
        const boxes = [...document.querySelectorAll('[data-otp]')];
        const i = boxes.indexOf(ev.target);
        const digits = ev.target.value.replace(/[^0-9]/g, '');
        if (digits.length > 1) {
          digits.split('').forEach((d, k) => { if (boxes[i + k]) boxes[i + k].value = d; });
          const last = Math.min(i + digits.length, boxes.length - 1);
          boxes[last].focus();
          return;
        }
        ev.target.value = digits;
        if (digits && boxes[i + 1]) boxes[i + 1].focus();
        /* Four digits is the whole answer, so the step moves on by itself.
           The Verify button stays for anyone who pastes or corrects a digit
           and wants to press it, but the code no longer waits on a click. */
        if (boxes.every(x => x.value.trim())) {
          keepOtp();
          setTimeout(() => {
            if (state.auth.step !== 'code') return;
            state.auth.p1 = ''; state.auth.p2 = '';
            state.auth.step = 'reset';
            stopResend();
            render();
          }, 260);
        }
        return;
      }
      // The new-password rules answer while they are being typed.
      if (ev.target.id === 'fp-p1' || ev.target.id === 'fp-p2') return paintPwRules();

      const s = ev.target.closest('[data-search]');
      if (s) {
        state.f[s.dataset.search].q = s.value;
        render();
        const again = document.querySelector(`[data-search="${s.dataset.search}"]`);
        if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
      }
    });
    /* ── Drag to reorder ────────────────────────────────────────
       Editorial order IS the order of the ARTICLES array, so a drop is an
       array splice followed by a normal render.

       Everything between dragstart and drop talks to the DOM directly and
       never calls render(): re-rendering mid-gesture would replace the very
       node the browser is dragging and the drag would die on the spot. Only
       the drop re-renders.

       Delegated on document like every other handler here, so it survives
       the innerHTML swap that each render performs. */
    let dragId = null;
    const clearDropMarks = () => $$('tr[data-drag-id]').forEach(r => r.classList.remove('is-dragging', 'drop-above', 'drop-below'));

    document.addEventListener('dragstart', (ev) => {
      const row = ev.target.closest && ev.target.closest('tr[data-drag-id]');
      if (!row) return;
      // A press that began on a control is a click, not a drag.
      if (ev.target.closest('button, a, input, select, textarea')) { ev.preventDefault(); return; }
      dragId = row.dataset.dragId;
      row.classList.add('is-dragging');
      if (ev.dataTransfer) {
        ev.dataTransfer.effectAllowed = 'move';
        // Firefox refuses to start a drag unless some data is set.
        try { ev.dataTransfer.setData('text/plain', dragId); } catch (e) { /* older browsers */ }
      }
    });

    document.addEventListener('dragover', (ev) => {
      if (!dragId) return;
      const row = ev.target.closest && ev.target.closest('tr[data-drag-id]');
      if (!row || row.dataset.dragId === dragId) return;
      ev.preventDefault();                       // required, or the drop never fires
      if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'move';
      // Which half of the row the cursor is over decides above vs below.
      const r = row.getBoundingClientRect();
      const below = ev.clientY > r.top + r.height / 2;
      $$('tr[data-drag-id]').forEach(x => x.classList.remove('drop-above', 'drop-below'));
      row.classList.add(below ? 'drop-below' : 'drop-above');
    });

    document.addEventListener('drop', (ev) => {
      if (!dragId) return;
      const row = ev.target.closest && ev.target.closest('tr[data-drag-id]');
      if (!row) return;
      ev.preventDefault();
      reorderArticle(dragId, row.dataset.dragId, row.classList.contains('drop-below'));
    });

    document.addEventListener('dragend', () => { clearDropMarks(); dragId = null; });

    /* Move `fromId` to sit before or after `toId`. Indices are resolved
       against ARTICLES rather than the rendered rows, so this still lands
       correctly when a search or filter is hiding part of the list — the
       drop means "put this one where that one is". */
    function reorderArticle(fromId, toId, after) {
      const from = ARTICLES.findIndex(a => a.id === fromId);
      if (from < 0 || fromId === toId) { clearDropMarks(); dragId = null; return; }
      const [moved] = ARTICLES.splice(from, 1);
      // Re-find the target: removing the dragged item may have shifted it.
      const to = ARTICLES.findIndex(a => a.id === toId);
      if (to < 0) ARTICLES.splice(from, 0, moved);        // target vanished — undo
      else ARTICLES.splice(to + (after ? 1 : 0), 0, moved);
      dragId = null;
      render();
      toast(`“${moved.title}” moved to position ${ARTICLES.indexOf(moved) + 1}`, 'check');
    }

    document.addEventListener('change', (ev) => {
      if (ev.target.id === 'cal-year') { state.cal.y = +ev.target.value; render(); return; }
      if (ev.target.id === 'pay-year') { state.payYear = +ev.target.value; render(); return; }
      const f = ev.target.closest('[data-filter]');
      if (f) {
        state.f[f.dataset.filter][f.dataset.key] = f.value;


        render();
      }
    });
    document.addEventListener('submit', (ev) => {
      if (ev.target.id === 'login-form') { ev.preventDefault(); doLogin(); }
      /* ── password reset ──
         Each step validates only its own answer and hands the flow on. No
         real mail is sent and any four digits are accepted: this is the shape
         of the flow, not an implementation of it. */
      if (ev.target.id === 'fp-request-form') {
        ev.preventDefault();
        const email = el('fp-email').value.trim();
        if (!validEmail(email)) return toast('Enter a valid email address', 'x');
        state.auth.email = email;
        state.auth.code = '';        // a fresh code means fresh boxes
        state.auth.step = 'code';
        render();
        toast(`Reset code sent to ${maskEmail(email)}`, 'mail');
      }
      if (ev.target.id === 'fp-code-form') {
        ev.preventDefault();
        const code = otpValue();
        if (code.length < 4) return toast('Enter all 4 digits of the code', 'x');
        state.auth.p1 = ''; state.auth.p2 = '';
        state.auth.step = 'reset';
        render();
      }
      if (ev.target.id === 'fp-reset-form') {
        ev.preventDefault();
        keepPw();
        const { p1, p2 } = state.auth;
        if (!pwOK(p1)) return toast('Your new password does not meet the rules yet', 'x');
        if (p1 !== p2) {
          // The rule that only matters once both boxes are filled shows itself
          // here rather than sitting there as an accusation from the start.
          const m = document.querySelector('[data-rule="match"]');
          if (m) { m.classList.remove('hidden'); m.classList.add('flex'); }
          return toast('Both passwords have to match', 'x');
        }
        state.auth.step = 'done';
        // The demo signs in with what it was given, so the new password is the
        // one that works on the form behind this.
        state.lg = { email: state.auth.email || state.lg.email, pass: p1 };
        state.auth.p1 = ''; state.auth.p2 = '';
        render();
        toast('Password updated', 'check');
      }
    });
    // The four boxes read as one value.
    const otpValue = () => [...document.querySelectorAll('[data-otp]')].map(i => i.value.trim()).join('');
    /* Live rule hints. Painted straight onto the nodes rather than through
       render(), which would rebuild the field being typed into. */
    function paintPwRules() {
      const v = (el('fp-p1') || {}).value || '';
      PW_RULES.forEach(r => {
        const n = document.querySelector(`[data-rule="${r.id}"]`); if (!n) return;
        const ok = r.test(v);
        n.classList.toggle('text-brand', ok);
        n.classList.toggle('text-muted', !ok);
      });
      const m = document.querySelector('[data-rule="match"]');
      const b = el('fp-p2');
      if (m && b) {
        const bad = b.value.length > 0 && b.value !== v;
        m.classList.toggle('hidden', !bad);
        m.classList.toggle('flex', bad);
      }
    }
    document.addEventListener('keydown', (ev) => {
      // ⌘K / Ctrl-K anywhere, including from inside a form field.
      if ((ev.metaKey || ev.ctrlKey) && (ev.key === 'k' || ev.key === 'K')) {
        ev.preventDefault();
        return cmdOpen ? closeCmd() : openCmd();
      }
      if (cmdOpen) {
        if (ev.key === 'Escape') {
          /* Escape has to be claimed here and NOT fall through: the shared
             handler below closes the modal, so one press would otherwise
             dismiss both this and whatever was open behind it. From the
             shortcuts sheet it steps back rather than closing outright. */
          ev.preventDefault();
          if (cmdHelp) { cmdHelp = false; cmdPaint(); const i = el('cmd-input'); if (i) i.focus(); return; }
          return closeCmd();
        }
        if (cmdHelp) return;
        if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
          ev.preventDefault();
          if (!cmdHits.length) return;
          const n = cmdHits.length;
          cmdSel = (cmdSel + (ev.key === 'ArrowDown' ? 1 : n - 1)) % n;
          return cmdPaint();
        }
        if (ev.key === 'Enter') { ev.preventDefault(); return runCmdRow(cmdHits[cmdSel]); }
        // "?" reaches the sheet even with the caret in the search field, but
        // only on an empty query — otherwise it is a character being typed.
        if (ev.key === '?' && !cmdQuery) { ev.preventDefault(); cmdHelp = true; return cmdPaint(); }
        return;
      }
      /* Closed. The single-key shortcuts only apply when nothing is being
         typed into — a "/" in a search box is a slash, not a command. */
      if (!inField(ev.target) && !ev.metaKey && !ev.ctrlKey && !ev.altKey) {
        if (ev.key === '/') { ev.preventDefault(); return openCmd(); }
        if (ev.key === '?') { ev.preventDefault(); return openCmd(true); }
        const k = ev.key.toLowerCase();
        if (chord) { ev.preventDefault(); return runChord(chord, k); }
        if (k === 'g' || k === 'n') { ev.preventDefault(); return armChord(k); }
      }
      /* Backspace in an empty code box steps back and clears the one before
         it — otherwise correcting a mistyped code means four clicks. */
      if (ev.key === 'Backspace' && ev.target.dataset && ev.target.dataset.otp !== undefined && !ev.target.value) {
        const boxes = [...document.querySelectorAll('[data-otp]')];
        const prev = boxes[boxes.indexOf(ev.target) - 1];
        if (prev) { ev.preventDefault(); prev.value = ''; prev.focus(); }
        return;
      }
      /* Escape unwinds one layer at a time, outermost first: drawer, then
         modal. Falling through would dismiss a drawer and the modal
         underneath it on a single press. */
      if (ev.key === 'Escape') {
        if (drawerOpen) { ev.preventDefault(); return closeDrawer(); }
        closeModal();
      }
    });

    render();
  </script>
</body>

</html>
