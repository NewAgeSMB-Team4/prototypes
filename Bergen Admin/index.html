          <div class="relative">
            ${state.userMenu ? `
            <div class="absolute bottom-full left-0 right-0 mb-2 z-[3] bg-surface border-[1.5px] border-line2 rounded-[14px] shadow-[var(--sh-3)] p-[0.35rem] animate-pop origin-bottom">
              <button class="w-full flex items-center gap-[0.7rem] px-3 py-[0.6rem] rounded-[10px] text-[0.9rem] font-semibold text-head hover:bg-surface-3 transition-colors" data-act="profile">
                <span class="text-brand">${icon('user', 16)}</span> Profile
              </button>
              <button class="w-full flex items-center gap-[0.7rem] px-3 py-[0.6rem] rounded-[10px] text-[0.9rem] font-semibold text-danger-t hover:bg-red-bg transition-colors" data-act="logout">
                ${icon('logout', 16)} Sign out
              </button>
            </div>` : ''}
            <button class="w-full flex items-center gap-3 p-[0.6rem] rounded-[12px] bg-white/[0.07] border border-white/[0.06] transition-colors duration-200 hover:bg-white/[0.11] ${state.userMenu ? 'bg-white/[0.13]' : ''} text-left"
              data-act="user-menu" aria-haspopup="menu" aria-expanded="${!!state.userMenu}" title="Account">
              ${avatar(me().name, 38, me().photo)}
              <span class="min-w-0 flex-1">
                <span class="block text-[0.88rem] font-bold text-white truncate">${esc(me().name)}</span>
                <span class="block text-[0.72rem] text-sun font-semibold">${me().role}</span>
              </span>
              <span class="text-white/60 shrink-0 transition-transform duration-200 ${state.userMenu ? 'rotate-180' : ''}">${icon('chev-down', 16)}</span>
            </button>
          </div>
        </div>
      </aside>`;
    }

    function topbar() {
      // The ad and article details are pages in their own right, so the topbar
      // names the record rather than the section it was reached from.
      const openAd = state.view === 'ads' && state.adDetail ? ADS.find(x => x.id === state.adDetail) : null;
      const openArt = state.view === 'editorial' && state.artDetail ? ARTICLES.find(x => x.id === state.artDetail) : null;
      const [t, s] = openAd
        ? [openAd.name, `Ad detail · ${advOf(openAd.advertiser).company}`]
        : openArt
          ? [openArt.title, `Article · ${openArt.author} · ${catOf(openArt.cat).name}`]
          : (state.view === 'profile' && isSub()
            ? ['My Profile', 'Your details and password']
            : TITLES[guardView(state.view)] || TITLES.dashboard);
      return `
      <header class="sticky top-0 z-[60] bg-[color-mix(in_srgb,var(--cream)_92%,transparent)] backdrop-blur-md border-b border-b-line2 px-[clamp(1rem,2.5vw,2rem)] py-[0.9rem] flex items-center gap-4">
        <button class="${C.iconbtn} hidden max1024:inline-flex" data-act="open-sidebar" aria-label="Open menu">${icon('menu', 18)}</button>
        <div class="min-w-0 flex-1">
          <h1 class="font-serif text-[1.35rem] font-black text-head tracking-[-0.02em] leading-tight truncate max700:text-[1.1rem]">${t}</h1>
          <p class="text-[0.85rem] text-muted truncate max900:hidden">${s}</p>
        </div>

        <!-- A button, not an input: this opens the command menu, which owns
             its own field outside #root so typing survives a re-render. The
             shortcut chip is the affordance that teaches the shortcut. -->
        <button class="flex items-center gap-[0.6rem] border-[1.5px] border-line rounded-[100px] bg-surface px-[0.9rem] min-h-[42px] w-[280px] text-left transition-[border-color,box-shadow,background] duration-150 hover:border-head hover:bg-surface-3 max1200:hidden" data-act="cmd">
          <span class="text-muted leading-[0]">${icon('search', 16)}</span>
          <span class="flex-1 min-w-0 text-[0.9rem] text-muted truncate">Search or jump to…</span>
          <span class="text-[0.72rem] font-bold text-muted border-[1.5px] border-line rounded-[6px] px-[0.35rem] py-[0.05rem] shrink-0">${MOD_KEY} K</span>
        </button>
        <!-- Below 1200px the bar is hidden, so small screens get the icon. -->
        <button class="${C.iconbtn} !w-[42px] !h-[42px] !rounded-[100px] hidden max1200:inline-flex" data-act="cmd" aria-label="Search">${icon('search', 18)}</button>

        ${themeToggle(`${C.iconbtn} !w-[42px] !h-[42px] !rounded-[100px] hover:!border-brand hover:!text-brand hover:!bg-surface-4 hover:rotate-[-12deg]`)}
        <!-- The dot was hardcoded, so it was on forever and told you nothing.
             It now means "there is work you have not looked at". -->
        <button class="${C.iconbtn} !w-[42px] !h-[42px] !rounded-[100px] relative" data-act="notifs" aria-label="Notifications${queueCount() && !state.notifSeen ? `, ${queueCount()} unread` : ''}">
          ${icon('bell', 18)}
          ${queueCount() && !state.notifSeen ? `<span class="absolute top-[7px] right-[8px] w-[8px] h-[8px] rounded-full bg-dot ring-2 ring-[var(--surface)]"></span>` : ''}
        </button>
        <button class="flex items-center gap-[0.6rem] pl-1 pr-3 py-1 rounded-[100px] border-[1.5px] border-line bg-surface hover:border-head transition-colors max700:!pr-1" data-act="profile">
          ${avatar(me().name, 32, me().photo)}
          <span class="text-[0.85rem] font-bold text-head max700:hidden">${esc(me().name.split(' ')[0])}</span>
          <span class="text-muted leading-[0] max700:hidden">${icon('chev-down', 14)}</span>
        </button>
      </header>`;
    }

    /* ═══════════════ SHARED BLOCKS ═══════════════ */
    /* KPI tiles and panels carry the site's card language: they lift toward
       the cursor and play an entrance as they scroll into view. `group` is
       what lets the badge react to a hover anywhere on the tile. */
    function kpi(label, value, delta, ic, tone) {
      const [bg, fg] = tone.split('|');
      /* `delta` was accepted and dropped for a long time, so every tile read
         as a number with no direction. It carries a sign now, drawn from the
         same window as the value. */
      const up = delta >= 0;
      const deltaPill = delta === null || delta === undefined ? '' :
        `<span class="${C.pill} ${up ? PILL.green : PILL.red} ml-auto">${icon(up ? 'trending' : 'declining', 12)}${up ? '+' : ''}${delta}%</span>`;
      return `<div data-rv class="${C.card} group p-5 relative overflow-hidden cursor-default transition-[transform,box-shadow,border-color] duration-[250ms] hover:-translate-y-[5px] hover:shadow-[var(--sh-2)] hover:border-line">
        <div class="absolute -right-[26px] -top-[26px] w-[100px] h-[100px] rounded-full opacity-[0.1] transition-transform duration-[400ms] group-hover:scale-[1.25]" style="background:${fg}"></div>
        <div class="flex items-start gap-3 mb-4 relative">
          <span class="w-[42px] h-[42px] rounded-[12px] tint inline-flex items-center justify-center shrink-0 transition-transform duration-[250ms] group-hover:scale-[1.07] group-hover:rotate-[-5deg]" style="--chip-bg:${bg};--chip-fg:${fg}">${icon(ic, 20)}</span>
          ${deltaPill}
        </div>
        <div class="font-serif text-[1.9rem] font-black text-head leading-none tracking-[-0.02em] [font-variant-numeric:tabular-nums]">${value}</div>
        <div class="text-[0.85rem] text-muted font-semibold mt-2">${label}</div>
      </div>`;
    }
    /* ── Ambient background bubbles ───────────────────────────────────────
       One entry per bubble: [icon, left %, size px, duration s, delay s, drift
       px, bg|ink]. Hand-placed rather than generated: the layer is built once
       and must look deliberate, and hand-picking lets the left offsets stay
       evenly spread instead of clumping the way random values do.

       Durations are long (28–52s) because this sits behind the whole page —
       anything quicker reads as movement you have to ignore rather than as
       atmosphere. The negative delays start every bubble part-way through its
       cycle, so the page is already alive on first paint instead of filling
       from the bottom over the first half minute.

       The icons are the platform's own categories and the tints are the same
       pastel pairs the category chips use, so this reads as the product
       rather than as decoration bolted on. */
    const PAGE_BUBBLES = [
      ['heart', 2, 30, 38, -4, 26, '#fbe4e1|#a3271c'],
      ['palette', 8, 22, 46, -21, -18, '#f8e6ef|#a3277c'],
      ['soccer', 14, 36, 33, -12, 30, '#e7f0fd|#2d5a8e'],
      ['music', 20, 24, 50, -35, -24, '#ede6f8|#5c4382'],
      ['cake', 25, 28, 29, -8, 20, '#fdeed5|#8a5200'],
      ['users', 31, 34, 43, -26, -30, '#e3f2e9|#20643d'],
      ['book', 37, 22, 36, -17, 22, '#e2ebfa|#2d5a8e'],
      ['tent', 43, 30, 52, -44, -20, '#fbeee3|#a8501c'],
      ['waves', 49, 26, 31, -6, 28, '#ddf1ec|#14685a'],
      ['star', 55, 20, 47, -30, -16, '#fdeed5|#8a5200'],
      ['leaf', 60, 32, 34, -14, 24, '#e3f2e9|#20643d'],
      ['sparkle', 66, 24, 41, -37, -26, '#ede6f8|#5c4382'],
      ['stethoscope', 72, 28, 28, -10, 18, '#ddf1ec|#14685a'],
      ['theater', 78, 22, 49, -23, -22, '#f8e6ef|#a3277c'],
      ['school', 84, 34, 37, -31, 26, '#e2ebfa|#2d5a8e'],
      ['heart', 89, 20, 44, -18, -14, '#fbe4e1|#a3271c'],
      ['users', 94, 30, 32, -40, 22, '#e3f2e9|#20643d'],
      ['sparkle', 97, 22, 45, -2, -20, '#fdeed5|#8a5200']
    ];

    const bubbleMarkup = (list) => list.map(([ic, left, size, dur, delay, drift, tone]) => {
      const [bg, fg] = tone.split('|');
      return `<span class="bk-bubble tint"
        style="left:${left}%;width:${size}px;height:${size}px;--drift:${drift}px;--chip-bg:${bg};--chip-fg:${fg};animation-duration:${dur}s;animation-delay:${delay}s">
        ${icon(ic, Math.round(size * 0.5))}
      </span>`;
    }).join('');

    /* Built once, never rebuilt. Guarded on a data flag rather than on the
       element being empty, so a future caller cannot accidentally restart
       every animation. */
    function mountBubbles() {
      const root = el('bubble-root');
      if (!root || root.dataset.mounted) return;
      root.innerHTML = bubbleMarkup(PAGE_BUBBLES);
      root.dataset.mounted = '1';
    }

    /* The sign-in screen needs its own layer: the auth card is opaque and
       fills the viewport, so the fixed page layer is completely hidden behind
       it. Fewer and slower, because this drifts behind a form rather than an
       open dashboard, and the lefts are respread for a narrow column.

       These do restart when render() runs, but on this screen render() only
       fires on the theme toggle and the show-password button, so it is not
       the constant rebuild the dashboard would have had. */
    const LOGIN_BUBBLES = [
      ['heart', 6, 26, 34, -5, 20, '#fbe4e1|#a3271c'],
      ['music', 20, 20, 44, -19, -16, '#ede6f8|#5c4382'],
      ['soccer', 34, 30, 29, -11, 24, '#e7f0fd|#2d5a8e'],
      ['cake', 48, 22, 40, -27, -18, '#fdeed5|#8a5200'],
      ['users', 62, 28, 36, -8, 22, '#e3f2e9|#20643d'],
      ['palette', 76, 20, 47, -33, -20, '#f8e6ef|#a3277c'],
      ['star', 88, 26, 31, -15, 18, '#ddf1ec|#14685a']
    ];
    const loginBubbleLayer = () =>
      `<div aria-hidden="true" class="absolute inset-0 overflow-hidden pointer-events-none">${bubbleMarkup(LOGIN_BUBBLES)}</div>`;

    /* ── Popping a bubble ─────────────────────────────────────────────────
       Click one and it breaks. The disc is cut into nine wedges that were
       the circle a frame ago, thrown outward with a little gravity on them,
       trailed by dust and one ring; the glyph it was carrying lifts out.

       The bubble is not deleted — it is replaced by a fresh copy of itself
       with the delay zeroed, so it starts the climb again from the bottom of
       the screen. Popping thins the layer for a moment instead of draining
       it, which is what lets this be clicked all day. */
    const POP_WEDGES = 9;

    /* One wedge of the disc as a clip path in percentages of the box. The
       arc is sampled rather than chorded, so the outer edge of a shard is
       still visibly a piece of a circle at 20–36px. */
    function wedgeClip(i, n) {
      const step = 360 / n, pts = ['50% 50%'];
      for (let k = 0; k <= 4; k++) {
        const r = (i * step + step * k / 4 - 90) * Math.PI / 180;
        pts.push(`${(50 + 50 * Math.cos(r)).toFixed(2)}% ${(50 + 50 * Math.sin(r)).toFixed(2)}%`);
      }
      return `polygon(${pts.join(',')})`;
    }

    /* Where one piece ends up: an angle, a distance, and `g` — a downward
       bias, because debris that scatters evenly in every direction reads as
       a diagram and debris that falls a little reads as a thing breaking. */
    const spread = (a, d, g = 0) => `--tx:${(Math.cos(a) * d).toFixed(1)}px;--ty:${(Math.sin(a) * d + g).toFixed(1)}px`;

    function popBubble(node) {
      const host = el('pop-root');
      if (!host) return;

      const r = node.getBoundingClientRect();
      const size = r.width;
      const rig = document.createElement('div');
      rig.className = 'bk-burst tint';
      rig.style.cssText = `left:${r.left + size / 2}px;top:${r.top + r.height / 2}px;--s:${size}px;` +
        `--chip-bg:${node.style.getPropertyValue('--chip-bg')};--chip-fg:${node.style.getPropertyValue('--chip-fg')}`;

      let html = '<i class="bk-wave tint"></i>';
      for (let i = 0; i < POP_WEDGES; i++) {
        /* Aimed down the middle of the wedge it is, so each piece leaves
           along the line it was cut on. */
        const a = (i + 0.5) / POP_WEDGES * Math.PI * 2 - Math.PI / 2;
        const style = `clip-path:${wedgeClip(i, POP_WEDGES)};` +
          `${spread(a, size * (0.7 + Math.random() * 0.6), size * 0.4)};` +
          `--rot:${(Math.random() * 170 - 85).toFixed(0)}deg;animation-delay:${i % 3 * 16}ms`;
        html += `<i class="bk-shard tint" style="${style}"></i>`;
      }
      /* Dust is sized per piece — `--s` set here beats the one the rig hands
         down, so the same centring rule places a 3px fleck and a 30px shard. */
      for (let i = 0; i < 7; i++) {
        const style = `--s:${(2 + Math.random() * 3).toFixed(1)}px;` +
          `${spread(Math.random() * Math.PI * 2, size * (1 + Math.random() * 1.1), size * 0.5)};` +
          `animation-delay:${(Math.random() * 90).toFixed(0)}ms`;
        html += `<i class="bk-spark tint" style="${style}"></i>`;
      }
      const glyph = node.querySelector('svg');
      if (glyph) html += `<i class="bk-glyph">${glyph.outerHTML}</i>`;

      rig.innerHTML = html;
      host.appendChild(rig);
      setTimeout(() => rig.remove(), 1000);

      const fresh = node.cloneNode(true);
      fresh.style.animationDelay = '0s';
      node.replaceWith(fresh);
      /* What the cursor was pointing at is no longer there — say so now
         rather than leaving a hand hovering over nothing until the tick. */
      queuePointer();
    }

    /* Anything the console itself owns a click on. A bubble drifting under a
       control must never eat the control's job. */
    const POP_SKIP = 'a,button,input,select,textarea,label,summary,[data-act],[data-nav],[data-tab]';

    /* The bubble a point lands on, or null — the single answer the cursor and
       the click both read, so what the pointer promises is exactly what a
       click delivers.

       Only a bubble you can SEE counts. The ambient layer is fixed behind the
       entire shell, so hit testing alone would happily report a disc drifting
       under an opaque card — from the front, a click that made something
       invisible vanish. Anything stacked above it with paint of its own
       therefore vetoes: the layer stays live in the gutters and behind the
       transparent footer, and inert under cards. */
    function bubbleAt(x, y) {
      const stack = document.elementsFromPoint(x, y);
      const at = stack.findIndex(n => n.classList?.contains('bk-bubble'));
      if (at < 0) return null;
      const bubble = stack[at];
      for (let k = 0; k < at; k++) {
        const over = stack[k];
        if (bubble.contains(over)) continue;
        const cs = getComputedStyle(over);
        if (cs.backgroundImage !== 'none') return null;
        const rgb = cs.backgroundColor.match(/[\d.]+/g);
        if (rgb && (rgb.length < 4 || Number(rgb[3]) > 0.02)) return null;
      }
      return bubble;
    }

    /* Capture, because the app's own click handler below re-renders #root on
       nav and filter clicks — the hit test has to run against the DOM that
       was actually clicked, not the one that replaced it. The event is never
       consumed; it carries on to those handlers untouched. */
    document.addEventListener('click', (ev) => {
      /* detail 0 is a click with no pointer behind it — Enter on a focused
         control — and its coordinates are 0,0, which would burst whatever
         happens to be drifting past the top left corner. */
      if (!ev.detail || ev.button || !el('pop-root') || ev.target.closest?.(POP_SKIP)) return;
      const bubble = bubbleAt(ev.clientX, ev.clientY);
      if (bubble) popBubble(bubble);
    }, true);

    /* One hit test per frame at most, however fast the mouse moves, and the
       class is only written when the answer actually changes — this runs on
       every pointer move, so it must cost nothing when nothing is happening.

       The slow tick is not a fallback for the move handler: the bubbles drift
       while the mouse sits still, and one arriving under a resting cursor has
       to start saying it can be clicked without waiting to be nudged. */
    let ptrAt = null, ptrQueued = false;

    function syncPointer() {
      ptrQueued = false;
      const on = !!ptrAt && !!el('pop-root') && !!bubbleAt(ptrAt[0], ptrAt[1]);
      const root = document.documentElement;
      if (root.classList.contains('bk-pointing') !== on) root.classList.toggle('bk-pointing', on);
    }

    function queuePointer() {
      if (ptrQueued) return;
      ptrQueued = true;
      requestAnimationFrame(syncPointer);
    }

    document.addEventListener('pointermove', (ev) => {
      ptrAt = [ev.clientX, ev.clientY];
      queuePointer();
    }, { passive: true });

    /* No relatedTarget means the pointer left the window entirely, rather
       than crossing between two elements inside it. */
    document.addEventListener('pointerout', (ev) => {
      if (ev.relatedTarget) return;
      ptrAt = null;
      queuePointer();
    }, { passive: true });

    setInterval(queuePointer, 300);

    const panel = (title, right, body, cls = '') => `<section data-rv class="${C.card} min-w-0 transition-[box-shadow] duration-[250ms] hover:shadow-[var(--sh-2)] ${cls}">
      <div class="flex items-center justify-between gap-3 px-5 py-4 border-b border-b-line2 flex-wrap">
        <h2 class="font-serif text-[1.05rem] font-black text-head tracking-[-0.01em]">${title}</h2>
        ${right || ''}
      </div>
      ${body}
    </section>`;
    const emptyRow = (cols, msg) => `<tr><td colspan="${cols}" class="!py-14 text-center"><div class="flex flex-col items-center gap-2 text-muted"><span class="w-[52px] h-[52px] rounded-[14px] bg-surface-3 inline-flex items-center justify-center">${icon('search', 22)}</span><div class="font-bold text-head">${msg}</div><div class="text-[0.88rem]">Try a different search or filter.</div></div></td></tr>`;

    function searchBox(scope, ph) {
      return `<div class="flex items-center gap-[0.6rem] border-[1.5px] border-line rounded-[10px] bg-surface px-[0.8rem] min-h-[42px] flex-1 min-w-[200px] transition-[border-color,box-shadow] duration-150 focus-within:border-grass-ink focus-within:shadow-[0_0_0_3px_rgba(32,100,61,0.13)]">
        <span class="text-muted leading-[0]">${icon('search', 16)}</span>
        <input data-search="${scope}" value="${esc(state.f[scope].q)}" class="w-full min-w-0 bg-transparent outline-none text-[0.9rem] text-head placeholder:text-muted placeholder:opacity-100" placeholder="${ph}">
      </div>`;
    }
    function selectBox(scope, key, opts, allLabel) {
      return `<select data-filter="${scope}" data-key="${key}" class="${C.inp} !w-auto !min-h-[42px] !py-[0.5rem] !pr-8 cursor-pointer font-semibold text-[0.88rem] !bg-surface">
        <option value="">${allLabel}</option>
        ${opts.map(o => `<option value="${o[0]}" ${state.f[scope][key] === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}
      </select>`;
    }
    const toolbar = (inner) => `<div class="flex items-center gap-[0.7rem] px-5 py-4 border-b border-b-line2 flex-wrap">${inner}</div>`;
    // Labelled filter controls — same layout the business dashboard uses.
    const FILTER_LABEL = 'text-[0.72rem] font-bold tracking-[0.07em] uppercase text-adlabel pl-1';
    /* 172px is what "All advertisers" needs at 0.88rem once the select's own
       padding and chevron are counted. Below that the row still fits on one
       line but every option label is clipped to "All advertis…"; above it the
       fields wrap to a second row instead, which reads far better. */
    // max-w stops the last field on a wrapped row from ballooning to fill it.
    const filterField = (label, inner) => `<div class="flex flex-col gap-[0.35rem] flex-1 min-w-[172px] max-w-[268px]"><label class="${FILTER_LABEL}">${label}</label>${inner}</div>`;
    const filterSelect = (label, scope, key, opts, allLabel) => filterField(label,
      `<select data-filter="${scope}" data-key="${key}" class="${C.inp} !min-h-[42px] !py-[0.5rem] !pr-8 cursor-pointer font-semibold text-[0.88rem] !bg-surface">
        <option value="">${allLabel}</option>
        ${opts.map(o => `<option value="${o[0]}" ${state.f[scope][key] === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}
      </select>`);
    const filterDate = (label, scope, key) => filterField(label,
      `<input type="date" data-filter="${scope}" data-key="${key}" value="${state.f[scope][key] || ''}" class="${C.inp} !min-h-[42px] !py-[0.5rem] cursor-pointer font-semibold text-[0.88rem] !bg-surface">`);
    const filterSearch = (label, scope, ph) => filterField(label,
      `<div class="flex items-center gap-[0.6rem] border-[1.5px] border-line rounded-[10px] bg-surface px-[0.8rem] min-h-[42px] focus-within:border-grass-ink focus-within:shadow-[0_0_0_3px_rgba(32,100,61,0.13)]">
        <span class="text-muted leading-[0]">${icon('search', 16)}</span>
        <input data-search="${scope}" value="${esc(state.f[scope].q)}" class="w-full min-w-0 bg-transparent outline-none text-[0.9rem] text-head placeholder:text-muted placeholder:opacity-100" placeholder="${ph}">
      </div>`);
    const filterBar = (inner, scope) => `<div class="px-5 pt-4 pb-4 border-b border-b-line2 flex items-end gap-[0.7rem] flex-wrap">
      ${inner}
      <div class="shrink-0 pb-[1px]">${clearFilters(scope)}</div>
    </div>`;
    function dateBox(scope, key, label) {
      return `<label class="flex items-center gap-2 border-[1.5px] border-line rounded-[10px] bg-surface px-[0.8rem] min-h-[42px] text-[0.85rem] font-semibold text-muted focus-within:border-grass-ink focus-within:shadow-[0_0_0_3px_rgba(32,100,61,0.13)]">
        ${label}<input type="date" data-filter="${scope}" data-key="${key}" value="${state.f[scope][key] || ''}" class="bg-transparent outline-none text-[0.88rem] font-semibold text-head cursor-pointer">
      </label>`;
    }
    const clearFilters = (scope) => `<button class="${C.btnSm} ${C.ghost}" data-act="clear-filters" data-scope="${scope}">${icon('x', 14)} Clear</button>`;
    // Impressions (green) and clicks (amber) side by side, each bar labelled with its count.
    function dualBar(imps, clicks, labels, h = 190) {
      const max = Math.max(...imps, ...clicks, 1);
      return `<div class="flex items-end gap-[8px] max700:gap-[3px]" style="height:${h}px">
        ${labels.map((lb, i) => `<div class="flex-1 flex flex-col items-center gap-[0.4rem] h-full justify-end">
          <div class="flex items-end justify-center gap-[3px] w-full h-full">
            <div class="flex flex-col items-center justify-end gap-[0.3rem] h-full">
              <span class="text-[0.68rem] font-bold text-brand whitespace-nowrap">${num(imps[i])}</span>
              <div class="w-[14px] rounded-t-[6px] origin-bottom animate-grow bg-grass-ink" style="height:${Math.max(3, (imps[i] / max) * (h - 46))}px;animation-delay:${i * 40}ms"></div>
            </div>
            <div class="flex flex-col items-center justify-end gap-[0.3rem] h-full">
              <span class="text-[0.68rem] font-bold text-amber-ink whitespace-nowrap">${num(clicks[i])}</span>
              <div class="w-[14px] rounded-t-[6px] origin-bottom animate-grow bg-sun" style="height:${Math.max(3, (clicks[i] / max) * (h - 46))}px;animation-delay:${i * 40}ms"></div>
            </div>
          </div>
          <span class="text-[0.68rem] font-bold text-adlabel">${lb}</span>
        </div>`).join('')}
      </div>`;
    }
    // Ad revenue by month, scaled down for earlier years.
    const MONTHS_YEAR = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function revenueSeries(year) {
      const adBase = [1200, 1400, 1300, 1700, 1900, 1800, 2200, 2400, 2100, 2600, 2900, 3100];
      const f = Math.max(0.35, 1 - (TODAY.getFullYear() - year) * 0.18);
      return { ads: adBase.map(v => Math.round(v * f / 10) * 10) };
    }
    /* One bar per month, labelled with its amount. The last month is picked
       out in sun so "where we are now" reads without checking the axis. */
    function moneyBar(vals, labels, h = 200) {
      const max = Math.max(...vals, 1);
      return `<div class="flex items-end gap-[8px] max700:gap-[3px]" style="height:${h}px">
        ${labels.map((lb, i) => `<div class="flex-1 flex flex-col items-center gap-[0.4rem] h-full justify-end">
          <span class="text-[0.64rem] font-bold text-brand whitespace-nowrap">${money(vals[i]).replace('.00', '')}</span>
          <div class="w-full max-w-[34px] rounded-t-[6px] rounded-b-[2px] origin-bottom animate-grow ${i === vals.length - 1 ? 'bg-sun' : 'bg-grass-ink'}" style="height:${Math.max(3, (vals[i] / max) * (h - 46))}px;animation-delay:${i * 40}ms"></div>
          <span class="text-[0.68rem] font-bold text-adlabel">${lb}</span>
        </div>`).join('')}
      </div>`;
    }
    const chartLegend = () => `<div class="flex items-center gap-4 text-[0.8rem] font-semibold text-muted">
      <span class="inline-flex items-center gap-[0.4rem]"><i class="w-[10px] h-[10px] rounded-full bg-grass-ink not-italic"></i>Impressions</span>
      <span class="inline-flex items-center gap-[0.4rem]"><i class="w-[10px] h-[10px] rounded-full bg-sun not-italic"></i>Clicks</span>
    </div>`;
    // Split a filtered total across the last 6 weeks so the chart tracks the active filters.
    const WEEK_LABELS = ['W1', 'W2', 'W3', 'W4', 'W5', 'W6'];
    const WEEK_WEIGHTS = [0.125, 0.15, 0.175, 0.165, 0.185, 0.2];
    const weekly = (total) => WEEK_WEIGHTS.map(w => Math.round(total * w));
    const ctrOf = (imp, clk) => imp ? (clk / imp * 100).toFixed(2) + '%' : '—';
    const ctrVal = (o) => o.impressions ? o.clicks / o.impressions : 0;
    const byCtr = (list) => [...list].sort((a, b) => ctrVal(b) - ctrVal(a));
    /* `cls` is for the rare wide table that needs tighter gutters to clear the
       panel — the CTR leaderboard carries ten columns. */
    const tableWrap = (inner, cls = '') => `<div class="overflow-x-auto [-webkit-overflow-scrolling:touch]"><table class="${C.table()} ${cls}">${inner}</table></div>`;
    // Ten columns wide: 0.75rem gutters instead of 1rem buys back ~80px.
    const TIGHT = '[&_th]:!px-3 [&_td]:!px-3';

    /* Whole days between an ISO date and today, positive for the past. Both
       sides go through Date.parse on a bare YYYY-MM-DD so both land on UTC
       midnight and the result is an exact integer — mixing a local `new Date()`
       with a parsed date string puts the boundary hours off and turns today
       into "yesterday" for anyone west of UTC. */
    const dayDiff = (iso) => Math.round((Date.parse(d(0)) - Date.parse(iso)) / 86400000);
    /* How to address someone in a generated email. Contacts carry honorifics
       — "Dr. Ravi Menon", "Dr. Omar Haddad" — and naive first-word slicing
       produces "Hi Dr.". Titled names keep the title with the surname;
       everyone else gets their first name. */
    const HONORIFICS = ['dr', 'dr.', 'mr', 'mr.', 'mrs', 'mrs.', 'ms', 'ms.', 'prof', 'prof.', 'coach', 'sensei', 'rabbi', 'fr', 'fr.'];
    function greetName(full) {
      const parts = String(full).trim().split(/\s+/);
      if (parts.length > 1 && HONORIFICS.includes(parts[0].toLowerCase())) return `${parts[0]} ${parts[parts.length - 1]}`;
      return parts[0];
    }

    const ago = (iso) => {
      const n = dayDiff(iso);
      if (n < 0) return `in ${-n} day${n === -1 ? '' : 's'}`;
      return n === 0 ? 'Today' : n === 1 ? 'Yesterday' : `${n} days ago`;
    };

    /* "Jun 10 → Sep 10, 2026" rather than repeating a year that is the same on
       both ends — the range is a table cell, not a legal date. */
    const dateRange = (a, b) => {
      const A = new Date(a + 'T00:00'), B = new Date(b + 'T00:00');
      const one = (d, withYear) => `${MONTHS[d.getMonth()]} ${d.getDate()}${withYear ? ', ' + d.getFullYear() : ''}`;
      return `${one(A, A.getFullYear() !== B.getFullYear())} → ${one(B, true)}`;
    };

    const STATUS_PILL = {
      active: () => pill('green', 'Active', 'check'), blocked: () => pill('red', 'Blocked', 'ban'),
      approved: () => pill('green', 'Approved', 'verified'), pending: () => pill('amber', 'Pending', 'clock'),
      rejected: () => pill('red', 'Rejected', 'x'), suspended: () => pill('red', 'Suspended', 'ban'),
      published: () => pill('green', 'Published', 'check'), draft: () => pill('grey', 'Draft'),
      review: () => pill('amber', 'In review', 'clock'), past: () => pill('grey', 'Past'),
      live: () => pill('green', 'Live'),
      ended: () => pill('grey', 'Ended'), expired: () => pill('grey', 'Expired', 'clock'),
      paid: () => pill('green', 'Paid', 'check'),
      refunded: () => pill('lav', 'Refunded'), failed: () => pill('red', 'Failed', 'x')
    };
    const sp = (s) => (STATUS_PILL[s] || (() => pill('grey', s)))();
    /* One pill per ad type, toned by where the ad runs: the two directory
       tiers read as a pair, and the two page-level ones as another. */
    const AD_TYPE_TONE = { basic: 'grey', deluxe: 'amber', home: 'navy', category: 'lav' };
    /* Rows get the short name, with the blurb on the title for anyone unsure
       of what the type covers. The slot the ad was sold in rides underneath —
       see spotCell — rather than being crammed into the pill. */
    const planPill = (id) => {
      const t = adTypeOf(id);
      return `<span class="${C.pill} ${PILL[AD_TYPE_TONE[t.id] || 'grey']}" title="${esc(t.label)} · ${esc(t.blurb)}">${icon(t.ic, 12)}${t.short}</span>`;
    };
    /* The slot a page ad was sold in, read under the type pill it belongs to —
       Home and Category each cover two, and the pill alone cannot say which. */
    const spotCell = (a) => adSpots(a).length
      ? `<div class="text-[0.76rem] text-muted font-semibold mt-[0.25rem] whitespace-nowrap">${adSpots(a).map(s => esc(s.label)).join(' · ')}</div>`
      : '';
    // Add-ons on a row. Nothing bought is a dash, not an empty cell.
    const addonCell = (a) => (a.addons || []).length
      ? `<div class="flex flex-wrap gap-[0.3rem] max-w-[200px]">${a.addons.map(id => pill('teal', addonOf(id).label, 'trending')).join('')}</div>`
      : '<span class="text-muted">—</span>';
    // "Internal" reads as a state of the ad; the advertiser name is the site's.
    const advCell = (a) => isInternal(a)
      ? `<span class="inline-flex items-center gap-[0.4rem]"><span class="font-semibold">Bergen Kids</span>${pill('green', 'Internal', 'shield')}</span>`
      : esc(advOf(a.advertiser).company);
    /* A category column was reading as a row of identical grey chips — the
       one column where the value IS the category and nine of them share a
       table. Carrying each category's own tint makes the column scannable
       without reading it; `.cat-tint` restates the hue for the dark page. */
    const catPill = (id) => {
      const c = catOf(id);
      return `<span class="cat-tint ${C.pill} text-head border-[1.5px] border-line2" style="--cat:${c.tint};background:var(--cat)">${c.name.split(' ')[0]}</span>`;
    };

    /* ═══════════════ 1. DASHBOARD ═══════════════ */
    function dashboardView() {
      const R = state.range, rLabel = (RANGES.find(r => r[0] === R) || RANGES[1])[1];

      /* Value and delta come from the same window, so they cannot disagree. */
      const vStat = rangeStats(DAILY.views, R);
      const cStat = rangeStats(DAILY.clicks, R);
      const rStat = rangeStats(DAILY.rev, R);

      // The amount lives on the ad's billing split, not on the charge row.
      const revenue = TX.filter(t => t.status === 'paid').reduce((a, t) => a + txOf(t).amount, 0);
      const cards = [
        kpi(`Article views · ${rLabel}`, num(vStat.cur), vStat.pct, 'news', '#e2ebfa|#2d5a8e'),
        kpi(`Ad clicks · ${rLabel}`, num(cStat.cur), cStat.pct, 'click', '#fdeed5|#8a5200'),
        kpi(`Ad revenue · ${rLabel}`, money(rStat.cur).replace('.00', ''), rStat.pct, 'dollar', '#e3f2e9|#20643d')
      ].join('');

      /* Live totals, tied to the real arrays — approving an advertiser in the
         Approvals inbox has to visibly move a number on this page, or the two
         screens look like they are describing different systems. */
      const totals = [
        ['Total Parents', num(PARENTS.length), 'users', '#e2ebfa|#2d5a8e'],
        ['Total Advertisers', num(ADVERTISERS.filter(a => a.status === 'approved').length), 'megaphone', '#ede6f8|#5c4382'],
        ['Published events', num(EVENTS.filter(e => e.status === 'published').length), 'calendar', '#e3f2e9|#20643d'],
        ['Lifetime ad revenue', money(revenue).replace('.00', ''), 'card', '#ddf1ec|#14685a']
      ];

      const rangeSwitch = `<div class="flex gap-1 p-1 rounded-[100px] bg-surface-3">
        ${RANGES.map(([v, l]) => `<button data-act="set-range" data-val="${v}" class="px-[0.9rem] py-[0.4rem] rounded-[100px] text-[0.85rem] font-bold min-h-[36px] transition-all ${R === v ? 'bg-surface text-head shadow-[0_2px_8px_rgba(26,46,74,0.12)]' : 'text-muted hover:text-head'}">${l}</button>`).join('')}
      </div>`;

      const topArt = [...ARTICLES].filter(a => a.status === 'published').sort((a, b) => b.views - a.views).slice(0, 5);
      const topA = [...ADS].filter(a => a.impressions).sort((a, b) => b.clicks - a.clicks).slice(0, 5);
      /* Events per category, counted straight off EVENTS — the old version of
         this donut counted listings and padded each slice with a fudge
         constant, so its total matched nothing else in the console. */
      const DONUT_C = ['#20643d', '#f5a623', '#2d5a8e', '#c0398b', '#1e8c7a', '#7b5ea7', '#e0550f', '#14685a', '#a3277c'];
      const catSegs = CATEGORIES.map((c, i) => ({
        n: c.name,
        v: EVENTS.filter(e => e.cat === c.id && e.status === 'published').length + ARTICLES.filter(a => a.cat === c.id && a.status === 'published').length,
        c: DONUT_C[i % DONUT_C.length]
      })).filter(s => s.v);
      /* Counted straight, with no padding. Both donuts used to add a fudge
         constant per slice, so their centre totals matched no other page —
         this one now equals the live ads on Advertisements, and the other
         equals the published events and articles on their own pages. */
      const placeSegs = AD_TYPES.map((p, i) => ({
        n: p.short,
        v: ADS.filter(a => a.status === 'live' && a.type === p.id).length,
        c: DONUT_C[i % DONUT_C.length]
      })).filter(s => s.v);

      const trafficPts = condense(DAILY.views, R, 34);

      return `
      <div class="grid gap-5">

        <div class="flex items-center justify-between gap-3 flex-wrap">
          <div class="flex items-baseline gap-3 flex-wrap">
            <span class="${C.eyebrow}">Reporting window</span>
            <span class="text-[0.85rem] text-muted">Compared with the previous ${rLabel}</span>
          </div>
          ${rangeSwitch}
        </div>

        <div class="grid grid-cols-3 gap-5 max1200:grid-cols-2 max560:grid-cols-1">${cards}</div>

        ${panel('Article views', `<span class="${C.pill} ${PILL.grey}">${rLabel}</span>`, `<div class="px-5 pt-5 pb-4">
          ${areaChart(trafficPts, tok('brand'), 180)}
          <div class="flex items-center justify-between gap-4 flex-wrap mt-3 pt-3 border-t border-t-line2 text-[0.85rem]">
            <span class="text-muted">Peak day <b class="text-head">${num(Math.max(...trafficPts))}</b> views</span>
            <span class="text-muted">Daily average <b class="text-head">${num(Math.round(vStat.cur / R))}</b></span>
            <span class="text-muted">Previous ${rLabel} <b class="text-head">${num(vStat.prev)}</b></span>
          </div>
        </div>`)}

        <div class="grid grid-cols-4 gap-5 max1200:grid-cols-2 max560:grid-cols-1">
          ${totals.map(([l, v, ic, tone]) => {
        const [bg, fg] = tone.split('|');
        return `<div data-rv class="${C.card} p-4 flex items-center gap-3">
              <span class="w-[38px] h-[38px] rounded-[11px] tint inline-flex items-center justify-center shrink-0" style="--chip-bg:${bg};--chip-fg:${fg}">${icon(ic, 17)}</span>
              <div class="min-w-0">
                <div class="font-serif text-[1.2rem] font-black text-head leading-none [font-variant-numeric:tabular-nums]">${v}</div>
                <div class="text-[0.78rem] text-muted font-semibold mt-1 truncate">${l}</div>
              </div>
            </div>`;
      }).join('')}
        </div>

        <div class="grid grid-cols-2 gap-5 max1200:grid-cols-1">
          ${panel('Live ads by ad type', '', `<div class="p-5 flex flex-col items-center gap-5">
            ${donut(placeSegs.map(s => ({ v: s.v, c: s.c })), 160)}
            <div class="w-full grid grid-cols-2 gap-y-2 gap-x-3">
              ${placeSegs.map(s => `<div class="flex items-center gap-2 text-[0.82rem] text-muted font-medium min-w-0">
                <i class="w-[9px] h-[9px] rounded-full shrink-0 not-italic" style="background:${s.c}"></i>
                <span class="truncate">${s.n}</span><span class="ml-auto font-bold text-head">${s.v}</span></div>`).join('')}
            </div>
          </div>`)}

          ${panel('Published content by category', '', `<div class="p-5 flex flex-col items-center gap-5">
            ${donut(catSegs.map(s => ({ v: s.v, c: s.c })), 160)}
            <div class="w-full grid grid-cols-2 gap-y-2 gap-x-3">
              ${catSegs.map(s => `<div class="flex items-center gap-2 text-[0.82rem] text-muted font-medium min-w-0">
                <i class="w-[9px] h-[9px] rounded-full shrink-0 not-italic" style="background:${s.c}"></i>
                <span class="truncate">${s.n.split(' ')[0]}</span><span class="ml-auto font-bold text-head">${s.v}</span></div>`).join('')}
            </div>
          </div>`)}
        </div>

        <div class="grid grid-cols-2 gap-5 max1200:grid-cols-1">
          ${panel('Top performing ads', `<button class="text-[0.85rem] font-bold text-brand hover:underline inline-flex items-center gap-1" data-nav="adanalytics">Full report ${icon('arrow-right', 14)}</button>`,
        tableWrap(`<thead><tr><th>Campaign</th><th>Ad type</th><th>Impressions</th><th>Clicks</th><th>CTR</th></tr></thead>
            <tbody>${topA.map(a => {
          return `<tr>
              <td><div class="flex items-center gap-[0.7rem] min-w-0">
                ${adThumb(a, 'w-[34px] h-[34px] rounded-[9px]')}
                <div class="min-w-0"><div class="font-bold truncate">${esc(a.name)}</div><div class="text-[0.78rem] text-muted truncate">${esc(advOf(a.advertiser).company)}</div></div>
              </div></td>
              <td>${planPill(a.type)}</td>
              <td class="font-semibold">${num(a.impressions)}</td><td class="font-semibold">${num(a.clicks)}</td>
              <td><span class="font-bold text-brand">${((a.clicks / a.impressions) * 100).toFixed(1)}%</span></td>
            </tr>`;
        }).join('')}</tbody>`))}

          ${panel('Recent Articles', `<button class="text-[0.85rem] font-bold text-brand hover:underline inline-flex items-center gap-1" data-nav="editorial">View All Articles ${icon('arrow-right', 14)}</button>`,
          tableWrap(`<thead><tr><th>Article</th><th>Category</th><th>Author</th><th class="!text-right">Views</th></tr></thead>
            <tbody>${topArt.map(a => `<tr>
              <td><div class="flex items-center gap-[0.7rem] min-w-0">
                <span class="w-[34px] h-[34px] rounded-[9px] inline-flex items-center justify-center cat-tint text-head shrink-0" style="--cat:${catOf(a.cat).tint};background:var(--cat)">${icon('news', 17)}</span>
                <div class="min-w-0"><button data-act="view-article" data-id="${a.id}" class="block text-left font-bold truncate max-w-full hover:text-brand hover:underline transition-colors">${esc(a.title)}</button></div>
              </div></td>
              <td>${catPill(a.cat)}</td>
              <td class="text-[0.88rem] text-muted truncate">${esc(a.author)}</td>
              <td class="text-right"><span class="font-bold text-brand">${num(a.views)}</span></td>
            </tr>`).join('')}</tbody>`))}
        </div>
      </div>`;
    }
    /* ═══════════════ 1b. APPROVALS INBOX ═══════════════
       Everything the platform needs a human decision on, in one queue.

       These records already existed — pending advertisers, pending ads,
       draft articles, ad flights running out, payments that did not settle —
       but they were spread over five pages, two of which are not in the side
       menu, so a demo never showed them and an admin had to remember to go
       looking. Nothing new is stored: this reads the same arrays every other
       page reads, and its row actions dispatch to the SAME handlers the
       original pages use, so approving here and approving there are one code
       path. */
    const RENEW_WINDOW = 14;                       // days out that counts as "ending soon"

    function queueItems() {
      const out = [];
      const push = (o) => out.push(o);

      ADVERTISERS.filter(a => a.status === 'pending').forEach(a => push({
        group: 'signups', kind: 'advertiser', id: a.id, date: a.joined,
        title: a.company, sub: `${a.contact} · ${a.email}`,
        label: 'Advertiser signup', ic: 'megaphone', tone: '#ede6f8|#5c4382',
        thumb: avatar(a.contact, 38, a.photo),
        acts: [['approve', 'advertiser'], ['reject', 'advertiser'], ['view-advertiser', 'advertiser']]
      }));

      ADS.filter(a => a.status === 'pending').forEach(a => push({
        group: 'content', kind: 'ad', id: a.id, date: a.txnDate || a.start,
        title: a.name, sub: `${advOf(a.advertiser).company} · ${adTypeOf(a.type).short} · ${money(adBill(a).total).replace('.00', '')}`,
        label: 'Ad creative', ic: 'image', tone: '#ede6f8|#5c4382',
        thumb: adThumb(a, 'w-[58px] h-[38px] rounded-[9px]'),
        acts: [['approve', 'ad'], ['reject-ad', 'ad'], ['view-ad', 'ad']]
      }));

      EVENTS.filter(e => e.status === 'draft').forEach(e => push({
        group: 'content', kind: 'event', id: e.id, date: e.date,
        title: e.name, sub: `${e.organizer} · ${e.town} · ${fmtDate(e.date)}`,
        label: 'Draft event', ic: 'calendar', tone: '#e7f0fd|#2d5a8e',
        thumb: photoTile('w-[38px] h-[38px] rounded-[11px]', catOf(e.cat).tint, e.icon, 18, e.img),
        acts: [['toggle-event', 'event'], ['edit-event', 'event']]
      }));

      ARTICLES.filter(a => a.status === 'draft').forEach(a => push({
        group: 'content', kind: 'article', id: a.id, date: a.date,
        title: a.title, sub: `${a.author} · ${catOf(a.cat).name}`,
        label: 'Draft article', ic: 'news', tone: '#fbeee3|#a8501c',
        thumb: photoTile('w-[38px] h-[38px] rounded-[11px]', catOf(a.cat).tint, 'news', 18),
        // Read it before you publish it — View leads, same as a pending ad.
        acts: [['view-article', 'article'], ['approve-article', 'article'], ['edit-article', 'article']]
      }));

      /* A flight running out is a sales call, not an error — but a "live" ad
         whose end date has already passed is a real inconsistency, so it sorts
         to the top with the overdue framing rather than being hidden. */
      // A house ad has nobody to send a renewal to, so it never joins the queue.
      ADS.filter(a => a.status === 'live' && !isInternal(a) && -dayDiff(a.end) <= RENEW_WINDOW).forEach(a => {
        const left = -dayDiff(a.end);
        push({
          group: 'revenue', kind: 'renewal', id: a.id, date: a.end, overdue: left < 0,
          title: a.name,
          sub: `${advOf(a.advertiser).company} · ${adTypeOf(a.type).short} · ${left < 0 ? `ran out ${-left} days ago` : left === 0 ? 'ends today' : `${left} days left`}`,
          label: left < 0 ? 'Flight overdue' : 'Ending soon', ic: 'clock', tone: left < 0 ? '#fbe4e1|#a3271c' : '#fdeed5|#8a5200',
          thumb: adThumb(a, 'w-[58px] h-[38px] rounded-[9px]'),
          acts: [['renew-ad', 'ad'], ['view-ad', 'ad']]
        });
      });

      TX.filter(t => t.status === 'failed' || t.status === 'pending').forEach(t => {
        const x = txOf(t);
        push({
          group: 'revenue', kind: 'payment', id: t.id, date: t.date,
          title: `${money(x.bill.total).replace('.00', '')} · ${x.adv.company}`,
          sub: `${x.ad.name} · ${x.method}`,
          label: t.status === 'failed' ? 'Payment failed' : 'Payment pending', ic: 'dollar',
          tone: t.status === 'failed' ? '#fbe4e1|#a3271c' : '#fdeed5|#8a5200',
          thumb: adThumb(x.ad, 'w-[58px] h-[38px] rounded-[9px]'),
          acts: t.status === 'failed' ? [['retry-payment', 'tx'], ['view-tx', 'tx']] : [['view-tx', 'tx']]
        });
      });

      // Oldest first — the queue is a backlog, so age is the only sane order.
      return out.sort((a, b) => dayDiff(b.date) - dayDiff(a.date));
    }

    const APPROVAL_TABS = [
      ['all', 'Everything', 'list'], ['signups', 'Advertisers', 'users'],
      ['content', 'Content & ads', 'image'], ['revenue', 'Revenue', 'dollar']
    ];
    const queueCount = () => queueItems().length;

    /* Age drives the only colour on the row, because "how long has this person
       been waiting" is the one thing the queue is actually about. */
    function urgency(item) {
      if (item.kind === 'renewal') return item.overdue ? 'red' : 'amber';
      const n = dayDiff(item.date);
      return n >= 5 ? 'red' : n >= 2 ? 'amber' : 'green';
    }

    const QUEUE_ACT_LABEL = {
      'approve': ['Approve', 'check', 'ok'], 'approve-article': ['Publish', 'check', 'ok'],
      'reject': ['Reject', 'x', 'bad'], 'reject-ad': ['Reject', 'x', 'bad'],
      'retry-payment': ['Retry charge', 'card', 'ok'], 'renew-ad': ['Send renewal', 'mail', 'ok'],
      'toggle-event': ['Publish', 'check', 'ok'], 'edit-event': ['Edit', 'edit', ''],
      'view-advertiser': ['View', 'eye', ''], 'view-ad': ['View', 'eye', ''],
      'view-tx': ['View', 'eye', ''], 'edit-article': ['Edit', 'edit', ''],
      'view-article': ['View', 'eye', '']
    };

    function approvalsView() {
      const all = queueItems();
      const tab = state.approvalTab;
      const rows = tab === 'all' ? all : all.filter(i => i.group === tab);
      const oldest = all.length ? Math.max(...all.map(i => dayDiff(i.date))) : 0;
      const atRisk = all.filter(i => i.group === 'revenue')
        .reduce((a, i) => a + (i.kind === 'payment' ? txOf(TX.find(t => t.id === i.id)).bill.total : adBill(adOf(i.id)).total), 0);

      const stats = [
        ['Awaiting a decision', all.length, 'clock', '#fdeed5|#8a5200'],
        ['Oldest in queue', all.length ? `${oldest}d` : '—', 'calendar', '#fbe4e1|#a3271c'],
        ['New sign-ups', all.filter(i => i.group === 'signups').length, 'users', '#e2ebfa|#2d5a8e'],
        ['Revenue at risk', money(atRisk).replace('.00', ''), 'dollar', '#e3f2e9|#20643d']
      ];

      const tabs = `<div class="flex gap-1 p-1 rounded-[100px] bg-surface-3 flex-wrap">
        ${APPROVAL_TABS.map(([id, l, ic]) => {
        const n = id === 'all' ? all.length : all.filter(i => i.group === id).length;
        return `<button data-tab="approvalTab" data-val="${id}" class="inline-flex items-center gap-[0.4rem] px-[0.9rem] py-[0.4rem] rounded-[100px] text-[0.85rem] font-bold min-h-[36px] transition-all ${tab === id ? 'bg-surface text-head shadow-[0_2px_8px_rgba(26,46,74,0.12)]' : 'text-muted hover:text-head'}">${icon(ic, 14)} ${l}
            ${n ? `<span class="text-[0.7rem] font-black px-[0.4rem] py-[0.05rem] rounded-[100px] ${tab === id ? 'bg-amber-bg text-amber-ink' : 'bg-surface-5 text-muted'}">${n}</span>` : ''}</button>`;
      }).join('')}
      </div>`;

      const body = rows.length ? `<div class="flex flex-col">
        ${rows.map(i => {
        const [bg, fg] = i.tone.split('|');
        const u = urgency(i);
        return `<div data-rv class="flex items-center gap-4 px-5 py-4 border-b border-b-line2 last:border-b-0 transition-colors hover:bg-surface-2 max900:flex-wrap">
            <span class="w-[5px] self-stretch rounded-[100px] shrink-0 ${u === 'red' ? 'bg-danger' : u === 'amber' ? 'bg-sun' : 'bg-grass-ink'}" aria-hidden="true"></span>
            ${i.thumb}
            <div class="min-w-0 flex-1 max900:basis-[60%]">
              <div class="flex items-center gap-2 flex-wrap mb-[0.15rem]">
                <span class="font-bold text-head truncate">${esc(i.title)}</span>
                <span class="${C.pill} tint" style="--chip-bg:${bg};--chip-fg:${fg}">${icon(i.ic, 11)}${i.label}</span>
              </div>
              <div class="text-[0.85rem] text-muted truncate">${esc(i.sub)}</div>
            </div>
            <div class="text-[0.82rem] font-bold shrink-0 w-[110px] text-right max900:w-auto ${u === 'red' ? 'text-danger-t' : u === 'amber' ? 'text-star' : 'text-muted'}">${ago(i.date)}</div>
            <div class="flex gap-[0.4rem] shrink-0 max900:basis-full max900:justify-end">
              ${i.acts.map(([act, kind]) => {
          const [label, ic, tone] = QUEUE_ACT_LABEL[act];
          const cls = tone === 'ok' ? C.iconOk : tone === 'bad' ? C.iconBad : '';
          return `<button class="${C.iconbtn} ${cls}" data-act="${act}" data-kind="${kind}" data-id="${i.id}" title="${label}" aria-label="${label}">${icon(ic, 15)}</button>`;
        }).join('')}
            </div>
          </div>`;
      }).join('')}
      </div>` : `<div class="flex flex-col items-center gap-2 text-muted py-16 px-5 text-center">
        <span class="w-[62px] h-[62px] rounded-[18px] bg-mint text-brand inline-flex items-center justify-center">${icon('check', 28)}</span>
        <div class="font-serif text-[1.1rem] font-black text-head mt-1">${tab === 'all' ? 'Queue is clear' : 'Nothing here'}</div>
        <div class="text-[0.9rem] max-w-[380px]">${tab === 'all' ? 'Every sign-up, ad, draft and payment has been dealt with. New submissions land here automatically.' : 'Nothing in this group is waiting on you right now.'}</div>
      </div>`;

      return `<div class="grid gap-5">
        ${miniStats(stats)}
        ${panel('Waiting on you', tabs, body)}
      </div>`;
    }

    /* ═══════════════ 1c. TOWN COVERAGE ═══════════════
       The console knows what every parent WANTS — signup captures their
       preferred towns and categories — and it knows what actually EXISTS in
       each town. Nothing had ever put the two side by side.

       That comparison is the whole product argument for a county-scoped
       directory, and it is the one screen a generic admin template cannot
       produce: it needs parent intent, which only this business model
       collects. Every number below is counted from the same arrays the rest
       of the console renders. */

    /* What `demand` actually is, because it is easy to over-read:

       At signup a parent optionally picks the Bergen towns they would travel
       to, and that becomes their DEFAULT FILTER on the Directory and Events
       pages. It is not a subscription and not an alert — nobody is watching a
       town. Skipping the question is offered ("No preference — shows all"),
       and a parent who skips sees every town.

       So a count of 0 here means "no parent named this town", NOT "no parent
       would go". The number below the grid says how many parents skipped, so
       the zeroes can be read with that in mind. */
    const noTownPref = () => PARENTS.filter(p => !(p.towns || []).length).length;
    const noCatPref = () => PARENTS.filter(p => !(p.cats || []).length).length;

    function townStats() {
      return TOWNS.map(town => {
        const want = PARENTS.filter(p => (p.towns || []).includes(town));
        const events = EVENTS.filter(e => e.town === town && e.status === 'published');
        const ads = ADS.filter(a => (a.towns || []).includes(town) && a.status === 'live');
        const demand = want.length;
        /* Supply is published events, because that is the only town-scoped
           thing the platform holds — articles are written for the county, not
           for a town, so they cannot answer "what is there in Closter". Ads are
           counted separately: an ad targeting a town is money coming IN for
           that town, not content going out to it. */
        const supply = events.length;
        const state = !demand && !supply ? 'quiet'
          : demand && !supply ? 'gap'
            : supply < demand ? 'thin' : 'good';
        return {
          town, demand, state, supply,
          events: events.length, ads: ads.length,
          // Which categories those parents asked for, and which are unserved here.
          wants: [...new Set(want.flatMap(p => p.cats || []))],
          served: [...new Set(events.map(e => e.cat))]
        };
      });
    }

    /* [tint, short label, what it actually means]

       The short labels were industry-speak — "Well served", "Thin coverage"
       — which describe a judgement without saying what was measured. Each one
       is now a plain statement about the two numbers printed on the tile:
       how many parents picked the town, and how many events are on there. */
    const TOWN_STATE = {
      good: ['#e3f2e9|#20643d', 'Enough events', 'As many events as parents who picked it'],
      thin: ['#fdeed5|#8a5200', 'Not enough', 'Some events, but fewer than the parents asking'],
      gap: ['#fbe4e1|#a3271c', 'Nothing on', 'Parents picked it and nothing is scheduled'],
      quiet: ['#eef1f5|#7c8a9c', 'Quiet', 'Nobody picked it and nothing is on']
    };

    /* A "how to read this" strip above a table.

       These two tables kept needing to be explained out loud, which is the
       clearest possible sign the UI was not doing its job — in a demo the
       client should not have to ask, and day to day a new admin should not
       have to be told. The question each table answers is now printed on it,
       in the table's own words, with the legend beside it. */
    function hintBar(question, answer, legend) {
      return `<div class="flex items-start gap-[0.7rem] px-5 py-[0.9rem] bg-surface-2 border-b border-b-line2">
        <span class="w-[26px] h-[26px] rounded-[8px] bg-sel text-head inline-flex items-center justify-center shrink-0 mt-[1px]">${icon('sparkle', 14)}</span>
        <div class="min-w-0 flex-1">
          <div class="text-[0.88rem] leading-[1.55]">
            <b class="text-head">${question}</b>
            <span class="text-muted"> ${answer}</span>
          </div>
          ${legend ? `<div class="flex items-center gap-x-4 gap-y-[0.35rem] flex-wrap mt-[0.6rem]">${legend}</div>` : ''}
        </div>
      </div>`;
    }
    /* One legend entry: a real sample of the cell, then what it means. */
    const legendKey = (sample, label) =>
      `<span class="inline-flex items-center gap-[0.4rem] text-[0.78rem] text-muted font-semibold">${sample}<span>${label}</span></span>`;

    function townsView() {
      const all = townStats();
      const gaps = all.filter(t => t.state === 'gap').sort((a, b) => b.demand - a.demand || b.wants.length - a.wants.length || a.town.localeCompare(b.town));
      const covered = all.filter(t => t.supply > 0);
      // A category a parent asked for in a town where nothing of that kind exists.
      const unmet = all.reduce((a, t) => a + t.wants.filter(c => !t.served.includes(c)).length, 0);

      const affected = new Set(gaps.flatMap(t => PARENTS.filter(p => (p.towns || []).includes(t.town)).map(p => p.id))).size;

      /* Colour means STATE, icon means UNIT — and the colours are the same
         four the grid below uses, or deliberately none of them.

         The amber tile was the bug worth fixing: amber in the grid means
         "some events, but not enough", and the third card was using it for
         something else entirely, so the colour scheme stopped being trustworthy
         the moment you looked at both. Cards 2 and 3 are the same problem counted
         at two sizes, so both take the grid's red; the pin and tag icons carry
         the difference in unit. Card 4 counts people, which is not a grid
         state at all, so it takes a colour the legend never uses.

         Labels stay short — the miniStats tile truncates. The sentence above
         them carries the meaning. */
      const stats = [
        ['Towns with an event', `${covered.length} / ${TOWNS.length}`, 'pin', '#e3f2e9|#20643d'],
        ['Towns needing one', gaps.length, 'pin', '#fbe4e1|#a3271c'],
        ['Things missing', unmet, 'tag', '#fbe4e1|#a3271c'],
        ['Parents affected', affected, 'users', '#e2ebfa|#2d5a8e']
      ];

      /* One sentence that ties all four numbers together, so the row reads as
         a statement rather than four unrelated counters. */
      const statLine = `<div class="flex items-start gap-[0.7rem]">
        <span class="w-[26px] h-[26px] rounded-[8px] bg-sel text-head inline-flex items-center justify-center shrink-0 mt-[1px]">${icon('sparkle', 14)}</span>
        <p class="text-[0.88rem] text-muted leading-[1.6] max-w-[95ch]">
          <b class="text-head">How well the events calendar covers the towns parents picked.</b>
          ${covered.length} of the ${TOWNS.length} Bergen towns have an event on.
          ${gaps.length ? `<b class="text-head">${gaps.length}</b> more were picked by a parent but have nothing scheduled — that is <b class="text-head">${unmet}</b> separate town-and-category ${unmet === 1 ? 'miss' : 'misses'}, affecting <b class="text-head">${affected}</b> ${affected === 1 ? 'parent' : 'parents'}.`
          : 'Every town a parent picked has something on.'}
        </p>
      </div>`;

      /* The legend used to be four two-word labels crammed into the panel
         header — no room to say what any of them measured, so the colours
         were decoration. It moved into a hint bar with the meaning spelled
         out beside each swatch.

         Each swatch is filled with the ink, not the pale chip background:
         four near-white squares are not a legend. `currentColor` picks up
         whatever .tint resolved the ink to, so it stays distinguishable
         after the dark-theme remix. */
      const gridHint = hintBar(
        'What do the colours mean?',
        'Every tile shows <b class="text-head">how many parents picked that town</b> and <b class="text-head">how many events are on there</b>. Click any tile for the full picture.',
        Object.entries(TOWN_STATE).map(([k, [tone, label, meaning]]) => {
          const [bg, fg] = tone.split('|');
          const swatch = `<i class="w-[13px] h-[13px] rounded-[4px] not-italic tint shrink-0 [background:currentColor]" style="--chip-bg:${bg};--chip-fg:${fg}"></i>`;
          return legendKey(swatch, `<b class="text-head">${label}</b> <span class="font-medium">— ${meaning}</span>`);
        }).join(''));

      /* All 70 municipalities as tiles rather than a map: a real map needs geo
         data and a library, and for a single county a tile per town is just as
         readable and stays legible on a phone. */
      const grid = `<div class="p-5 grid grid-cols-6 gap-2 max1400:grid-cols-5 max1200:grid-cols-4 max900:grid-cols-3 max560:grid-cols-2">
        ${all.map(t => {
        const [bg, fg] = TOWN_STATE[t.state][0].split('|');
        const title = `${t.town} — ${t.demand} parent${t.demand === 1 ? '' : 's'} would travel here, ${t.events} event${t.events === 1 ? '' : 's'} on, ${t.ads} ad${t.ads === 1 ? '' : 's'} targeting`;
        return `<button data-act="town-detail" data-town="${esc(t.town)}" title="${esc(title)}"
            class="tint text-left rounded-[11px] px-[0.7rem] py-[0.55rem] border-[1.5px] border-transparent transition-all duration-150 hover:-translate-y-px hover:border-[color-mix(in_srgb,var(--chip-fg)_45%,transparent)] hover:shadow-[var(--sh-1)]"
            style="--chip-bg:${bg};--chip-fg:${fg}">
            <div class="text-[0.8rem] font-bold leading-tight truncate">${esc(t.town)}</div>
            <div class="text-[0.7rem] font-semibold opacity-80 mt-[0.15rem] [font-variant-numeric:tabular-nums]">${t.demand} picked · ${t.events} on</div>
          </button>`;
      }).join('')}
      </div>`;

      const gapTable = tableWrap(`<thead><tr><th>Town</th><th>Would travel here</th><th>Categories they picked</th><th class="!text-center">Ads targeting</th><th class="!text-right">Action</th></tr></thead>
        <tbody>${gaps.length ? gaps.map(t => `<tr>
          <td><div class="flex items-center gap-[0.6rem]">
            <span class="w-[30px] h-[30px] rounded-[9px] tint inline-flex items-center justify-center shrink-0" style="--chip-bg:#fbe4e1;--chip-fg:#a3271c">${icon('pin', 14)}</span>
            <span class="font-bold">${esc(t.town)}</span></div></td>
          <td><button class="inline-flex items-center gap-[0.4rem] font-serif text-[1.05rem] font-black text-head rounded-[9px] px-[0.5rem] py-[0.15rem] -ml-[0.5rem] transition-colors hover:bg-sel hover:text-brand group"
            data-act="town-parents" data-town="${esc(t.town)}" title="See the ${t.demand} ${t.demand === 1 ? 'parent' : 'parents'} who picked ${esc(t.town)}">
            ${t.demand}
            <span class="text-muted transition-transform duration-150 group-hover:translate-x-[2px] group-hover:text-brand">${icon('chev-right', 13)}</span>
          </button></td>
          <td><div class="flex flex-wrap gap-1">${t.wants.map(c => catPill(c)).join('')}</div></td>
          <td class="text-center">${t.ads
          ? `<span class="${C.pill} ${PILL.amber}" title="Advertisers are paying to reach this town, but nothing is scheduled here for parents to come for">${icon('megaphone', 11)}${t.ads}</span>`
          : '<span class="text-muted">—</span>'}</td>
          <td><div class="flex justify-end"><button class="${C.btnSm} ${C.ghost}" data-act="new-event" data-town="${esc(t.town)}">${icon('plus', 14)} Schedule an event</button></div></td>
        </tr>`).join('') : emptyRow(5, 'Every town parents picked has something on')}</tbody>`);

      const gapHint = hintBar(
        'Where should we run something next?',
        'Parents picked these towns as their filter, but nothing is scheduled there. Worst first. Click a number to see the families, or schedule an event to clear the row.');

      /* Category × town: where the gap actually is, not just that there is one.
         Only towns anyone has asked about — the other 44 would be 44 empty
         rows saying nothing. */
      const matrixTowns = all.filter(t => t.demand > 0).sort((a, b) => b.demand - a.demand || a.town.localeCompare(b.town));
      const matrix = tableWrap(`<thead><tr><th>Town</th>${CATEGORIES.map(c => `<th class="!text-center !px-2" title="${esc(c.name)}">${esc(c.name.split(' ')[0])}</th>`).join('')}</tr></thead>
        <tbody>${matrixTowns.map(t => {
        /* Same pin chip the first table uses, so a town reads identically in
           both. Tinted by the town's own state rather than a flat colour —
           this table lists every town parents picked, not only the empty
           ones, so the pin carries whether the row is a gap at all. */
        const [pbg, pfg] = TOWN_STATE[t.state][0].split('|');
        return `<tr>
          <td class="whitespace-nowrap"><button class="flex items-center gap-[0.6rem] text-left rounded-[9px] -ml-1 px-1 py-[0.15rem] transition-colors hover:bg-surface-3 group"
            data-act="town-detail" data-town="${esc(t.town)}" title="${esc(t.town)} — ${TOWN_STATE[t.state][1]}">
            <span class="w-[30px] h-[30px] rounded-[9px] tint inline-flex items-center justify-center shrink-0" style="--chip-bg:${pbg};--chip-fg:${pfg}">${icon('pin', 14)}</span>
            <span class="font-bold text-head group-hover:text-brand transition-colors">${esc(t.town)}</span>
          </button></td>
          ${CATEGORIES.map(c => {
          const wanted = t.wants.includes(c.id);
          const has = EVENTS.filter(e => e.town === t.town && e.cat === c.id && e.status === 'published').length;
          if (has) return `<td class="!text-center !px-2"><span class="inline-flex items-center justify-center w-[26px] h-[26px] rounded-[8px] bg-mint text-brand font-bold text-[0.8rem]" title="${esc(c.name)} in ${esc(t.town)}: ${has} on">${has}</span></td>`;
          if (wanted) return `<td class="!text-center !px-2"><span class="inline-flex items-center justify-center w-[26px] h-[26px] rounded-[8px] bg-red-bg text-danger-t" title="Parents picked ${esc(c.name)} in ${esc(t.town)} — nothing scheduled">${icon('x', 12)}</span></td>`;
          return `<td class="!text-center !px-2"><span class="text-line2">·</span></td>`;
        }).join('')}
        </tr>`;
      }).join('')}</tbody>`, 'min-w-[860px]');

      /* The legend uses the real cell markup, not a description of it, so the
         eye can match it to the grid without translating. */
      const matrixHint = hintBar(
        'What kind of event should it be?',
        'Every town at least one parent picked, against the 9 categories. Read a row across to see what those families asked for and what already exists.',
        [
          legendKey(`<span class="inline-flex items-center justify-center w-[22px] h-[22px] rounded-[7px] bg-red-bg text-danger-t shrink-0">${icon('x', 11)}</span>`, 'Asked for, nothing on — the gap'),
          legendKey(`<span class="inline-flex items-center justify-center w-[22px] h-[22px] rounded-[7px] bg-mint text-brand font-bold text-[0.72rem] shrink-0">2</span>`, 'Events already on'),
          legendKey(`<span class="inline-flex items-center justify-center w-[22px] h-[22px] text-line2 shrink-0">·</span>`, 'Nobody asked, nothing on')
        ].join(''));

      /* Stated plainly on the page, not buried in a tooltip. Without it the
         grid reads as "43 towns nobody wants", which is not what the data
         says — it says nobody named them, and a parent who skipped the
         question is shown every town anyway. */
      const skipped = noTownPref();
      const caveat = `<div class="flex items-start gap-[0.6rem] px-5 pb-5 -mt-1">
        ${icon('shield', 15, 'shrink-0 mt-[2px] text-muted')}
        <p class="text-[0.83rem] text-muted leading-[1.6] max-w-[80ch]">
          Town is an <b class="text-head">optional</b> question at signup — parents pick the towns they would travel to and it becomes their default filter on Directory and Events.
          ${skipped ? `<b class="text-head">${skipped}</b> of ${PARENTS.length} parents skipped it and are shown every town.` : `All ${PARENTS.length} parents answered it.`}
          A town with none picked has not been rejected, only unnamed.
        </p>
      </div>`;

      /* The two tables are a pair and were not reading as one. Numbering them
         and naming the split — WHERE, then WHAT — is what makes the second
         table obviously the follow-up to the first rather than a repeat of it. */
      const step = (n, label) =>
        `<span class="inline-flex items-center gap-[0.45rem] shrink-0">
          <span class="w-[22px] h-[22px] rounded-full bg-grass-ink text-white inline-flex items-center justify-center font-black text-[0.72rem] shrink-0">${n}</span>
          <span class="${C.eyebrow}">${label}</span>
        </span>`;

      return `<div class="grid gap-5">
        ${statLine}
        ${miniStats(stats)}
        ${panel('Coverage across all ' + TOWNS.length + ' Bergen County towns',
        `<span class="text-[0.85rem] text-muted">${covered.length} with events · ${gaps.length} with none</span>`,
        gridHint + grid + caveat)}

        <div class="flex items-center gap-3 flex-wrap -mb-1">
          ${step(1, 'Where')}
          <span class="text-[0.85rem] text-muted">Find the towns that need something</span>
        </div>
        ${panel('Towns with nothing on', `<span class="text-[0.85rem] text-muted">${gaps.length} of ${TOWNS.length} towns</span>`, gapHint + gapTable)}

        <div class="flex items-center gap-3 flex-wrap -mb-1">
          ${step(2, 'What')}
          <span class="text-[0.85rem] text-muted">Then decide what to put on there</span>
        </div>
        ${panel('What is missing, by category', `<span class="text-[0.85rem] text-muted">${matrixTowns.length} towns × ${CATEGORIES.length} categories</span>`, matrixHint + matrix)}
      </div>`;
    }

    /* The records behind the "Would travel here" number. The count on its own
       is a dead end — the useful next question is always "which families?",
       and from there "show me that account". */
    function townParentsDrawer(town) {
      const t = townStats().find(x => x.town === town);
      const people = PARENTS.filter(p => (p.towns || []).includes(town));
      const missing = t ? t.wants.filter(c => !t.served.includes(c)) : [];

      const body = people.length ? `
        <div class="flex flex-col gap-[0.45rem]">
          ${people.map(p => {
        // Which of THIS parent's categories have nothing on in this town.
        const gaps = (p.cats || []).filter(c => missing.includes(c));
        return `<button class="w-full text-left flex items-start gap-[0.7rem] p-[0.7rem] rounded-[12px] border-[1.5px] border-line2 bg-surface-2 transition-all duration-150 hover:border-head hover:bg-surface hover:-translate-y-px hover:shadow-[var(--sh-1)] group"
              data-act="drawer-parent" data-id="${p.id}">
              ${avatar(p.name, 38, p.photo)}
              <span class="min-w-0 flex-1">
                <span class="flex items-center gap-2 flex-wrap">
                  <span class="font-bold text-[0.93rem] text-head leading-tight">${esc(p.name)}</span>
                  ${p.status === 'blocked' ? pill('red', 'Blocked', 'ban') : ''}
                </span>
                <span class="block text-[0.8rem] text-muted leading-[1.4] mt-[0.05rem] break-all">${esc(p.email)}</span>
                <span class="flex flex-wrap items-center gap-x-[0.4rem] text-[0.76rem] text-adlabel font-semibold mt-[0.3rem]">
                  <span>${esc(p.town)}</span><span class="text-line2">·</span>
                  <span>${p.kids} ${p.kids === 1 ? 'child' : 'children'}</span><span class="text-line2">·</span>
                  <span>${(p.towns || []).length} towns</span>
                </span>
                ${gaps.length ? `<span class="flex flex-wrap items-center gap-[0.25rem] mt-[0.4rem]">
                  <span class="text-[0.7rem] font-bold text-danger-t uppercase tracking-[0.05em] mr-[0.15rem]">Nothing on:</span>
                  ${gaps.map(c => catPill(c)).join('')}</span>` : ''}
              </span>
              <span class="text-muted shrink-0 self-center transition-transform duration-150 group-hover:translate-x-[3px]">${icon('chev-right', 15)}</span>
            </button>`;
      }).join('')}
        </div>
        <p class="text-[0.8rem] text-muted leading-[1.55] mt-[1.15rem] pt-[1.15rem] border-t border-t-line2">
          These parents picked <b class="text-head">${esc(town)}</b> at signup, so it is part of their default filter on Directory and Events. Open an account to see or change their preferences.
        </p>`
        : `<div class="flex flex-col items-center gap-2 text-muted py-10 text-center">
            <span class="w-[52px] h-[52px] rounded-[14px] bg-surface-3 inline-flex items-center justify-center">${icon('users', 24)}</span>
            <div class="font-bold text-head">Nobody picked this town</div>
            <div class="text-[0.88rem] max-w-[280px]">Parents who skip the town question are shown every town, so this does not mean nobody would go.</div>
          </div>`;

      drawer(town, `${people.length} ${people.length === 1 ? 'parent' : 'parents'} would travel here`, body, { w: '460px' });
    }

    /* One town's full picture, opened from a grid tile. */
    function townDetail(town) {
      const t = townStats().find(x => x.town === town);
      const wouldTravel = PARENTS.filter(p => (p.towns || []).includes(town));
      const events = EVENTS.filter(e => e.town === town && e.status === 'published');
      const ads = ADS.filter(a => (a.towns || []).includes(town) && a.status === 'live');
      const missing = t.wants.filter(c => !t.served.includes(c));
      const [bg, fg] = TOWN_STATE[t.state][0].split('|');

      /* Sections were running into each other: 20px between a heading and the
         block above it is not enough separation when four of them stack, so
         the whole drawer read as one undifferentiated column. Headings now get
         real air above, a count chip so the section is scannable without
         reading it, and a hairline to close the section off. */
      /* Spacing is a compromise, and it was wrong in both directions before:
         p-2 rows were congested, then the fix over-corrected and a town with
         several parents and events needed constant scrolling. These values sit
         between the two — the hairline and the heading still separate the
         sections, but a full drawer now shows roughly a third more before you
         have to scroll. */
      const section = (title, n, items, empty) => `
        <div class="mt-[1.15rem] pt-[1.15rem] border-t border-t-line2 first:mt-0 first:pt-0 first:border-t-0">
          <div class="flex items-center gap-2 mb-[0.55rem]">
            <span class="text-[0.72rem] font-bold tracking-[0.09em] uppercase text-adlabel">${title}</span>
            ${n ? `<span class="text-[0.68rem] font-black text-muted bg-surface-3 rounded-[100px] px-[0.4rem] py-[0.1rem] leading-none">${n}</span>` : ''}
          </div>
          ${items.length ? `<div class="flex flex-col gap-[0.4rem]">${items.join('')}</div>`
          : `<p class="text-[0.85rem] text-muted leading-[1.55]">${empty}</p>`}
        </div>`;

      /* One row shape for all three lists, so events and ads sit on the same
         grid as parents rather than each being hand-spaced. */
      const row = (thumb, title, sub, act) => {
        const inner = `${thumb}
          <span class="min-w-0 flex-1">
            <span class="block font-bold text-[0.9rem] text-head leading-[1.3]">${title}</span>
            <span class="block text-[0.8rem] text-muted leading-[1.45] mt-[0.1rem]">${sub}</span>
          </span>
          ${act ? `<span class="text-muted shrink-0 self-center transition-transform duration-150 group-hover:translate-x-[3px]">${icon('chev-right', 15)}</span>` : ''}`;
        return act
          ? `<button class="w-full text-left flex items-start gap-[0.65rem] p-[0.6rem] rounded-[12px] border-[1.5px] border-line2 bg-surface-2 transition-all duration-150 hover:border-head hover:bg-surface hover:shadow-[var(--sh-1)] group" ${act}>${inner}</button>`
          : `<div class="flex items-start gap-[0.65rem] p-[0.6rem] rounded-[12px] border-[1.5px] border-line2 bg-surface-2">${inner}</div>`;
      };

      /* A drawer, not a modal: this is a drill-down into a row you are still
         reading, so the grid should stay visible behind it rather than being
         covered by a box in the middle of the screen. Same treatment as the
         parents list, so both drill-downs behave identically.

         Stats go 2×2 rather than 1×4 — a drawer is narrow, and four columns
         inside 480px wraps "Categories picked" onto three lines. */
      drawer(town, TOWN_STATE[t.state][1], `
        <!-- The drawer header already carries the town and its state label, so
             this says what that state MEANS rather than repeating the name. -->
        <div class="flex items-start gap-[0.6rem] p-[0.7rem] rounded-[12px] tint" style="--chip-bg:${bg};--chip-fg:${fg}">
          <span class="shrink-0 mt-[1px]">${icon('pin', 16)}</span>
          <p class="text-[0.85rem] font-semibold leading-[1.45]">${TOWN_STATE[t.state][2]}</p>
        </div>

        <div class="grid grid-cols-2 gap-[0.5rem] mt-[0.7rem]">
          ${[['Would travel', t.demand, 'users'], ['Events on', t.events, 'calendar'], ['Ads targeting', t.ads, 'megaphone'], ['Categories picked', t.wants.length, 'tag']]
          .map(([l, v, ic]) => `<div class="rounded-[12px] border-[1.5px] border-line2 bg-surface-2 px-[0.7rem] py-[0.55rem] flex items-center gap-[0.6rem]">
            <span class="w-[30px] h-[30px] rounded-[9px] bg-surface text-brand inline-flex items-center justify-center shrink-0 border border-line2">${icon(ic, 15)}</span>
            <span class="min-w-0">
              <span class="block font-serif text-[1.15rem] font-black text-head leading-none">${v}</span>
              <span class="block text-[0.72rem] text-muted font-semibold mt-[0.2rem] leading-tight">${l}</span>
            </span>
          </div>`).join('')}
        </div>

        ${missing.length ? `<div class="flex items-start gap-[0.6rem] p-[0.7rem] rounded-[12px] bg-red-bg border-[1.5px] border-line2 mt-[0.7rem]">
          ${icon('declining', 15, 'shrink-0 mt-[2px] text-danger-t')}
          <div class="text-[0.85rem] leading-[1.45] min-w-0">
            <div class="font-bold text-head">Picked here, nothing scheduled</div>
            <div class="flex flex-wrap gap-[0.3rem] mt-[0.45rem]">${missing.map(c => catPill(c)).join('')}</div>
          </div>
        </div>` : ''}

        <div class="mt-[1.15rem]">
        <!-- Same drill-down as the table: these rows open the parent account. -->
        ${section('Parents who would travel here', wouldTravel.length,
            wouldTravel.map(p => row(
              avatar(p.name, 34, p.photo),
              esc(p.name),
              /* Chips, not a truncated sentence — "Music & Dan…" told you nothing. */
              `<span class="flex flex-wrap gap-[0.25rem] mt-[0.25rem]">${(p.cats || []).map(c => catPill(c)).join('')}</span>`,
              `data-act="drawer-parent" data-id="${p.id}"`)),
            'No parent picked this town at signup. Parents who skip the question see every town.')}

        ${section('Published events', events.length,
              events.map(e => row(
                photoTile('w-[34px] h-[34px] rounded-[10px]', catOf(e.cat).tint, e.icon, 16, e.img),
                esc(e.name),
                `${fmtDate(e.date)} · ${e.time} · ${esc(e.organizer)}`)),
              'No events are scheduled here.')}

        ${section('Ads targeting this town', ads.length,
                ads.map(a => row(
                  adThumb(a, 'w-[50px] h-[34px] rounded-[9px]'),
                  esc(a.name),
                  `${esc(advOf(a.advertiser).company)} · ${adTypeOf(a.type).short}`)),
                'No advertiser is targeting this town.')}
        </div>
      `, {
        w: '520px',
        footer: `<button class="${C.btnSm} ${C.ghost}" data-close="1">Close</button>
