  <script>
    // Tailwind is precompiled and inlined above; no runtime config needed.


    // The theme has to land on <html> before the first paint, otherwise the
    // console renders light and then snaps to dark. Runs in <head>, ahead of
    // any markup, and deliberately does not wait for the main script. Shares
    // the `bk-theme` key with the public site, so an admin who picked dark
    // there lands in dark here.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('bk-theme'); } catch (e) { /* private mode */ }
      var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <style>
    /* ── Colour tokens ──────────────────────────────────────────
       Lifted verbatim from the public site so the console and the site are
       one system. Split by ROLE, not by hue, because several hues do double
       duty: navy is both a button fill (white text on it) and heading text,
       grass-ink is both a button fill and link text. A single token cannot
       invert for both — a fill must stay dark enough for white text while
       text must go light. So fills keep their hue token (--navy,
       --grass-ink) and never invert; the text/border roles moved to --head
       and --brand, which do.

       Anything painted on a permanently dark surface (the sidebar, toasts,
       the login photo panel) is fixed too: --sun, --mint-2, --on-dark-*,
       and every bare `text-white` in the markup.

       Light values are byte-identical to what the site ships, so light mode
       renders exactly as the public site does. */
    :root {
      color-scheme: light;
      /* fills — never invert (white text sits on these) */
      --navy: #1a2e4a;
      --grass-ink: #20643d;
      --sun: #f5a623;
      --orange: #e0550f;
      --orange-ink: #c2410c;
      --orange-deep: #9c3409;
      --lavender: #7b5ea7;
      --lavender-ink: #5c4382;
      --danger-ink: #a3271c;
      --teal: #1e8c7a;
      --mint-2: #d3ebde;
      /* surfaces — page, cards, and the recessed panels inside them */
      --cream: #fdf8f0;
      --surface: #ffffff;
      --surface-2: #fbfcfd;
      --surface-3: #f5f5f5;
      --surface-4: #f3f7f4;
      --surface-5: #e6ebf1;
      --sel: #e7f0fd;
      /* text + lines on those surfaces */
      --head: #1a2e4a;
      --text: #12233a;
      --ad-label: #4e5f72;
      --line: rgba(26, 46, 74, 0.14);
      --line2: rgba(26, 46, 74, 0.1);
      /* accents on those surfaces */
      --brand: #20643d;
      --grass: #2d7a4f;
      --teal-ink: #14685a;
      --star: #bd7400;
      --muted: #465569;
      --mint: #e3f2e9;
      /* on permanently dark surfaces */
      --on-dark: #ffffff;
      --on-dark-2: rgba(255, 255, 255, 0.88);
      --on-dark-3: rgba(255, 255, 255, 0.72);

         The sidebar is a permanently dark slab in both themes, so it is a

         page, not lighter, or the navigation reads as the brightest thing on

      --nav: #1a2e4a;

      --nav-item: rgba(255, 255, 255, 0.13);
      --nav-item-hover: rgba(255, 255, 255, 0.09);
      /* status tints — the pill and soft-chip palette */
      --amber-bg: #fdeed5;
      --amber-ink: #8a5200;
      --red-bg: #fbe4e1;

      --teal-bg: #ddf1ec;
      --navy-bg: #e2e8ef;
      /* Red and lavender each do double duty: a button fill with white text
         on it, and text/border on a surface. One token cannot serve both once
         the page goes dark — the fill has to stay dark enough for white while
         the text has to go light. So the fill keeps --danger-ink / --lavender-ink
         and never inverts; these are the text roles, and they do. */
      --danger-text: #a3271c;
      --lav-text: #5c4382;
      /* elevation — one scale, so a card and a popover agree */
      --sh-1: 0 2px 14px rgba(26, 46, 74, 0.05);
      --sh-2: 0 10px 30px rgba(15, 26, 44, 0.08);
      --sh-3: 0 24px 70px rgba(26, 46, 74, 0.22);
      --sh-brand: 0 4px 18px rgba(32, 100, 61, 0.28);
      --sh-brand-hi: 0 8px 26px rgba(32, 100, 61, 0.38);
      /* Two typefaces, the same pairing the public site uses: Inter carries the
         body and every piece of UI, and a Georgia-based serif carries the
         display headings. The fallbacks are host OS defaults, so the console
         still reads correctly if the webfont is blocked or slow. */
      --font:
        "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
        Arial, sans-serif;
      --font-display: Georgia, "Times New Roman", Times, serif;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      /* Fills lift slightly so they still read as buttons against a dark
         page, while keeping white text above 4.5:1. */
      --navy: #26405f;
      --grass-ink: #2a7d4e;
      --cream: #10151c;
      --surface: #181f29;
      /* Recessed panels invert their relationship: on light they sit below
         the card, on dark they sit above it, which is what makes an input
         read as an input. */
      --surface-2: #212a36;
      --surface-3: #2a3441;
      --surface-4: #17251d;
      --surface-5: #232d3b;
      --sel: #1c3350;
      --head: #eaf0f7;
      --text: #dde5ef;
      /* Both carry long runs of SMALL text — table column heads at 0.72rem
         all-caps, chart tick labels at 0.68rem, table sub-lines at 0.78rem.
         The site's values were tuned for paragraph copy at 1rem on a page
         that is mostly prose; at half that size, tracked and uppercase, the
         same greys land around 6:1 and read as a smudge even though they
         pass AA. Both are lifted to ~9:1 on the surface they actually sit
         on — column heads sit on --surface-2, not --surface, which is why
         --ad-label has to go further than --muted. */
      --ad-label: #c0cdde;
      --line: rgba(255, 255, 255, 0.14);
      --line2: rgba(255, 255, 255, 0.08);
      /* Also the "Active" pill ink on --mint and every inline link, both of
         which were sitting near 6.5:1 at 12px. */
      --brand: #7fd3a0;
      --grass: #6cc48f;
      --teal-ink: #66d7c0;
      --star: #f0b429;
      --muted: #b6c3d4;
      --mint: #183322;
      /* Sits just above the page rather than far below it — a navy slab at
         its light value would out-glow every card on the screen. */
      --nav: #141b25;
      --nav-glow: rgba(45, 122, 79, 0.3);
      --nav-item: rgba(255, 255, 255, 0.11);
      --nav-item-hover: rgba(255, 255, 255, 0.07);
      /* Status tints become low-luminance washes of the same hues; their
         ink lightens to sit on them. */
      --amber-bg: #3a2c12;
      --amber-ink: #f0b429;
      --red-bg: #3a1c18;
      --lav-bg: #2a2140;
      --teal-bg: #123330;
      --navy-bg: #22303f;
      /* Lifted well clear of their own tint: 7:1 on the pill, 7.5:1 on a
         card. At the light values these read as 2.1:1 — a "Blocked" badge
         you had to hunt for. */
      --danger-text: #ff8f80;
      --lav-text: #c9b4f0;
      --sh-1: 0 2px 14px rgba(0, 0, 0, 0.4);
      --sh-2: 0 10px 30px rgba(0, 0, 0, 0.45);
      --sh-3: 0 24px 70px rgba(0, 0, 0, 0.6);
      --sh-brand: 0 4px 18px rgba(0, 0, 0, 0.45);
      --sh-brand-hi: 0 8px 26px rgba(0, 0, 0, 0.55);
    }

    *,
    ::before,
    ::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border-width: 0;
      border-style: solid;
      border-color: currentColor
    }

    html {
      -webkit-text-size-adjust: 100%;
      /* Firefox */
      scrollbar-color: var(--grass) var(--cream);
      scrollbar-width: thin;
    }

    /* WebKit / Chromium. Track picks up the page cream, thumb the brand
       green — same treatment as the public site. */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      background: var(--cream);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--grass);
      border-radius: 100px;
      border: 3px solid var(--cream);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--grass-ink);
    }

    ::-webkit-scrollbar-corner {
      background: var(--cream);
    }

    body {
      font-family: var(--font);
      background: var(--cream);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility
    }

    /* Display type, matched to the public site: Georgia at regular weight with
       a tightened track, never synthetically bolded. The markup asks for
       font-black on most headings and Georgia ships no 900, so the browser was
       left to fake one — thick, smeared strokes. Repeating the class beats the
       utility on specificity without reaching for !important, and an explicit
       `font-bold` (a real Georgia weight) still outranks it. */
    .font-serif.font-serif {
      font-weight: 400;
      letter-spacing: -0.02em
    }

    .font-serif.font-bold.font-bold {
      font-weight: 700
    }

    a {
      color: inherit;
      text-decoration: none
    }

    button {
      font-family: inherit;
      cursor: pointer;
      background: none
    }

    input,
    select,
    textarea {
      font-family: inherit
    }

    ::selection {
      background: var(--sun);
      color: var(--head)
    }

    :focus-visible {
      outline: 3px solid var(--grass-ink);
      outline-offset: 2px;
      border-radius: 6px
    }

    /* Chromium matches :focus-visible on a text field even when it was clicked
       rather than tabbed to, so the ring above was drawing a hard rectangle on
       top of every input the moment it was touched. Fields already show focus
       their own way — the border turns green and a soft halo comes up on the
       wrapper — so they opt out of the global ring. Buttons and links keep it,
       which is who it was for. */
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: none
    }

    img,
    svg {
      max-width: 100%
    }

    .no-scrollbar {
      scrollbar-width: none
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none
    }

    /* The option list is drawn by the OS, not the page, and it takes its
       colours from the control. Every select here is transparent so it can
       sit inside a bordered field wrapper, and from a transparent control
       Chrome paints a light list — near-white text on white on a dark page.
       Pin both ends; in light mode these resolve to what already shipped. */
    select option,
    select optgroup {
      background-color: var(--surface);
      color: var(--text);
    }

    /* The date picker's own glyph is a black bitmap, invisible on a dark
       field. Inverting is the only hook the shadow DOM exposes. */
    [data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1) opacity(0.7);
    }

    /* ── Coloured tint chips ────────────────────────────────────
       Nav icons, KPI badges and avatars carry a per-category pastel fill
       with a saturated ink on it — authored in JS as a `bg|fg` pair and
       written to inline style. A pastel is the brightest thing on a dark
       page, so on dark the pair is re-mixed from the SAME ink: a low
       luminance wash of it for the fill, a lightened version for the glyph.
       One rule covers every chip, so a new category needs no dark values. */
    .tint {
      background: var(--chip-bg);
      color: var(--chip-fg);
    }

    /* The inks are authored for a white page — several (#20643d, #1a2e4a)
       are dark enough that tinting toward black leaves a chip you cannot
       find. Mixing keeps the hue but bleeds the chroma out with it, so the
       fallback below is only that: a fallback.

       What actually carries these is relative colour — take the ink's HUE
       and re-state saturation and lightness outright. Every chip then lands
       at the same weight and stays fully saturated whatever hue it began
       as, which is what makes the row read as a set. */
    [data-theme="dark"] .tint {
      background: color-mix(in srgb, var(--chip-fg) 32%, #0b1017);
      color: color-mix(in srgb, var(--chip-fg) 28%, #ffffff);
    }

    /* Category tints are single pastels with no paired ink — but a pastel
       still carries its hue, so the same treatment works on them. */
    [data-theme="dark"] .cat-tint {
      background: color-mix(in srgb, var(--cat) 24%, #0b1017) !important;
      color: color-mix(in srgb, var(--cat) 90%, #ffffff) !important;
      border-color: var(--line);
    }

    @supports (color: hsl(from white h s l)) {
      [data-theme="dark"] .tint {
        background: hsl(from var(--chip-fg) h 58% 19%);
        color: hsl(from var(--chip-fg) h 90% 72%);
      }

      /* Pastels start near-grey, so their saturation is restated harder than
         the inks' — otherwise a category chip reads as a smudge. */
      [data-theme="dark"] .cat-tint {
        background: hsl(from var(--cat) h 45% 18%) !important;
        color: hsl(from var(--cat) h 78% 74%) !important;
      }
    }

    /* ── Drag to reorder ────────────────────────────────────────
       Rows carrying data-drag-id can be dragged into a new position. The
       insertion point is drawn as a rule along the row edge you would drop
       against — a full row-height placeholder would reflow the table under
       the cursor mid-gesture. Painted with inset shadows rather than a
       border so no row changes height as the indicator moves. */
    tr[data-drag-id] {
      cursor: grab;
    }

    tr[data-drag-id]:active {
      cursor: grabbing;
    }

    tr.is-dragging {
      opacity: 0.4;
    }

    tr.drop-above td {
      box-shadow: inset 0 3px 0 0 var(--brand);
    }

    tr.drop-below td {
      box-shadow: inset 0 -3px 0 0 var(--brand);
    }

    /* The handle only signals "this is draggable"; the whole row is the drag
       source, so the grip takes no pointer events of its own. */
    .grip {
      color: var(--ad-label);
      opacity: 0.45;
      transition: opacity 0.15s ease, color 0.15s ease;
      pointer-events: none;
    }

    tr:hover .grip {
      opacity: 1;
      color: var(--brand);
    }

    /* ── Scroll reveal ──────────────────────────────────────────
       Panels play an entrance as they scroll into view, same language as the
       public site. JS adds .rv (armed, hidden) then .rv-in (playing), and
       strips both once the animation ends — so the element is left with its
       own styles and its hover transform still works. */
    .rv {
      opacity: 0;
    }

    .rv-in {
      animation: rvUp 0.6s cubic-bezier(0.22, 0.68, 0.3, 1) var(--rv-delay, 0s) both;
    }

    @keyframes rvUp {
      from {
        opacity: 0;
        transform: translate3d(0, 22px, 0);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ── Theme toggle ───────────────────────────────────────────
       One button, two icons: the visible one is whichever theme you would
       switch TO. Both ship in the markup so the swap is a class flip with
       no re-render. */
    .theme-toggle [data-icon-dark],
    [data-theme="dark"] .theme-toggle [data-icon-light] {
      display: none;
    }

    [data-theme="dark"] .theme-toggle [data-icon-dark] {
      display: block;
    }

    /* ── Login decor ────────────────────────────────────────────
       The same playful shapes the site's hero uses, tucked behind the login
       card. Purely decorative, no pointer events, frozen by the global
       reduced-motion rule. */
    .auth-shell {
      background:
        radial-gradient(115% 85% at 92% 4%, rgba(45, 122, 79, 0.22) 0%, rgba(45, 122, 79, 0) 58%),
        radial-gradient(85% 80% at 0% 92%, rgba(245, 166, 35, 0.26) 0%, rgba(245, 166, 35, 0) 62%),
        linear-gradient(150deg, #fdf8f0 0%, #fefcf7 48%, #f4f9f4 100%);
    }

    [data-theme="dark"] .auth-shell {
      background:
        radial-gradient(115% 85% at 92% 4%, rgba(45, 122, 79, 0.3) 0%, rgba(45, 122, 79, 0) 58%),
        radial-gradient(85% 80% at 0% 92%, rgba(245, 166, 35, 0.16) 0%, rgba(245, 166, 35, 0) 62%),
        linear-gradient(150deg, #141b24 0%, #10151c 48%, #111e18 100%);
    }

    .auth-decor {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .auth-decor>* {
      position: absolute;
    }

    .auth-ring {
      width: 168px;
      height: 168px;
      border-radius: 50%;
      border: 2px dashed rgba(30, 140, 122, 0.4);
      right: -46px;
      top: 14%;
      animation: heroSpin 26s linear infinite;
    }

    .auth-dots {
      width: 128px;
      height: 96px;
      left: -18px;
      bottom: 16%;
      background-image: radial-gradient(rgba(26, 46, 74, 0.16) 2.1px, transparent 2.2px);
      background-size: 15px 15px;
    }

    [data-theme="dark"] .auth-dots {
      background-image: radial-gradient(rgba(255, 255, 255, 0.18) 2.1px, transparent 2.2px);
    }

    .auth-pop {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(124, 92, 168, 0.5);
      left: 12%;
      top: 12%;
      animation: heroFloat 5s ease-in-out infinite;
    }

    .auth-blob {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      right: 8%;
      bottom: -70px;
      background: radial-gradient(circle at 32% 30%, rgba(245, 166, 35, 0.34), rgba(245, 166, 35, 0) 70%);
      animation: heroFloat 9s ease-in-out infinite 0.4s;
    }

    @keyframes heroFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes heroSpin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Footer bubbles ───────────────────────────────────────────────────
       Small tinted discs carrying the category icons, drifting up and fading
       out behind the footer text. The console is for a children's platform;
       this is the one place it can say so without getting in the way of the
       work.

       Every bubble is given a NEGATIVE animation-delay in the markup, which
       starts it part-way through its cycle. Two reasons: the row looks alive
       immediately rather than all rising together from nothing, and because
       render() rebuilds #root constantly, each remount puts every bubble back
       at exactly the same phase instead of at a random one. */
    /* The layer lives OUTSIDE #root and is mounted exactly once. render()
       replaces #root's innerHTML on every keystroke, filter change and theme
       flip — rebuilding the bubbles there would restart twenty animations mid
       flight every time you typed a character.

       z-index 0 on a fixed element paints above the canvas background (body's
       cream propagates to the canvas because html has none) but below the app
       shell, which is lifted to z-1. So the bubbles drift behind every card
       and show through the gutters. */
    #bubble-root {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* Signed in, the sidebar is a solid slab — the bubbles start after it so
       none are wasted underneath. Below 1024px it goes off-canvas, so the
       layer reclaims the full width. */
    #bubble-root.bk-app {
      left: 268px;
    }

    @media (max-width:1024px) {
      #bubble-root.bk-app {
        left: 0;
      }
    }

    .bk-bubble {
      position: absolute;
      bottom: -70px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity;
      /* A hairline of the bubble's own ink, so a pale tint still reads as a
         disc against the cream page instead of dissolving into it. */
      box-shadow: inset 0 0 0 1.5px color-mix(in srgb, currentColor 22%, transparent);
      animation: bkBubble linear infinite;
    }

    @keyframes bkBubble {
      0% {
        transform: translate3d(0, 0, 0) scale(.72) rotate(-8deg);
        opacity: 0;
      }

      8% {
        opacity: .55;
      }

      82% {
        opacity: .4;
      }

      100% {
        transform: translate3d(var(--drift, 14px), calc(-100vh - 120px), 0) scale(1.06) rotate(12deg);
        opacity: 0;
      }
    }

    /* The one thing on the layer that answers back. Only the discs take the
       pointer — the layer around them stays transparent to it — so a bubble
       is clickable exactly where it is drawn and nowhere else. */
    .bk-bubble {
      pointer-events: auto;
    }

    /* The cursor cannot live on .bk-bubble. On the sign-in screen the discs
       are the top of the stack and it would work, but signed in they drift
       UNDER the shell: the element the mouse is really over is whatever
       transparent layout box happens to be on top, and that is the one that
       has to carry the cursor. `cursor` inherits, so stamping the answer on
       <html> reaches every case from a single rule. */
    html.bk-pointing {
      cursor: pointer;
    }

    /* ── Popping a bubble ─────────────────────────────────────────────────
       The burst is not the bubble animating: the disc is swapped out and a
       throwaway rig is dropped at the same point in a layer of its own. That
       keeps it above whatever the bubble was drifting behind, and it can be
       binned wholesale when it finishes rather than unwound.

       z-60 clears the app shell and the sidebar but stays under the modal and
       drawer (90–92), so nothing bursts across an open dialog. */
    #pop-root {
      position: fixed;
      inset: 0;
      z-index: 60;
      overflow: hidden;
      pointer-events: none;
    }

    /* The rig is a zero-size POINT at the centre of the disc that broke, not
       a box over it. Every piece is centred on that point and sized from
       --s, the diameter it inherited — which also means `.tint` can sit on
       the rig, handing its children the theme-corrected ink, without
       painting anything itself. */
    .bk-burst {
      position: absolute;
      width: 0;
      height: 0;
    }

    .bk-burst>* {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--s);
      height: var(--s);
      margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
      border-radius: 999px;
      will-change: transform, opacity;
    }

    /* Each shard is the whole disc clipped down to one wedge of it, so the
       nine of them start out as the intact bubble — the break is legible
       because the pieces were visibly a circle a frame earlier. The 12%
       stop swells it first: the disc strains, then gives.

       Opacity is held to 62% rather than fading with the flight. The ease is
       steep, so a straight 1→0 spends most of the animation at almost
       nothing and the shards are gone before they have travelled anywhere —
       the pieces have to still be there while they are moving. */
    .bk-shard {
      box-shadow: inset 0 0 0 1.5px color-mix(in srgb, currentColor 22%, transparent);
      animation: bkShard 760ms cubic-bezier(.16, .78, .3, 1) forwards;
    }

    @keyframes bkShard {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        opacity: 1;
      }

      12% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1.12);
        opacity: 1;
      }

      62% {
        opacity: .92;
      }

      100% {
        transform: translate3d(var(--tx), var(--ty), 0) rotate(var(--rot)) scale(.34);
        opacity: 0;
      }
    }

    /* One soft ring of the bubble's own tint pushing out past the shards, so
       the burst has a shape of its own and not just debris. */
    .bk-wave {
      box-shadow: inset 0 0 0 2px color-mix(in srgb, currentColor 50%, transparent);
      animation: bkWave 620ms cubic-bezier(.2, .72, .3, 1) forwards;
    }

    @keyframes bkWave {
      0% {
        transform: scale(.7);
        opacity: .5;
      }

      55% {
        opacity: .34;
      }

      100% {
        transform: scale(2.5);
        opacity: 0;
      }
    }

    /* Dust: thrown further than the shards and outliving them, which is what
       stops the whole thing landing on a single hard beat. */
    .bk-spark {
      animation: bkSpark 720ms cubic-bezier(.1, .72, .25, 1) forwards;
    }

    @keyframes bkSpark {
      0% {
        transform: translate3d(0, 0, 0) scale(1);
        opacity: .95;
      }

      70% {
        opacity: .75;
      }

      100% {
        transform: translate3d(var(--tx), var(--ty), 0) scale(.2);
        opacity: 0;
      }
    }

    /* The category glyph is the one piece that does not shatter — it lifts
       out of the wreckage and fades, so what popped stays readable. */
    .bk-glyph {
      display: grid;
      place-items: center;
      animation: bkGlyph 660ms ease-out forwards;
    }

    @keyframes bkGlyph {
      0% {
        transform: scale(1) rotate(0deg);
        opacity: .9;
      }

      58% {
        opacity: .7;
      }

      100% {
        transform: scale(2.1) rotate(14deg);
        opacity: 0;
      }
    }

    /* The footer keeps its own reduced-motion rule: the global one above sets
       iteration-count to 1, which would leave every bubble frozen mid-screen
       at opacity 0 rather than simply absent. */
    @media (prefers-reduced-motion:reduce) {

      .bk-bubble,
      #pop-root {
        display: none;
      }
    }

    /* A brand-green sweep across the sign-in button while it is working. */
    @keyframes btnSweep {
      to {
        transform: translateX(220%);
      }
    }

    .btn-sweep::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -60%;
      width: 45%;
      transform: translateX(0);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
      pointer-events: none;
    }

    .btn-sweep:hover::after {
      animation: btnSweep 0.75s ease;
    }

    /* Toast progress bar — depletes over the toast's life, so the dismissal
       is never a surprise. Matches the public site's toast exactly. */
    @keyframes toastBar {
      to {
        transform: scaleX(0);
      }
    }

    .toast-bar {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 2px;
      width: 100%;
      transform-origin: left;
      background: linear-gradient(90deg, var(--sun), #7ee0b0);
      animation: toastBar 2.6s linear forwards;
    }

    /* Rich-text surface. Tailwind's reset strips heading and list styling, so
       the editable area and the preview restate it — otherwise an admin types
       a heading and sees no change. Both share the class so what you edit is
       what you preview. */
    .rte {
      color: var(--text);
      font-size: .95rem;
      line-height: 1.75
    }

    .rte h2 {
      font-family: var(--font);
      color: var(--head);
      font-size: 1.15rem;
      /* 700 is the heaviest Inter weight now loaded — 800 would be faked. */
      font-weight: 700;
      letter-spacing: -.01em;
      margin: 1.4em 0 .5em
    }

    .rte h2:first-child {
      margin-top: 0
    }

    .rte h3 {
      color: var(--head);
      font-size: 1rem;
      font-weight: 700;
      margin: 1.2em 0 .4em
    }

    .rte p {
      margin: 0 0 .85em
    }

    .rte ul,
    .rte ol {
      margin: 0 0 .95em;
      padding-left: 1.35em

      }

  <div id="root"></div>
  <div id="modal-root"></div>
  <!-- Its own mount, deliberately outside #root: render() replaces #root's
       innerHTML, and a search field living inside that would be destroyed and
       rebuilt as you typed, losing focus and the caret. Out here the command
       menu owns its own lifecycle. -->
  <div id="cmd-root"></div>
  <!-- Side drawer. Its own mount for the same reason: it has to survive the
       render() that fires when a row inside it navigates. -->
  <div id="drawer-root"></div>
  <!-- Ambient background. Filled once at startup and never rebuilt. -->
  <div id="bubble-root" aria-hidden="true"></div>
  <!-- Where a popped bubble comes apart. Above the shell the ambient layer
       sits behind, so the burst is visible wherever the disc was. -->
  <div id="pop-root" aria-hidden="true"></div>
  <!-- Top centre, clear of the sticky topbar, and above every overlay so a
       modal flow can still confirm — same placement as the public site. -->
  <div id="toast-root"
    class="fixed top-[88px] left-1/2 -translate-x-1/2 z-[2000] flex flex-col gap-[0.55rem] items-center pointer-events-none max700:left-3 max700:right-3 max700:top-[74px] max700:translate-x-0 max700:items-stretch">
  </div>

  <script>
    /* ═══════════════ HELPERS ═══════════════ */
    const el = (id) => document.getElementById(id);
    const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
    const ICON_BASE = 'inline-block align-middle shrink-0 [stroke-linecap:round] [stroke-linejoin:round] [stroke-width:1.9]';
    function icon(name, size = 18, cls = '') {
      const solid = cls.includes('solid');
      const extra = cls.replace('solid', '').trim();
      const paint = solid ? 'fill-current stroke-none' : 'fill-none stroke-current';
      return `<svg class="${ICON_BASE} ${paint}${extra ? ' ' + extra : ''}" width="${size}" height="${size}"><use href="#ic-${name}"/></svg>`;
    }
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = (n) => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const num = (n) => Number(n).toLocaleString('en-US');
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const MONTHS_FULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const TODAY = new Date();
    const fmtDate = (iso) => { const d = new Date(iso + 'T00:00'); return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };

       Every Export button used to fire a toast and produce nothing. This
       writes a real file.

       Two details that are easy to skip and expensive to discover in front of
       a client: the BOM, because the copy is full of curly apostrophes and
       accents that Excel renders as mojibake without it; and RFC4180 quote
       doubling, because listing descriptions contain commas and quotes and an
       unescaped one silently shifts every later column. */
    function csvCell(v) {
      const s = v === null || v === undefined ? '' : String(v);
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    function downloadCSV(filename, cols, rows) {
      const lines = [cols.map(c => csvCell(c[0])).join(',')];
      rows.forEach(r => lines.push(cols.map(c => csvCell(c[1](r))).join(',')));
      const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);

       host or an offline demo degrades to the coloured monogram instead of

    const AV = ['#e3f2e9|#20643d', '#fdeed5|#8a5200', '#e2ebfa|#1a2e4a', '#f8e6ef|#a3277c', '#efe8f8|#5c4382', '#ddf1ec|#14685a', '#fbeee3|#a8501c', '#e7f0fd|#2d5a8e'];

    }

    /* Toasts match the public site's: a permanently dark glass slab with a

    function toast(msg, ic = 'check') {

    }

    function closeModal() { el('modal-root').innerHTML = ''; }
    function modal(title, body, footer, opts = {}) {
      el('modal-root').innerHTML = `
        <div class="fixed inset-0 bg-[rgba(9,15,26,0.6)] backdrop-blur-[3px] z-[90] flex items-center justify-center p-4 animate-fade" data-close="1">

            <div class="flex items-center justify-between gap-4 px-6 py-5 border-b-[1.5px] border-b-line2 sticky top-0 bg-surface rounded-t-[20px] z-[2]">
              <h3 class="font-serif font-black text-[1.25rem] text-head tracking-[-0.01em]">${title}</h3>
              <button class="${C.iconbtn}" data-close="1" aria-label="Close">${icon('x', 16)}</button>

      back.addEventListener('mousedown', e => { if (e.target.dataset.close) closeModal(); });

    }
    /* ── Side drawer ──────────────────────────────────────────────────────
       A modal is the wrong shape for "show me the records behind this
       number": you are drilling into a table, not interrupting it, and the
       table should stay visible behind you. The drawer slides in from the
       right, keeps the page in view, and closes back to exactly where you
       were.

       It sits at z-[92] — above a modal (90), so a drawer opened over one
       stacks correctly. */
    let drawerOpen = false;
    function closeDrawer() {
      if (!drawerOpen) return;
      drawerOpen = false;
      el('drawer-root').innerHTML = '';
    }
    function drawer(title, sub, body, opts = {}) {
      drawerOpen = true;
      el('drawer-root').innerHTML = `
        <div class="fixed inset-0 z-[92] bg-[rgba(9,15,26,0.5)] backdrop-blur-[2px] animate-fade" data-drawer-back></div>
        <aside class="fixed top-0 right-0 bottom-0 z-[93] w-[${opts.w || '420px'}] max-w-[calc(100vw-2rem)] bg-surface border-l-[1.5px] border-l-line2 shadow-[-18px_0_50px_rgba(9,15,26,0.22)] flex flex-col animate-slideInRight"
          role="dialog" aria-label="${esc(title)}">
          <div class="flex items-start justify-between gap-3 px-5 py-4 border-b-[1.5px] border-b-line2 shrink-0">
            <div class="min-w-0">
              <h3 class="font-serif font-black text-[1.15rem] text-head tracking-[-0.01em] truncate">${esc(title)}</h3>

       which is what repaints them. */
    function barChart(data, labels, color = tok('brand'), h = 170) {
      const max = Math.max(...data, 1);
      return `<div class="flex items-end gap-[6px] max700:gap-[3px]" style="height:${h}px">
        ${data.map((v, i) => `<div class="flex-1 flex flex-col items-center gap-[0.4rem] h-full justify-end" title="${labels[i]}: ${num(v)}">
          <div class="w-full max-w-[46px] rounded-t-[7px] rounded-b-[3px] origin-bottom animate-grow" style="height:${Math.max(3, (v / max) * (h - 28))}px;background:${i === data.length - 1 ? '#f5a623' : color};animation-delay:${i * 45}ms"></div>
          <span class="text-[0.68rem] font-bold text-adlabel">${labels[i]}</span>
        </div>`).join('')}
      </div>`;
    }
    function areaChart(data, color = tok('brand'), h = 150) {
      const w = 620, max = Math.max(...data) * 1.12 || 1, n = data.length;
      const pts = data.map((v, i) => [(i / (n - 1)) * w, h - (v / max) * (h - 12) - 6]);
      const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      const uid = 'g' + Math.abs(Math.round(data[0] * 7 + n));
      const last = pts[n - 1];
      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="w-full overflow-visible" style="height:${h}px">
        <defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity=".28"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${line} L ${w} ${h} L 0 ${h} Z" fill="url(#${uid})"/>
        <path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
        <circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="#f5a623" stroke="${tok('surface')}" stroke-width="2.5"/>
      </svg>`;
    }
    function donut(segs, size = 150) {
      const total = segs.reduce((a, s) => a + s.v, 0) || 1;
      const R = 54, CIRC = 2 * Math.PI * R;
      let off = 0;
      const arcs = segs.map(s => {
        const len = (s.v / total) * CIRC;
        const a = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${s.c}" stroke-width="13" stroke-dasharray="${len} ${CIRC - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
        off += len; return a;
      }).join('');
      return `<svg viewBox="0 0 120 120" width="${size}" height="${size}">${arcs}
        <!-- 700, not 900: an inline weight beats the .font-serif rule, and
             Georgia has no 900 for the browser to reach for. -->
        <text x="60" y="57" text-anchor="middle" class="font-serif" style="font-weight:700;font-size:19px;fill:${tok('head')}">${num(total)}</text>
        <text x="60" y="73" text-anchor="middle" style="font-weight:600;font-size:9px;fill:${tok('muted')};letter-spacing:.08em">TOTAL</text></svg>`;
    }
    function sparkline(data, color = tok('brand'), w = 92, h = 30) {
      const max = Math.max(...data), min = Math.min(...data), rng = (max - min) || 1;
      const pts = data.map((v, i) => [(i / (data.length - 1)) * w, h - ((v - min) / rng) * (h - 6) - 3]);
      const d = pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
      const last = pts[pts.length - 1];
      /* The trailing dot is what makes a 92px line read as "and here is now"
         rather than as decoration — same device areaChart uses at its end. */
      return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="overflow-visible">
        <polyline points="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6" fill="${color}"/>
      </svg>`;
    }
  </script>

        id: 'a1', title: 'Choosing the Right Pediatrician in Bergen County', cat: 'medical', author: 'Dr. Elena Ruiz', date: '2026-05-02', read: '5 min', views: 4821, status: 'published', img: 3, excerpt: 'What to look for when picking a doctor your child will grow with — from office hours to bedside manner.',
        body: 'Picking a pediatrician is the first real healthcare decision most parents make on their child’s behalf, and it is one you will live with for close to two decades. The good news is that Bergen County is unusually well served — the harder part is working out which practice fits your family rather than which one looks best on paper.\n\nStart with logistics, because they decide whether you actually go. How far is the office from home or daycare? Are there evening and Saturday hours? Is there a same-day sick visit line, and who answers it at 7pm on a Sunday? A brilliant doctor forty minutes away is a doctor you will skip when your toddler spikes a fever at bedtime.\n\nThen look at the practice’s shape. A solo practitioner gives you continuity — the same face every visit, someone who remembers your child without opening the chart. A larger group gives you coverage, which matters more than continuity when your child is sick and you need someone today. Neither is wrong; they simply trade the same thing in opposite directions.\n\nFinally, meet them. Most practices offer a prenatal or meet-and-greet visit at no cost, and it is the single most useful thirty minutes you will spend. Ask how they handle vaccine questions, how they feel about being called, and what happens after hours. You are listening less for the right answers than for whether you feel comfortable asking the next question.'

        body: 'A full weekend with kids does not have to cost anything. Bergen County is dense with parks, libraries and town programmes that ask for nothing but your time, and most of them are within fifteen minutes of wherever you are reading this.\n\nStart at the library. Nearly every branch in the county runs a free storytime, and several add craft hours, LEGO clubs and reading-to-a-therapy-dog sessions during the school year. Check the branch calendar rather than the county one — the good sessions fill from the local list first.\n\nOutdoors, the county park system is the obvious answer and still an underused one. Van Saun has the paths, the playgrounds and the picnic tables; the smaller town greens are quieter and better for a scavenger hunt. Write ten things on an index card, hand it over, and you have bought yourself an hour.\n\nAnd do not overlook the ordinary. A fire station visit, a bakery window, a construction site with a working excavator — for a four-year-old these are events. The trick is not finding something free to do. It is remembering that novelty, for a small child, is cheap.'

        body: 'Every spring a fresh wave of families decides that this is the year the SAT gets taken seriously, and every spring the same thing happens: an ambitious schedule, three good weeks, and then a slow collapse into resentment. The plan is rarely the problem. The pace is.\n\nStart earlier and do less. Sixty to ninety minutes, three times a week, beginning four months out, beats a frantic month of three-hour evenings — and it leaves room for the season, the show, the job, and the sleep. Score gains come from accumulated reps, not from intensity.\n\nDiagnose before you drill. One full timed practice test tells you more than a month of guessing which sections are weak. Sit it properly, on paper or on the app, in one go. Then work the two weakest areas and leave the strong ones alone until the last month.\n\nProtect the relationship. If you are both the parent and the study coach, the coach will win arguments the parent then has to live with. Outsource the nagging to a calendar, a tutor or a study group, and keep your own role to logistics and encouragement. A teenager who is not fighting you has more attention left for the test.\n\nAnd keep the stakes honest. The SAT is one input among many, it can be retaken, and no single Saturday morning decides a life. Teenagers who believe that perform better than teenagers who do not.'

        id: 'a4', title: 'Signs Your Child Is Ready for Swim Lessons', cat: 'sports', author: 'Coach Dana Lee', date: '2026-04-12', read: '3 min', views: 3287, status: 'published', img: 8, excerpt: 'Age is only part of the picture — how to know when your little one is ready for the water.',
        body: 'Parents usually ask about swim lessons in terms of age, and age is the least useful part of the answer. What matters is whether a child can follow a simple instruction, tolerate water on their face, and separate from you for twenty minutes without falling apart.\n\nThe American Academy of Pediatrics puts formal lessons at around age one at the earliest, but readiness inside that range varies enormously. A confident two-year-old who loves the bath will do more in a term than an anxious four-year-old who has been pushed.\n\nWatch for three things at home. Does your child let water run over their head without panic? Can they wait a turn? Do they recover quickly from a small scare? If all three are yes, they are ready for a group class. If not, a few parent-and-child sessions will build the base faster than a class where they spend the half hour clinging to the wall.\n\nWhatever you decide, remember that lessons are not drowning-proofing. Supervision, fences and life jackets do that work. Lessons make a child comfortable and capable — which is worth doing on its own, at whatever age it clicks.'

        id: 'a5', title: 'A Parent\'s Guide to After-School Activities', cat: 'schools', author: 'Marcus Feld', date: '2026-04-05', read: '5 min', views: 5610, status: 'published', img: 1, excerpt: 'How many is too many? Balancing enrichment, downtime, and family dinners.',
        body: 'The pressure to fill a week starts early and rarely lets up. Soccer on Monday, piano on Wednesday, a coding club on Thursday, a travel team on the weekend — each one reasonable on its own, and collectively a schedule no adult would accept.\n\nA useful rule: count the free afternoons, not the activities. Most primary-age children do well with at least two unstructured weekday afternoons and one genuinely open weekend day. Below that, everything gets more expensive — bedtime, homework, appetite, mood.\n\nBe honest about whose activity it is. Some enrolments are for the child, some are childcare with a nicer name, and some are for the parent who wishes they had learnt an instrument. All three are legitimate. Confusing them is what leads to a nine-year-old being driven to something they quietly stopped enjoying two seasons ago.\n\nLet things end. A term is a natural unit; so is a season. Deciding in advance that something runs until March and then gets reviewed removes the drama from quitting and makes it much easier for a child to say the thing is not working.\n\nAnd guard the family dinner if you can. It is the one activity with a research base behind it, and it is the first thing a full calendar takes.'

        id: 'a6', title: 'Throwing a Birthday Party Kids Will Remember', cat: 'parties', author: 'Sofia Bianchi', date: '2026-03-30', read: '4 min', views: 2944, status: 'expired', img: 6, excerpt: 'Simple themes, easy activities, and venues around Bergen County that do the work for you.',
        body: 'The parties children actually remember are almost never the most expensive ones. They are the ones with a clear shape: something to do on arrival, one big activity, cake, and out. Everything else is decoration, in both senses.\n\nPick a theme narrow enough to make decisions for you. "Space" tells you the colours, the cake, the party bag and the game. "Fun" tells you nothing and leaves you buying things at ten o’clock the night before.\n\nOn length, be ruthless. Two hours is plenty for under-sevens and generous for under-fours. A party that runs long does not become more fun; it becomes a room of tired children and a host who cannot enjoy any of it.\n\nIf you would rather not host, Bergen County is well supplied with venues that include the staffing, the space and the clean-up in one price — trampoline parks, pottery studios, the county farm, a handful of the bigger indoor playgrounds. Compare them on what is included rather than the headline rate, because the add-ons are where the difference usually lives.'
      },
      {
        id: 'a7', title: 'Summer Camp Checklist: What to Pack', cat: 'camps', author: 'Greg Halloran', date: d(-2), read: '4 min', views: 0, status: 'draft', img: 4, excerpt: 'Everything your camper needs — and the three things they definitely do not.',
        body: 'Camp packing lists have a way of expanding until the duffel will not close. Most of what gets added is insurance against an unlikely day, and it arrives home unused and slightly damp.\n\nStart with the things that get lost or ruined and pack doubles: socks, swimwear, a water bottle, a torch. Label everything, including the water bottle, which is the single most-lost object at any camp in the county.\n\nSun and bugs deserve real thought. A wide-brimmed hat gets worn if it is one your child already likes; a new one stays in the bag. Same with insect repellent — buy the format they will actually apply themselves.\n\nAnd three things to leave at home: anything valuable, anything with a screen, and anything they would be genuinely upset to lose. Camp is hard on possessions and the rules about devices exist for good reasons. A disposable camera does the memory-keeping job without any of the risk.'
      },
      {
        id: 'a8', title: 'Music Lessons: Piano or Guitar First?', cat: 'music', author: 'Ravi Shankar', date: d(-6), read: '5 min', views: 0, status: 'draft', img: 2, excerpt: 'A teacher weighs in on which instrument builds fundamentals faster for young learners.',
        body: 'Parents ask this constantly, and the honest answer is that either works — but they fail in different ways, and knowing how helps you pick.\n\nPiano lays out music theory in front of you. The relationship between notes is visible and physical, which makes reading, intervals and harmony far easier to teach. The first weeks produce a recognisable sound with almost no technique, which matters enormously for a six-year-old’s motivation.\n\nGuitar asks more of small hands at the start. Pressing a clean chord hurts, and the first month can be discouraging. But the payoff arrives sooner in a different currency: three chords and a child can play songs they actually listen to, alone or with friends, and carry the instrument to where the people are.\n\nSo: for a younger child, or one you hope will read music properly, start at the piano. For an older child who already has a band in mind, start on guitar and accept the sore fingers. The instrument that gets practised is always the better instrument.'
      },

         the inventory is valued — the banner across the top is worth more than

         going to the first line, so the two rows still add up to the rate that
         was charged and no total anywhere moves. A single slot is billed whole,

    function mulberry32(a) {

        adanalytics: { q: '', adv: '', cat: '', addon: '', adtype: '', from: '', to: '' }
      }
    };
    /* The signed-in admin. `let` on the fields the profile page can edit —
       pricing config lives on the same page, so this is the one record the
       console lets you write to about yourself. */
    /* A name is held as its two parts and joined for display. Sorting, greeting
       and initials all want the halves separately, and splitting a single field
       on the first space guesses wrongly the moment someone has two given
       names. `name` stays as a read-only convenience so nothing downstream had
       to change. */
    const fullName = (o) => `${o.first || ''} ${o.last || ''}`.trim();
    /* The dialling code is stored apart from the number so it can be shown
       wherever a number is, and so a number is never parsed to find it. */
    /* The ISO code leads each option — "US +1", not "+1 · US / Canada". A
       native select shows the picked option's whole text when closed, so a
       country name in there is a country name inside the phone field, taking
       the room the number needs. The code is also what tells the +1 countries
       apart, which the dial alone cannot. */
    const DIAL_CODES = [
      ['+1', 'US / Canada', 'US'], ['+44', 'United Kingdom', 'GB'], ['+91', 'India', 'IN'],
      ['+61', 'Australia', 'AU'], ['+49', 'Germany', 'DE'], ['+33', 'France', 'FR'],
      ['+81', 'Japan', 'JP'], ['+971', 'UAE', 'AE'],
    ];
    const dialOpts = (sel) => DIAL_CODES.map(([c, n, iso]) => `<option value="${c}" ${c === sel ? 'selected' : ''} title="${n}">${iso} ${c}</option>`).join('');
    /* Code and number as one control rather than two boxes side by side. They
       are one value — a phone number — and drawing them as separate fields made
       the code read as its own question, with two focus rings and two borders
       for something a reader takes in as a single line. The wrapper carries the
       border and the focus ring; the parts inside are bare. */
    const phoneField = (id, dial, value, ph = '(201) 555-0000') => `
      <div class="flex items-stretch rounded-[11px] border-[1.5px] border-line bg-surface-2 overflow-hidden transition-colors duration-150 focus-within:border-brand focus-within:shadow-[0_0_0_3px_rgba(32,100,61,0.14)]">
        <select id="${id}-dial" aria-label="Country code" class="shrink-0 bg-transparent border-none outline-none pl-[0.85rem] pr-[0.4rem] py-[0.6rem] text-[0.92rem] font-bold text-head cursor-pointer">${dialOpts(dial || '+1')}</select>
        <span class="w-px my-[0.5rem] bg-line2 shrink-0"></span>
        <input id="${id}" type="tel" value="${esc(value || '')}" placeholder="${esc(ph)}"
          class="flex-1 min-w-0 bg-transparent border-none outline-none px-[0.85rem] py-[0.6rem] text-[0.95rem] text-head placeholder:text-muted">
      </div>`;
    const showPhone = (o) => `${o.dial || '+1'} ${o.phone || ''}`.trim();

    const ADMIN = {
      first: 'Jordan', last: 'Alvarez', email: 'admin@bergenkids.com', role: 'Super Admin',
      photo: '',
      dial: '+1', phone: '(201) 555-0100',
      joined: '2025-08-04', lastLogin: d(0),
      get name() { return fullName(this); },
    };

    /* ═══════════════ SUB ADMINS ═══════════════
       A sub admin is the same console with fewer doors. `tabs` holds the views
       the super admin has opened up; everything else is not rendered, not
       routable and not reachable from the palette — hiding a link while leaving
       the route open is not access control, it is decoration. */
    const SUB_TABS = [
      ['parents', 'Parent Accounts'],
      ['advertisers', 'Advertiser Accounts'],
      ['ads', 'Advertisements'],
      ['categories', 'Category Management'],
      ['events', 'Events & Calendar'],
      ['editorial', 'Editorial Content'],
      ['content', 'Content Management'],
      ['payments', 'Payments'],
      ['adanalytics', 'Ad Analytics'],
    ];
    let SUB_ADMINS = [
      {
        id: 'sa1', first: 'Megan', last: 'Whitfield', email: 'megan.whitfield@bergenkids.com',
        dial: '+1', phone: '(201) 555-0142',
        tabs: ['parents', 'advertisers', 'events'], active: true, joined: '2026-01-12', lastLogin: d(1),
        get name() { return fullName(this); },
      },
      {
        id: 'sa2', first: 'Marcus', last: 'Webb', email: 'marcus.webb@bergenkids.com',
        dial: '+1', phone: '(201) 555-0177',
        tabs: ['editorial', 'content', 'categories'], active: true, joined: '2026-03-02', lastLogin: d(4),
        get name() { return fullName(this); },
      },
      {
        id: 'sa3', first: 'Danielle', last: 'Foster', email: 'danielle.foster@bergenkids.com',
        dial: '+1', phone: '(201) 555-0163',
        tabs: ['payments', 'adanalytics'], active: true, joined: '2026-04-18', lastLogin: d(2),
        get name() { return fullName(this); },
      },
    ];
    // Who the console is being used as. null = the super admin.
    let ACTING = null;
    const isSub = () => !!ACTING;
    const me = () => ACTING
      ? { name: ACTING.name, first: ACTING.first, last: ACTING.last, email: ACTING.email, dial: ACTING.dial, phone: ACTING.phone, role: 'Sub Admin', photo: '', joined: ACTING.joined, lastLogin: ACTING.lastLogin }
      : ADMIN;
    // Every address on the console has to be unique — a sub admin's, and the
    // super admin's own, since both are sign-ins to the same panel.
    const emailTaken = (email, ignoreId) => {
      const e = email.trim().toLowerCase();
      if (e === ADMIN.email.toLowerCase()) return true;
      return SUB_ADMINS.some(x => x.id !== ignoreId && x.email.toLowerCase() === e);
    };
    const canSee = view => !isSub() || ACTING.tabs.includes(view) || view === 'profile';

    /* ═══════════════ FILTERED SETS ═══════════════
       Each of these was written inline inside its view. They are lifted out
       because Export has to ship exactly the rows on screen — if the client
       filters to blocked parents and the CSV comes back with all of them, the
       button is worse than the toast it replaced. One definition, called by
       both the table and the exporter, is the only way they cannot drift. */
    const FILTERED = {
      /* Newest first. An account list is read from the top, and the row someone
         is looking for is almost always the one that just arrived. Sorted on a
         copy so the seed order is never mutated underneath the export. */
      parents: () => {
        const f = state.f.parents;
        return PARENTS.filter(p =>
          (!f.q || (p.name + p.email + p.phone).toLowerCase().includes(f.q.toLowerCase())) &&
          (!f.status || p.status === f.status))
          .slice().sort((a, b) => (b.joined || '').localeCompare(a.joined || ''));
      },
      advertisers: () => {
        const f = state.f.advertisers;
        return ADVERTISERS.filter(a =>
          (!f.q || (a.company + a.email + a.phone).toLowerCase().includes(f.q.toLowerCase())) &&
          (!f.status || a.status === f.status) &&
          (!f.adv || a.id === f.adv))
          .slice().sort((a, b) => (b.joined || '').localeCompare(a.joined || ''));
      },
      transactions: () => {
        const f = state.f.payments;
        return TX.filter(t => {
          const x = txOf(t);
          return t.status === 'paid' &&
            (!f.q || (t.id + x.adv.company + x.ad.name).toLowerCase().includes(f.q.toLowerCase())) &&
            (!f.adv || x.ad.advertiser === f.adv) &&
            (!f.adtype || x.ad.type === f.adtype) &&
            // Inclusive at both ends: picking the same day twice is that day.
            (!f.from || t.date >= f.from) &&
            (!f.to || t.date <= f.to);
        });
      },
      adanalytics: () => {
        const f = state.f.adanalytics;
        // Only ads that have actually run can have numbers against them, so
        // pending and rejected ones never reach analytics.
        return ADS.filter(a => (a.status === 'live' || a.status === 'ended')).filter(a =>
          (!f.q || a.name.toLowerCase().includes(f.q.toLowerCase())) &&
          (!f.adv || a.advertiser === f.adv) &&
          (!f.cat || a.cat === f.cat) &&
          (!f.addon || (a.addons || []).includes(f.addon)) &&
          (!f.adtype || a.type === f.adtype) &&
          (!f.from || a.end >= f.from) && (!f.to || a.start <= f.to));
      }
    };

    /* Column definitions per export. `data-what` on the button picks the set,
       so all six buttons still route through the one existing action. */
    const ctrPct = (o) => o.impressions ? ((o.clicks / o.impressions) * 100).toFixed(2) : '0.00';
    const CSV_SETS = {
      parents: {
        file: 'parents', get: () => FILTERED.parents(),
        cols: [
          ['Name', p => p.name], ['Email', p => p.email], ['Phone', p => p.phone],
          ['Home town', p => p.town], ['Children', p => p.kids], ['Saved items', p => p.saved],
          ['Age groups', p => (p.ages || []).map(a => ageOf(a)).join(' | ')],
          ['Preferred towns', p => (p.towns || []).join(' | ')],
          ['Status', p => p.status], ['Joined', p => p.joined], ['Last active', p => p.last]
        ]
      },
      advertisers: {
        file: 'advertisers', get: () => FILTERED.advertisers(),
        cols: [
          ['Company', a => a.company], ['Contact', a => a.contact], ['Email', a => a.email], ['Phone', a => a.phone],
          ['Campaigns', a => a.campaigns], ['Spend (USD)', a => a.spend],
          ['Impressions', a => a.impressions], ['Clicks', a => a.clicks], ['CTR %', a => ctrPct(a)],
          ['Status', a => a.status], ['Joined', a => a.joined]
        ]
      },
      transactions: {
        file: 'transactions', get: () => FILTERED.transactions(),
        cols: [
          ['Payment ID', t => t.id], ['Date', t => t.date],
          ['Advertiser', t => txOf(t).adv.company], ['Ad', t => txOf(t).ad.name],
          ['Ad type', t => adTypeFull(txOf(t).ad)],
          ['Payment plan', t => txOf(t).ad.payPlan],
          ['Add-ons', t => (txOf(t).ad.addons || []).map(x => addonOf(x).label).join(' | ')],
          ['Payment card', t => txOf(t).method], ['Amount (USD)', t => txOf(t).bill.total], ['Status', t => t.status]
        ]
      },
      'ad analytics': {
        file: 'ad-analytics', get: () => FILTERED.adanalytics(),
        cols: [
          ['Campaign', a => a.name], ['Advertiser', a => advOf(a.advertiser).company],
          ['Ad type', a => adTypeOf(a.type).label],
          ['Placement', a => adSpots(a).map(s => s.label).join(' | ')],
          ['Add-ons', a => (a.addons || []).map(x => addonOf(x).label).join(' | ')],
          ['Category', a => catOf(a.cat).name], ['Start', a => a.start], ['End', a => a.end],
          ['Impressions', a => a.impressions], ['Clicks', a => a.clicks], ['CTR %', a => ctrPct(a)],
          ['Spend (USD)', a => adSpend(a)], ['Status', a => a.status]
        ]
      }
    };

    /* ═══════════════ LOGIN ═══════════════
       The left column of the sign-in screen is a four-card flow, not a single
       form: sign in, ask for a code, enter the code, choose a new password —
       plus the confirmation that follows. The shell around it never changes,
       so a reset never throws the admin out to some other-looking page; only
       the card in the middle is swapped. */
    const AUTH_BOX = 'flex items-center gap-[0.6rem] border-[1.5px] border-line rounded-[14px] bg-surface-2 px-[0.9rem] min-h-[52px] transition-[border-color,box-shadow,background-color] duration-150 hover:border-[color-mix(in_srgb,var(--head)_24%,transparent)] focus-within:bg-surface focus-within:border-grass-ink focus-within:shadow-[0_0_0_3px_rgba(32,100,61,0.15)]';
    const AUTH_INP = 'w-full min-w-0 bg-transparent outline-none text-[0.95rem] text-head py-3 placeholder:text-muted placeholder:opacity-100';
    // One field, built the same way on every card in the flow.
    const authField = (o) => `<div class="flex flex-col gap-[0.4rem]">
      <div class="flex items-center justify-between">
        <label class="${C.label}" for="${o.id}">${o.label}</label>
        ${o.aside || ''}
      </div>
      <div class="${AUTH_BOX}">
        <span class="text-muted leading-[0]">${icon(o.ic, 17)}</span>
        <input id="${o.id}" type="${o.type || 'text'}"${o.auto ? ` autocomplete="${o.auto}"` : ''} value="${esc(o.val || '')}" class="${AUTH_INP}" placeholder="${esc(o.ph || '')}">
        ${o.tail || ''}
      </div>
    </div>`;
    // The eye that flips a password field between dots and plain text.
    /* The eye shows the state the field is in, not the action the button
       performs: masked characters carry the struck-through eye, revealed text
       carries the open one. Both toggles in the console follow this, so the
       icon never means two different things on two screens. */
    /* Swaps the field's type and its icon directly. It used to run through
       render(), which rebuilt the entire page: the sign-in card flashed and
       replayed its animations — read as the page reloading — and, worse, the
       button under the pointer was replaced between press and release, so a
       click on Sign in straight after using the eye landed on a node that no
       longer existed and did nothing. Nothing here re-renders. */
    const authEye = (act, on) => `<button type="button" class="text-muted leading-[0] p-1 hover:text-head" data-pw-eye="${act}" aria-label="${on ? 'Hide' : 'Show'} password">${icon(on ? 'eye' : 'eye-off', 17)}</button>`;
    // Which field each auth eye belongs to, and the flag that remembers it.
    const AUTH_EYE = { 'toggle-pass': ['lg-pass', 'showPass'], 'fp-eye-new': ['fp-p1', 'showNew'], 'fp-eye-conf': ['fp-p2', 'showConf'] };
    /* `nowrap` is for the sign-in title only: it is sized to hold on one line
       inside the column's 430px cap, and the break after "admin" read as a
       mistake. The reset titles are short enough not to need it. */
    const authHead = (title, sub, nowrap) => `<div class="text-center mb-8">
      <h2 class="font-serif text-[clamp(1.32rem,1.05rem_+_0.85vw,1.72rem)] font-black text-head tracking-[-0.02em] leading-[1.2] mb-2${nowrap ? ' whitespace-nowrap' : ''}">${title}</h2>
      <p class="${C.sub}">${sub}</p>
    </div>`;
    /* Every card except the first offers the same way out. It is a link rather
       than a button because abandoning a reset is not an action with a
       consequence — nothing has been changed yet. */
    const authBack = (label = 'Back to sign in') => `<button type="button" data-act="auth-login" class="mt-5 w-full inline-flex items-center justify-center gap-[0.4rem] text-[0.88rem] font-bold text-muted hover:text-head transition-colors duration-150">${icon('chev-left', 15)} ${label}</button>`;

    /* What a new password has to satisfy. One list, read by the live hints
       under the field and by the check that runs on submit, so the rules the
       admin is shown are exactly the rules they are held to. */
    const PW_RULES = [
      { id: 'len', label: 'At least 8 characters', test: v => v.length >= 8 },
      { id: 'cap', label: 'An uppercase letter', test: v => /[A-Z]/.test(v) },
      { id: 'low', label: 'A lowercase letter', test: v => /[a-z]/.test(v) },
      { id: 'num', label: 'A number', test: v => /[0-9]/.test(v) },
      { id: 'sym', label: 'A special character', test: v => /[^A-Za-z0-9]/.test(v) },
    ];
    const pwOK = v => PW_RULES.every(r => r.test(v));
    const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    // Masked for the "we sent it to…" line: j•••@bergenkids.com.
    function maskEmail(e) {
      const at = e.indexOf('@'); if (at < 1) return e;
      const name = e.slice(0, at);
      return name[0] + '•'.repeat(Math.max(2, Math.min(6, name.length - 1))) + e.slice(at);
    }

    function loginCard() {
      return `${authHead('Sign in to the admin panel', 'Use your Bergen Kids admin credentials to login.', true)}
      <form id="login-form" class="flex flex-col gap-[1.1rem]" novalidate>
        ${authField({ id: 'lg-email', label: 'Email address', ic: 'mail', type: 'email', auto: 'username', val: state.lg.email, ph: 'you@bergenkids.com' })}
        ${authField({
        id: 'lg-pass', label: 'Password', ic: 'lock', type: state.showPass ? 'text' : 'password',
        auto: 'current-password', val: state.lg.pass, ph: '••••••••',
        aside: `<button type="button" class="text-[0.82rem] font-bold text-brand hover:underline" data-act="forgot">Forgot?</button>`,
        tail: authEye('toggle-pass', state.showPass),
      })}
        <div class="flex items-center justify-between flex-wrap gap-3 mt-1">
          <label class="flex items-center gap-[0.6rem] cursor-pointer text-[0.9rem] text-muted font-medium">
            <input type="checkbox" checked class="w-[18px] h-[18px] accent-[#20643d] cursor-pointer"> Keep me signed in
          </label>
        </div>
        <!-- Handled by its own click as well as the form's submit. A submit that
             is not prevented navigates the page and lands back on this screen,
             which reads as the button doing nothing at all; a direct click
             cannot fall through that way. Enter still works through the form. -->
        <button type="submit" data-act="do-login" class="${C.btn} ${C.primary} w-full !min-h-[52px] mt-2 group">Sign in to dashboard <span class="transition-transform duration-200 group-hover:translate-x-1 leading-[0]">${icon('arrow-right', 17)}</span></button>
      </form>`;
    }

    // Step 1 — who is resetting.
    function forgotCard() {
      return `${authHead('Forgot your password?', "Enter the email on your admin account and we'll send you a 4-digit code to reset it.")}
      <form id="fp-request-form" class="flex flex-col gap-[1.1rem]" novalidate>
        ${authField({ id: 'fp-email', label: 'Email address', ic: 'mail', type: 'email', auto: 'username', val: state.auth.email, ph: 'you@bergenkids.com' })}
        <button type="submit" class="${C.btn} ${C.primary} w-full !min-h-[52px] mt-1 group">Send reset code <span class="transition-transform duration-200 group-hover:translate-x-1 leading-[0]">${icon('arrow-right', 17)}</span></button>
      </form>
      <p class="text-[0.82rem] text-muted leading-[1.6] text-center mt-4">Only addresses with an admin account will receive a code. Nothing is sent to anyone else.</p>
      ${authBack()}`;
    }

    // Step 2 — the code. Four boxes rather than one field: it is four digits,
    // and typing them one at a time is what everyone has been trained to do.
    function codeCard() {
      return `${authHead('Enter the reset code', `We sent a 4-digit code to <strong class="text-head">${esc(maskEmail(state.auth.email))}</strong>. It expires in 10 minutes.`)}
      <form id="fp-code-form" class="flex flex-col gap-[1.1rem]" novalidate>
        <div class="flex gap-3 justify-center" id="fp-otp">
          ${[0, 1, 2, 3].map(i => `<input data-otp="${i}" inputmode="numeric" maxlength="1" value="${(state.auth.code || '')[i] || ''}" aria-label="Digit ${i + 1} of 4" class="w-[62px] h-[68px] text-center font-serif text-[1.7rem] font-black text-head bg-surface-2 border-[1.5px] border-line rounded-[14px] outline-none transition-[border-color,box-shadow,background-color] duration-150 hover:border-[color-mix(in_srgb,var(--head)_24%,transparent)] focus:bg-surface focus:border-grass-ink focus:shadow-[0_0_0_3px_rgba(32,100,61,0.15)] max560:w-[54px] max560:h-[60px]">`).join('')}
        </div>
        <div class="flex items-center justify-center gap-2 text-[0.85rem] font-semibold">
          <button type="button" id="fp-resend-btn" data-act="fp-resend" ${state.auth.resendIn > 0 ? 'disabled' : ''} class="${state.auth.resendIn > 0 ? 'text-muted cursor-not-allowed' : 'text-brand hover:underline'}">${state.auth.resendIn > 0 ? `Resend code in 00:${String(state.auth.resendIn).padStart(2, '0')}` : 'Resend code'}</button>
          <span class="text-line2">·</span>
          <button type="button" data-act="fp-edit-email" class="text-muted hover:text-head">Use a different email</button>
        </div>
        <button type="submit" class="${C.btn} ${C.primary} w-full !min-h-[52px] group">Verify code <span class="transition-transform duration-200 group-hover:translate-x-1 leading-[0]">${icon('arrow-right', 17)}</span></button>
      </form>
      <p class="text-[0.82rem] text-muted leading-[1.6] text-center mt-4">Demo — any 4 digits will do.</p>
      ${authBack()}`;
    }

    // Step 3 — the new password, with the rules visible while they are typed
    // rather than announced only after a failed submit.
    /* Showing or hiding a password re-renders the card, so what has been typed
       is committed to state first — otherwise tapping the eye would empty the
       very field you wanted to read. */
    function keepPw() {
      const a = el('fp-p1'), b = el('fp-p2');
      if (a) state.auth.p1 = a.value;
      if (b) state.auth.p2 = b.value;
    }
    // Same for the four code boxes, which are DOM values until something asks.
    function keepOtp() {
      const boxes = document.querySelectorAll('[data-otp]');
      if (boxes.length) state.auth.code = [...boxes].map(i => i.value).join('');
    }
    function resetCard() {
      return `${authHead('Choose a new password', 'It has to be different from the one you had before.')}
      <form id="fp-reset-form" class="flex flex-col gap-[1.1rem]" novalidate>
        ${authField({ id: 'fp-p1', label: 'New password', ic: 'lock', type: state.auth.showNew ? 'text' : 'password', auto: 'new-password', val: state.auth.p1, ph: 'At least 8 characters', tail: authEye('fp-eye-new', state.auth.showNew) })}
        <div class="flex flex-wrap gap-x-4 gap-y-[0.35rem] -mt-1">
          ${PW_RULES.map(r => `<span data-rule="${r.id}" class="inline-flex items-center gap-[0.4rem] text-[0.82rem] font-semibold text-muted transition-colors duration-150"><span class="leading-[0]">${icon('check', 12)}</span>${r.label}</span>`).join('')}
        </div>
        ${authField({ id: 'fp-p2', label: 'Confirm New Password', ic: 'lock', type: state.auth.showConf ? 'text' : 'password', auto: 'new-password', val: state.auth.p2, ph: 'Type it again', tail: authEye('fp-eye-conf', state.auth.showConf) })}
        <div data-rule="match" class="hidden items-center gap-[0.4rem] text-[0.82rem] font-semibold text-danger-t -mt-1"><span class="leading-[0]">${icon('x', 12)}</span>Both passwords have to match</div>
        <button type="submit" class="${C.btn} ${C.primary} w-full !min-h-[52px] mt-1">${icon('check', 17)} Reset Password</button>
      </form>
      ${authBack()}`;
    }

    // Step 4 — done. A screen rather than a toast: a password change is worth
    // stopping on, and the way back in should be a button, not a guess.
    function doneCard() {
      return `<div class="text-center">
        <span class="w-[62px] h-[62px] rounded-[100px] tint inline-flex items-center justify-center mb-5" style="--chip-bg:#e3f2e9;--chip-fg:#20643d">${icon('check', 28)}</span>
        ${authHead('Password updated', `Your admin password has been changed. Sign in with the new one to carry on.`)}
        <button type="button" data-act="auth-login" class="${C.btn} ${C.primary} w-full !min-h-[52px] group">Back to sign in <span class="transition-transform duration-200 group-hover:translate-x-1 leading-[0]">${icon('arrow-right', 17)}</span></button>
      </div>`;
    }

    /* The resend countdown patches its own label each second instead of
       re-rendering the card, because a re-render would take the caret out of
       whichever code box is being typed in. */
    let resendTimer = null;
    function stopResend() { clearInterval(resendTimer); resendTimer = null; state.auth.resendIn = 0; }
    function paintResend() {
      const b = el('fp-resend-btn'); if (!b) return;
      const left = state.auth.resendIn;
      b.disabled = left > 0;
      b.textContent = left > 0 ? `Resend code in 00:${String(left).padStart(2, '0')}` : 'Resend code';
      b.className = left > 0
        ? 'text-muted cursor-not-allowed'
        : 'text-brand hover:underline';
    }
    function startResend(sec) {
      clearInterval(resendTimer);
      state.auth.resendIn = sec;
      paintResend();
      resendTimer = setInterval(() => {
        state.auth.resendIn = Math.max(0, state.auth.resendIn - 1);
        paintResend();
        if (state.auth.resendIn === 0) { clearInterval(resendTimer); resendTimer = null; }
      }, 1000);
    }

    const AUTH_CARDS = { login: loginCard, forgot: forgotCard, code: codeCard, reset: resetCard, done: doneCard };
    /* Each step lands the caret where its answer goes, so a reset can be typed
       start to finish without reaching for the mouse. The rule hints are
       painted too, because a re-render (the eye toggle) rebuilds them grey
       while the password behind them is already valid. */
    const AUTH_FOCUS = { forgot: 'fp-email', reset: 'fp-p1' };
    function afterAuthPaint() {
      wireAuthEyes();
      const step = state.auth.step;
      if (step === 'code') {
        const boxes = [...document.querySelectorAll('[data-otp]')];
        // The first box still waiting for a digit, so coming back to a partly
        // typed code carries on rather than starting again.
        const next = boxes.find(b => !b.value) || boxes[boxes.length - 1];
        if (next) next.focus();
        return;
      }
      if (step === 'reset') paintPwRules();
      // A one-shot override, set by whatever caused this repaint.
      const id = state.auth.focus || AUTH_FOCUS[step];
      state.auth.focus = '';
      const n = id && el(id);
      /* setSelectionRange throws on email, number and a few other input types —
         they have no selection to move. Only text and password accept it, so
         the caret is placed on those and the focus alone stands for the rest. */
      if (n) {
        n.focus();
        if (/^(text|password|search|tel|url)$/.test(n.type)) {
          try { n.setSelectionRange(n.value.length, n.value.length); } catch (_) { }
        }
      }
    }

    /* One timer for the whole app. It is cleared on every repaint, because the
       sign-in card is re-rendered on each keystroke that changes a rule hint —
       without this the interval would be started again on every paint and the
       photographs would race each other. */
    let shotTimer = null, shotAt = 0;
    function stopShots() { clearInterval(shotTimer); shotTimer = null; }
    function startShots() {
      stopShots();
      const wrap = el('login-shots'); if (!wrap) return;
      const shots = [...wrap.querySelectorAll('[data-shot]')];
      if (shots.length < 2) return;
      /* The position is held outside the DOM, so showing a password — which
         repaints the whole card — carries on from the photograph that was up
         rather than snapping back to the first one. */
      shotAt %= shots.length;
      shots.forEach((s, i) => s.style.opacity = i === shotAt ? '1' : '0');
      shotTimer = setInterval(() => {
        shots[shotAt].style.opacity = '0';
        shotAt = (shotAt + 1) % shots.length;
        shots[shotAt].style.opacity = '1';
      }, 5000);
    }

          <!-- LEFT — login form. Mark, form and footer share one centred column. -->
          <div class="relative flex flex-col px-[clamp(1.25rem,4vw,4rem)] py-[clamp(1.5rem,3vw,2.5rem)]">

            <!-- z-[1] keeps the form above the drifting icons behind it. -->
            <div class="relative z-[1] w-full max-w-[440px] mx-auto flex flex-1 flex-col items-center justify-center py-6">
              <!-- The wordmark is WHITE artwork on transparency — it is drawn
                   for a dark ground. On the light card it therefore sits on a
                   brand-navy plate rather than being filtered into a
                   silhouette, which would throw the sun away with it. -->
              <!-- No plate behind the mark: each theme gets the cut of the
                   lockup drawn for its background, so the artwork sits
                   directly on the card. -->
              <div class="mb-8 animate-fadeUp flex flex-col items-center">

                <p class="text-on-dark-2 text-[0.95rem] leading-[1.6] max-w-[52ch] mb-5 animate-fadeUp [animation-delay:0.16s]">

                  ${perks.map((p, i) => `<div class="group flex items-center gap-[0.7rem] rounded-[13px] border border-white/[0.14] bg-white/[0.08] backdrop-blur-[6px] px-[0.7rem] py-[0.45rem] animate-fadeUp transition-[background-color,border-color,transform] duration-200 hover:bg-white/[0.16] hover:border-white/[0.28] hover:-translate-y-px" style="animation-delay:${0.24 + i * 0.09}s">

          ${NAV.map(g => ({ ...g, items: g.items.filter(([id]) => canSee(id) && !(id === 'subadmins' && isSub())) }))
        .filter(g => g.items.length).map(g => `
            <div class="text-[0.66rem] font-bold tracking-[0.14em] uppercase text-white/[0.68] px-[0.8rem] mt-[1.35rem] mb-2">${g.group}</div>
            ${g.items.map(([id, label, ic, tone]) => {
        const [bg, fg] = tone.split('|');
        const on = state.view === id;
        const b = badgeFor(id);
        return `<button data-nav="${id}" class="group relative w-full text-left flex items-center gap-3 px-[0.8rem] py-[0.62rem] rounded-[11px] text-[0.92rem] font-semibold transition-all duration-150 mb-[2px] ${on ? 'bg-[var(--nav-item)] text-white before:content-[\'\'] before:absolute before:-left-3 before:top-1/2 before:-translate-y-1/2 before:w-1 before:h-[22px] before:rounded-r-[4px] before:bg-sun' : 'text-white/[0.72] hover:bg-[var(--nav-item-hover)] hover:text-white hover:translate-x-[2px]'}">
                <span class="${on ? 'tint ' : ''}w-[30px] h-[30px] rounded-[8px] inline-flex items-center justify-center shrink-0 transition-all duration-200 group-hover:scale-105 group-hover:rotate-[-4deg]" style="${on ? `--chip-bg:${bg};--chip-fg:${fg}` : 'background:rgba(255,255,255,0.08);color:inherit'}">${icon(ic, 16)}</span>
                <span class="truncate">${label}</span>
                ${b ? `<span class="ml-auto shrink-0 min-w-[22px] h-[22px] px-[6px] rounded-[100px] bg-sun text-[#1a2e4a] text-[0.7rem] font-extrabold inline-flex items-center justify-center">${b}</span>` : ''}
              </button>`;
      }).join('')}`).join('')}
        </nav>

        <div class="relative z-[1] shrink-0 p-3 border-t border-t-white/[0.1]">
          <!-- The block is one button that opens a menu, rather than two targets
               sharing a row where a mis-tap on the arrow signed you out. The menu
               opens upward because the block sits at the foot of the slab, and it
               is a light surface — the same one every other popover uses — so it
               reads as sitting above the navy rather than cut out of it. -->
